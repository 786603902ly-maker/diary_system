<title>读书宇宙 · Book OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#f1f3f1; --bg-elev:#ffffff; --bg-sunken:#e9ece9; --ink:#1b211e; --ink-soft:#4e5651; --ink-faint:#838c86;
    --line:#dfe4e0; --line-soft:#eaeeeb;
    --accent:#2f6b57; --accent-soft:#e3ece7; --accent-ink:#1b4a3c;
    --quad-mas:#b0691f; --quad-inw:#2f6b57; --quad-deo:#6a5a9e; --quad-leg:#a6433f;
    --recent:#2f6b57; --recent-soft:#e3ece7;
    --star:#b8860f; --star-soft:#f6ecd2;
    --shadow-sm:0 1px 2px rgba(20,30,25,.05);
    --shadow:0 1px 2px rgba(20,30,25,.05), 0 6px 20px rgba(20,30,25,.07);
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --thread-1:#b0691f; --thread-2:#2f6b57; --thread-3:#6a5a9e; --thread-4:#a6433f; --thread-5:#2f6b8f; --thread-6:#8a7a2f;
    font-size:16px;
  }
  :root[data-theme="dark"]{
    --bg:#10140f; --bg-elev:#171d19; --bg-sunken:#1b221d; --ink:#e7ece9; --ink-soft:#b7c0bb; --ink-faint:#7c8781;
    --line:#29332d; --line-soft:#1d2521;
    --accent:#7fbfa3; --accent-soft:#1d362e; --accent-ink:#bfe6d3;
    --quad-mas:#d99a4e; --quad-inw:#7fbfa3; --quad-deo:#a79bde; --quad-leg:#d68787;
    --recent:#7fbfa3; --recent-soft:#1d362e;
    --star:#e0b34c; --star-soft:#2c2411;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --thread-1:#d99a4e; --thread-2:#7fbfa3; --thread-3:#a79bde; --thread-4:#d68787; --thread-5:#7fa9d9; --thread-6:#cdbb5f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10140f; --bg-elev:#171d19; --bg-sunken:#1b221d; --ink:#e7ece9; --ink-soft:#b7c0bb; --ink-faint:#7c8781;
      --line:#29332d; --line-soft:#1d2521;
      --accent:#7fbfa3; --accent-soft:#1d362e; --accent-ink:#bfe6d3;
      --quad-mas:#d99a4e; --quad-inw:#7fbfa3; --quad-deo:#a79bde; --quad-leg:#d68787;
      --recent:#7fbfa3; --recent-soft:#1d362e;
      --star:#e0b34c; --star-soft:#2c2411;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --thread-1:#d99a4e; --thread-2:#7fbfa3; --thread-3:#a79bde; --thread-4:#d68787; --thread-5:#7fa9d9; --thread-6:#cdbb5f;
    }
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden;}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  a{color:inherit}
  button{font:inherit;color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px;}
  h1,h2,h3{text-wrap:balance;margin:0;}
  [tabindex]:focus-visible, button:focus-visible, input:focus-visible, [contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  body.edit-mode .wrap{padding-bottom:120px;}

  header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .top-inner{max-width:1040px;margin:0 auto;padding:14px 16px 10px;}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .title-row h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em;}
  .title-row .sub{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);letter-spacing:.02em;display:block;margin-top:2px;}
  .head-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-soft);border-radius:var(--radius-sm);padding:6px 11px;font-size:.76rem;cursor:pointer;line-height:1.3;}
  .icon-btn:hover{border-color:var(--accent);color:var(--ink);}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

  .controls{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .search-box{flex:1 1 220px;position:relative;}
  .search-box input{width:100%;padding:9px 14px 9px 34px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-size:.88rem;outline:none;}
  .search-box input:focus{border-color:var(--accent)}
  .search-box::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:1rem;}
  .stat-pill{font-size:.74rem;color:var(--ink-faint);background:var(--bg-sunken);border-radius:999px;padding:6px 12px;white-space:nowrap;}

  .tabs{display:flex;gap:3px;margin-top:12px;background:var(--bg-sunken);border-radius:var(--radius-sm);padding:3px;width:fit-content;max-width:100%;overflow-x:auto;}
  .tab{flex:none;padding:7px 16px;border-radius:7px;font-size:.82rem;color:var(--ink-faint);cursor:pointer;border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--bg-elev);color:var(--ink);font-weight:700;box-shadow:var(--shadow-sm);}

  .quickjump{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;max-width:1040px;margin:0 auto;border-top:1px solid var(--line-soft);-webkit-overflow-scrolling:touch;}
  .quickjump[hidden]{display:none;}
  .qj-chip{flex:none;display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);background:var(--bg-elev);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  .qj-chip.dim{opacity:.4;}
  .qj-chip.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600;}
  .qj-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;}
  .qj-chip[data-q="MAS"] .qj-dot{background:var(--quad-mas);}
  .qj-chip[data-q="INW"] .qj-dot{background:var(--quad-inw);}
  .qj-chip[data-q="DEO"] .qj-dot{background:var(--quad-deo);}
  .qj-chip[data-q="LEG"] .qj-dot{background:var(--quad-leg);}

  main{padding-top:16px;}

  .quad-block{margin-bottom:26px;}
  .quad-h{font-size:1.05rem;font-weight:800;display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .quad-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .quad-h[data-q="MAS"]{color:var(--quad-mas);} .quad-h[data-q="MAS"] .quad-dot{background:var(--quad-mas);}
  .quad-h[data-q="INW"]{color:var(--quad-inw);} .quad-h[data-q="INW"] .quad-dot{background:var(--quad-inw);}
  .quad-h[data-q="DEO"]{color:var(--quad-deo);} .quad-h[data-q="DEO"] .quad-dot{background:var(--quad-deo);}
  .quad-h[data-q="LEG"]{color:var(--quad-leg);} .quad-h[data-q="LEG"] .quad-dot{background:var(--quad-leg);}
  .quad-en{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;font-weight:400;}
  .quad-tag{font-size:.8rem;color:var(--ink-faint);margin:2px 0 12px;}

  .subcat-section{margin-bottom:18px;scroll-margin-top:236px;}
  .subcat-h{display:flex;align-items:baseline;gap:8px;font-size:.88rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .sc-count{font-size:.68rem;color:var(--ink-faint);font-weight:400;background:var(--bg-sunken);border-radius:999px;padding:2px 8px;}
  .cluster-h{font-size:.72rem;font-weight:600;color:var(--ink-faint);margin:12px 0 6px;padding-left:9px;border-left:2px solid var(--line);}
  .cluster-h:first-child{margin-top:0;}

  .card-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .pcard{flex:1 1 220px;max-width:340px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
  .pcard:hover{border-color:var(--accent);}
  .pcard.starred{background:var(--star-soft);border-color:var(--star);}
  .pcard.expanded{flex:1 1 100%;max-width:100%;box-shadow:var(--shadow);}
  .pcard.flash{animation:flashPulse 1.6s ease;}
  @keyframes flashPulse{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:var(--shadow-sm);}}

  .pcard-head{display:flex;align-items:flex-start;gap:8px;padding:12px 13px;cursor:pointer;}
  .star-btn{flex:none;border:none;background:none;cursor:pointer;font-size:.95rem;color:var(--ink-faint);line-height:1;padding:1px;}
  .pcard.starred .star-btn{color:var(--star);}
  .pcard-head-text{flex:1;min-width:0;}
  .pc-kw{font-weight:700;font-size:.9rem;margin-bottom:2px;}
  .pc-title{font-size:.72rem;color:var(--ink-faint);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .pcard.expanded .pc-title{-webkit-line-clamp:initial;}
  .pc-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .pc-books{font-size:.62rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 7px;white-space:nowrap;}
  .pc-id{font-size:.62rem;color:var(--ink-faint);}
  .pc-chev{font-size:.6rem;color:var(--ink-faint);}
  .pc-day{font-size:.6rem;color:var(--ink-faint);white-space:nowrap;}

  .pcard-body{padding:0 15px 16px;border-top:1px solid var(--line-soft);margin-top:2px;padding-top:12px;}
  .pcard-body{animation:pcardIn .18s ease;}
  @keyframes pcardIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .core{font-size:.92rem;color:var(--ink);margin-bottom:12px;white-space:pre-wrap;}
  .day-prog{font-size:.8rem;color:var(--ink-soft);background:var(--bg-sunken);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;white-space:pre-wrap;}
  .section-label{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;margin:14px 0 7px;}

  .insight-block{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:8px;}
  .insight-title{font-weight:700;font-size:.86rem;color:var(--accent-ink);margin-bottom:2px;}
  .insight-src{font-size:.68rem;color:var(--ink-faint);margin-bottom:6px;}
  .insight-mech{font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
  .insight-ex{font-size:.82rem;color:var(--ink-soft);background:var(--bg-elev);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:6px;white-space:pre-wrap;}
  .insight-ex b{color:var(--accent-ink);}
  .insight-take{font-size:.83rem;color:var(--ink);font-weight:600;white-space:pre-wrap;}

  .analogy-block{border-left:3px solid var(--quad-deo);background:color-mix(in srgb, var(--quad-deo) 12%, var(--bg-elev));border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:12px;}
  .analogy-domain{font-weight:700;font-size:.82rem;color:var(--quad-deo);margin-bottom:4px;}
  .analogy-text{font-size:.84rem;color:var(--ink-soft);white-space:pre-wrap;}

  .scenario-block{border-left:3px solid var(--quad-leg);background:color-mix(in srgb, var(--quad-leg) 10%, var(--bg-elev));border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:12px;}
  .scenario-case{font-size:.68rem;color:var(--ink-faint);font-weight:600;margin-bottom:4px;}
  .scenario-text{font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
  .scenario-q{font-size:.84rem;color:var(--ink);font-style:italic;white-space:pre-wrap;}
  .scenario-hang{font-size:.7rem;color:var(--quad-leg);font-weight:700;margin-top:6px;}
  .scenario-ans{font-size:.82rem;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);white-space:pre-wrap;}

  .internal-block{background:var(--bg-sunken);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:.84rem;}
  .internal-block div{margin-bottom:4px;}
  .internal-block b{color:var(--accent-ink);}

  .link-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip-book{font-size:.72rem;background:var(--bg-sunken);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
  .chip-mindos{font-size:.72rem;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;text-decoration:none;display:inline-block;}
  .chip-mindos:hover{background:var(--accent);color:#fff;}
  .chip-thread{font-size:.68rem;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;}

  .empty-hint{color:var(--ink-faint);font-size:.85rem;padding:40px 10px;text-align:center;}

  /* ---------- graph tab ---------- */
  .graph-wrap{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow-sm);}
  .graph-wrap svg{width:100%;height:auto;display:block;}
  .g-node{cursor:pointer;}
  .g-node circle{stroke:var(--bg-elev);stroke-width:2px;}
  .g-node text{font-size:10px;fill:var(--ink);pointer-events:none;}
  .g-hub text{font-size:11px;font-weight:700;fill:var(--ink-soft);}
  .g-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .g-legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);}
  .g-legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .graph-hint{font-size:.76rem;color:var(--ink-faint);margin-top:8px;}

  /* ---------- books tab ---------- */
  .book-doc-group{margin-bottom:20px;}
  .book-doc-h{font-size:.86rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .book-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:6px;}
  .book-status{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line);}
  .book-status.distilled{background:var(--recent);}
  .book-status.in-progress{background:var(--star);}
  .book-title{font-weight:600;font-size:.86rem;}
  .book-author{font-size:.72rem;color:var(--ink-faint);margin-left:6px;}
  .book-links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
  .book-link{font-size:.68rem;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap;}

  /* ---------- editable ---------- */
  .editable{border-radius:4px;}
  body.edit-mode .editable{cursor:text;outline:1px dashed transparent;}
  body.edit-mode .editable:hover{outline-color:var(--line);background:var(--bg-sunken);}
  body.edit-mode .editable:focus{outline:1px solid var(--accent);background:var(--bg-elev);}

  .edit-toolbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg-elev);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 16px;}
  .edit-toolbar[hidden]{display:none;}
  .et-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding:3px 0;}
  .et-label{font-size:.72rem;color:var(--ink-faint);margin-right:2px;}
  .swatch{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--sw);cursor:pointer;padding:0;}
  .swatch:hover{border-color:var(--ink);transform:scale(1.08);}
  .et-ghost{border:none;background:none;color:var(--ink-faint);font-size:.74rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .et-sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px;}
  .et-hint{font-size:.7rem;color:var(--ink-faint);flex:1 1 auto;}
  .et-outline{border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-soft);border-radius:var(--radius-sm);padding:6px 11px;font-size:.74rem;cursor:pointer;white-space:nowrap;}
  .et-outline:hover{border-color:var(--accent);color:var(--ink);}
  .et-outline.et-danger:hover{border-color:var(--quad-leg);color:var(--quad-leg);}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="top-inner">
      <div class="title-row">
        <div>
          <h1 id="site-title">读书宇宙</h1>
          <span class="sub" id="site-sub"></span>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="edit-mode-btn" title="开关编辑模式：修改文字 / 高亮 / 标星">🖊 编辑</button>
          <button class="icon-btn" id="theme-btn">🌗 主题</button>
        </div>
      </div>
      <div class="controls">
        <div class="search-box"><input id="search" type="text" placeholder="搜索关键词 / 书名 / 论点…" /></div>
        <span class="stat-pill" id="stat-pill"></span>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="pyramid">普世智金字塔</button>
        <button class="tab" data-tab="graph">关联图谱</button>
        <button class="tab" data-tab="books">书籍索引</button>
      </div>
    </div>
    <div class="quickjump" id="quickjump" hidden></div>
  </header>
  <main id="main"></main>
</div>

<div class="edit-toolbar" id="edit-toolbar" hidden>
  <div class="et-row">
    <span class="et-label">高亮</span>
    <button class="swatch" data-hl="#fff2a8" style="--sw:#fff2a8" title="黄色高亮"></button>
    <button class="swatch" data-hl="#c9f2d8" style="--sw:#c9f2d8" title="绿色高亮"></button>
    <button class="swatch" data-hl="#ffd6d6" style="--sw:#ffd6d6" title="粉色高亮"></button>
    <button class="swatch" data-hl="#d6e4ff" style="--sw:#d6e4ff" title="蓝色高亮"></button>
    <button class="et-ghost" data-hl="transparent">清除高亮</button>
    <span class="et-sep"></span>
    <span class="et-label">文字色</span>
    <button class="swatch" data-fc="#b0691f" style="--sw:#b0691f" title="橙"></button>
    <button class="swatch" data-fc="#a6433f" style="--sw:#a6433f" title="红"></button>
    <button class="swatch" data-fc="#2f6b57" style="--sw:#2f6b57" title="绿"></button>
    <button class="et-ghost" data-fc="inherit">默认色</button>
  </div>
  <div class="et-row">
    <span class="et-hint">选中文字后点色块即可高亮/改色；编辑保存在本机浏览器，换设备前请先导出。</span>
    <button class="et-outline" id="et-export">⭳ 导出编辑</button>
    <button class="et-outline" id="et-import">⭱ 导入编辑</button>
    <input type="file" id="et-import-file" accept="application/json" hidden>
    <button class="et-outline et-danger" id="et-reset">清空本机编辑</button>
  </div>
</div>

<script type="application/json" id="book-os-data">__BOOK_OS_DATA__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('book-os-data').textContent);
  var state = { tab:'pyramid', search:'', starOnly:false, editMode:false, expanded:{}, jumpTo:null };

  var $ = function(sel, el){ return (el||document).querySelector(sel); };
  var main = $('#main');
  var quickjumpEl = $('#quickjump');
  var searchInput = $('#search');

  $('#site-title').textContent = DATA.meta.title || '读书宇宙';
  $('#site-sub').textContent = DATA.meta.subtitle || '';

  function esc(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function matchText(hay, needle){ return hay && hay.toLowerCase().indexOf(needle) !== -1; }

  // ---------- local edit overlay (localStorage, namespaced separately from Mind OS) ----------
  var overlay = {};
  try{ overlay = JSON.parse(localStorage.getItem('bookos-edits-v1')||'{}'); }catch(e){ overlay = {}; }
  function saveOverlay(){ try{ localStorage.setItem('bookos-edits-v1', JSON.stringify(overlay)); }catch(e){} }
  var FALLBACK = {};
  function fieldHTML(key, plain){
    FALLBACK[key] = plain || '';
    var ov = overlay[key];
    if(ov && ov.html != null) return ov.html;
    return esc(plain || '');
  }
  function effectiveText(key, plain){
    var ov = overlay[key];
    return (ov && ov.text != null) ? ov.text : (plain || '');
  }

  var ALLOWED_TAGS = {MARK:1, SPAN:1, B:1, STRONG:1, I:1, EM:1, BR:1};
  function filterStyle(style){
    var out = [];
    style.split(';').forEach(function(rule){
      var parts = rule.split(':');
      if(parts.length !== 2) return;
      var prop = parts[0].trim().toLowerCase();
      var val = parts[1].trim();
      if((prop === 'color' || prop === 'background-color') && /^[a-zA-Z0-9#(),.% ]+$/.test(val)){
        out.push(prop + ':' + val);
      }
    });
    return out.join(';');
  }
  function sanitizeNode(node){
    var child = node.firstChild;
    while(child){
      var next = child.nextSibling;
      if(child.nodeType === 1){
        var tag = child.tagName;
        if(!ALLOWED_TAGS[tag]){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          child = next; continue;
        }
        var styleVal = child.getAttribute('style');
        Array.prototype.slice.call(child.attributes).forEach(function(a){ child.removeAttribute(a.name); });
        if((tag === 'SPAN' || tag === 'MARK') && styleVal){
          var cleaned = filterStyle(styleVal);
          if(cleaned) child.setAttribute('style', cleaned);
        }
        sanitizeNode(child);
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
      child = next;
    }
  }
  function sanitizeInline(html){
    var box = document.createElement('div');
    box.innerHTML = html;
    sanitizeNode(box);
    return box.innerHTML;
  }
  function commitEdit(el){
    var key = el.getAttribute('data-key');
    if(!key) return;
    var text = el.textContent || '';
    if(text.trim() === ''){

  function truthMatchesSearch(t, q){
    if(matchText(effectiveText(t.id + '::title', t.title), q)) return true;
    if(matchText(effectiveText(t.id + '::keyword', t.keyword), q)) return true;
    if(matchText(effectiveText(t.id + '::core', t.core), q)) return true;

    for(var i=0;i<books.length;i++){ if(matchText(books[i].title.toLowerCase(), q)) return true; }
    var insights = t.insights || [];
    for(var j=0;j<insights.length;j++){ if(matchText((insights[j].title||'').toLowerCase(), q)) return true; }
    return false;
  }

  function sectionForSubcat(quad, sc, list){
    var id = 'sc-' + quad.id + '-' + sc.id;
    var clusterDefs = (sc.clusters && sc.clusters.length) ? sc.clusters : [{id: null, name: null}];
    var byCluster = {};
    list.forEach(function(t){
      var cid = t.cluster || '_none';
      (byCluster[cid] = byCluster[cid] || []).push(t);
    });
    var groupsHTML = '';
    clusterDefs.forEach(function(cl){
      var items = byCluster[cl.id || '_none'] || [];
      if(!items.length) return;
      groupsHTML += (cl.name ? '<div class="cluster-h">' + esc(cl.name) + '</div>' : '') +
        '<div class="card-grid">' + items.map(truthCardHTML).join('') + '</div>';
    });
    var assignedIds = {};
    clusterDefs.forEach(function(cl){ (byCluster[cl.id || '_none'] || []).forEach(function(t){ assignedIds[t.id] = true; }); });
    var orphans = list.filter(function(t){ return !assignedIds[t.id]; });
    if(orphans.length) groupsHTML += '<div class="card-grid">' + orphans.map(truthCardHTML).join('') + '</div>';
    return '<section class="subcat-section" id="' + id + '">' +
      '<h3 class="subcat-h"><span class="sc-name">' + esc(sc.name) + '</span><span class="sc-count mono">' + list.length + ' 条</span></h3>' +
      groupsHTML +
      '</section>';
  }

  // ---------- render: graph tab ----------
  function renderGraph(){
    var truths = DATA.universalTruths;
    if(!truths.length){ main.innerHTML = '<div class="empty-hint">还没有可视化的条目。</div>'; return; }
    var buckets = {};
    truths.forEach(function(t){
      var tids = (t.threads && t.threads.length) ? t.threads : ['_unassigned'];
      tids.forEach(function(tid){ (buckets[tid] = buckets[tid] || []).push(t); });
    });
    var threadIds = Object.keys(buckets);
    var W = 760, H = 560, cx = W/2, cy = H/2, R1 = Math.min(W,H)/2 - 110;
    var colorVar = ['var(--thread-1)','var(--thread-2)','var(--thread-3)','var(--thread-4)','var(--thread-5)','var(--thread-6)'];
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    var nodesSvg = '', edgesSvg = '';
    threadIds.forEach(function(tid, i){
      var angle = (i / threadIds.length) * Math.PI * 2 - Math.PI/2;
      var hx = cx + R1 * Math.cos(angle), hy = cy + R1 * Math.sin(angle);
      var th = threadById(tid);
      var color = colorVar[i % colorVar.length];
      var members = buckets[tid];
      var R2 = 70;
      members.forEach(function(t, j){
        var a2 = (members.length === 1) ? angle : angle + (j/(members.length-1) - 0.5) * 1.1;
        var nx = hx + R2 * Math.cos(a2), ny = hy + R2 * Math.sin(a2);
        edgesSvg += '<line x1="' + hx.toFixed(1) + '" y1="' + hy.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) + '" stroke="' + color + '" stroke-width="1.3" stroke-opacity="0.55"/>';
        var qColor = 'var(--quad-' + t.quadrant.toLowerCase() + ')';
        var r = 7 + Math.min(3, (t.books||[]).length);
        nodesSvg += '<g class="g-node" data-jump-pyramid="' + t.id + '" transform="translate(' + nx.toFixed(1) + ',' + ny.toFixed(1) + ')">' +
          '<title>' + esc(t.title) + '</title>' +
          '<circle r="' + r + '" fill="' + qColor + '"/>' +
          '<text x="0" y="' + (r+12) + '" text-anchor="middle">' + esc((t.keyword||t.title||'').slice(0,8)) + '</text>' +
          '</g>';
      });
      nodesSvg += '<g class="g-hub" transform="translate(' + hx.toFixed(1) + ',' + hy.toFixed(1) + ')">' +
        '<circle r="5" fill="' + color + '"/>' +
        '<text x="0" y="-10" text-anchor="middle">' + esc(th ? th.name : '待归类') + '</text>' +
        '</g>';
    });
    svg += edgesSvg + nodesSvg + '</svg>';

    var legend = '<div class="g-legend">' + threadIds.map(function(tid, i){
      var th = threadById(tid);
      var color = colorVar[i % colorVar.length];
      return '<div class="g-legend-item"><span class="g-legend-dot" style="background:' + color + '"></span>' +
        esc(th ? th.name + '（' + th.desc + '）' : '待归类') + '</div>';
    }).join('') + '</div>';

    main.innerHTML = '<div class="graph-wrap">' + svg + '</div>' + legend +
      '<div class="graph-hint">节点 = 一条普世智条目（颜色按四象限），线条颜色 = 所属跨学科主线；点击节点跳转到金字塔中的完整卡片。</div>';
  }

  function observeSections(){
    if(io) io.disconnect();

    if(!sections.length || !window.IntersectionObserver) return;
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var id = en.target.id;
          Array.prototype.forEach.call(quickjumpEl.querySelectorAll('.qj-chip'), function(c){
            c.classList.toggle('active', c.getAttribute('data-target') === id);
          });
        }
      });
    }, {rootMargin: '-40% 0px -50% 0px', threshold: 0});
    Array.prototype.forEach.call(sections, function(s){ io.observe(s); });
  }

  function afterRenderJump(){
    if(!state.jumpTo) return;
    var id = state.jumpTo; state.jumpTo = null;
    requestAnimationFrame(function(){
      var el = main.querySelector('[data-id="' + id + '"]');
      if(!el) return;
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 1600);
    });
  }

  main.addEventListener('click', function(e){
    var t = e.target;
    var starBtn = t.closest && t.closest('.star-btn');
    if(starBtn){
      var id1 = starBtn.getAttribute('data-id');
      var key1 = id1 + '::star';
      if(overlay[key1]) delete overlay[key1]; else overlay[key1] = true;
      saveOverlay(); render(); return;
    }
    var jumpPyr = t.closest && t.closest('[data-jump-pyramid]');
    if(jumpPyr){ jumpToPyramid(jumpPyr.getAttribute('data-jump-pyramid')); return; }
    var jumpBooks = t.closest && t.closest('[data-jump-books]');
    if(jumpBooks){
      state.tab = 'books'; setActiveTab('books'); state.search = ''; searchInput.value = ''; render(); return;
    }
    var head = t.closest && t.closest('.pcard-head');
    if(head){
      if(state.editMode && t.closest('.editable')) return;
      var id3 = head.getAttribute('data-id');
      state.expanded[id3] = !state.expanded[id3];
      render(); return;
    }
  });

  quickjumpEl.addEventListener('click', function(e){
    var qjChip = e.target.closest && e.target.closest('.qj-chip');
    if(qjChip) scrollToSection(qjChip.getAttribute('data-target'));
  });

  function updateStatPill(){
    var distilled = DATA.books.filter(function(b){ return b.status !== 'queued'; }).length;
    $('#stat-pill').textContent = distilled + ' / ' + DATA.books.length + ' 本已开始梳理 · ' + DATA.universalTruths.length + ' 条普世智';
  }

  function render(){
    updateStatPill();
    if(state.tab === 'pyramid') renderPyramid();
    else if(state.tab === 'graph') renderGraph();
    else renderBooks();
    renderQuickJump();
    applyEditableAttrs();
    afterRenderJump();
  }

  // deep-link support: #UT-xxx opens directly into that card on first load
  if(location.hash && location.hash.length > 1){
    var hashId = decodeURIComponent(location.hash.slice(1));
    if(truthById(hashId)) state.jumpTo = hashId, state.expanded[hashId] = true;
  }

  render();
})();
</script>

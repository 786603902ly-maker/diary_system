<title>个人知识宇宙 · Mind OS · Book OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    /* 冷调石灰纸 + 深松石绿——刻意避开"暖米白+赭石"的默认配色 */
    --bg:#f1f3f1; --bg-elev:#ffffff; --bg-sunken:#e9ece9; --ink:#1b211e; --ink-soft:#4e5651; --ink-faint:#838c86;
    --line:#dfe4e0; --line-soft:#eaeeeb;
    --accent:#2f6b57; --accent-soft:#e3ece7; --accent-ink:#1b4a3c;
    --quad-mas:#b0691f; --quad-inw:#2f6b57; --quad-deo:#6a5a9e; --quad-leg:#a6433f; --health-accent:#2f6b8f;
    --recent:#2f6b57; --recent-soft:#e3ece7;
    --star:#b8860f; --star-soft:#f6ecd2;
    --shadow-sm:0 1px 2px rgba(20,30,25,.05);
    --shadow:0 1px 2px rgba(20,30,25,.05), 0 6px 20px rgba(20,30,25,.07);
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --life-bg:#eaeeeb;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --thread-1:#b0691f; --thread-2:#2f6b57; --thread-3:#6a5a9e; --thread-4:#a6433f; --thread-5:#2f6b8f; --thread-6:#8a7a2f;
    font-size:16px;
  }
  :root[data-theme="dark"]{
    --bg:#10140f; --bg-elev:#171d19; --bg-sunken:#1b221d; --ink:#e7ece9; --ink-soft:#b7c0bb; --ink-faint:#7c8781;
    --line:#29332d; --line-soft:#1d2521;
    --accent:#7fbfa3; --accent-soft:#1d362e; --accent-ink:#bfe6d3;
    --quad-mas:#d99a4e; --quad-inw:#7fbfa3; --quad-deo:#a79bde; --quad-leg:#d68787; --health-accent:#7fa9d9;
    --recent:#7fbfa3; --recent-soft:#1d362e;
    --star:#e0b34c; --star-soft:#2c2411;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --life-bg:#171d19;
    --thread-1:#d99a4e; --thread-2:#7fbfa3; --thread-3:#a79bde; --thread-4:#d68787; --thread-5:#7fa9d9; --thread-6:#cdbb5f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10140f; --bg-elev:#171d19; --bg-sunken:#1b221d; --ink:#e7ece9; --ink-soft:#b7c0bb; --ink-faint:#7c8781;
      --line:#29332d; --line-soft:#1d2521;
      --accent:#7fbfa3; --accent-soft:#1d362e; --accent-ink:#bfe6d3;
      --quad-mas:#d99a4e; --quad-inw:#7fbfa3; --quad-deo:#a79bde; --quad-leg:#d68787; --health-accent:#7fa9d9;
      --recent:#7fbfa3; --recent-soft:#1d362e;
      --star:#e0b34c; --star-soft:#2c2411;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --life-bg:#171d19;
      --thread-1:#d99a4e; --thread-2:#7fbfa3; --thread-3:#a79bde; --thread-4:#d68787; --thread-5:#7fa9d9; --thread-6:#cdbb5f;
    }
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden;}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  a{color:inherit}
  button{font:inherit;color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px;}
  h1,h2,h3{text-wrap:balance;margin:0;}
  [tabindex]:focus-visible, button:focus-visible, input:focus-visible, [contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  body.edit-mode .wrap{padding-bottom:160px;}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .top-inner{max-width:1040px;margin:0 auto;padding:14px 16px 10px;}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .title-groups{display:flex;gap:18px;flex-wrap:wrap;row-gap:2px;}
  .title-group h1{font-size:1.05rem;font-weight:700;letter-spacing:.02em;}
  .title-group .sub{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);letter-spacing:.02em;display:block;margin-top:1px;}
  .title-sep{color:var(--line);align-self:center;font-size:1.2rem;}
  .head-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-soft);border-radius:var(--radius-sm);padding:6px 11px;font-size:.76rem;cursor:pointer;line-height:1.3;}
  .icon-btn:hover{border-color:var(--accent);color:var(--ink);}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

  .controls{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .search-box{flex:1 1 220px;position:relative;}
  .search-box input{width:100%;padding:9px 14px 9px 34px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-size:.88rem;outline:none;}
  .search-box input:focus{border-color:var(--accent)}
  .search-box::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:1rem;}
  .toggle-pill{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-soft);border:1px solid var(--line);background:var(--bg-elev);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
  .toggle-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:inline-block;}
  .toggle-pill .dot.star-dot{width:auto;height:auto;border-radius:0;background:none;color:var(--ink-faint);font-size:.8rem;}
  .toggle-pill.on{background:var(--recent-soft);color:var(--recent);border-color:var(--recent);font-weight:600;}
  .toggle-pill.on .dot{background:var(--recent);}
  .toggle-pill.on .dot.star-dot{background:none;color:var(--star);}
  #star-toggle.on{background:var(--star-soft);color:var(--star);border-color:var(--star);}
  #star-toggle.on .dot.star-dot{color:var(--star);}
  .stat-pill{font-size:.74rem;color:var(--ink-faint);background:var(--bg-sunken);border-radius:999px;padding:6px 12px;white-space:nowrap;}

  .tabs{display:flex;gap:3px;align-items:center;margin-top:12px;background:var(--bg-sunken);border-radius:var(--radius-sm);padding:3px;width:fit-content;max-width:100%;overflow-x:auto;}
  .tab-group{display:flex;gap:3px;}
  .tab-divider{width:1px;align-self:stretch;background:var(--line);margin:3px 4px;flex:none;}
  .tab{flex:none;padding:7px 16px;border-radius:7px;font-size:.82rem;color:var(--ink-faint);cursor:pointer;border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--bg-elev);color:var(--ink);font-weight:700;box-shadow:var(--shadow-sm);}

  .quickjump{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;max-width:1040px;margin:0 auto;border-top:1px solid var(--line-soft);-webkit-overflow-scrolling:touch;}
  .quickjump[hidden]{display:none;}
  .qj-chip{flex:none;display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);background:var(--bg-elev);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  .qj-chip.dim{opacity:.4;}
  .qj-chip.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600;}
  .qj-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;}
  .qj-chip[data-q="MAS"] .qj-dot{background:var(--quad-mas);}
  .qj-chip[data-q="INW"] .qj-dot{background:var(--quad-inw);}
  .qj-chip[data-q="DEO"] .qj-dot{background:var(--quad-deo);}
  .qj-chip[data-q="LEG"] .qj-dot{background:var(--quad-leg);}

  main{padding-top:16px;}

  /* ---------- quadrant / subcat section headers ---------- */
  .quad-block{margin-bottom:26px;}
  .quad-h{font-size:1.05rem;font-weight:800;display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .quad-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .quad-h[data-q="MAS"]{color:var(--quad-mas);} .quad-h[data-q="MAS"] .quad-dot{background:var(--quad-mas);}
  .quad-h[data-q="INW"]{color:var(--quad-inw);} .quad-h[data-q="INW"] .quad-dot{background:var(--quad-inw);}
  .quad-h[data-q="DEO"]{color:var(--quad-deo);} .quad-h[data-q="DEO"] .quad-dot{background:var(--quad-deo);}
  .quad-h[data-q="LEG"]{color:var(--quad-leg);} .quad-h[data-q="LEG"] .quad-dot{background:var(--quad-leg);}
  .quad-en{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;font-weight:400;}
  .quad-tag{font-size:.8rem;color:var(--ink-faint);margin:2px 0 12px;}

  .subcat-section{margin-bottom:18px;scroll-margin-top:236px;}
  .subcat-h{display:flex;align-items:baseline;gap:8px;font-size:.88rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .sc-count{font-size:.68rem;color:var(--ink-faint);font-weight:400;background:var(--bg-sunken);border-radius:999px;padding:2px 8px;}
  .cluster-h{font-size:.72rem;font-weight:600;color:var(--ink-faint);margin:12px 0 6px;padding-left:9px;border-left:2px solid var(--line);}
  .cluster-h:first-child{margin-top:0;}

  /* ---------- card grid (flat, expand-in-place) ---------- */
  .card-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .pcard{flex:1 1 190px;max-width:300px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
  .pcard:hover{border-color:var(--accent);}
  .pcard.starred{border-color:var(--star);background:linear-gradient(var(--star-soft),var(--star-soft)) padding-box, var(--bg-elev);}
  .pcard.starred{background:var(--star-soft);}
  .pcard.expanded{flex:1 1 100%;max-width:100%;box-shadow:var(--shadow);}
  .pcard.flash{animation:flashPulse 1.6s ease;}
  @keyframes flashPulse{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:var(--shadow-sm);}}

  .pcard-head{display:flex;align-items:flex-start;gap:8px;padding:12px 13px;cursor:pointer;}
  .star-btn{flex:none;border:none;background:none;cursor:pointer;font-size:.95rem;color:var(--ink-faint);line-height:1;padding:1px;}
  .pcard.starred .star-btn{color:var(--star);}
  .pcard-head-text{flex:1;min-width:0;}
  .pc-kw{font-weight:700;font-size:.9rem;margin-bottom:2px;}
  .pc-title{font-size:.72rem;color:var(--ink-faint);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .pcard.expanded .pc-title{-webkit-line-clamp:initial;}
  .pc-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .b-recent{width:6px;height:6px;border-radius:50%;background:var(--recent);display:inline-block;}
  .b-evergreen{font-size:.62rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 6px;white-space:nowrap;}
  .b-quote{border:1px solid var(--line);background:var(--bg-sunken);color:var(--ink-soft);border-radius:999px;font-size:.65rem;padding:1px 7px;cursor:pointer;white-space:nowrap;}
  .b-quote:hover{border-color:var(--accent);color:var(--accent-ink);}
  .pc-books{font-size:.62rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 7px;white-space:nowrap;}
  .pc-id{font-size:.62rem;color:var(--ink-faint);}
  .pc-chev{font-size:.6rem;color:var(--ink-faint);}
  .pc-day{font-size:.6rem;color:var(--ink-faint);white-space:nowrap;}

  .pcard-body{padding:0 15px 16px;border-top:1px solid var(--line-soft);margin-top:2px;padding-top:12px;}
  .pcard-body{animation:pcardIn .18s ease;}
  @keyframes pcardIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .core{font-size:.92rem;color:var(--ink);margin-bottom:12px;white-space:pre-wrap;}
  .day-prog{font-size:.8rem;color:var(--ink-soft);background:var(--bg-sunken);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;white-space:pre-wrap;}
  .action{font-size:.86rem;color:var(--ink-soft);background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 13px;margin-bottom:14px;white-space:pre-wrap;}
  .action b{color:var(--accent-ink);}
  .section-label{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;margin:14px 0 7px;}

  .quote-block{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:8px;}
  .quote-block .qtext{font-size:.9rem;font-style:italic;color:var(--accent-ink);}
  .quote-block .qdate{font-size:.68rem;color:var(--ink-faint);margin-top:4px;}

  .case-item{position:relative;padding:0 0 12px 16px;border-left:2px solid var(--line-soft);}
  .case-item:last-child{border-color:transparent;padding-bottom:0;}
  .case-item::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
  .case-item.recent::before{background:var(--recent);}
  .case-item .cdate{font-size:.7rem;color:var(--ink-faint);font-weight:600;margin-bottom:2px;}
  .case-item .ctext{font-size:.83rem;color:var(--ink-soft);}

  .ctx-toggle{font-size:.68rem;color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:0;margin-top:5px;text-decoration:underline;text-underline-offset:2px;display:inline-block;}
  .ctx-panel{display:none;margin-top:6px;padding:9px 11px;background:var(--bg-sunken);border-radius:var(--radius-sm);font-size:.8rem;color:var(--ink-soft);white-space:pre-wrap;}
  .ctx-panel.open{display:block;}
  .root-toggle{font-size:.76rem;color:var(--ink-faint);cursor:pointer;border:1px dashed var(--line);background:none;border-radius:var(--radius-sm);padding:6px 12px;display:inline-block;margin-top:2px;}
  .root-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .root-cases{display:none;margin-top:9px;}
  .root-cases.open{display:block;}
  .jump-link-btn,.jump-link{font-size:.76rem;color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;display:inline-block;margin-top:10px;}

  .link-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip-book{font-size:.72rem;background:var(--bg-sunken);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;}
  .chip-jump{font-size:.72rem;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-block;}
  .chip-jump:hover{background:var(--accent);color:#fff;}
  .chip-thread{font-size:.68rem;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;}

  /* ---------- quotes tab ---------- */
  .qgroup-list{display:flex;flex-direction:column;gap:10px;}
  .qgroup{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow-sm);}
  .qgroup.starred{border-color:var(--star);background:var(--star-soft);}
  .qgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .qgroup-head .pc-id{background:var(--bg-sunken);border-radius:6px;padding:2px 7px;font-size:.68rem;color:var(--ink-soft);}
  .qgroup-title{font-weight:700;font-size:.86rem;flex:1;min-width:120px;}
  .qgroup .quote-block:last-child{margin-bottom:0;}

  /* ---------- life tab ---------- */
  .life-list{margin-top:10px;}
  .life-year{font-size:.78rem;font-weight:700;color:var(--ink-faint);margin:18px 0 8px;letter-spacing:.05em;}
  .life-item{background:var(--life-bg);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;font-size:.85rem;color:var(--ink-soft);display:flex;gap:10px;}
  .life-item .ldate{flex:none;font-size:.72rem;color:var(--ink-faint);padding-top:1px;white-space:nowrap;}
  .life-item .life-body{flex:1;min-width:0;}
  .life-member{color:var(--ink-faint);font-weight:600;}
  .tl-part + .tl-part{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .tl-part-quote{font-style:italic;}
  .tl-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tl-chip{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-soft);background:var(--bg-elev);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .tl-chip .tl-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .tl-chip.active{border-color:var(--ink-soft);color:var(--ink);font-weight:600;background:var(--bg-sunken);}
  .tl-chip[data-tl-filter="life"] .tl-dot{background:var(--ink-faint);}
  .tl-chip[data-tl-filter="health"] .tl-dot{background:var(--health-accent);}
  .tl-chip[data-tl-filter="MAS"] .tl-dot{background:var(--quad-mas);}
  .tl-chip[data-tl-filter="INW"] .tl-dot{background:var(--quad-inw);}
  .tl-chip[data-tl-filter="DEO"] .tl-dot{background:var(--quad-deo);}
  .tl-chip[data-tl-filter="LEG"] .tl-dot{background:var(--quad-leg);}

  .empty-hint{color:var(--ink-faint);font-size:.85rem;padding:40px 10px;text-align:center;}
  .search-hit-meta{font-size:.7rem;color:var(--ink-faint);margin-bottom:10px;}

  /* ---------- book insight / analogy / scenario / internalization blocks ---------- */
  .insight-block{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:8px;}
  .insight-title{font-weight:700;font-size:.86rem;color:var(--accent-ink);margin-bottom:2px;}
  .insight-src{font-size:.68rem;color:var(--ink-faint);margin-bottom:6px;}
  .insight-mech{font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
  .insight-ex{font-size:.82rem;color:var(--ink-soft);background:var(--bg-elev);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:6px;white-space:pre-wrap;}
  .insight-ex b{color:var(--accent-ink);}
  .insight-take{font-size:.83rem;color:var(--ink);font-weight:600;white-space:pre-wrap;}

  .analogy-block{border-left:3px solid var(--quad-deo);background:color-mix(in srgb, var(--quad-deo) 12%, var(--bg-elev));border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:12px;}
  .analogy-domain{font-weight:700;font-size:.82rem;color:var(--quad-deo);margin-bottom:4px;}
  .analogy-text{font-size:.84rem;color:var(--ink-soft);white-space:pre-wrap;}

  .scenario-block{border-left:3px solid var(--quad-leg);background:color-mix(in srgb, var(--quad-leg) 10%, var(--bg-elev));border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:12px;}
  .scenario-case{font-size:.68rem;color:var(--ink-faint);font-weight:600;margin-bottom:4px;}
  .scenario-text{font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
  .scenario-q{font-size:.84rem;color:var(--ink);font-style:italic;white-space:pre-wrap;}
  .scenario-hang{font-size:.7rem;color:var(--quad-leg);font-weight:700;margin-top:6px;}
  .scenario-ans{font-size:.82rem;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);white-space:pre-wrap;}

  .internal-block{background:var(--bg-sunken);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:.84rem;}
  .internal-block div{margin-bottom:4px;}
  .internal-block b{color:var(--accent-ink);}

  /* ---------- graph tab ---------- */
  .graph-wrap{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow-sm);}
  .graph-wrap svg{width:100%;height:auto;display:block;}
  .g-node{cursor:pointer;}
  .g-node circle{stroke:var(--bg-elev);stroke-width:2px;}
  .g-node text{font-size:10px;fill:var(--ink);pointer-events:none;}

  .xl-type-isomorphism{background:var(--quad-inw);color:var(--bg-elev);}

  .xl-why{font-size:.84rem;color:var(--ink-soft);line-height:1.65;margin-bottom:12px;}
  .xl-members-label{font-size:.72rem;color:var(--ink-faint);font-weight:700;margin-bottom:6px;}
  .group-member{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin-bottom:8px;cursor:pointer;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  .group-member:last-child{margin-bottom:0;}

  .group-member-head{display:flex;align-items:center;gap:8px;margin-bottom:2px;}

  .group-member-ann{font-size:.82rem;color:var(--accent-ink);background:var(--accent-soft);border-radius:var(--radius-sm);padding:6px 9px;margin-top:6px;}

  /* ---------- books tab ---------- */
  .book-doc-group{margin-bottom:20px;}
  .book-doc-h{font-size:.86rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .book-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:6px;}
  .book-status{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line);}
  .book-status.distilled{background:var(--recent);}
  .book-status.in-progress{background:var(--star);}
  .book-title{font-weight:600;font-size:.86rem;}
  .book-author{font-size:.72rem;color:var(--ink-faint);margin-left:6px;}
  .book-links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
  .book-link{font-size:.68rem;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap;}

  /* ---------- editable ---------- */
  .editable{border-radius:4px;}
  body.edit-mode .editable{cursor:text;outline:1px dashed transparent;}
  body.edit-mode .editable:hover{outline-color:var(--line);background:var(--bg-sunken);}
  body.edit-mode .editable:focus{outline:1px solid var(--accent);background:var(--bg-elev);}

  /* ---------- floating cross-tab back button ---------- */
  .nav-back-btn{position:fixed;right:16px;bottom:16px;z-index:26;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow);cursor:pointer;}
  .nav-back-btn:hover{opacity:.9;}
  .nav-back-btn[hidden]{display:none;}
  .nav-back-btn .nbb-arrow{font-size:.95rem;}
  body.edit-mode .nav-back-btn{bottom:170px;}
  @media (max-width:480px){ .nav-back-btn{right:12px;bottom:12px;padding:9px 13px;font-size:.78rem;} body.edit-mode .nav-back-btn{bottom:170px;} }

  /* ---------- fixed edit toolbar ---------- */
  .edit-toolbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg-elev);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 16px;}
  .edit-toolbar[hidden]{display:none;}
  .et-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding:3px 0;}
  .et-label{font-size:.72rem;color:var(--ink-faint);margin-right:2px;}

  .swatch:hover{border-color:var(--ink);transform:scale(1.08);}
  .et-ghost{border:none;background:none;color:var(--ink-faint);font-size:.74rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

  .et-hint{font-size:.7rem;color:var(--ink-faint);flex:1 1 auto;}

  .et-outline:hover{border-color:var(--accent);color:var(--ink);}

</style>

<script type="application/json" id="book-os-data">__BOOK_OS_DATA__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('mind-os-data').textContent);
  var BOOKS = JSON.parse(document.getElementById('book-os-data').textContent);
  var TAB_FAMILY = {kb:'mindos', quotes:'mindos', timeline:'mindos', pyramid:'bookos', library:'bookos', graph:'bookos', books:'bookos'};
  var TIMELINE_START = DATA.meta.timelineStart || '2017-09-25';
  var state = { tab:'kb', search:'', recentOnly:false, starOnly:false, editMode:false, expanded:{}, showRootFor:{}, showCtxFor:{}, jumpTo:null, graphMode:'library', timelineCategory:null, navStack:[] };

  var $ = function(sel, el){ return (el||document).querySelector(sel); };
  var main = $('#main');
  var quickjumpEl = $('#quickjump');
  var searchInput = $('#search');
  var navBackBtn = $('#nav-back-btn');
  var navBackLabel = $('#nav-back-label');

  $('#site-sub-mindos').textContent = DATA.meta.subtitle || '';
  $('#site-sub-bookos').textContent = BOOKS.meta.subtitle || '';

  function esc(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function matchText(hay, needle){ return hay && hay.toLowerCase().indexOf(needle) !== -1; }

  // ---------- local edit overlay (shared across both systems; one-time migration from the
  // two systems' pre-merge separate localStorage keys so existing highlights/stars survive) ----------
  var overlay = {};
  try{ overlay = JSON.parse(localStorage.getItem('kos-edits-v1')||'{}'); }catch(e){ overlay = {}; }
  if(!localStorage.getItem('kos-edits-v1')){
    var legacy = {};
    try{ Object.assign(legacy, JSON.parse(localStorage.getItem('mindos-edits-v1')||'{}')); }catch(e){}
    try{ Object.assign(legacy, JSON.parse(localStorage.getItem('bookos-edits-v1')||'{}')); }catch(e){}
    if(Object.keys(legacy).length){ overlay = legacy; }
  }
  function saveOverlay(){
    try{ localStorage.setItem('kos-edits-v1', JSON.stringify(overlay)); }catch(e){}
  }
  var FALLBACK = {};
  function fieldHTML(key, plain){
    FALLBACK[key] = plain || '';
    var ov = overlay[key];
    if(ov && ov.html != null) return ov.html;
    return esc(plain || '');
  }
  function effectiveText(key, plain){
    var ov = overlay[key];
    return (ov && ov.text != null) ? ov.text : (plain || '');
  }

  var ALLOWED_TAGS = {MARK:1, SPAN:1, B:1, STRONG:1, I:1, EM:1, BR:1};
  function filterStyle(style){
    var out = [];
    style.split(';').forEach(function(rule){
      var parts = rule.split(':');
      if(parts.length !== 2) return;
      var prop = parts[0].trim().toLowerCase();
      var val = parts[1].trim();
      if((prop === 'color' || prop === 'background-color') && /^[a-zA-Z0-9#(),.% ]+$/.test(val)){
        out.push(prop + ':' + val);
      }
    });
    return out.join(';');
  }
  function sanitizeNode(node){
    var child = node.firstChild;
    while(child){
      var next = child.nextSibling;
      if(child.nodeType === 1){
        var tag = child.tagName;
        if(!ALLOWED_TAGS[tag]){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          child = next; continue;
        }
        var styleVal = child.getAttribute('style');
        Array.prototype.slice.call(child.attributes).forEach(function(a){ child.removeAttribute(a.name); });
        if((tag === 'SPAN' || tag === 'MARK') && styleVal){
          var cleaned = filterStyle(styleVal);
          if(cleaned) child.setAttribute('style', cleaned);
        }
        sanitizeNode(child);
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
      child = next;
    }
  }
  function sanitizeInline(html){
    var box = document.createElement('div');
    box.innerHTML = html;
    sanitizeNode(box);
    return box.innerHTML;
  }
  function commitEdit(el){
    var key = el.getAttribute('data-key');
    if(!key) return;
    var text = el.textContent || '';
    if(text.trim() === ''){
      delete overlay[key];
      el.innerHTML = esc(FALLBACK[key] || '');
    } else {
      overlay[key] = { html: sanitizeInline(el.innerHTML), text: text };
    }
    saveOverlay();
  }

  // ---------- theme ----------
  var themeBtn = $('#theme-btn');
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); localStorage.setItem('kos-theme', t); }
    else { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem('kos-theme'); }
  }
  var savedTheme = localStorage.getItem('kos-theme') || localStorage.getItem('mindos-theme') || localStorage.getItem('bookos-theme');
  if(savedTheme) applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next;
    if(!cur) next = prefersDark ? 'light' : 'dark';
    else if(cur === 'dark') next = 'light';
    else next = 'dark';
    applyTheme(next);
  });

  // ---------- edit mode ----------
  var editModeBtn = $('#edit-mode-btn');
  var editToolbar = $('#edit-toolbar');
  function applyEditableAttrs(){
    Array.prototype.forEach.call(main.querySelectorAll('.editable'), function(el){
      if(state.editMode) el.setAttribute('contenteditable', 'true');
      else el.removeAttribute('contenteditable');
    });
  }
  editModeBtn.addEventListener('click', function(){
    state.editMode = !state.editMode;
    document.body.classList.toggle('edit-mode', state.editMode);
    editModeBtn.classList.toggle('on', state.editMode);
    editToolbar.hidden = !state.editMode;
    applyEditableAttrs();
  });
  main.addEventListener('focusout', function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('editable')) return;
    commitEdit(el);
  });
  main.addEventListener('paste', function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('editable')) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  editToolbar.addEventListener('mousedown', function(e){ e.preventDefault(); });
  editToolbar.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.hasAttribute('data-hl')){ document.execCommand('hiliteColor', false, b.getAttribute('data-hl')); commitActive(); return; }
    if(b.hasAttribute('data-fc')){ document.execCommand('foreColor', false, b.getAttribute('data-fc')); commitActive(); return; }
    if(b.id === 'et-export'){ exportEdits(); return; }
    if(b.id === 'et-import'){ $('#et-import-file').click(); return; }
    if(b.id === 'et-reset'){ resetEdits(); return; }
  });
  function commitActive(){
    var a = document.activeElement;
    if(a && a.classList && a.classList.contains('editable')) commitEdit(a);
  }
  function todayStr(){
    var d = new Date();
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fallbackDownload(text){
    try{
      var blob = new Blob([text], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'kos-edits-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    }catch(e){ alert('导出失败：' + (e && e.message || e)); }
  }
  function exportEdits(){
    var payload = JSON.stringify(overlay, null, 2);
    if(window.claude && window.claude.downloads){
      window.claude.downloads.save({filename:'kos-edits-' + todayStr() + '.json', data: payload}).catch(function(){
        fallbackDownload(payload);
      });
    } else {
      fallbackDownload(payload);
    }
  }
  $('#et-import-file').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var incoming = JSON.parse(reader.result);
        var n = 0;
        Object.keys(incoming).forEach(function(k){ overlay[k] = incoming[k]; n++; });
        saveOverlay();
        render();
        alert('已导入编辑记录（' + n + ' 条）。');
      }catch(err){ alert('文件内容不是有效的编辑记录 JSON，导入失败。'); }
    };
    reader.readAsText(f);
    this.value = '';
  });
  function resetEdits(){
    if(!confirm('确定清空本机保存的全部编辑（文字修改/高亮/标星，含日记与读书宇宙两边）吗？此操作不可撤销，建议先导出备份。')) return;
    overlay = {};
    saveOverlay();
    render();
  }

  // ---------- tabs ----------
  function setActiveTab(name){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-tab') === name); });
  }
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      state.tab = t.getAttribute('data-tab');
      setActiveTab(state.tab);
      state.search = ''; searchInput.value = '';
      render();
    });
  });

  // ---------- search / filters ----------
  var searchTimer;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ state.search = searchInput.value.trim(); render(); }, 120);
  });
  var recentToggle = $('#recent-toggle');
  recentToggle.addEventListener('click', function(){
    state.recentOnly = !state.recentOnly;
    recentToggle.classList.toggle('on', state.recentOnly);
    render();
  });
  var starToggle = $('#star-toggle');
  starToggle.addEventListener('click', function(){
    state.starOnly = !state.starOnly;
    starToggle.classList.toggle('on', state.starOnly);
    render();
  });

  // 键盘可达性：自定义 div 控件（tabindex=0）用 Enter/Space 触发点击；
  // 排除真实 button/input 与 contenteditable，避免打字时空格被拦截。
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var el = document.activeElement;
    if(!el || el.getAttribute('tabindex') !== '0') return;
    e.preventDefault();
    el.click();
  });

  function principleById(id){ return DATA.principles.find(function(p){ return p.id === id; }); }
  function quadrantById(id){ return DATA.quadrants.find(function(q){ return q.id === id; }); }
  function truthById(id){ return BOOKS.universalTruths.find(function(t){ return t.id === id; }); }
  function bookById(id){ return BOOKS.books.find(function(b){ return b.id === id; }); }
  function threadById(id){ return BOOKS.threads.find(function(t){ return t.id === id; }); }
  function libById(id){ return (BOOKS.library || []).find(function(e){ return e.id === id; }); }
  function principlesOf(qid, scid){
    return DATA.principles.filter(function(p){ return p.quadrant === qid && (!scid || p.subcat === scid); });
  }
  function truthsOf(qid, scid){
    return BOOKS.universalTruths.filter(function(t){ return t.quadrant === qid && (!scid || t.subcat === scid); });
  }
  function libraryOf(qid, scid){
    return (BOOKS.library || []).filter(function(e){ return e.quadrant === qid && (!scid || e.subcat === scid); });
  }
  function isRecentEnough(p){
    return p.recency === 'recent' || p.recency === 'mixed' || p.recency === 'evergreen';
  }
  function isStarred(id){ return !!overlay[id + '::star']; }

  function principleMatchesSearch(p, q){
    if(matchText(effectiveText(p.id + '::title', p.title), q)) return true;
    if(matchText(effectiveText(p.id + '::keyword', p.keyword), q)) return true;
    if(matchText(effectiveText(p.id + '::core', p.core), q)) return true;
    if(matchText(effectiveText(p.id + '::action', p.action), q)) return true;
    var quotes = p.quotes || [];
    for(var i = 0; i < quotes.length; i++){ if(matchText(effectiveText(p.id + '::quote::' + i, quotes[i].text), q)) return true; }
    var cases = p.cases || [];
    for(var j = 0; j < cases.length; j++){ if(matchText(effectiveText(p.id + '::case::' + j, cases[j].text), q)) return true; }
    return false;
  }

  function truthMatchesSearch(t, q){
    if(matchText(effectiveText(t.id + '::title', t.title), q)) return true;
    if(matchText(effectiveText(t.id + '::keyword', t.keyword), q)) return true;
    if(matchText(effectiveText(t.id + '::core', t.core), q)) return true;
    var books = (t.books || []).map(bookById).filter(Boolean);
    for(var i=0;i<books.length;i++){ if(matchText(books[i].title.toLowerCase(), q)) return true; }
    var insights = t.insights || [];
    for(var j=0;j<insights.length;j++){ if(matchText((insights[j].title||'').toLowerCase(), q)) return true; }
    return false;
  }

  function libMatchesSearch(e, q){
    if(matchText(effectiveText(e.id + '::title', e.title), q)) return true;
    if(matchText(effectiveText(e.id + '::keyword', e.keyword), q)) return true;
    if(matchText(effectiveText(e.id + '::core', e.core), q)) return true;
    if(matchText(effectiveText(e.id + '::annotation', e.annotation), q)) return true;
    if(e.quote && matchText(e.quote.toLowerCase(), q)) return true;
    var b = bookById(e.book);
    if(b && matchText(b.title.toLowerCase(), q)) return true;
    return false;
  }

  // ---------- shared: quadrant/subcat/cluster section renderer (used by both KB and Pyramid) ----------
  function sectionForSubcat(quad, sc, list, cardRenderer){
    var id = 'sc-' + quad.id + '-' + sc.id;
    var clusterDefs = (sc.clusters && sc.clusters.length) ? sc.clusters : [{id: null, name: null}];
    var byCluster = {};
    list.forEach(function(item){
      var cid = item.cluster || '_none';
      (byCluster[cid] = byCluster[cid] || []).push(item);
    });
    var groupsHTML = '';
    clusterDefs.forEach(function(cl){
      var items = byCluster[cl.id || '_none'] || [];
      if(!items.length) return;
      groupsHTML += (cl.name ? '<div class="cluster-h">' + esc(cl.name) + '</div>' : '') +
        '<div class="card-grid">' + items.map(cardRenderer).join('') + '</div>';
    });
    var assignedIds = {};
    clusterDefs.forEach(function(cl){ (byCluster[cl.id || '_none'] || []).forEach(function(item){ assignedIds[item.id] = true; }); });
    var orphans = list.filter(function(item){ return !assignedIds[item.id]; });
    if(orphans.length) groupsHTML += '<div class="card-grid">' + orphans.map(cardRenderer).join('') + '</div>';
    return '<section class="subcat-section" id="' + id + '">' +
      '<h3 class="subcat-h"><span class="sc-name">' + esc(sc.name) + '</span><span class="sc-count mono">' + list.length + ' 条</span></h3>' +
      groupsHTML +
      '</section>';
  }

  // ---------- render: life tab ----------
  // ---------- timeline: unified, color-coded merge of lifeRecords + every dated principle
  // quote/case (from TIMELINE_START onward) — "life" rows are plain diary flow, "insight" rows
  // are the same excerpts already curated into 思维库, tinted by which quadrant they belong to.
  function parseDateTuple(s){
    if(!s) return null;
    var m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(s);
    if(!m) return null;
    return [parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 1, m[3] ? parseInt(m[3], 10) : 1];
  }
  function dateTupleCompare(a, b){
    for(var i = 0; i < 3; i++){ if(a[i] !== b[i]) return a[i] - b[i]; }
    return 0;
  }
  var TL_CATEGORIES = [
    { id: 'life', label: '生活记录' },
    { id: 'health', label: '健康追踪' },
    { id: 'MAS', label: null }, { id: 'INW', label: null }, { id: 'DEO', label: null }, { id: 'LEG', label: null }
  ];
  function timelineItemCategory(it){
    return it.kind === 'insight' ? it.quadrant : it.kind;
  }
  function collectTimelineItems(){
    var items = [];
    (DATA.lifeRecords || []).forEach(function(rec, idx){
      items.push({ date: rec.date, kind: 'life', text: rec.text, context: rec.context,
        key: 'life::' + idx, ctxKey: 'life::' + idx + '::ctx' });
    });
    (DATA.healthLog || []).forEach(function(rec, idx){
      var key = 'health::' + idx;
      items.push({ date: rec.date, kind: 'health', text: rec.note, context: rec.context, member: rec.member,
        key: key, ctxKey: key + '::ctx' });
    });
    DATA.principles.forEach(function(p){
      // A quote and a case dated the same day are almost always the same diary moment seen
      // twice (verbatim excerpt + distilled reflection) — group same-principle/same-date
      // quotes+cases into one timeline card instead of two near-identical ones, so reading the
      // timeline doesn't mean re-reading the same day's insight back to back.
      var byDate = {};
      (p.quotes || []).forEach(function(qt, idx){
        var key = p.id + '::quote::' + idx;
        (byDate[qt.date] = byDate[qt.date] || []).push({ type: 'quote', text: qt.text, context: qt.context, key: key, ctxKey: key + '::ctx' });
      });
      (p.cases || []).forEach(function(c, idx){
        var key = p.id + '::case::' + idx;
        (byDate[c.date] = byDate[c.date] || []).push({ type: 'case', text: c.text, context: c.context, key: key, ctxKey: key + '::ctx' });
      });
      Object.keys(byDate).forEach(function(date){
        var parts = byDate[date].slice().sort(function(a, b){ return a.type === b.type ? 0 : (a.type === 'quote' ? -1 : 1); });
        items.push({ date: date, kind: 'insight', quadrant: p.quadrant, principleId: p.id, keyword: p.keyword, parts: parts });
      });
    });
    var cutoff = parseDateTuple(TIMELINE_START);
    return items.filter(function(it){
      var dt = parseDateTuple(it.date);
      return dt && cutoff && dateTupleCompare(dt, cutoff) >= 0;
    });
  }
  function timelineItemHTML(it){
    if(it.kind === 'insight'){
      var qColor = 'var(--quad-' + it.quadrant.toLowerCase() + ')';
      var partsHTML = it.parts.map(function(part){
        return '<div class="tl-part' + (part.type === 'quote' ? ' tl-part-quote' : '') + '">' +
          '<span class="editable" data-key="' + part.key + '">' + fieldHTML(part.key, part.text) + '</span>' +
          ctxToggleHTML(part.ctxKey, part.context) +
        '</div>';
      }).join('');
      return '<div class="life-item insight" style="border-left:3px solid ' + qColor + ';background:color-mix(in srgb, ' + qColor + ' 9%, var(--life-bg));">' +
        '<span class="ldate mono">' + esc(it.date || '') + '</span>' +
        '<div class="life-body">' +
          '<span class="chip-jump" data-jump-kb="' + it.principleId + '" style="margin-right:6px;">💡 ' + esc(it.keyword) + '</span>' +
          partsHTML +
        '</div></div>';
    }
    if(it.kind === 'health'){

  function renderTimelineLegend(){

    }).join('') + '</div>';
  }
  function renderTimeline(){
    var q = state.search.toLowerCase();
    var items = collectTimelineItems();
    if(q) items = items.filter(function(it){
      if(it.parts) return it.parts.some(function(part){ return matchText(effectiveText(part.key, part.text), q); }) || (it.keyword && matchText(it.keyword.toLowerCase(), q));
      return matchText(effectiveText(it.key, it.text), q) || (it.member && matchText(it.member, q));
    });
    if(state.recentOnly){

    if(state.timelineCategory) items = items.filter(function(it){ return timelineItemCategory(it) === state.timelineCategory; });

    var byYear = {};

  // ---------- render: graph tab (two modes: 思维库全景 comprehensive map, 金字塔主线 thread constellation) ----------
  function graphModeSwitchHTML(){
    return '<div class="controls" style="margin:0 0 12px;">' +
      '<button class="tab' + (state.graphMode==='library'?' active':'') + '" data-graph-mode="library" style="background:' + (state.graphMode==='library'?'var(--bg-elev)':'transparent') + '">思维库全景</button>' +
      '<button class="tab' + (state.graphMode==='thread'?' active':'') + '" data-graph-mode="thread" style="background:' + (state.graphMode==='thread'?'var(--bg-elev)':'transparent') + '">金字塔主线</button>' +
      '</div>';
  }
  function renderLibraryGraph(){
    var entries = BOOKS.library || [];
    if(!entries.length){ main.innerHTML = graphModeSwitchHTML() + '<div class="empty-hint">读书思维库还没有条目可视化。</div>'; return; }
    var quadOrder = ['MAS','INW','DEO','LEG'];
    var byQuad = {MAS:[],INW:[],DEO:[],LEG:[]};
    entries.forEach(function(e){ (byQuad[e.quadrant] = byQuad[e.quadrant] || []).push(e); });
    var W = 900, H = 900, cx = W/2, cy = H/2;
    var arcWidth = (Math.PI/2) * 0.82;
    var pos = {};
    quadOrder.forEach(function(qid, qi){
      var list = byQuad[qid] || [];
      var centerAngle = qi * (Math.PI/2) + Math.PI/4 - Math.PI/2; // start MAS at top, go clockwise
      var ringCount = Math.min(4, Math.max(1, Math.ceil(list.length / 14)));
      list.forEach(function(e, i){
        var ring = i % ringCount;
        var idxInRing = Math.floor(i / ringCount);
        var perRing = Math.ceil(list.length / ringCount);
        var a = (perRing > 1) ? (centerAngle - arcWidth/2 + (idxInRing/(perRing-1)) * arcWidth) : centerAngle;
        var r = 140 + ring * 85;
        pos[e.id] = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
      });
    });
    var edgesSvg = '';
    var drawnPairs = {};
    (BOOKS.crossLinks || []).forEach(function(xl){
      var m = xl.members;
      for(var i = 0; i < m.length; i++){
        for(var j = i + 1; j < m.length; j++){
          var a = m[i], b = m[j];
          if(!pos[a] || !pos[b]) continue;
          var key = a < b ? a + '|' + b : b + '|' + a;
          if(drawnPairs[key]) continue;
          drawnPairs[key] = true;
          var p1 = pos[a], p2 = pos[b];
          edgesSvg += '<line x1="' + p1.x.toFixed(1) + '" y1="' + p1.y.toFixed(1) + '" x2="' + p2.x.toFixed(1) + '" y2="' + p2.y.toFixed(1) + '" stroke="var(--ink-faint)" stroke-width="0.8" stroke-opacity="0.35"/>';
        }
      }
    });
    var nodesSvg = entries.map(function(e){
      var p = pos[e.id];
      if(!p) return '';
      var qColor = 'var(--quad-' + e.quadrant.toLowerCase() + ')';
      return '<g class="g-node" data-jump-library="' + e.id + '" transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')">' +
        '<title>' + esc(e.title) + '</title>' +
        '<circle r="4.5" fill="' + qColor + '"/>' +
        '</g>';
    }).join('');
    var quadLabelsSvg = quadOrder.map(function(qid, qi){
      var centerAngle = qi * (Math.PI/2) + Math.PI/4 - Math.PI/2;
      var lx = cx + (140 + 4*85 + 30) * Math.cos(centerAngle), ly = cy + (140 + 4*85 + 30) * Math.sin(centerAngle);
      var quad = BOOKS.quadrants.find(function(q){ return q.id === qid; });
      var qColor = 'var(--quad-' + qid.toLowerCase() + ')';
      return '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" fill="' + qColor + '" font-size="15" font-weight="700">' + esc(quad ? quad.name : qid) + '</text>';
    }).join('');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + edgesSvg + nodesSvg + quadLabelsSvg + '</svg>';
    main.innerHTML = graphModeSwitchHTML() + '<div class="graph-wrap">' + svg + '</div>' +
      '<div class="graph-hint">' + entries.length + ' 条读书思维库条目，按四象限分布；节点颜色=象限，连线=经过人工核实、写明"为什么"的跨书连接（悬停看标题，点击跳转到读书思维库对应卡片）。下面是这些连线对应的可读内容，每一组先给出共享的底层规律和成立的理由，再列出参与的条目，直接往下滑就能看，不用去点图上的点。</div>' +
      crossBookGroupsHTML();
  }

  // ---------- cross-book connection groups: editorial, not inferred ----------
  // BOOKS.crossLinks is the single source of truth for "which entries share a deeper
  // idea" — each entry is an explicit, hand-checked claim (law + why), never a bare
  // ID pair. A crossLink's `type` names what kind of connection it actually is, so a
  // real cross-domain structural analogy is never visually confused with "these two
  // just happen to sit in the same subcategory."
  var XL_TYPE_META = {
    isomorphism: { emoji: '🧬', label: '跨学科同构' },
    convergence: { emoji: '📚', label: '同源汇聚' },
    instance:    { emoji: '📎', label: '案例佐证' },
    chain:       { emoji: '⛓', label: '递进链条' },
    tension:     { emoji: '⚖️', label: '观点张力' },
    complement:  { emoji: '🧩', label: '互补策略' }
  };
  function libAdjacency(){
    if(BOOKS._xlAdj) return BOOKS._xlAdj;
    var adj = {};
    (BOOKS.crossLinks || []).forEach(function(xl){
      xl.members.forEach(function(id){ (adj[id] = adj[id] || []).push(xl); });
    });
    BOOKS._xlAdj = adj;
    return adj;
  }
  function groupMemberHTML(e){
    var b = bookById(e.book);
    return '<div class="group-member" data-id="' + e.id + '" data-jump-library="' + e.id + '">' +
      '<div class="group-member-head">' +
        '<span class="pc-kw">' + esc(e.keyword) + '</span>' +
        (b ? '<span class="pc-books">📖 ' + esc(b.title) + '</span>' : '') +
      '</div>' +
      '<div class="group-member-title">' + esc(e.title) + '</div>' +
      '<div class="group-member-core">' + esc(e.core) + '</div>' +
      (e.annotation ? '<div class="group-member-ann">🖊 ' + esc(e.annotation) + '</div>' : '') +
      '</div>';
  }
  function crossLinkCardHTML(xl){
    var members = xl.members.map(libById).filter(Boolean);
    var books = [];
    members.forEach(function(e){
      var b = bookById(e.book);
      if(b && books.indexOf(b.title) === -1) books.push(b.title);
    });
    var meta = XL_TYPE_META[xl.type] || { emoji: '🔗', label: xl.type };
    return '<div class="cross-group">' +
      '<div class="cross-group-head">' +
        '<span class="xl-type-badge xl-type-' + esc(xl.type) + '">' + meta.emoji + ' ' + esc(meta.label) + '</span>' +
        '<span class="cross-group-books">📚 ' + books.map(esc).join(' × ') + '</span>' +
      '</div>' +
      '<div class="xl-law">' + esc(xl.law) + '</div>' +
      '<div class="xl-why">' + esc(xl.why) + '</div>' +
      '<div class="xl-members-label">参与条目（' + members.length + '）</div>' +
      members.map(groupMemberHTML).join('') +
      '</div>';
  }
  function crossBookGroupsHTML(){
    var groups = BOOKS.crossLinks || [];
    if(!groups.length) return '<div class="empty-hint">还没有发现跨书连接。</div>';
    var touched = {};
    groups.forEach(function(xl){ xl.members.forEach(function(id){ touched[id] = true; }); });
    var html = '<div class="section-label" style="margin-top:20px;">🔗 跨学科连接组（' + groups.length + ' 组，' +
      Object.keys(touched).length + ' 条条目参与）</div>';
    html += groups.map(crossLinkCardHTML).join('');
    return html;
  }
  function renderThreadGraph(){
    var truths = BOOKS.universalTruths;
    if(!truths.length){ main.innerHTML = graphModeSwitchHTML() + '<div class="empty-hint">还没有可视化的条目。</div>'; return; }
    var buckets = {};
    truths.forEach(function(t){
      var tids = (t.threads && t.threads.length) ? t.threads : ['_unassigned'];
      tids.forEach(function(tid){ (buckets[tid] = buckets[tid] || []).push(t); });
    });
    var threadIds = Object.keys(buckets);
    var W = 760, H = 560, cx = W/2, cy = H/2, R1 = Math.min(W,H)/2 - 110;
    var colorVar = ['var(--thread-1)','var(--thread-2)','var(--thread-3)','var(--thread-4)','var(--thread-5)','var(--thread-6)'];
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    var nodesSvg = '', edgesSvg = '';
    threadIds.forEach(function(tid, i){
      var angle = (i / threadIds.length) * Math.PI * 2 - Math.PI/2;
      var hx = cx + R1 * Math.cos(angle), hy = cy + R1 * Math.sin(angle);
      var th = threadById(tid);
      var color = colorVar[i % colorVar.length];
      var members = buckets[tid];
      var R2 = 70;
      members.forEach(function(t, j){
        var a2 = (members.length === 1) ? angle : angle + (j/(members.length-1) - 0.5) * 1.1;
        var nx = hx + R2 * Math.cos(a2), ny = hy + R2 * Math.sin(a2);
        edgesSvg += '<line x1="' + hx.toFixed(1) + '" y1="' + hy.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) + '" stroke="' + color + '" stroke-width="1.3" stroke-opacity="0.55"/>';
        var qColor = 'var(--quad-' + t.quadrant.toLowerCase() + ')';
        var r = 7 + Math.min(3, (t.books||[]).length);
        nodesSvg += '<g class="g-node" data-jump-pyramid="' + t.id + '" transform="translate(' + nx.toFixed(1) + ',' + ny.toFixed(1) + ')">' +
          '<title>' + esc(t.title) + '</title>' +
          '<circle r="' + r + '" fill="' + qColor + '"/>' +
          '<text x="0" y="' + (r+12) + '" text-anchor="middle">' + esc((t.keyword||t.title||'').slice(0,8)) + '</text>' +
          '</g>';
      });
      nodesSvg += '<g class="g-hub" transform="translate(' + hx.toFixed(1) + ',' + hy.toFixed(1) + ')">' +
        '<circle r="5" fill="' + color + '"/>' +
        '<text x="0" y="-10" text-anchor="middle">' + esc(th ? th.name : '待归类') + '</text>' +
        '</g>';
    });
    svg += edgesSvg + nodesSvg + '</svg>';

    var legend = '<div class="g-legend">' + threadIds.map(function(tid, i){
      var th = threadById(tid);
      var color = colorVar[i % colorVar.length];
      return '<div class="g-legend-item"><span class="g-legend-dot" style="background:' + color + '"></span>' +
        esc(th ? th.name + '（' + th.desc + '）' : '待归类') + '</div>';
    }).join('') + '</div>';

    main.innerHTML = graphModeSwitchHTML() + '<div class="graph-wrap">' + svg + '</div>' + legend +
      '<div class="graph-hint">节点 = 一条普世智条目（颜色按四象限），线条颜色 = 所属跨学科主线；点击节点跳转到金字塔中的完整卡片。</div>';
  }
  function renderGraph(){
    if(state.graphMode === 'thread') renderThreadGraph();
    else renderLibraryGraph();
  }

  // ---------- render: books tab ----------
  function renderBooks(){
    var q = state.search.toLowerCase();
    var byDoc = {};
    var order = [];
    BOOKS.books.forEach(function(b){
      if(q && !matchText(b.title.toLowerCase(), q) && !matchText((b.author||'').toLowerCase(), q)) return;

    var html = '<div class="stat-pill" style="margin-bottom:14px;display:inline-block;">已收录读书思维库 ' + distilled + ' / ' + BOOKS.books.length + ' 本</div>';
    order.forEach(function(doc){
      html += '<div class="book-doc-group"><div class="book-doc-h">' + esc(doc) + '</div>';

          '<div class="book-links">' +
            pyrRefs.map(function(t){ return '<span class="book-link" data-jump-pyramid="' + t.id + '">🌍 ' + esc(t.keyword || t.id) + ' →</span>'; }).join('') +
            libRefs.map(function(e){ return '<span class="book-link" data-jump-library="' + e.id + '">📖 ' + esc(e.keyword || e.id) + ' →</span>'; }).join('') +
          '</div>' +
          '</div>';
      });
      html += '</div>';
    });

  // ---------- quick-jump rail (kb + pyramid tabs, both share the same quadrant/subcat id scheme) ----------
  var io = null;
  function observeSections(){
    if(io) io.disconnect();
    var sections = main.querySelectorAll('.subcat-section');
    if(!sections.length || !window.IntersectionObserver) return;
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var id = en.target.id;
          Array.prototype.forEach.call(quickjumpEl.querySelectorAll('.qj-chip'), function(c){
            c.classList.toggle('active', c.getAttribute('data-target') === id);
          });
        }
      });
    }, {rootMargin: '-40% 0px -50% 0px', threshold: 0});
    Array.prototype.forEach.call(sections, function(s){ io.observe(s); });
  }
  function renderQuickJump(){
    if(state.tab !== 'kb' && state.tab !== 'pyramid' && state.tab !== 'library'){ quickjumpEl.hidden = true; quickjumpEl.innerHTML = ''; return; }
    quickjumpEl.hidden = false;
    var html = '';
    DATA.quadrants.forEach(function(quad){
      quad.subcats.forEach(function(sc){
        var target = 'sc-' + quad.id + '-' + sc.id;
        var exists = !!document.getElementById(target);
        html += '<button class="qj-chip' + (exists ? '' : ' dim') + '" data-q="' + quad.id + '" data-target="' + target + '">' +
          '<span class="qj-dot"></span>' + esc(sc.name) + '</button>';
      });
    });
    quickjumpEl.innerHTML = html;
    observeSections();
  }
  function scrollToSection(id){
    var el = document.getElementById(id);
    if(!el) return;
    // measured at click time (not a fixed CSS value) so it stays correct if the sticky
    // header's real height changes — quickjump row hidden/shown, edit toolbar, responsive wrap, etc.
    var header = document.querySelector('header.top');
    var offset = (header ? header.getBoundingClientRect().height : 0) + 10;
    var top = el.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
  }

  // ---------- cross-tab / cross-system jump ----------
  // Every jump* below hops to a different tab (and often a different card), which used to
  // strand the reader's scroll position with no way back. pushNav() snapshots "where I was"
  // right before the hop; the floating "返回上一页" button (goBack) pops the stack and restores
  // it. One shared stack works across both Mind OS and Book OS since they render into the same
  // #main / state — no per-system implementation needed.
  function pushNav(){
    state.navStack.push({ tab: state.tab, scrollY: window.scrollY, search: state.search, timelineCategory: state.timelineCategory, graphMode: state.graphMode });
    if(state.navStack.length > 30) state.navStack.shift();
    updateNavBackBtn();
  }
  function updateNavBackBtn(){
    var n = state.navStack.length;
    navBackBtn.hidden = n === 0;
    navBackLabel.textContent = n > 1 ? ('返回上一页（' + n + '）') : '返回上一页';
  }
  function goBack(){
    if(!state.navStack.length) return;
    var snap = state.navStack.pop();
    state.tab = snap.tab; setActiveTab(snap.tab);
    state.search = snap.search || ''; searchInput.value = state.search;
    state.timelineCategory = snap.timelineCategory;
    if(snap.graphMode) state.graphMode = snap.graphMode;
    render();
    updateNavBackBtn();
    // scroll restore needs to happen after the new tab's (possibly much taller/shorter) HTML
    // has actually been laid out, hence the double rAF rather than a single one.
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ window.scrollTo({top: snap.scrollY, behavior: 'auto'}); });
    });
  }
  navBackBtn.addEventListener('click', goBack);
  function jumpToQuotes(id){
    pushNav();
    state.tab = 'quotes'; setActiveTab('quotes'); state.search = ''; searchInput.value = ''; state.jumpTo = id; render();
  }
  function jumpToKB(id){
    pushNav();
    state.tab = 'kb'; setActiveTab('kb'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function jumpToPyramid(id){
    pushNav();
    state.tab = 'pyramid'; setActiveTab('pyramid'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function jumpToLibrary(id){
    pushNav();
    state.tab = 'library'; setActiveTab('library'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function jumpToBooksTab(){
    pushNav();
    state.tab = 'books'; setActiveTab('books'); state.search = ''; searchInput.value = ''; render();
  }
  function afterRenderJump(){
    if(!state.jumpTo) return;
    var id = state.jumpTo; state.jumpTo = null;
    requestAnimationFrame(function(){
      var el = main.querySelector('[data-id="' + id + '"]');
      if(!el) return;
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 1600);
    });
  }

  // ---------- targeted DOM updates for the two hottest interactions (expand/collapse, star) ----------
  // Large tabs (读书思维库 alone can hold 260+ cards) made a full render() per click needlessly
  // expensive — every keystroke-free click was re-building and re-parsing the entire visible
  // list's HTML just to flip one card's state. These two paths patch only the affected node.
  function detailHTMLFor(id){
    var p = principleById(id); if(p) return pcardDetailHTML(p);
    var t = truthById(id); if(t) return truthDetailHTML(t);
    var e = libById(id); if(e) return libDetailHTML(e);
    return '';
  }
  function toggleCardExpand(id){
    var wasExpanded = !!state.expanded[id];
    state.expanded[id] = !wasExpanded;
    var el = main.querySelector('.pcard[data-id="' + id + '"]');
    if(!el){ render(); return; }
    el.classList.toggle('expanded', !wasExpanded);
    var chev = el.querySelector('.pc-chev');
    if(chev) chev.textContent = wasExpanded ? '▾' : '▲';
    if(wasExpanded){
      var body = el.querySelector('.pcard-body');
      if(body) body.remove();
    } else {
      el.insertAdjacentHTML('beforeend', detailHTMLFor(id));
    }
    applyEditableAttrs();
  }
  function toggleStar(id){
    var key = id + '::star';
    var willStar = !overlay[key];
    if(willStar) overlay[key] = true; else delete overlay[key];
    saveOverlay();
    if(state.starOnly){ render(); return; } // visibility itself changes under this filter
    var el = main.querySelector('.pcard[data-id="' + id + '"]');
    if(!el){ render(); return; }
    el.classList.toggle('starred', willStar);
    var btn = el.querySelector('.star-btn[data-id="' + id + '"]');
    if(btn) btn.textContent = willStar ? '★' : '☆';
  }

  // ---------- delegated click handling (shared across both systems: same class names / data-attrs) ----------
  main.addEventListener('click', function(e){
    var t = e.target;
    var starBtn = t.closest && t.closest('.star-btn');
    if(starBtn){ toggleStar(starBtn.getAttribute('data-id')); return; }
    var quoteBadge = t.closest && t.closest('.b-quote');
    if(quoteBadge){ jumpToQuotes(quoteBadge.getAttribute('data-id')); return; }
    var jumpQ = t.closest && t.closest('[data-jump-quotes]');
    if(jumpQ){ jumpToQuotes(jumpQ.getAttribute('data-jump-quotes')); return; }
    var jumpKB = t.closest && t.closest('[data-jump-kb]');
    if(jumpKB){ jumpToKB(jumpKB.getAttribute('data-jump-kb')); return; }
    var jumpPyr = t.closest && t.closest('[data-jump-pyramid]');
    if(jumpPyr){ jumpToPyramid(jumpPyr.getAttribute('data-jump-pyramid')); return; }
    var jumpLib = t.closest && t.closest('[data-jump-library]');
    if(jumpLib){ jumpToLibrary(jumpLib.getAttribute('data-jump-library')); return; }
    var jumpBooksChip = t.closest && t.closest('[data-jump-books]');
    if(jumpBooksChip){ jumpToBooksTab(); return; }
    var graphModeBtn = t.closest && t.closest('[data-graph-mode]');
    if(graphModeBtn){ state.graphMode = graphModeBtn.getAttribute('data-graph-mode'); render(); return; }
    var tlFilterBtn = t.closest && t.closest('[data-tl-filter]');
    if(tlFilterBtn){
      var cat = tlFilterBtn.getAttribute('data-tl-filter');
      state.timelineCategory = (state.timelineCategory === cat) ? null : cat;
      render(); return;
    }
    var rootToggle = t.closest && t.closest('.root-toggle');
    if(rootToggle){
      var id2 = rootToggle.getAttribute('data-id');
      state.showRootFor[id2] = !state.showRootFor[id2];
      render(); return;
    }
    var ctxToggle = t.closest && t.closest('.ctx-toggle');
    if(ctxToggle){
      var ctxKey = ctxToggle.getAttribute('data-ctx');
      state.showCtxFor[ctxKey] = !state.showCtxFor[ctxKey];
      render(); return;
    }
    var head = t.closest && t.closest('.pcard-head');
    if(head){
      if(state.editMode && t.closest('.editable')) return;
      toggleCardExpand(head.getAttribute('data-id'));
      return;
    }
  });

  // quickjump chips live in <header>, outside #main's subtree, so they need their own delegated listener
  quickjumpEl.addEventListener('click', function(e){
    var qjChip = e.target.closest && e.target.closest('.qj-chip');
    if(qjChip) scrollToSection(qjChip.getAttribute('data-target'));
  });

  // ---------- controls visibility (recent-toggle is diary-only; stat-pill is book-only) ----------
  function renderControls(){
    var family = TAB_FAMILY[state.tab];
    recentToggle.hidden = family !== 'mindos';
    var statPill = $('#stat-pill');
    statPill.hidden = family !== 'bookos';
    if(family === 'bookos'){
      var distilled = BOOKS.books.filter(function(b){ return b.status !== 'queued'; }).length;
      statPill.textContent = distilled + ' / ' + BOOKS.books.length + ' 本已收录读书思维库 · ' +
        (BOOKS.library || []).length + ' 条思维库条目 · ' + BOOKS.universalTruths.length + ' 条普世智';
    }
  }

  function render(){
    if(state.tab === 'kb') renderKB();
    else if(state.tab === 'quotes') renderQuotes();
    else if(state.tab === 'timeline') renderTimeline();
    else if(state.tab === 'pyramid') renderPyramid();
    else if(state.tab === 'library') renderLibrary();
    else if(state.tab === 'graph') renderGraph();
    else renderBooks();
    renderControls();
    renderQuickJump();
    applyEditableAttrs();
    afterRenderJump();
  }

  // deep-link support: #MAS-C-50 / #UT-MAS-C-10 / #LIB-MAS-A-10 opens directly into that card
  // on first load, routing to whichever tab (kb / pyramid / library) the id belongs to.
  if(location.hash && location.hash.length > 1){
    var hashId = decodeURIComponent(location.hash.slice(1));
    if(principleById(hashId)){ state.tab = 'kb'; setActiveTab('kb'); state.expanded[hashId] = true; state.jumpTo = hashId; }
    else if(truthById(hashId)){ state.tab = 'pyramid'; setActiveTab('pyramid'); state.expanded[hashId] = true; state.jumpTo = hashId; }
    else if(libById(hashId)){ state.tab = 'library'; setActiveTab('library'); state.expanded[hashId] = true; state.jumpTo = hashId; }
  }

  render();
})();
</script>

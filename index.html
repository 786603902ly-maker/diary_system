<title>个人知识宇宙 · Mind OS · Book OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    /* 冷调石灰纸 + 深松石绿——刻意避开"暖米白+赭石"的默认配色 */
    --bg:#f1f3f1; --bg-elev:#ffffff; --bg-sunken:#e9ece9; --ink:#1b211e; --ink-soft:#4e5651; --ink-faint:#838c86;
    --line:#dfe4e0; --line-soft:#eaeeeb;
    --accent:#2f6b57; --accent-soft:#e3ece7; --accent-ink:#1b4a3c;
    --quad-mas:#b0691f; --quad-inw:#2f6b57; --quad-deo:#6a5a9e; --quad-leg:#a6433f; --health-accent:#2f6b8f;
    --recent:#2f6b57; --recent-soft:#e3ece7;
    --star:#b8860f; --star-soft:#f6ecd2;
    --shadow-sm:0 1px 2px rgba(20,30,25,.05);
    --shadow:0 1px 2px rgba(20,30,25,.05), 0 6px 20px rgba(20,30,25,.07);
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --life-bg:#eaeeeb;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --thread-1:#b0691f; --thread-2:#2f6b57; --thread-3:#6a5a9e; --thread-4:#a6433f; --thread-5:#2f6b8f; --thread-6:#8a7a2f;
    font-size:16px;
  }
  :root[data-theme="dark"]{
    --bg:#10140f; --bg-elev:#171d19; --bg-sunken:#1b221d; --ink:#e7ece9; --ink-soft:#b7c0bb; --ink-faint:#7c8781;
    --line:#29332d; --line-soft:#1d2521;
    --accent:#7fbfa3; --accent-soft:#1d362e; --accent-ink:#bfe6d3;
    --quad-mas:#d99a4e; --quad-inw:#7fbfa3; --quad-deo:#a79bde; --quad-leg:#d68787; --health-accent:#7fa9d9;
    --recent:#7fbfa3; --recent-soft:#1d362e;
    --star:#e0b34c; --star-soft:#2c2411;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --life-bg:#171d19;
    --thread-1:#d99a4e; --thread-2:#7fbfa3; --thread-3:#a79bde; --thread-4:#d68787; --thread-5:#7fa9d9; --thread-6:#cdbb5f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10140f; --bg-elev:#171d19; --bg-sunken:#1b221d; --ink:#e7ece9; --ink-soft:#b7c0bb; --ink-faint:#7c8781;
      --line:#29332d; --line-soft:#1d2521;
      --accent:#7fbfa3; --accent-soft:#1d362e; --accent-ink:#bfe6d3;
      --quad-mas:#d99a4e; --quad-inw:#7fbfa3; --quad-deo:#a79bde; --quad-leg:#d68787; --health-accent:#7fa9d9;
      --recent:#7fbfa3; --recent-soft:#1d362e;
      --star:#e0b34c; --star-soft:#2c2411;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --life-bg:#171d19;
      --thread-1:#d99a4e; --thread-2:#7fbfa3; --thread-3:#a79bde; --thread-4:#d68787; --thread-5:#7fa9d9; --thread-6:#cdbb5f;
    }
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden;}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  a{color:inherit}
  button{font:inherit;color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px;}
  h1,h2,h3{text-wrap:balance;margin:0;}
  [tabindex]:focus-visible, button:focus-visible, input:focus-visible, [contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  body.edit-mode .wrap{padding-bottom:160px;}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .top-inner{max-width:1040px;margin:0 auto;padding:14px 16px 10px;}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .title-groups{display:flex;gap:18px;flex-wrap:wrap;row-gap:2px;}
  .title-group h1{font-size:1.05rem;font-weight:700;letter-spacing:.02em;}
  .title-group .sub{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);letter-spacing:.02em;display:block;margin-top:1px;}
  .title-sep{color:var(--line);align-self:center;font-size:1.2rem;}
  .head-actions{display:flex;gap:6px;}
  .icon-btn{border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-soft);border-radius:var(--radius-sm);padding:6px 11px;font-size:.76rem;cursor:pointer;line-height:1.3;}
  .icon-btn:hover{border-color:var(--accent);color:var(--ink);}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

  .controls{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .search-box{flex:1 1 220px;position:relative;}
  .search-box input{width:100%;padding:9px 14px 9px 34px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-size:.88rem;outline:none;}
  .search-box input:focus{border-color:var(--accent)}
  .search-box::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:1rem;}
  .toggle-pill{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-soft);border:1px solid var(--line);background:var(--bg-elev);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
  .toggle-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:inline-block;}
  .toggle-pill .dot.star-dot{width:auto;height:auto;border-radius:0;background:none;color:var(--ink-faint);font-size:.8rem;}
  .toggle-pill.on{background:var(--recent-soft);color:var(--recent);border-color:var(--recent);font-weight:600;}
  .toggle-pill.on .dot{background:var(--recent);}
  .toggle-pill.on .dot.star-dot{background:none;color:var(--star);}
  #star-toggle.on{background:var(--star-soft);color:var(--star);border-color:var(--star);}
  #star-toggle.on .dot.star-dot{color:var(--star);}
  .stat-pill{font-size:.74rem;color:var(--ink-faint);background:var(--bg-sunken);border-radius:999px;padding:6px 12px;white-space:nowrap;}

  .tabs{display:flex;gap:3px;align-items:center;margin-top:12px;background:var(--bg-sunken);border-radius:var(--radius-sm);padding:3px;width:fit-content;max-width:100%;overflow-x:auto;}
  .tab-group{display:flex;gap:3px;}
  .tab-divider{width:1px;align-self:stretch;background:var(--line);margin:3px 4px;flex:none;}
  .tab{flex:none;padding:7px 16px;border-radius:7px;font-size:.82rem;color:var(--ink-faint);cursor:pointer;border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--bg-elev);color:var(--ink);font-weight:700;box-shadow:var(--shadow-sm);}

  .quickjump{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;max-width:1040px;margin:0 auto;border-top:1px solid var(--line-soft);-webkit-overflow-scrolling:touch;}
  .quickjump[hidden]{display:none;}
  .qj-chip{flex:none;display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);background:var(--bg-elev);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
  .qj-chip.dim{opacity:.4;}
  .qj-chip.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600;}
  .qj-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;}
  .qj-chip[data-q="MAS"] .qj-dot{background:var(--quad-mas);}
  .qj-chip[data-q="INW"] .qj-dot{background:var(--quad-inw);}
  .qj-chip[data-q="DEO"] .qj-dot{background:var(--quad-deo);}
  .qj-chip[data-q="LEG"] .qj-dot{background:var(--quad-leg);}

  main{padding-top:16px;}

  /* ---------- quadrant / subcat section headers ---------- */
  .quad-block{margin-bottom:26px;}
  .quad-h{font-size:1.05rem;font-weight:800;display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .quad-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .quad-h[data-q="MAS"]{color:var(--quad-mas);} .quad-h[data-q="MAS"] .quad-dot{background:var(--quad-mas);}
  .quad-h[data-q="INW"]{color:var(--quad-inw);} .quad-h[data-q="INW"] .quad-dot{background:var(--quad-inw);}
  .quad-h[data-q="DEO"]{color:var(--quad-deo);} .quad-h[data-q="DEO"] .quad-dot{background:var(--quad-deo);}
  .quad-h[data-q="LEG"]{color:var(--quad-leg);} .quad-h[data-q="LEG"] .quad-dot{background:var(--quad-leg);}
  .quad-en{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;font-weight:400;}
  .quad-tag{font-size:.8rem;color:var(--ink-faint);margin:2px 0 12px;}

  .subcat-section{margin-bottom:18px;scroll-margin-top:236px;}
  .subcat-h{display:flex;align-items:baseline;gap:8px;font-size:.88rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .sc-count{font-size:.68rem;color:var(--ink-faint);font-weight:400;background:var(--bg-sunken);border-radius:999px;padding:2px 8px;}
  .cluster-h{font-size:.72rem;font-weight:600;color:var(--ink-faint);margin:12px 0 6px;padding-left:9px;border-left:2px solid var(--line);}
  .cluster-h:first-child{margin-top:0;}

  /* ---------- card grid (flat, expand-in-place) ---------- */
  .card-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .pcard{flex:1 1 190px;max-width:300px;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
  .pcard:hover{border-color:var(--accent);}
  .pcard.starred{border-color:var(--star);background:linear-gradient(var(--star-soft),var(--star-soft)) padding-box, var(--bg-elev);}
  .pcard.starred{background:var(--star-soft);}
  .pcard.expanded{flex:1 1 100%;max-width:100%;box-shadow:var(--shadow);}
  .pcard.flash{animation:flashPulse 1.6s ease;}
  @keyframes flashPulse{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:var(--shadow-sm);}}

  .pcard-head{display:flex;align-items:flex-start;gap:8px;padding:12px 13px;cursor:pointer;}
  .star-btn{flex:none;border:none;background:none;cursor:pointer;font-size:.95rem;color:var(--ink-faint);line-height:1;padding:1px;}
  .pcard.starred .star-btn{color:var(--star);}
  .pcard-head-text{flex:1;min-width:0;}
  .pc-kw{font-weight:700;font-size:.9rem;margin-bottom:2px;}
  .pc-title{font-size:.72rem;color:var(--ink-faint);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .pcard.expanded .pc-title{-webkit-line-clamp:initial;}
  .pc-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .b-recent{width:6px;height:6px;border-radius:50%;background:var(--recent);display:inline-block;}
  .b-evergreen{font-size:.62rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 6px;white-space:nowrap;}
  .b-quote{border:1px solid var(--line);background:var(--bg-sunken);color:var(--ink-soft);border-radius:999px;font-size:.65rem;padding:1px 7px;cursor:pointer;white-space:nowrap;}
  .b-quote:hover{border-color:var(--accent);color:var(--accent-ink);}
  .pc-books{font-size:.62rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 7px;white-space:nowrap;}
  .pc-id{font-size:.62rem;color:var(--ink-faint);}
  .pc-chev{font-size:.6rem;color:var(--ink-faint);}
  .pc-day{font-size:.6rem;color:var(--ink-faint);white-space:nowrap;}

  .pcard-body{padding:0 15px 16px;border-top:1px solid var(--line-soft);margin-top:2px;padding-top:12px;}
  .pcard-body{animation:pcardIn .18s ease;}
  @keyframes pcardIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .core{font-size:.92rem;color:var(--ink);margin-bottom:12px;white-space:pre-wrap;}
  .day-prog{font-size:.8rem;color:var(--ink-soft);background:var(--bg-sunken);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px;white-space:pre-wrap;}
  .action{font-size:.86rem;color:var(--ink-soft);background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 13px;margin-bottom:14px;white-space:pre-wrap;}
  .action b{color:var(--accent-ink);}
  .section-label{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;margin:14px 0 7px;}

  .quote-block{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:8px;}
  .quote-block .qtext{font-size:.9rem;font-style:italic;color:var(--accent-ink);}
  .quote-block .qdate{font-size:.68rem;color:var(--ink-faint);margin-top:4px;}

  .case-item{position:relative;padding:0 0 12px 16px;border-left:2px solid var(--line-soft);}
  .case-item:last-child{border-color:transparent;padding-bottom:0;}
  .case-item::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
  .case-item.recent::before{background:var(--recent);}
  .case-item .cdate{font-size:.7rem;color:var(--ink-faint);font-weight:600;margin-bottom:2px;}
  .case-item .ctext{font-size:.83rem;color:var(--ink-soft);}

  .ctx-toggle{font-size:.68rem;color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:0;margin-top:5px;text-decoration:underline;text-underline-offset:2px;display:inline-block;}
  .ctx-panel{display:none;margin-top:6px;padding:9px 11px;background:var(--bg-sunken);border-radius:var(--radius-sm);font-size:.8rem;color:var(--ink-soft);white-space:pre-wrap;}
  .ctx-panel.open{display:block;}
  .root-toggle{font-size:.76rem;color:var(--ink-faint);cursor:pointer;border:1px dashed var(--line);background:none;border-radius:var(--radius-sm);padding:6px 12px;display:inline-block;margin-top:2px;}
  .root-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .root-cases{display:none;margin-top:9px;}
  .root-cases.open{display:block;}
  .jump-link-btn,.jump-link{font-size:.76rem;color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;display:inline-block;margin-top:10px;}

  .link-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip-book{font-size:.72rem;background:var(--bg-sunken);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;}
  .chip-jump{font-size:.72rem;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-block;}
  .chip-jump:hover{background:var(--accent);color:#fff;}
  .chip-thread{font-size:.68rem;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;}

  /* ---------- quotes tab ---------- */
  .qgroup-list{display:flex;flex-direction:column;gap:10px;}
  .qgroup{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow-sm);}
  .qgroup.starred{border-color:var(--star);background:var(--star-soft);}
  .qgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .qgroup-head .pc-id{background:var(--bg-sunken);border-radius:6px;padding:2px 7px;font-size:.68rem;color:var(--ink-soft);}
  .qgroup-title{font-weight:700;font-size:.86rem;flex:1;min-width:120px;}
  .qgroup .quote-block:last-child{margin-bottom:0;}

  /* ---------- life tab ---------- */
  .life-list{margin-top:10px;}
  .life-year{font-size:.78rem;font-weight:700;color:var(--ink-faint);margin:18px 0 8px;letter-spacing:.05em;}
  .life-item{background:var(--life-bg);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;font-size:.85rem;color:var(--ink-soft);display:flex;gap:10px;}
  .life-item .ldate{flex:none;font-size:.72rem;color:var(--ink-faint);padding-top:1px;white-space:nowrap;}
  .life-item .life-body{flex:1;min-width:0;}
  .life-member{color:var(--ink-faint);font-weight:600;}
  .tl-part + .tl-part{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .tl-part-quote{font-style:italic;}
  .tl-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tl-chip{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-soft);background:var(--bg-elev);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .tl-chip .tl-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .tl-chip.active{border-color:var(--ink-soft);color:var(--ink);font-weight:600;background:var(--bg-sunken);}
  .tl-chip[data-tl-filter="life"] .tl-dot{background:var(--ink-faint);}
  .tl-chip[data-tl-filter="health"] .tl-dot{background:var(--health-accent);}
  .tl-chip[data-tl-filter="MAS"] .tl-dot{background:var(--quad-mas);}
  .tl-chip[data-tl-filter="INW"] .tl-dot{background:var(--quad-inw);}
  .tl-chip[data-tl-filter="DEO"] .tl-dot{background:var(--quad-deo);}
  .tl-chip[data-tl-filter="LEG"] .tl-dot{background:var(--quad-leg);}

  .empty-hint{color:var(--ink-faint);font-size:.85rem;padding:40px 10px;text-align:center;}
  .search-hit-meta{font-size:.7rem;color:var(--ink-faint);margin-bottom:10px;}

  /* ---------- book insight / analogy / scenario / internalization blocks ---------- */
  .insight-block{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:8px;}
  .insight-title{font-weight:700;font-size:.86rem;color:var(--accent-ink);margin-bottom:2px;}
  .insight-src{font-size:.68rem;color:var(--ink-faint);margin-bottom:6px;}
  .insight-mech{font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
  .insight-ex{font-size:.82rem;color:var(--ink-soft);background:var(--bg-elev);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:6px;white-space:pre-wrap;}
  .insight-ex b{color:var(--accent-ink);}
  .insight-take{font-size:.83rem;color:var(--ink);font-weight:600;white-space:pre-wrap;}

  .analogy-block{border-left:3px solid var(--quad-deo);background:color-mix(in srgb, var(--quad-deo) 12%, var(--bg-elev));border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:12px;}
  .analogy-domain{font-weight:700;font-size:.82rem;color:var(--quad-deo);margin-bottom:4px;}
  .analogy-text{font-size:.84rem;color:var(--ink-soft);white-space:pre-wrap;}

  .scenario-block{border-left:3px solid var(--quad-leg);background:color-mix(in srgb, var(--quad-leg) 10%, var(--bg-elev));border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:12px;}
  .scenario-case{font-size:.68rem;color:var(--ink-faint);font-weight:600;margin-bottom:4px;}
  .scenario-text{font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;white-space:pre-wrap;}
  .scenario-q{font-size:.84rem;color:var(--ink);font-style:italic;white-space:pre-wrap;}
  .scenario-hang{font-size:.7rem;color:var(--quad-leg);font-weight:700;margin-top:6px;}
  .scenario-ans{font-size:.82rem;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);white-space:pre-wrap;}

  .internal-block{background:var(--bg-sunken);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:.84rem;}
  .internal-block div{margin-bottom:4px;}
  .internal-block b{color:var(--accent-ink);}

  /* ---------- graph tab ---------- */
  .graph-wrap{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow-sm);}
  .graph-wrap svg{width:100%;height:auto;display:block;}
  .g-node{cursor:pointer;}
  .g-node circle{stroke:var(--bg-elev);stroke-width:2px;}
  .g-node text{font-size:10px;fill:var(--ink);pointer-events:none;}

},{"id":"c2","name":"决策策略"}]}]}],"principles":[{"id":"MAS-A-10","quadrant":"MAS","subcat":"A","keyword":"专注力保护","title":"深度工作要物理隔绝手机，而不是靠意志力硬扛","core":"保护专注力比保护时间更重要。深度 Work 期间，彻底切断手机和干扰。周末早上的手机是专注力杀手。","action":"","quotes":[],"cases":[{"date":"2019","text":"识别到周末早上刷手机是破坏专注力的最大杀手。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"MAS-A-20","quadrant":"MAS","subcat":"A","keyword":"微习惯起步","title":"把目标缩到不可思议的小，才真的启动得了","core":"计划不要定在“困难区”。本能脑厌恶困难。不要定“一天看一本书”这种宏大目标，这会直接吓跑行动力。","action":"把目标缩小到不可思议的程度——“就学15分钟”。用“完成过程”代替“完成目标”。一旦开始，惯性会推着你走。","quotes":[],"cases":[{"date":"2021-10-17","text":"反思为什么总想学习却动不起来，因为目标设得太高。周末想学习却动不起来，是因为潜意识里想定下“一天写完一本书总结”的宏大目标，结果因为太难而直接放弃。正确做法是：计划要清楚实际且很小，容易“无脑执行”。","era":"root","context":"今日份几个反思：1.讲了一万遍的'想学习想进步，计划一大堆，却又行动力不够'，这个周末依然如此。原因还是'本能脑的瞬时满足的力量太强烈'，自控力不足，行动力还不够，自制的良性循环终究还没养成；换个角度，也是因为'急于求成'，忍不住给自己定下很多大目标，比如一天写完一本书，反而反效果。而该怎么做呢？a. 计划不要好高骛远到了困难区，反而削弱了行动力 b. 计划要清楚实际且容易轻易的无脑执行 c. 追求体验和做事的过程，而不是追求要在固定时间完成某一目标，以此来增强行动力 d. 以一个小目标作为开始，比如'就学个15分钟先'，来减少本能脑的抵抗"}],"recency":"root","cluster":"c1","bookRefs":["UT-MAS-A-10"]},{"id":"MAS-A-30","quadrant":"MAS","subcat":"A","keyword":"习惯回路","title":"改的是信号触发的反应，不是靠意志力硬扛","core":"改变坏习惯（拖延）的关键在于识别“信号（Cue）”并替换“反应（Respond）”。坏信号：周末起床→大脑觉得无聊→玩手机（惯性反应）。新回路：周末起床（信号）→告诉自己“小恶魔在诱惑我了”→启动番茄钟（新反应）。","action":"","quotes":[{"date":"2025-05-22","text":"有个很强烈的感觉，就是睡眠对于一天的状态极其重要。如果前一天没睡好，第二天就会情绪很差，没有耐心，做工也不能集中精力……问题就是，自己熬夜的习惯养成了，还没有一个刺激因素，让我决定坚决早睡。每天晚上柔柔10点才睡，之后不带宝宝，完全放松的就那么两个小时，就实在不愿意早早睡。"}],"cases":[{"date":"2025-05-22","text":"刺激控制疗法（Stimulus Control）：反思晚睡根源——卧室和床已经与“看视频、玩游戏”建立了强关联。必须打破这个回路：卧室只用于睡觉，不困不上床，将手机移除卧室。","era":"recent"}],"recency":"recent","cluster":"c1","bookRefs":["UT-MAS-C-10"]},{"id":"MAS-A-40","quadrant":"MAS","subcat":"A","keyword":"拒绝好高骛远","title":"目标定太高，反而会导致什么都不做","core":"不要高估自己一天的能力，也不要低估自己一年的能力。每天进步一点点，好过三天打鱼两天晒网的突击。","action":"","quotes":[{"date":"2022-05-17","text":"周末最大的教训就是设定目标永远不要好高骛远，其实三天完全可以读完一本书，可是到最后连半本书都没有读到，就是因为目标太高，没有动力去做，结果一天，大多数时间没有做事情。","context":"周末最大的教训就是设定目标永远不要好高骛远，其实三天完全可以读完一本书，可是到最后连半本书都没有读到，就是因为目标太高，没有动力去做结果一天，大多数时间没有做事情。也说明了制定清晰目标的重要性，这样也许可以避免打游戏的时间，因为目标不会太高，会比较能够行动，而且目标比较清晰会有动力。"},{"date":"2023-04-08","text":"这周开始尝试2+1模式：在工作日，至少一小时的自我进步时间；而周末，每天两小时……虽然步子小但依然是在稳定的进步。","context":"前几天发现自己焦虑的原因之一，是太久没有正向的习惯养成，比如每天阅读。当时想的解决方案，一个是'多抓住碎片时间学习'，一个是'继续坚持正向的习惯，用增强回路让自己进入正向循环'。于是这周开始尝试2+1模式：在工作日，至少一小时的自我进步时间（读书，写日记，做思维导图）；而周末，每天两小时。现在执行下来，一方面实现的难度的确不高。比如这周末，基本白天在哄娃或清闲时读一小时书比如《人类简史》，然后睡前抓住机会再学习一小时，就可以达到目标；另一方面，的确会让自己的焦虑大大的缓解；因为虽然步子小但依然是在稳定的进步，且因为在拉伸区实现的也好容易。所以，继续坚持这种模式即可。"}],"cases":[{"date":"2016-05-14","text":"周末定了一堆宏大计划，结果一样都没完成，只剩悔恨。","era":"root"},{"date":"2022-05-17","text":"目标过高的反噬：周末设定了“三天读完一本书”的宏大目标，结果因为太难，动力全无，最后连半本都没读。目标定得太高，反而会导致“什么都不做”。","era":"recent"},{"date":"2023-04-08","text":"“2+1”学习模式：针对有娃后“成长时间变少”的焦虑，实施了“2+1”模式：工作日每天至少1小时自我进步（读书、日记），周末每天2小时。这种低门槛的微习惯迅速缓解了“没时间成长”的焦虑，证明了步子小才能走得远。","era":"recent"},{"date":"2022-01-27","text":"体会到了凡事都会过犹不及。比较'一天到晚不间断的读书生活'与'读一两个小时便穿插些别的活动'，后者更有乐趣。若是前者，反而会在一段时间后精力无法集中，是一种无法持续的状态。","era":"recent"}],"recency":"mixed","cluster":"c1","bookRefs":["UT-MAS-A-10"]},{"id":"MAS-A-50","quadrant":"MAS","subcat":"A","keyword":"删除的艺术","title":"选择本身也是一种消耗，要靠标准而不是纠结","core":"少花时间去挑工具，想清楚最看重的功能是哪个，选定一个工具，然后删除其他的，花时间去用一个。避免冲动消费，买东西前冷静三天，放入购物车三天后通常就不想买了。解决选择困难：在小事上（买衣服、选PPT模板）犹豫不决是浪费生命，设定标准（限时10分钟），快速决策，把决策力留给真正的大事。","action":"","quotes":[{"date":"2024-11-21","text":"必须承认我有选择恐惧症，甚至决定犹豫不决，不同的Slides模板怎么选，不同的清单软件、AI软件、投资软件怎么选等等，都要花很多时间纠结。"}],"cases":[{"date":"2016-05-11","text":"痛定思痛决定简化生活，一心一意用好一个工具。曾纠结于官网书单功能不能更新，浪费两个晚上，结果书一页没看。后来领悟：那浪费的时间完全可以拿来静心阅读。工具只是手段，不要本末倒置。","era":"root"},{"date":"2024-11-21","text":"琐事的内耗：承认自己有严重的选择恐惧症，常在Slides模板、清单软件、AI工具选择上浪费大量时间。必须建立“够用就好”的原则，停止在工具层面的过度优化。","era":"recent"}],"recency":"mixed","cluster":"c1","bookRefs":["UT-MAS-C-10"]},{"id":"MAS-A-60","quadrant":"MAS","subcat":"A","keyword":"一个爱好","title":"工作之外要有能进入心流的事，是精神的避难所","core":"工作之外，要有一个能让你进入心流的事（如吉他、写作）。它是你灵魂的避难所。","action":"","quotes":[],"cases":[{"date":"2017","text":"练吉他虽然没大进步，但也是一种寄托。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"MAS-A-70","quadrant":"MAS","subcat":"A","keyword":"拉伸区学习","title":"太易没有成长，太难会丧失兴趣，甜蜜点在中间","core":"最高效的学习发生在“拉伸区”中靠近“困难区”的那一端。太简单（舒适区）没有成长，太难（困难区）会丧失兴趣。","action":"学习新知识时，初期的一知半解是正常的。保持在“有点难但能啃动”的状态效率最高，利用大脑的“后台自动消化”能力，只要坚持输入，过段时间再看就会豁然开朗。","quotes":[{"date":"2022-08-27","text":"本来里面有挺多概念都是第一次见，也无法一下就吃透。可是过一段时间再来看，就能更好地理顺其中脉络了……成长更快的速度，其实是让自己的学习保持在拉伸区中靠近困难区的一端。","context":"在学小岛经济学时产生的感悟：本来里面有挺多概念都是第一次见，也无法一下就吃透。可是过一段时间再来看，就能更好的理顺其中脉络了。和之前学习其他技能类似，完事开头难，大脑有神奇的力量帮你在后台默默的建立联结。继而想到，在学新知识时，不就是在拉伸区里面学习吗？可是拉伸区和困难区到底如何区别呢，固然困难区更难，但是大脑的神奇能力带来的长期收益是不是也一定更高呢？In other Way，在过去自己总想着尽可能在拉伸区中靠近舒适区的一端，但是成长更快的速度，其实是让自己的学习保持在拉伸区中靠近困难区的一端呢？同时，守住另一个boundary，这一端不能难到你直接丧失兴趣。在维持强的兴趣的前提下，尽可能的往困难区那边靠，应该就是最优的学习方式。"}],"cases":[{"date":"2021-11-23","text":"吉他练习的心流：发现自己很有动力练习《卡农》和《加州旅馆》，正是因为它们处于“拉伸区”——不是完全不会（恐慌区），也不是熟练到无聊（舒适区），而是“基本能弹但和弦衔接还需要磨练”。这种“跳一跳够得着”的状态，是技能习得的甜蜜点。","era":"root","context":"成功的在用完两个王者荣耀quota后，停了下来，做别的事情；是一个良性循环的过程。弹了一小时吉他，练习卡农。一个感悟：当我发现自己很有动力练习卡农，或是加州旅馆时，不就是因为把自己放在了拉伸区——肯定是还弹的不够好的，可是同时又已经上手，只是一些和弦的衔接要练习；于是刚刚好就是那个能学到东西，不再会的东西上反复弹，同时又不是太难的区域"},{"date":"2022-08-27","text":"读《小岛经济学》时的感悟：万事开头难，坚持读下去，大脑会自动建立联结。","era":"recent"},{"date":"2022-11-03","text":"不能只靠专注模式，一段时间的发散模式也很重要，千万不要低估大脑的'后台自动消化'能力。比如弹琴在困难处一日苦练并不见效果，过几日再弹突然就熟练了；读一些心理学或生涩的书，一年依然无感，只要坚持，几年后终会不同。","era":"recent","context":"有时候不能只靠专注模式，一段时间的发散模式也很重要，千万不要低估大脑的'后台自动消化'能力。比如弹琴在困难处一日苦练并不见效果，过几日再弹突然就熟练了。再长远些看，很复杂的技巧，几个月都不一定可以，可是持续几年，突然就会突破。比如我突然就可以熟练的弹出《卡农》完整版了。那同理，读书的道理也应该是如此，读一些心理学或某些生涩的书，一年依然无感，只要坚持，几年后终会不同。同时，阅读的方法也很重要，就像卡农和天空之城学习了教学课程教的方法后就更容易了；那么读书，也要自己摸索方法，比如我至少觉得要写'思维导图'，才算是把一本书读懂了。"}],"recency":"mixed","cluster":"c2","bookRefs":["UT-MAS-A-10"]},{"id":"MAS-A-80","quadrant":"MAS","subcat":"A","keyword":"费曼技巧","title":"讲不出来，就说明还没真的懂","core":"如果你不能简单地解释它，你就没有真正理解它。尝试把学到的东西讲给别人听，或者写下来。","action":"","quotes":[{"date":"2024-09-27","text":"最近在year end checkin，发现可以分享一些读到的书里的概念时，切实感受到了学以致用的好处。现在的几十个TM刚好可以作为我学习完后输出练习的对象。再加上YouTube里学到的，成年人的学习要有功利性，不能漫无目的。"}],"cases":[{"date":"2021","text":"通过写日记和整理笔记，强迫自己理顺逻辑。","era":"root"},{"date":"2024-03-19","text":"管理即输出：担任 M2 角色其实是被动的“费曼技巧”实践。因为要回答几十个人各式各样的问题，还要给出 Team Update，这种强反馈机制逼迫我不断思考、梳理逻辑。","era":"recent"},{"date":"2024-09-27","text":"管理即教学：在 One-on-One 中将书中学到的概念（心流、被讨厌的勇气）讲给 TM 听，这种“功利性”输出让理解更深刻。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"MAS-A-90","quadrant":"MAS","subcat":"A","keyword":"先记忆后理解","title":"啃不动的知识先背下来，理解会自己追上来","core":"学习不是线性的。遇到极难理解的知识（如复杂算法），不要钻牛角尖停滞不前。先背下来，背着背着脑中有了素材，某一天自然就理解了（书读百遍其义自见）。","action":"","quotes":[],"cases":[{"date":"2019-10-22","text":"学习算法时，选择“妥协”先背诵，发现反而打破了瓶颈。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"MAS-A-100","quadrant":"MAS","subcat":"A","keyword":"概念生活化","title":"找不到对应的生活事例，说明还没真的掌握","core":"检验是否掌握一个新观点的唯一标准：能否找到对应的生活事例来解释它。抽象概念如果不能落地，只是空中楼阁。这不仅帮助理解，也能在给别人通俗易懂解释时发挥威力。清晰概念→价值观→方法论→践行改进。","action":"","quotes":[{"date":"2024-01-17","text":"愈发觉得对于新学到的观点，要找到对之进行解释的生活事例是非常重要的。一方面会帮助自己更好地理解这些复杂的点，同时也能更牢固地记忆；甚至于当要给身边人通俗易懂地解释时，用这些例子来解释也是最有效的。","context":"愈发觉得对于新学到的观点，要找到对之进行解释的生活事例是非常重要的。一方面会帮助自己更好的理解这些复杂的点，同时也能更牢固的记忆；甚至于当要给身边人通俗易懂的解释时，用这些例子来解释也是最有效的。\n比如什么是strategically thinking，就要拿自己工作中的经验，比如之前安排team assignment怎样想的更高，更远；比如那些心智成长，思维方式，心理学，学习方法，效率与自控；沟通方式；公司管理；知识面扩宽中学到的点，都需要做到这一点。\n清晰的概念与联结→价值观→方法论→践行与改进　学习—记忆—实践—改变\n个人提升：心智成长，心理学，思维方式，效率与自控，学习能力与方法\n为人处世：人际沟通，管理类\n知识面扩宽：传记，法制与科普，社会与政治，历史，哲学，生活与健康，育儿\n小说与文学：文学，小说\n技能教学：理财与金融，设计教学，计算机教学"}],"cases":[{"date":"2024-01-17","text":"概念与事例的联结：愈发觉得新学到的观点（如Strategic Thinking）必须立刻找到工作中的对应事例（如安排Team Assignment时的长远考虑）来解释。","era":"recent"},{"date":"2024-09-14","text":"战略思维的具象化：利用Claude深入拆解了Strategic Thinking在半导体Fab中的具体含义（Technology Roadmap, Capacity Planning, Cost Reduction等）。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"MAS-A-110","quadrant":"MAS","subcat":"A","keyword":"建立知识体系","title":"碎片知识不挂上体系，读了也留不住","core":"碎片化阅读不仅无效，反而有害。必须把碎片知识挂载到自己的知识树上（如个人提升、为人处世、管理等分类）。","action":"","quotes":[{"date":"2024-01-17","text":"个人提升：心智成长，心理学，思维方式，效率与自控，学习能力与方法／为人处世：人际沟通，管理类／知识面扩宽：传记，法制与科普，社会与政治，历史，哲学，生活与健康，育儿／小说与文学／技能教学：理财与金融，设计教学，计算机教学。"},{"date":"2022-12-12","text":"提高记忆能力的一个方法就是'结构性思考'……层层浓缩概括，而更高层的浓缩，就会因其清楚的结构而更容易被记忆。","context":"在读《系统之美》的过程中，感受到了提高记忆能力的一个方法就是'结构性思考'，比如把所有事物map到一个时间轴，于是之后回忆就更容易沿着轴想起来……也有一点《金字塔原理》里的概念，即层层浓缩概括，而更高层的浓缩，就会因其清楚的结构而更容易被记忆。"}],"cases":[{"date":"2024-01-17","text":"建立详细的知识分类表，将“生活事例”填入对应体系。","era":"recent"},{"date":"2022-12-12","text":"读《系统之美》时体会到'结构性思考'能提高长期记忆——把事物挂到一个时间轴上，之后回忆就能沿轴想起（比如把'系统延迟'想象成一根从客户到供应端的轴），这和《金字塔原理》层层浓缩概括、结构清楚才更容易被记住的道理相通。","era":"recent","context":"在读《系统之美》的过程中，感受到了提高记忆能力的一个方法就是'结构性思考'，比如把所有事物map到一个时间轴，于是之后回忆就更容易沿着轴想起来……也有一点《金字塔原理》里的概念，即层层浓缩概括，而更高层的浓缩，就会因其清楚的结构而更容易被记忆。"}],"recency":"recent","cluster":"c2"},{"id":"MAS-A-120","quadrant":"MAS","subcat":"A","keyword":"记录清空大脑","title":"大脑是用来想事的，不是用来记事的","core":"大脑是用来思考的，不是用来记事的。把想法写下来，能清空内存，让思考更深入。","action":"","quotes":[{"date":"2022-08-18","text":"面对失眠，还有一个很重要的经验，就是提前把脑海中挥散不去的情绪或是待办事项记录下来。"}],"cases":[{"date":"2016–2025","text":"坚持十年的日记习惯，让我在2025年回顾时，能清晰看到自己从“情绪的奴隶”到“情绪的主人”的完整蜕变轨迹。","era":"mixed"},{"date":"2022-08-18","text":"书写治愈失眠：因XYG比赛失利和第二天Team Building的压力失眠。起床把脑海中挥之不去的焦虑点写下来后，大脑内存被清空，情绪得到安抚。","era":"recent"},{"date":"2026-01-10","text":"离线存储治愈失眠：凌晨醒来大脑停不下来的本质是“DRAM被占用”。解决方法：把所有Open Ended的焦虑点（如要发的Minutes、要回的Msg）全部写入OneNote或TickTick（存入NAND Flash）。清空大脑的工作内存，才能安心睡眠。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"MAS-A-130","quadrant":"MAS","subcat":"A","keyword":"AI重塑学习流","title":"AI包耗时的整理工作，我只做划重点和应用","core":"分工明确：AI负责耗时并重复的工作（如构建框架、读完原书并像老师一样提炼讲解），我负责划重点与应用（高价值劳动）。降低门槛：AI总结不仅提高了摄入速度，更因为降低了“开始学习”的门槛而增强了行动力。应用导向：打破“必须看完整本书才能学到东西”的执念，可以边学边应用，遇到不懂的地方再返回去查阅原书精确理解。","action":"","quotes":[{"date":"2024-11-23","text":"首先的感受是学习摄入的速度是很快的，几小时能做完之前几天的量……(1)这种降低难度的学习带来更强行动力 (2)ChatGPT可以几乎总结出我手动去做也会总结出的点，但用时远短过我自己敲键盘 (3)这个总结大大降低了我将来回顾的难度。","context":"最近用AI工具做了大量的学习，比如总结YouTube学习视频再自己划要点，或是一些复杂的文章进行AI总结再自己划重点。首先的感受是学习摄入的速度是很快的，几小时能做完之前几天的量，再就是因为这种成就感也增加了自己去学习更多的欲望。但是一直有个担忧在心里，就是这种方法获得的是不是一种虚无的成就感，因为我并没有靠自己写下每一个总结的文字。但今天想到应该没有这样的问题，一是即便转化效率只有自己一字一句写总结的50%，但因为1.这种降低难度的学习带来的更强行动力 2.ChatGPT可以几乎总结出我手动去做也会总结出的点，但用时远短过我自己键盘手敲，3.这个总结大大降低了我将来回顾的难度。这也点醒我，之前我知道ChatGPT适合的就是去辅助你学习全新知识，因为它是个无所不知的老师，可是结束了学生时代后真的要靠ChatGPT来学习的主题实在不多。"},{"date":"2025-01-16","text":"传统方式上，'阅读，画笔记->所有笔记完整总结到思维导图->加入自己的思考'是一套必不可少的流程；但如果把最终效果与花费时间做XY轴，那个'所有笔记完整总结到思维导图'的过程非常耗时、回报很低，但又不可或缺；而现在恰当使用NotebookLM和Gemini、ChatGPT，我就可以跳过这一步。","context":"传统意义上我们觉得AI是拿来实现自动化于是提高生产力的，那么在学习这种很依赖'激发思考'的事情上，只能亲力亲为，可是今日细想，不觉得如此；比如深刻学懂一本书，传统方式上，'阅读，画笔记->所有笔记完整总结到思维导图->加入自己的思考，从完整架构中挑出几个最有触动的点，再次内化为一个300字浓缩版的专属于自己的学习总结'，这是一套必不可少的流程；但是，如果把最终效果与花费时间做XY轴，以我的经验，是一个越来越陡的指数曲线，那个'所有笔记完整总结到思维导图'的过程是非常耗时，回报很低，但是又不可或缺的一个过程；而现在恰当使用notebook LM和Gemini,ChatGPT，我就可以跳过这一步，让AI帮我做好这个思维框架，我把精力花在'进行思考，挑出最有触动的点，内化我专属于我自己的总结'，于是就是事半而功倍了；说明AI即便在思维这种很个性化的事情上，只要你时时都努力想'我生活中哪一刻，哪一件事，可以让AI帮我'，就一定最终可以找到利用他，让你be more effective 的机会"}],"cases":[{"date":"2024-11-23","text":"效率与行动力：AI总结不仅提高了摄入速度，更因为降低了“开始学习”的门槛而增强了行动力。虽然不是自己逐字总结，但“AI总结+自己画重点+方便回顾”的组合拳，总收益远高于“因畏难而什么都不做”。","era":"recent"},{"date":"2025-01-16","text":"AI重塑学习流：传统学习流程是“阅读→画笔记→整理思维导图→内化总结”。发现“整理思维导图”这一步耗时极高但回报低。策略升级：用NotebookLM或ChatGPT代劳构建思维框架（低价值劳动），自己将精力集中在“内化思考”和“提取触动点”（高价值劳动）上，这才是真正的Be more effective。","era":"recent"},{"date":"2026-01-11","text":"打破完整阅读的执念：思考发现，用Gemini看完书并像老师一样教我，是一个真正可行的模式。关键在于“确保知道该怎样应用”，并配合“反向查书”的模式，比以前花几个周硬读完一本书高效得多。","era":"recent"}],"recency":"recent","cluster":"c4"},{"id":"MAS-A-140","quadrant":"MAS","subcat":"A","keyword":"AI分步喂养","title":"复杂任务一次性丢给AI效果差，要拆步骤喂","core":"复杂任务链式拆解：对于复杂任务，直接丢给AI效果很差，必须拆解为“逻辑生成”与“内容扩写”两步。时间检验真需求：检验一个工具（或AI功能）是否是真需求的唯一标准是“时间”。","action":"","quotes":[{"date":"2025-02-20","text":"最好的检验一件事情是不是有价值、是不是true need的工具，就是时间。比如我最早喜欢用Safari的Summary功能，但过了新鲜劲就完全没兴趣了；而闪念笔记、用ChatGPT总结文章到清单，这就是true pain，因为过了好几个月，我还是每天都会做这件事。"},{"date":"2025-07-30","text":"直接全文丢到Gemini flash的GEM——效果很一般，逻辑不清楚，甚至有错误……先用Gemini Pro的bullet point格式总结一遍，再丢到Gemini Pro的GEM——效果好很多，语言简洁，逻辑清晰……对于很复杂的任务，要适当拆解任务，多次使用AI工具完成每个小任务，最终效果会更好。"}],"cases":[{"date":"2025-03-02","text":"时间检验真需求：Safari Summary功能因新鲜感过后被弃用，而“闪念笔记”和“ChatGPT辅助总结”在数月后依然高频使用，证明了它们解决了True Pain。","era":"recent"},{"date":"2025-07-30","text":"复杂任务的链式拆解：写小红书文案这种复杂任务，直接丢给AI效果很差，必须拆解：1. 先用Gemini Pro总结逻辑（Bullet point）；2. 再用Gemini Flash/Pro根据逻辑扩写文案。“分步喂养”是AI产出高质量内容的关键。","era":"recent"},{"date":"2026-01-20","text":"提问的质量决定产出的质量：Micron周期文章获得高关注，核心在于利用AI的过程中“问出了对的、大家都在乎的问题”。在AI时代，最重要的是“问对问题”的能力，这决定了内容的差异化与价值。","era":"recent"},{"date":"2026-01-04","text":"AI Agent与工作流的隐喻：Opal复杂工作流像多个不同部门Engineer的协作，而单个Agent就像一个专精的Engineer。单一任务Gemini就够了，而随着基础模型能力增强，单Agent也能自然处理近乎工作流的复杂任务。","era":"recent"},{"date":"2024-12-22","text":"构想用AI结合历史知识库（如YE slides、cell library）自动判定'某个conversion toggled issue是否为已知模式（known BKM）'，能大大节约做report所需的时间——是后续'AI分步喂养'系列方法论的早期雏形。","era":"recent"}],"recency":"recent","cluster":"c4"},{"id":"MAS-A-150","quadrant":"MAS","subcat":"A","keyword":"AI是加速器","title":"AI替代不了判断力，它只是老师和加速器","core":"AI是极佳的学习助手，用它来解释复杂概念、润色文章、生成代码，但核心的 Domain Knowledge and judgement 必须在你脑子里，AI不能替代你判断。AI即老师：使用AI本质上和老师教学生一样，都是帮我们将晦涩的“天书”拆解、梳理、内化，只要知识最终变成了你的，老师是人还是AI并不重要。","action":"","quotes":[{"date":"2024-09-24","text":"AI应该会有三大应用场景：a. 自动化很多的重复性工作；b. 作为高效的知识检索工具（个人agent）；c. 作为高效的新知识的学习工具……我们都知道'三分钟读完红楼梦'是毫无意义的，那么'100字看完文章'，是不是也会有类似陷阱？"},{"date":"2024-11-25","text":"发现ChatGPT这种比较适合去总结观点不容易千人千面的文章，比如一些新闻、一些YouTube博主的视频，因为他们的观点都是非常单一的。而我自己的日记，或者是复杂的书籍，就不适合让ChatGPT总结，因为我在想的、有思考和感悟的，不一定是作者的本意，也不一定是ChatGPT可以抓住的。"},{"date":"2024-12-31","text":"NotebookLM类AI工具，和传统的老师教学生，本质是一样的；如《经济学原理》这本书，我自己很难看懂，但是有个老师帮我梳理结构、解释概念、浓缩精华，我终于懂了……只看结果的话，和老师学懂，与你和NotebookLM学懂，并没有区别，因为两者的知识都转化为你的了。"}],"cases":[{"date":"2024-09-24","text":"AI是加速器而非替代品：总结出AI的三大正确用法：1. 自动化重复工作（Coding）；2. 高效知识检索；3. 学习新知的杠杆。切记：AI生成的Bullet Point是人类知识的压缩，适合回顾，但初次学习仍需结合原文以避免肤浅。","era":"recent"},{"date":"2024-11-25","text":"AI的局限性：发现AI非常适合总结观点单一的新闻或YouTube视频，但极不适合总结个人日记或思想复杂的书籍，因为它无法捕捉到“我个人的独特感悟”和“千人千面”的细腻情感。","era":"recent"},{"date":"2024-12-31","text":"AI即老师：使用NotebookLM整理《经济学原理》笔记的体验，本质上和老师教学生一样，都是帮我们将晦涩的“天书”拆解、梳理、内化。","era":"recent"}],"recency":"recent","cluster":"c4"},{"id":"MAS-A-160","quadrant":"MAS","subcat":"A","keyword":"带着目标阅读","title":"读完没带来认知或行为的改变，就只是娱乐","core":"读书如果不带来认知或行为的改变，就是一种娱乐。读完一本书，问自己：我哪里的想法变了？我准备怎么做？","action":"","quotes":[],"cases":[{"date":"2016-05-11","text":"读了些深奥的科普书、娱乐性质的小说、名人杂记，可是读完的感悟很有限，有时是“为了读完而读”。于是明白：我读书，必定是带着一个问题或目标（即便《瓦尔登湖》，也是为了更好地了解山野生活的具体感受）。","era":"root"},{"date":"2022-11-01","text":"感觉时间管理/自控/习惯养成类的'概念教学'书已经到了饱和点，道理都已经懂了，要想突破只能靠长期实践，不行动就只能'懂了道理却依然过不好这一生'。自我诊断出'深思强于笃行'的失衡，意识到概念类书籍读多了会陷入懂道理却不行动的陷阱。","era":"recent"}],"recency":"mixed","cluster":"c3"},{"id":"MAS-A-170","quadrant":"MAS","subcat":"A","keyword":"模仿是创新开始","title":"不知道怎么做的时候，先照着标杆模仿","core":"不知道怎么做的时候，先找一个标杆去模仿。在模仿中寻找感觉，再慢慢形成风格。","action":"","quotes":[],"cases":[{"date":"2019","text":"学习好员工的标准，先照着做，内化为自己的习惯。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"MAS-A-180","quadrant":"MAS","subcat":"A","keyword":"谈吐即思想","title":"没被赋予意义的信息，记住了也很快会漏掉","core":"谈吐不俗的前提是思想有层次。死记硬背的数据如果不赋予意义（Pattern Matching），很快就会遗忘。","action":"在记忆信息时，强制进行意义联结。问自己：“这个数据意味着什么？它和整体趋势有什么关系？”","quotes":[],"cases":[{"date":"2020-10-16","text":"Yuekang的指导：脑容量扩容需要依靠“赋予意义”而非死记硬背。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"MAS-B-10","quadrant":"MAS","subcat":"B","keyword":"高敏感特质","title":"自己的情绪很容易被身边人的负面情绪带着走","core":"我是一个高敏感、高共情的人（INFJ倾向）。既能敏锐感知他人的需求，也极易受他人情绪影响，易追求和谐，对冲突会本能不适甚至逃避。","action":"必须开启“上帝视角”，将“感受”与“事实”剥离。告诉自己：“我现在的情绪波动是因为我的特质在共振，不要因为冲突而逃避，而是去就事论事地解决实际的问题”。","quotes":[{"date":"2024-12-23","text":"今天的观察是我的情绪是很容易被身边的人的情绪影响的，尤其是负面的情绪。比如说，如果柔柔晚上睡觉前哭闹得很厉害，我就会变得很烦躁，甚至于迁怒到妈妈身上，觉得她哄得不够好之类的。","context":"今天的观察是我的情绪是很容易被身边的人的情绪影响的,尤其是负面的情绪。比如说,如果柔柔晚上睡觉前哭闹得很厉害,我就会变得很烦躁,甚至于迁怒到妈妈身上,觉得她哄得不够好之类的。同样的,如果妈妈给了我一个脸色,比如说今天早上柔柔要看手机,我去了房间,妈妈不太耐烦,觉得我让柔柔更急躁了,我也就会马上有负面情绪出现。这让我思考,是不是也是INFJ的一部分,就是对于他人情绪的feeling的部分,我会特别的敏感。但这也警醒了我，要开始慢慢克服这个本能,学会在别人情绪化后依然让自己保持理智，保持内心的平和；而且这种状态也更容易做出最好的行为与反应，避免情绪化下让事态更严重。"},{"date":"2024-12-04","text":"有时候即便只是对一些人或事有了更清晰的理解，都可以对你的思维带来改变，即便没有具体的行为指南，也就是所谓的知道what and why，即便不知道how。比如说我懂了MBTI以及知道了自己的性格是INFJ以后，我就知道了自己是那种更希望让身边所有人都满意。","context":"有时候即便只是对一些人或事有了更清晰的理解,都可以对你的思维带来改变,即便没有具体的行为指南，也就是所谓的知道what and why,即便不知道how. 比如说我懂了MBTI以及知道了自己的性格是INFJ以后,我就知道了自己是那种更希望让身边所有人都满意,同时希望维护大家的和和气气。那我再看很多自己的行为就有了一个上帝视角,比如说我看到有时候小美批评了一下姐姐,我就会想着去说两句中间的好话。再比如说有时候会在同事那边维护大家的和气,懂了自己的性格，这也就让我走出舒适区,甚至于让我更有勇气去做一个以前自己讨厌的人,就是那种更能够接受冲突,甚至于为了自己的信念主动去制造冲突,去有棱角的人。"}],"cases":[{"date":"2024-12-23","text":"情绪传染的觉察：深刻意识到自己的情绪极易被身边人的负面情绪（尤其是家人的）感染。柔柔晚上哭闹或小美早上不耐烦时，会瞬间变得烦躁。专注于解决问题而非卷入情绪漩涡。","era":"recent"},{"date":"2024-12-04","text":"认知驱动行为：理解MBTI不仅是贴标签，更是行动指南。因为知道自己是INFJ（追求和谐），能以“上帝视角”审视自己“喜欢做和事佬”的行为。这种认知给了我反向操作的底气——为了信念，必须主动走出舒适区，去接受甚至制造必要的冲突，做一个有棱角的人。","era":"recent"}],"recency":"recent","cluster":"c1","bookRefs":["UT-MAS-C-20"]},{"id":"MAS-B-20","quadrant":"MAS","subcat":"B","keyword":"认可欲求陷阱","title":"不必人人都喜欢我，赢得尊重就够了","core":"极度渴望外部认可曾让我成为情绪的奴隶，很多行为的本能反应都是去想“做完别人会怎么看”。被讨厌的勇气：你不是人民币，不可能让所有人都喜欢；被讨厌往往是因为你坚持了原则，这是做自己的代价，也是勇气的勋章。","action":"放弃“让所有人满意”的幼稚幻想。做决定时问自己：“我觉得怎样做是我觉得正确的（而不是别人会怎样想）？”追求共同体感觉，谁也不是世界中心，既不过度看重别人的看法，也不以自我为中心。在职场中，不强求被“喜欢”（Like），但必须赢得“尊重”（Respect）。","quotes":[{"date":"2022-03-18","text":"我因为多年的认可欲求，习惯性还是想更多的'like me'；可是何必强求呢？'做到那些TM真正需要的，不就是respect me'，不就已经是上层境界了吗？"},{"date":"2016-04-06","text":"极度没有存在感。同事不约一起吃饭，似乎我就不存在……这种归属感的缺失，每天都在折磨着我。"},{"date":"2025-03-16","text":"我本来的价值观里有一个叫'胸怀格局传承'，这个胸怀的部分，我最近观察自己的行为，发现其实恰恰自己不能说小心眼，但很容易把很多小小的事情或者别人说的几句话放在心里，然后就会念念不忘。","context":"我本来的价值观里有一个叫胸怀格局传承,这个胸怀的部分,我最近观察自己的行为,发现其实恰恰自己是一个非常不能说小心眼,但是就很容易把很多小小的事情或者别人说的几句话放在心里,然后就会念念不忘，把什么小事都看得很重,这恰恰其实就是胸怀还不够大不够潇洒的一个表现，甚至这可能为什么咱妈觉得我啰嗦，因为她有时候说的话很伤人，我于是就总想去解释甚至纠正；再比如说小美说觉得我做爸爸算好爸爸，把妈妈放在一起比我就还算不上够好，于是我就会一直念念不忘，觉得自己的effort没有被足够认可。换个角度想，有时候也有可能因为我太过于在乎别人的看法，不够自信的同时又有高认可欲求，于是别人给的这几句无心的评价把它作为了对自己表现的核心评判标准。再换句话，我可能就是敏感型人格，无心的话也特别在乎吧，也可能是我的INFJ使然。再换句话，可能我就是被动性人格骨子里面，总是那种有自己的想法，又会被动的满足别人，又渴望别人意识到甚至会照顾到自己的感受。正确说法当然就是'放弃认可欲求，转而you control your life and responsible on the choice'"},{"date":"2025-12-30","text":"看到的几句很真实的谚语：不遭人忌是庸才，莫经他人苦，莫劝他人善。"},{"date":"2022-01-15","text":"我在焦虑的，是因为怕被别人说闲话或排挤，还是觉得错过了一个找到talent的好机会呢？恐怕是前者吧，那岂不是在认可需求了，而不是课题分离了。","context":"周六突然接到tianke电话说可能缺人，可是没去interview有丝丝焦虑，想起被讨厌的勇气，我在焦虑的，是因为怕被别人说闲话或排挤，还是觉得错过了一个找到talent的好机会呢？恐怕是前者吧，那岂不是在认可需求了，而不是课题分离了；想通这一层，再想清楚'talent的求贤若渴并不构成我的核心concern'，于是就知道无需陷入这种无必要的焦虑了。"}],"cases":[{"date":"2017","text":"早期因同事聚餐未叫自己，瞬间感到被抛弃。","era":"root"},{"date":"2022-03-18","text":"Respect vs Like：在给下属做辅导时，意识到自己习惯性地想让对方“喜欢我”，这是一种低级的认可欲求。真正的管理者不应强求被喜欢，而应通过解决对方的实际痛点来赢得“尊重”。","era":"recent"},{"date":"2025-03-16","text":"面对父母对育儿方式的情绪化评判，早年很容易被影响。后来学会对自己说：“那是他们的局限，不是我的失败。”","era":"recent"},{"date":"2025-12-18","text":"Respect vs Like：在和HBM下属相处的过程中，发现自己再次陷入了认可欲求陷阱。解决方法一样，应专注做好自己该做的与擅长做的，剩下的交给时间评判。","era":"recent"},{"date":"2025 (Merged)","text":"反思自己太在意小美对“好爸爸”的评价。当被评价为“还不够好”时，内心的委屈源于“努力未被承认”。真正的成熟是：我知道我爱孩子并付出了，不需要别人颁发奖状。","era":"recent"},{"date":"2025-12-30","text":"反思自己在HBM处事不自信时，很看重leader或counterpart怎样看待自己，甚至因为Yong Kiat的敌意自我怀疑。后来领悟：庸才定律——不遭人忌是庸才，如果职场中没人对你有意见，说明你从未触及核心利益或坚持过原则。","era":"recent"},{"date":"2026-01-10","text":"有效认可vs虚荣认可：面对“大老板不认识你等于白做”的焦虑，重新定义了Visibility——不需要全公司都认识我（Vanity），只需要核心Stakeholder深度认可我的价值即可。创造Visibility应是锦上添花，而非本末倒置。底线依然是把Program做成功。","era":"recent"},{"date":"2022-01-15","text":"接到猎头电话说可能有岗位缺人，因没去面试而隐隐焦虑；反思后发现焦虑的根源是怕被人说闲话/排挤（认可需求），而不是真的错过了发现人才的机会（课题分离），想通后焦虑随即消散。","era":"recent","context":"周六突然接到tianke电话说可能缺人，可是没去interview有丝丝焦虑，想起被讨厌的勇气，我在焦虑的，是因为怕被别人说闲话或排挤，还是觉得错过了一个找到talent的好机会呢？恐怕是前者吧，那岂不是在认可需求了，而不是课题分离了；想通这一层，再想清楚'talent的求贤若渴并不构成我的核心concern'，于是就知道无需陷入这种无必要的焦虑了。"}],"recency":"mixed","cluster":"c2"},{"id":"MAS-B-30","quadrant":"MAS","subcat":"B","keyword":"拒绝受害者心态","title":"从被动等待转向主动行动，伤害力就会减弱","core":"不要总觉得全世界都对不起自己，或者老板故意针对自己。这种心态会让人放弃主观能动性，变成一个只会抱怨的废人。一旦从“被动等待者”转为“主动行动者”，世界对你的伤害力就减弱了。","action":"遇到不公时，先问自己：“我能做什么来改变现状？”而不是“为什么倒霉的总是我？”——“谁痛苦，谁改变”。","quotes":[{"date":"2022-11-12","text":"也许，有些缺点不可怕，在不断的否定中开始怀疑自己，丧失了斗志，丧失了对自己的认知，才可怕……我生活的意义不是要让你看得起我。","context":"yuekang说的就一定对，我就一定要为之茶饭不思，否定自己吗？也许，有些缺点不可怕，在不断的否定中开始怀疑自己，丧失了斗志，丧失了对自己的认知，才可怕。我就明显感觉得到昨天被否定后，进入了以前的自我怀疑的感觉，甚至于这一年建立起来的的雄心壮志又一次被打压了；那如若这般，我还何苦庸人自扰呢？陷入了这个PUA的陷阱。再换个角度，如果我一下夸下海口，你是不是又可以judge说浮躁，不切实际，做人高调呢？怎么讲他都有理。不如放弃执着，继续做自己信的事情，继续做已经被证明对的，有效的事情就好了。他觉得我和David是倒数第一第二under load 的人，他固然可以以一种'我看的起你才这么批评贬低你'，但是我是有自己的价值观和信念的，若是合理，我必然会反思，但若是不合理，我不愿意苟同，你也不要想着非得让我顺从。我也是有自我保护机制的，且我生活的意义不是要让你看的起我，你若是真的关心我那也不想以'击溃我的自信'为目的；所以如果这个点不能convince我，然后让我陷入自我怀疑，那我不得不继续坚持自己，而不是轻易改变了。"},{"date":"2022-11-13","text":"你说的都对，那你说是为什么呢？你说的都对，你说我该怎么做呢？你是不满意，为什么要让你满意呢？"},{"date":"2025-03-23","text":"我之前性格里有一个被动的部分，就是牺牲完以后希望别人能够理解我，甚至可怜我……我看她没买葡萄，那我要是想吃葡萄但她没买，那我就不应该以受害者心态去想为什么她不给我买，而是主动地去买我想买的东西就够了。","context":"我之前性格里有一个被动的部分,就是牺牲完以后希望别人能够理解我,甚至于可怜我。比如说我故意不打球在家陪雁雁,再比如说在球场上别人把球场占了,然后我打不了,我就希望别人感到愧疚。但其实这都是被动的受害者心理表现,而主动的表现就是我自己决定,比如我如果一定还想在那里打球,我就主动上去说我要和你们一起打，或者如果我觉得这球场等不到空缺的,那我直接就换一个球场。我觉得这才是一个主动者的心态,而不是一个被动的受害者心态。比如今天和咱妈买水果也是一样，我看她没买葡萄，那我要是想吃葡萄但是她没买,那我就不应该以受害者心态去想为什么她不给我买,而是主动的去买我想买的东西就够了。"}],"cases":[{"date":"2022-11-12","text":"拒绝职场PUA：面对Yuekang对工作表现（Loop impact）的否定，没有像以前那样陷入自我怀疑。通过复盘，确认自己团队bonding很好，其他manager评价也很高，清晰地认识到：他的否定是他的管理手段（PUA），不是事实。坚守自己的价值锚点，不被他人的评判击垮。","era":"recent"},{"date":"2025-03-23","text":"“主动者”心态：不要等小美妈妈买葡萄，我想吃就自己去买。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"MAS-B-40","quadrant":"MAS","subcat":"B","keyword":"真正的勇敢","title":"不是不害怕，是怕也依然往前走","core":"勇敢不是不害怕，而是虽然害怕，但依然前行。","action":"","quotes":[],"cases":[{"date":"2020","text":"面对健康未知的恐惧，依然坚持去医院检查、调整生活。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"MAS-B-50","quadrant":"MAS","subcat":"B","keyword":"精神内耗","title":"内耗是想得太多做得太少，行动是唯一的解药","core":"内耗往往是因为想得太多，做得太少。躺在床上焦虑时间流逝，却不肯起来看一页书。行动是治愈恐惧和焦虑的唯一良药，一旦去学一会、去写一会日记、去做一点欠了很久的工作，那种焦虑感就会大幅缓解。","action":"","quotes":[{"date":"2022-01-16","text":"我在希望用打农药逃避没有读书没有进步的焦虑，可是此刻连这层的瞬时满足都没有做到，于是双份的沮丧感（没有进步+游戏输）。","context":"我在希望用打农药逃避没有读书没有进步的焦虑，可是此刻连这层的瞬时满足都没有做到，于是双份的沮丧感（没有进步+游戏输）；所以想通这一层，我无须纠结在到底这局游戏如何如何或是小美对或错，root cause fix，应该是马上去书房，做一些有意义的事情，比如clear掉一些AI，或者做些学习相关的事情，这样才是源头解决问题。而事实上，我刚的确是这么做的，做了会公司的事情，而做到后，心态的确就平和了很多。再想到为什么'保持进步状态'对我如此重要，简单原因，就用李杨第一定律来解答吧。"}],"cases":[{"date":"2016-05-14","text":"记录自己周末躺在床上焦虑的心理活动。","era":"root"},{"date":"2021-09-19","text":"“动机转移”法则：将不得不做的繁重任务（如加班Pull Data），定义为“为了换取我今后三天的内心平静”。这种从被动转向主动的心态转换能瞬间消除焦虑感。","era":"root","context":"感悟：可以在生活中使用'动机转移'理论。比如'我不是在加班完成公司的任务，而是在满足李杨第二定律，完成未完成的任务并获得内心的平和'；把这作为目标，就会多一层动力来追求'更积极，更自制的生活'。"},{"date":"2022-01-16","text":"焦虑源于回避：晚上打游戏输了后的沮丧，本质也是因为“想用游戏逃避没读书没进步的焦虑”。解药只有一个：立刻去做有意义的事（如去书房学习）。","era":"recent"},{"date":"2022-08-17","text":"发现自己时不时会突然焦虑，尤其是身体有不适感的时候；但如果做了运动或其他开心的事情，又会觉得'这都不算事'。让自己保持在喜悦平和的状态，通过愉悦感分散对不适的注意力，能降低自己的'精神熵'。","era":"recent"},{"date":"2025-02-13","text":"应对莫名情绪低落的具体方法：强制拆解焦虑源头为几个具体项目，逐一核对是否真的不可克服——比如剖析后发现是'柔柔被highlight到学校太晚'和'工作任务压力'两件事，拆解完就发现都不是什么大不了的问题，那些更重要的事情都还在，想通之后情绪自然就好了。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"MAS-B-60","quadrant":"MAS","subcat":"B","keyword":"适可而止","title":"靠适可而止拿回掌控感，而不是靠硬扛","core":"通过“适可而止”来获得心理上的掌控感，或“彻底戒断”后时间变多的reward成就感，建立良性循环。当自控力不足时，引入外部的“紧迫需求”来对抗本能的欲望。","action":"","quotes":[{"date":"2022-03-13","text":"不打游戏的时候，明显感到一天的时间变长了。往往都是快12点，然后还在打游戏，可是今天已经玩了很久小红书了，还是有时间看书，写笔记。","context":"此刻晚上回头看，不打游戏的时候，明显感到一天的时间变长了。往往都是快12点，然后还在打游戏，可是今天已经玩了很久小红书了，还是有时间看书，写笔记。是一个很好的兆头，决定来观察一波，看到底可以几天不打王者荣耀。第一天 XYG的比赛，还是一如既往的血压高。但是着实精彩。更重要的，是看到了迎难而上，高压之下依然勇于尝试新阵容的勇气，还有无论多么逆风决不放弃的品质。"},{"date":"2024-11-21","text":"当我们说用当下分子来控制过多的欲望多巴胺的时候，比如说节制或者是不纵欲，当下分子就可以是比如今晚有的一些社交需求，或者是今晚家里有需要照顾宝宝，在这些情况下就自然的会放弃，因为当下分子占了主导。"},{"date":"2022-03-19","text":"果然一天可用时间变多了，而且不打的时候，不会很想打。","context":"过去七天，一共用小美手机打了五局云樱，自己手机依然没装回来王者荣耀。果然一天可用时间变多了，而且不打的时候，不会很想打，因为'很努力打却总是输输赢赢，一会打得好一会第五名，赢和输的不确定性都在队友'，这些不好的体验都可以有效抑制想打游戏的冲动。"},{"date":"2022-09-10","text":"相较于打了游戏后的虚无甚至烦躁，这种可以感受时间流逝的感觉，至少说明时间在自己的感知与控制之下了。","context":"最近不用打游戏，大多数时候不用刷剧，同时也没有KPL比赛，整体闲暇的确多了很多，甚至有些时候有些无所事事了……但是，即便如此，依然觉得这是好的状态，相较于打了游戏后的虚无甚至烦躁，这种可以感受时间流逝的感觉，至少说明时间在自己的感知与控制之下了。"}],"cases":[{"date":"2021-11-23","text":"Quota机制的胜利：成功在打完两局王者荣耀（Quota）后停了下来，去做别的事。这种“适可而止”的控制感带来了巨大的心理正反馈，打破了以往“越输越打、越打越输”的恶性循环。良性循环的建立，往往始于一次微小的“自我刹车”。","era":"root","context":"成功的在用完两个王者荣耀quota后，停了下来，做别的事情；是一个良性循环的过程。弹了一小时吉他，练习卡农。一个感悟：当我发现自己很有动力练习卡农，或是加州旅馆时，不就是因为把自己放在了拉伸区——肯定是还弹的不够好的，可是同时又已经上手，只是一些和弦的衔接要练习；于是刚刚好就是那个能学到东西，不再会的东西上反复弹，同时又不是太难的区域"},{"date":"2022-03-13","text":"戒断手游体验：卸载王者荣耀后，发现一天的时间变长了。没有了“努力打却输了”的挫败感，情绪也更平稳。这种“时间变多”的正向反馈，成为了坚持戒断的新动力。","era":"recent"},{"date":"2024-11-21","text":"用“当下需求”控制多巴胺：发现控制欲望（如玩游戏、刷手机）的一个有效方法是“强化当下的紧迫需求”。例如，当晚上有明确的社交计划或照顾宝宝的责任时，多巴胺的诱惑自然被压制。用“责任分子”对抗“多巴胺分子”。","era":"recent"},{"date":"2022-03-19","text":"卸载王者荣耀满七天，七天只借老婆手机打了五局，自己手机始终没装回来，可用时间明显变多，且不打时也不太想打，因为'赢输都由队友决定'的体验本身就抑制了想玩的冲动。","era":"recent","context":"过去七天，一共用小美手机打了五局云樱，自己手机依然没装回来王者荣耀。果然一天可用时间变多了，而且不打的时候，不会很想打，因为'很努力打却总是输输赢赢，一会打得好一会第五名，赢和输的不确定性都在队友'，这些不好的体验都可以有效抑制想打游戏的冲动。"},{"date":"2022-09-10","text":"不打游戏、不追剧的日子里即便有些无所事事，甚至只是刷手机，也依然比打完游戏后的空虚烦躁感觉更好，因为至少时间的流逝还在自己的感知与控制之下。","era":"recent","context":"最近不用打游戏，大多数时候不用刷剧，同时也没有KPL比赛，整体闲暇的确多了很多，甚至有些时候有些无所事事了……但是，即便如此，依然觉得这是好的状态，相较于打了游戏后的虚无甚至烦躁，这种可以感受时间流逝的感觉，至少说明时间在自己的感知与控制之下了。"}],"recency":"mixed","cluster":"c3"},{"id":"MAS-B-70","quadrant":"MAS","subcat":"B","keyword":"内啡肽快乐","title":"多巴胺越刷越空虚，内啡肽才耐久","core":"多巴胺来自对奖赏的渴望（刷视频、打游戏），短暂、成瘾，耐受性不断提高，是“垃圾快乐”。内啡肽来自付出努力后的补偿（长跑、完成困难任务），宁静、持久，能对抗痛苦并带来成就感，是“高级快乐”。","action":"警惕廉价的多巴胺，主动追求需要付出汗水才能获得的内啡肽。当感到空虚时，去运动或深度学习，而不是刷手机。用“责任分子”（如照顾宝宝、明确的社交计划）对抗“多巴胺分子”。","quotes":[{"date":"2016-07-05","text":"推迟满足感，是一个成熟人士必备的能力……高强度工作后再玩一个小时，和一天玩了十二个小时中的一个小时，给人带来的满足感相差甚远，前者带来的快乐多得多。"},{"date":"2024-11-21","text":"当我们说用当下分子来控制过多的欲望多巴胺的时候……在这些情况下就自然的会放弃，因为当下分子占了主导。"}],"cases":[{"date":"2022-06-28","text":"深刻反思：多巴胺带来的快感极其容易适应（Hedonic Adaptation），想要长久的愉悦，需要的不是一次性的巨大成功，而是持续的“微进步”和内啡肽的滋养。","era":"recent"},{"date":"2023-04-02","text":"快乐阈值的边际递减：物质享乐（如打游戏）存在明显的“阈值效应”。起初每天打两局无比快乐，时间充裕后同样的刺激带来的快乐迅速衰减，甚至变得无趣。这解释了为什么“即时满足”不可持续：它需要不断提高的刺激才能维持同样的快感，最终导致崩溃。相比之下，延迟满足（健康、学习）带来的“内啡肽”虽然缓慢，但更持久且无副作用。","era":"recent"},{"date":"2023-12-08","text":"为什么人的成长一定要伴随'延迟满足感'，与本能的'即时满足'做斗争？想到一个例子：毒品就是即时满足获得快感的最典型例子，而它明显是short term gain long term lose的事情。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"MAS-B-80","quadrant":"MAS","subcat":"B","keyword":"ABC情绪理论","title":"让你痛苦的不是事件本身，是你对它的解读","core":"情绪不是由事件(A)直接引起的，而是由你对事件的belief(B)引起的。当你感到痛苦时，一定是B出了问题。","action":"","quotes":[],"cases":[{"date":"2017-04~08","text":"系统学习ABC理论，并用它治愈了自己在人际交往中患得患失的毛病。同事Mary发来一条简短的消息(A)，我感到极度失落(C)。为什么？因为我有一个非理性信念(B)：“她回复这么短是因为嫌弃我”。如果换个信念：“她可能正在忙”，失落感瞬间消失。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"MAS-C-10","quadrant":"MAS","subcat":"C","keyword":"仪式感","title":"仪式是给平凡生活打的锚点，不是演给别人看的","core":"婚礼、节日不是为了做给别人看，而是为了给平凡生活打上锚点。婚礼完成了自己的成人礼，也替父母松了口气。","action":"","quotes":[{"date":"2023-10-03","text":"这一次的婚礼个人非常满意……昨晚和小美的彻夜长谈也很棒。关键词就是'以小家为中心，有商有量'。"}],"cases":[{"date":"2023","text":"婚礼带来的满足感。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"MAS-C-20","quadrant":"MAS","subcat":"C","keyword":"身体维护协议","title":"身体的小警报是福气，早睡能治一半的情绪问题","core":"身体的早期预警（如吞咽困难、牙痛）其实是福气，它用不致命但警醒的方式强制你转向健康。早睡是万能药，很多情绪和身体问题睡一觉就好了一半，熬夜是对明天的透支。运动不仅是为了身材，更是为了内啡肽，为了让大脑更清晰。独处不等于孤独，高质量的独处是自我疗愈和精神滋养。","action":"感谢身体的小病痛。早睡、少油少辣、多运动，这不是任务，是身体给你的第二次机会。","quotes":[{"date":"2016-09-30","text":"身体还是革命的本钱，终究早睡早起才是王道。工作可以表现好点差点，甚至换工作，调整人生轨迹，但是，身体垮了，什么都没有了。"},{"date":"2024-07-06","text":"记录今年第二次腰椎痛。六月头就开始不舒服，去拔了罐，去针灸……主要就是弯腰难受，于是很难发力。中间强撑着打了球，以当下所见，是恶化了病症的。"},{"date":"2025-02-24","text":"发现自己似乎Stress tolerance变弱了。上周接到了要做drama video lead的role，而后基本都是全身心投入、事无巨细地操心……也许是一直在这种'紧绷状态'，周末就开始喉咙痛、鼻子堵，周天晚上身上发冷，今天似乎是感冒与低烧了。"},{"date":"2025-07-21","text":"记录一个今天中午的身体感受，感觉通过最近连续三天非常早睡的习惯，好的睡眠质量的确给自己带来了非常好的身体体验。中午少有的不会想马上倒下就睡，而是感觉头脑很清醒，身体很轻松。"}],"cases":[{"date":"2021-12","text":"Christmas期间独自发烧隔离，虽然身体痛苦，但利用那段时间深度复盘了全年，那种无人打扰的静谧反而成了一种精神滋养。","era":"root"},{"date":"2024-07-06","text":"腰椎痛复发：六月初腰椎痛复发，反思病根在于长期侧卧看Kindle。身体的代偿是有限度的，错误的姿势必须彻底纠正。","era":"recent"},{"date":"2025-02-24","text":"压力耐受度预警：接手Drama Video Lead后全身心投入、事无巨细，这种持续的“紧绷状态”直接导致了周末的喉咙痛和低烧。工作中的“松弛感”不仅是心态问题，更是生理健康的防线。","era":"recent"},{"date":"2025-07-21","text":"睡眠稳态与奖励系统：晚睡是因为大脑偏爱“熬夜看视频”的即时奖励。必须建立新的奖励机制（如早睡带来的第二天神清气爽），并利用“自我效能感”（循序渐进，每天早睡15分钟）来重塑习惯。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"MAS-C-30","quadrant":"MAS","subcat":"C","keyword":"饮食节制","title":"人如其食，节制比放纵更配得上年纪","core":"少油少辣。人如其食（You are what you eat）。","action":"","quotes":[{"date":"2024-08-05","text":"结果中午头铁，还去买了麦当劳，点了油炸大土豆加油炸菠萝鸡柠檬茶……而后便一发不可收拾。Lesson learn：再也不要肠胃不适的时候头铁地吃麦当劳了，于情于理油炸食品只会恶化这种肠炎。"}],"cases":[{"date":"2020","text":"身体出状况后的饮食反思。","era":"root"},{"date":"2024","text":"8月贪吃油炸食品诱发了长达一周的严重腹泻。身体不再支持年轻时的“胡吃海喝”，节制即长寿。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"MAS-C-40","quadrant":"MAS","subcat":"C","keyword":"全人模型","title":"身体思维情绪意义要协同升级，不能只顾一头","core":"人的完整状态由四大要素构成：Body（身体/生存）、Mind（思维/专注）、Heart（情绪/连接）、Spirit（精神/意义）。自我成长不仅仅是思维的进化，更是这四者的协同。","action":"Body：睡眠与运动（如八段锦、篮球）。Mind：通过读书和写作建立意识的秩序（心流）。Heart：通过冥想和“课题分离”管理情绪带宽。Spirit：寻找让生活产生意义感的支点（如家人、利他）。","quotes":[{"date":"2022-07-18","text":"Whole person model：Body-Physical / Mind-mental-our focused energy / Heart Emotional-情绪管理 / spirit Spiritual-meaning of life……两者就构成了自我的成长。","context":"Whole person model：What's the meaning? How to develop: Body - Physical（sight, sound, smell, touch, and taste）。《心流》一书里只说当人不断进入心流，意识越来越有序，自我就会获得成长，越来越复杂。其实同时'心智成长'是另一个让自我更完善的维度，那些《认知觉醒》，《财富自由之路》里面教的，多数就和心智成长有关。做运动类而达到心流，如游泳打篮球，那body肯定是累了，可是意识（awareness）的秩序更有序了。Mind - mental - our focused energy(注意力）：Positive mental health allows us to cope with stress, think clearly。Heart Emotional - 情绪管理/心智带宽：Good emotional status will foster resilience to stress, provide us with self-awareness, even more energy, keep us balanced when manage daily work & big life events & pandemic。"}],"cases":[{"date":"2022-07-18","text":"建立了上述模型。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"MAS-C-50","quadrant":"MAS","subcat":"C","keyword":"人的操作系统","title":"像升级系统一样，反思修补自己的概念和方法论","core":"人应当像计算机一样去理解和升级自己的“操作系统”。三层构成：概念（Concepts，底层代码，如“元认知”“复利”“机会成本”）、价值观（Values，算法逻辑，如“注意力>时间>金钱”）、方法论（Methodology，输出程序）。硬件升级（鳄鱼脑→猴子脑→智慧脑）靠进化，软件升级（概念→价值观→方法论）靠反思与学习。通过“践行+改进”的闭环，不断修补Bug，完成OS的迭代。","action":"","quotes":[{"date":"2023-12-25","text":"人的软件操作系统构成……概念间的关联-->价值观……+方法论-->践行+改进……人的硬件构成：鳄鱼大脑-->猴子大脑-->人智慧大脑。"},{"date":"2022-03-01","text":"要时刻警示自己，多自省，避免陷入思维定势。","context":"要时刻警示自己，多自省，避免陷入思维定势。比如让TM去做一project，觉得对她好，可是闪念一想，就会意识到上次别人类似assignment并不成功。于是就可以及早跳出定式，以更大的格局解决问题。"}],"cases":[{"date":"2023-12-25","text":"系统性地梳理了个人成长的底层逻辑框架。","era":"recent"},{"date":"2022-03-01","text":"以给TM分配project为例，本觉得对她好，但闪念一想意识到上次类似安排别人并不成功，于是及早跳出思维定式，用更大格局重新解决问题。","era":"recent","context":"要时刻警示自己，多自省，避免陷入思维定势。比如让TM去做一project，觉得对她好，可是闪念一想，就会意识到上次别人类似assignment并不成功。于是就可以及早跳出定式，以更大的格局解决问题。"}],"recency":"recent","cluster":"c2","bookRefs":["UT-MAS-C-10","UT-MAS-C-20"]},{"id":"MAS-C-60","quadrant":"MAS","subcat":"C","keyword":"痛苦是催化剂","title":"舒适区里长不出新东西","core":"舒适区里没有成长。感到痛苦和吃力的时候，往往是正在走上坡路的时候。","action":"","quotes":[{"date":"2025-06-15","text":"我们常说做事要扬长避短，但我听着最近单依纯唱这几首歌，都是在自己最不擅长的地方尝试突破，让我想到扬长避短不就是在自己的舒适圈吗？而如果你想有大的成长，你就应该扬短避长——只有把自己摆到拉伸区，甚至痛苦区，你才能突破自己此刻最大的潜力。"}],"cases":[{"date":"2018","text":"研究生期间即使痛苦（编程不会、听不懂），坚持下来后能力大增。","era":"root"},{"date":"2021-07","text":"M2转型期面对项目Drift的焦虑，虽然痛苦，但如日记所写：“适应一定程度的不踏实，是成大事的必经之路。”","era":"root","context":"这时候有个办法，就是李笑来说的'放弃一部分自己的安全感'；我要让自己开始适应'一定程度的不踏实'，尤其是无关身体或生活或是做人，而只是关于工作的话；这也算是工作能力上的一种成长吧。成大事的必经之路。不管通过冥想来排解，还是一些有效的小方法比如记录并分析情绪（即便事情还是没有confirm fix），或是那些面对焦虑的小技巧，都是不错的。"},{"date":"2025-06-15","text":"2025认知升级：扬短避长。传统的“扬长避短”往往让人停留在舒适区。真正的突破性成长恰恰来自于“扬短避长”——主动把自己置于“拉伸区”甚至“痛苦区”去挑战弱点，这才是拓宽能力边界的唯一路径。","era":"recent"},{"date":"2022-06-25","text":"看KPL电竞比赛的感悟：电竞与职场并无本质区别，都会有低谷有高潮。可塑性（潜力）比一时的聪明更重要——有的选手很聪明但灵气一纵即逝，有的不算聪明但大心脏、够刻苦，最终厚积薄发。有底蕴的队伍必定都经历过辉煌也经历过迷失和低谷，'生于忧患死于安乐'——足够的危机意识+强大的抗压力，才能成就不凡。","era":"recent"}],"recency":"mixed","cluster":"c3"},{"id":"MAS-C-70","quadrant":"MAS","subcat":"C","keyword":"承认无知","title":"不知道不可耻，假装知道才可怕","core":"不知道并不可耻，假装知道才可怕。承认无知是开启新知的钥匙。","action":"","quotes":[{"date":"2016-08-29","text":"千万不可撒谎。不知道的data就说不知道。需要查的就说先去查。做错了就说是做错了。忘了就是忘了。"}],"cases":[{"date":"2021","text":"打破面子，不懂就问。","era":"root","context":"意识到自己一个思维的问题：很多当场听，觉得OK OK，习惯在当场不做反驳（甚至背后有习惯在人前留好人印象，以'愉快的结束谈话为目的，而不是追求真理为目的'；于是后来回头再细思，会想'哎呀，如果这样我应该跟上这样一个follow up question'呀；或者是，'不对呀，如果真是这样，那为什么不是这样这样呢？'说白了，就是一些'需要反驳'的问题，或者是'继续深入探讨'的问题，总是思维太慢+为了和谐不习惯'当场打破砂锅问到底'，要事后才能想到这些当场本应该就即时问出的问题，没有达到最理想的谈话效果。那解决办法呢？1.意识并刻意打破自己'碍于面子'的老毛病，把'和谐友好'放在'追求真理'的后面；在将要结束谈话前问自己，'我真的达到end goal了；所有的逻辑点都已经理顺了吗？2.强迫自己建立'当场思考'的毛病，别想着'行，我先接受了，回家再慢慢想'，而是'我一定要来当场internalize,复述出你的要点了再结束谈话'；这和上课道理是一样的，课后努力绝对没有当场领悟的学习效率高，同时必然是要花费更多的精力了。"}],"recency":"root","cluster":"c2"},{"id":"INW-A-10","quadrant":"INW","subcat":"A","keyword":"第一性原理","title":"类比别人怎么做容易陷入平庸，要回到最基本事实","core":"类比思维（别人怎么做我也怎么做）容易陷入平庸。第一性原理要求我们打破知识的硬壳，回溯到最基本的真理。","action":"当遇到复杂问题时，问自己：“这个问题的本质是什么？最基础的事实是什么？”不依赖既定经验或他人观点推导。","quotes":[],"cases":[{"date":"2024-03-19","text":"记录Claude 3关于第一性原理的定义，开始尝试将其应用到工作复盘中。比如考虑“为什么要送孩子去学习”时，回归本质——不是为了名次，而是为了心智的完善与立足社会的工具储备。","era":"recent"},{"date":"2026-02-21","text":"火箭发射成本案例：面对高昂的火箭发射成本，类比思维会试图优化现有供应链，而第一性原理直接拆解火箭的物理实体，计算得出基础原材料的绝对物理成本仅占传统火箭售价的约2%，证明了剩余98%的高价是流程冗余而非物理限制；据此跳过航天业传统外包经验，自建垂直制造产线，实现成本数量级降低。","era":"recent"},{"date":"2026-02-21","text":"芯片液冷案例：面对高算力芯片集群的严重发热，类比思维倾向于制造转速更高的风扇，而第一性原理回溯到热力学定律——散热的本质是介质的热能转移，基于水的导热率远高于空气这一物理数据，推导出空气冷却存在不可逾越的效率上限；据此打破“机柜必须吹冷风”的既定经验，全面转向直接芯片液冷。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"INW-A-20","quadrant":"INW","subcat":"A","keyword":"常见心智模型","title":"马太效应与二八定律：早期积累和关键投入决定结果","core":"掌握即用的思维工具箱，能快速看透事物本质。马太效应：强者愈强，弱者愈弱，优势是累加的，职场中早期的成功会带来更多资源和声望，“开局”和“早期积累”至关重要。二八定律：80%的结果来自20%的原因，找到并专注于那20%的关键投入（如High Light工作），而不是在80%的琐事中空耗。","action":"","quotes":[],"cases":[{"date":"2024-01-03","text":"记录马太效应与二八定律在职场中的应用。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"INW-A-30","quadrant":"INW","subcat":"A","keyword":"跨界思维","title":"一个领域的解法，常常藏在另一个领域里","core":"很多问题的解法在另一个领域。育儿的智慧完全可以迁移到组织管理中。","action":"","quotes":[],"cases":[{"date":"2023-12-27","text":"团队管理与育儿：发现带两个Team（Transform & Pillar）的微妙心理与“二胎家庭”惊人相似——既要通过竞争促进活力，又要确保两个“孩子”都觉得被公平对待、被偏爱。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"INW-A-40","quadrant":"INW","subcat":"A","keyword":"承诺与一致性","title":"一旦表过态，就会有压力让言行自圆其说","core":"人一旦做出了某种决定或选择了某种立场，就会产生一种强烈的心理压力，迫使自己的言行与该决定保持一致。这是一种自我说服的机制。","action":"","quotes":[],"cases":[{"date":"2024-03-19","text":"读《影响力》后的反思：自从决定在新加坡久居后，发现自己无论人前人后都在不自觉地赞美新加坡（法制、环境、教育）。这不完全是客观评价，很大程度上是因为潜意识里启动了“承诺与一致性”原则，自动过滤了负面信息，放大了优点。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"INW-A-50","quadrant":"INW","subcat":"A","keyword":"屁股决定脑袋","title":"站得高看不见细节，蹲得低只看见细节，不是能力差距","core":"不要过度神话Upper Leader的“战略思维”，也不要贬低Engineer的“细节思维”。这种差异往往不是能力的差距，而是职责（Role）的产物——Leader看不到细节只能关注High Level；Engineer每天处理细节自然关注细节。","action":"理解这一点，能祛除对领导的盲目崇拜，也能更客观地看待不同层级的沟通鸿沟。","quotes":[{"date":"2024-11-30","text":"会不会有时候我们觉得upper leader特别有什么strategic thinking之类的，这也只是各司其职呢？好比Liliang每天都在drill每个tool的每个细节，自然就更难跳出来，说这个tool要做那个先不做了。","context":"刚才对于upper leader有一个很快的想法,会不会有时候我们觉得upper leader特别有什么strategic thinking之类的,这也只是各司其职呢？因为比较lower side engineer level,就是会每天专注于细节,所以他脑子里想的也就是把这些细节做好,而upper leader, 他们本来也不太懂这些细节,他们每天看到的就是那些更high level的,更directional的东西,所以自然也就会看起来更有strategic thinking,in other way就是他们anyway也看不到这些细节,所以也不会太执拗于这些细节。好比Liliang 每天都在drill每个tool的每个细节，自然就更难跳出来，说这个tool要做那个先不做了"}],"cases":[{"date":"2024-11-30","text":"Liliang每天钻研Tool的细节，自然难跳出来；而作为Leader每天看Direction，自然显得更有Strategic Thinking。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"INW-A-60","quadrant":"INW","subcat":"A","keyword":"熵减与心流","title":"维持秩序要持续做功，随波逐流才是真正的失控","core":"物理层（熵增铁律）：宇宙的趋势是熵增，生命本质上是“负熵”的孤岛，维持任何形式的秩序都需要持续注入能量——坦然接受生活中的“麻烦”，解决麻烦的过程就是维持生命系统有序运作的必要做功。生物心理层：人类对环境的“掌控感”有基本需求，混乱无序的环境会持续引发焦虑；通过行动建立秩序是心理健康的核心基石，大脑会用多巴胺和血清素奖励“对抗熵增”的行为。社会精神层：随波逐流看似轻松，本质是放弃个人选择、被环境裹挟，终点往往是无路可走；主动建立的精神秩序（意义感）是抵御人生苦难的终极盾牌。","action":"拥抱“费力”：告诉自己“我现在付出的辛苦，是在为我的生命系统注入负熵”。制造秩序：当感到焦虑时，从小事做起建立秩序（如整理书桌、写日记），用“有序感”对抗内心的“精神熵”。","quotes":[{"date":"2023-12-22","text":"宇宙的熵增理论……做熵减的事情也可以带给人最大的幸福感……可是若是没有自控没有理智的介入，我一定会追求即时满足……这中间矛盾点怎么解释呢？"},{"date":"2020-02-07","text":"人生的每一刻并无意义，意义只有在终局时回头才能看到……当每天都有意义感，一生自然就有了意义。"},{"date":"2024-06-08","text":"今天在外面带娃时忽然想到，我在外面陪宝宝玩的时候，是不是也有可能进入这种'几个小时时间不知不觉就逝去了的'心流状态呢？目标——给宝宝带来最大的快乐；反馈——宝宝可以很开心地玩耍，不吵不闹；专注——不要想着抽空玩手机；掌控感——调整好自己的状态。"},{"date":"2025-12-20","text":"我觉得很多时候我们在做的事情都是给自己带来有序感，比如让生活井然有序，维持家庭和谐，或者是让思维有序，通过反思写日记或读书理清自己的思绪……人就是渴望有序；做到这种有序之后，人满足了，人的本能愉悦就会出现。"}],"cases":[{"date":"2023-12-23","text":"熵增与生命意义：结合视频与热力学定律，对人生意义有了物理学层面的理解——人类的高级生存需求已经演化为“尊重、社交与自我实现”。克服本能脑的懒惰，去追求有序（熵减），是产生最高级幸福感的源泉。","era":"recent"},{"date":"2024-06-08","text":"育儿的心流：发现带娃也可以进入“心流”状态。条件是：1. 设定目标（给宝宝快乐）；2. 调整难度（设计新游戏如穿越栏杆）；3. 专注当下（不看手机）。把带娃看作正向体验而非任务时，几个小时会不知不觉过去。","era":"recent"},{"date":"2025-12-20","text":"秩序的本能愉悦：意识到写日记、读书的本质是在“制造思维的有序”。这种有序感带来的满足，是人类作为负熵体的本能愉悦，优于低级的感官刺激。","era":"recent"},{"date":"2026-02-23","text":"掌控感的治愈力：当在项目中拥有了很强的掌控感（熟悉drive issue的流程并能自己做主），以前的空虚和不安全感就自然消失了，甚至连寻找情绪价值去聊天的需求都变小了。这是一种“任他清风拂山岗”的深层平静，证明了建立秩序（掌控感）能直接对抗精神熵。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"INW-B-10","quadrant":"INW","subcat":"B","keyword":"拥抱变化","title":"唯一不变的就是变化，别死守过去的确定性","core":"唯一不变的就是变化。不要试图抓住过去的确定性。","action":"","quotes":[],"cases":[{"date":"2022-09-28","text":"全家首次感染COVID-19，生活节奏被彻底打乱。但正是这次突变，让我们学会了如何在极限状态下互相扶持，也接受了“生活随时可能停摆”的无常。","era":"recent"},{"date":"2023-12-17","text":"芯片战争的启示：读《芯片战争》感悟——大公司往往因沉迷现有利润而错过风口，反而是危机逼出了重生。商业如此，个人亦然，危险往往包裹着机遇，不破不立是转型的唯一法则。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"INW-B-20","quadrant":"INW","subcat":"B","keyword":"直觉的重要性","title":"逻辑分析僵住时，直觉是潜意识算出来的结果","core":"在逻辑分析无法决断时，听从直觉。直觉不是玄学，而是潜意识大数据的快速计算结果。","action":"","quotes":[],"cases":[{"date":"2024","text":"在某些投资或决策上，开始信任第一感觉。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"INW-B-30","quadrant":"INW","subcat":"B","keyword":"冷静后再评估","title":"第一反应总把事情想得太糟，等冷却了再评估","core":"面对突发状况或冒犯性言论，第一反应往往是焦虑或愤怒，容易把情况想得极糟。只要按下暂停键，等待情绪冷却，再重新评估，往往会发现事实优于最初的判断。","action":"无论当时觉得处境多糟糕，告诉自己：“先别急，等一天再说。”","quotes":[{"date":"2024-11-23","text":"无论当时看起来是多么不好或是不同意的处境，都不要急，再等等，往往都会发现情况不一定是自己开始以为的那么差。","context":"无论当时看起来是多么不好或是不同意的处境，都不要急，再等等，往往都会发现情况不一定是自己开始以为的那么差。比如觉得幼儿园隔壁班老师更好，现在发现柔柔班也有独立优势，比如都会华文，都很会带娃。再比如刚听到沈阳爸说换国籍很冒犯，可是过一天再想他讲的那些换的原因都不算错，若是类比到自己父母更不理性的讲回国好，也不算是什么接受不了的事情了。刚才也是骤然听到沈阳爸在讲要继续promote，或是美国裁员要继续去别的国家不要去中国之类的，咋听也一丝不爽，其实不过是一时的自我意识和敏感作祟，心态平和点，让自己冷静下再回头，其实根本不算一回事了"}],"cases":[{"date":"2024","text":"幼儿园选择：起初觉得隔壁班老师更好，冷静后发现柔柔班老师也有独特优势（华文好、带娃专业）。","era":"recent"},{"date":"2024-07-29","text":"听到沈阳爸“去美国还是其他国家”的建议时短暂不适，冷静后发现这只是对方视角的建议，无足轻重。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"INW-B-40","quadrant":"INW","subcat":"B","keyword":"当下的力量","title":"意义不是一个终极答案，是当下每一刻过得值不值","core":"广义的、宏大的人生意义是不存在的，不要试图去寻找一个终极答案。当下的每一刻过得有意义，一生自然就有意义。旅行的意义不在于终点，在于沿途的风景。","action":"不要为过去悔恨（没用），不要为未来焦虑（没来），你拥有的只有“现在”。Past is history, Future is mystery, Today is a gift. 当你因为未来可能发生的困难而焦虑时，告诉自己：“只专注解决眼前这一步”。","quotes":[{"date":"2023-11-15","text":"《活出生命的意义》讲到如何找到生命的意义，是'做事 爱人 经历苦难'……《被讨厌的勇气》说……'途中每一刻经历，就是意义本身'……《人生的智慧》说……'活在当下，知足常乐'。","context":"读了这么多书，他们表达是不是都是类似的内核，就是要'过好当下,意义才会出现'。《活出生命的意义》讲到如何找到生命的意义，是'做事 爱人 经历苦难'——通过这些让当下的每一刻存在意义感（此处是'意义感'）。《被讨厌的勇气》说人生就是旅行，意义不仅仅是到达终点，'途中每一刻经历，就是意义本身'（此处是缥缈的'意义'），如一场盘旋先前的舞蹈；而找到意义的方式，是'他者贡献'——这不就是'做事与爱人'吗？《最好的告别》说，老人继续活下去的勇气，就是要感受到人生还有意义。而导致人生意义感迷失的，就是'厌倦感，孤独感，无助感'——孤独感就像社交需求，厌倦感和无助感就是尊严需求（你还可以有成就感）。《人生的智慧》说人生最重要的，就是'活在当下，知足常乐'"},{"date":"2017-06-28","text":"人生就是体验的过程；一切你的经历，都是一种体验……珍惜一切的体验，并对每一种体验去观察与了解。"},{"date":"2025-04-27","text":"今天看到一部叫做《日日是好日》的电影，核心主题就是感受当下，保持平常心，放弃多余的思考。想到自己也是深有此感，经常会有类似放空的举动，往前反思，就是因为大学也读了好些这一类的书，比如《当下的力量》《遇见未知的自己》，于是忽觉早些阅读、早些知道一些道理是非常重要的。"}],"cases":[{"date":"2023-11-15","text":"书籍共鸣：读完《活出生命的意义》《被讨厌的勇气》《人生的智慧》后，发现所有关于意义的内核都指向同一处：“过好当下”。前者说是“做事爱人”，中者说是“途中每一刻即意义”，后者说是“活在当下，知足常乐”。","era":"recent"},{"date":"2025-04-27","text":"观看电影《日日是好日》感悟：核心主题“感受当下，保持平常心，放弃多余思考”与自己常做的放空不谋而合。","era":"recent"},{"date":"2026-05-19","text":"人生的意义像面包的香味，一定是一边做一边出现那个香味，还没开始做就想提前找到香味，找不到的。你不做面包就没有那个香味，你一边活，意义才会一边诞生。","era":"recent","context":"人生的意义像是面包的香味，一定是一边做一边出现那个香味，还没开始做就想提前找到香味，找不到的。你不做面包就是没有那个香味，你一边活，意义才会一边诞生。"}],"recency":"recent","cluster":"c1"},{"id":"INW-B-50","quadrant":"INW","subcat":"B","keyword":"爱喜悦和平","title":"别把意义等同于成就，平静和喜悦才是终极指标","core":"人生的终极奥义不是宏大的成就，而是去做那些能带来“爱、喜悦、和平”的事。不要把“意义”等同于“成就”，无论工作还是生活，只要内心感受是平静与喜悦的，那就是意义所在。","action":"","quotes":[{"date":"2022-12-28","text":"12月28日下午7点，我们的宝宝柔柔终于出生啦！感恩，感谢，感激……那一瞬间，我居然不受控制地哭了出来。生命之神奇，难以言表。","context":"12月28日下午7点，我们的宝宝柔柔终于出生啦！感恩，感谢，感激；感恩上天赐予的如此不平凡之幸福。切身感受到了身为母亲的不容易，从怀胎十月，到之后的很多年。在这十个月之中，老婆和我都要战战兢兢，格外呵护好这个脆弱的生命，既怕外界的意外会伤害她，同时又因为看不到摸不着，害怕在肚子里有什么不舒服。同时，除了这份精神上的压力，老婆的身体还要承担与日俱增的难受……但是，勇敢的雁雁老婆都积极的克服了，而且全程都保持着乐观的心态。再到生产的一天中，也是有恍如隔世之感。凌晨我们两个人背着大包小包，相互支撑着去医院催生，仿佛踏上一趟未知的旅途……医院的一天，基本就是用药催生，打上催产素，而后便是安静的等开指……过去了将近12小时，才勉强到三指，再到3 4点居然才开到4指，那一刻我们几乎要觉得这将是一场一天多的持久战了。与此同时，老婆的焦虑也开始发酵……但是，否极泰来，到6点时，老婆居然神奇的开到了9指，于是只差临门一脚了。在之后的一小时，基本就是学习如何在宫缩时用力推出了。可是，在等待医生来的过程中，老婆的身体开始不受控制的发抖，估计是无痛的副作用，加上受冷，还有紧张，而且越来越严重，一度我都怀疑是不是不得不被动接受手术了。所幸，医生及时的来了，那一刻我都差点开心的叫出来，而后便是一波波的推出，在不管我还是老婆都感觉自己要到达极限，而柔柔的头无法完全露出时，几位助产士过来集体发力，在那大脑几乎空白而唯一感受只是几位助产士死死扶住了床在发力的一分钟里，柔柔就那么神奇的被推出。"},{"date":"2025-12-07","text":"越来越清楚了，在任何迷茫的时候，去做那个带给我'爱 喜悦 和平'的事，就是我人生的终极奥义（即便半夜我选择工作而不是玩乐，也是基于这个原因）。"}],"cases":[{"date":"2022-12-28","text":"新生命的降临：柔柔的出生让我对生命有了全新的体验。看着老婆怀胎十月和生产的艰辛，以及新生命的神奇，深感“上天待我不薄”。这种对当下的极致感恩和对家人的责任感，就是这一人生阶段最大的意义。","era":"recent"},{"date":"2025-12-07","text":"无论是带孩子时的温情（从“接受爱”转变为“给予爱”），还是深夜心流状态下的工作，只要内心感受是平静与喜悦的，那就是当下的意义。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"INW-B-60","quadrant":"INW","subcat":"B","keyword":"幸福的相对论","title":"幸福等于现实减预期，预期越高越容易痛苦","core":"幸福感=现实-预期，高预期是痛苦之源。痛苦是幸福的背景板，幸福往往隐藏在“不痛苦”的平淡中，黑色的墨才能衬出纸的白。","action":"不对老板期待像父母般的包容，不对伴侣期待读心术般的理解。适度降低期待，惊喜就会随处可见。","quotes":[{"date":"2024-07-29","text":"在一次诊所X光预警强直性脊柱炎后，polyclinic提供抽血和仔细X光检查，一方面确定了身体的确无碍……不得不感慨，失去了才知道珍惜呀，只是一个健康的身体，可以听可以看可以肆意地跑，就是多么幸福的事情了。"},{"date":"2024-08-06","text":"与此同时，上周的感冒还没恢复，鼻子还是堵得；腰也还在痛；真是'三英战吕布'了，只好咬牙坚持，等着否极泰来了。"},{"date":"2024-11-07","text":"我们在庸常的生活中，日复一日，那些平淡无奇的琐碎，消磨了我们对生活的感知力，于是，那些原本是幸福的东西，却被我们解读出了痛苦的意义；因为我们需要痛苦，痛苦让我们上瘾，经历了长久的痛苦之后，我们便可以收获短暂的快乐。"},{"date":"2025-12-14","text":"人总是在平静时寻求刺激，而在太过不稳定时去追求平静。前者就好像是当下平静顺利的生活，或是所谓的中年危机；后者就好像是曾经相濡以沫，比如一起等待宝宝降临时，就会觉得有一个稳定的家庭真是太过幸福——这就是人性。"}],"cases":[{"date":"2024-07-26","text":"失去方知拥有的可贵：在经历了对强直性脊柱炎的恐惧后，检查确认骨头无碍，那一刻的狂喜让我意识到：仅仅是拥有一个可以跑、可以跳、没有痛感的平凡身体，就是巨大的幸福。","era":"recent"},{"date":"2024-08","text":"在经历了腰痛、肠炎、荨麻疹“三英战吕布”的连环暴击后，康复的那天早上，看到阳光洒在柔柔脸上，那一刻深刻体会到：能跑能跳、无病无痛，就是最大的幸福。","era":"recent"},{"date":"2024-11-07","text":"痛苦的衬托作用：看《不够善良的我们》感悟：痛苦是有必要的。正是肠胃炎时的难受，才衬托出大吃大喝的快乐。","era":"recent"},{"date":"2025-12-14","text":"平静与刺激的钟摆：人性总是在平静时寻求刺激，在动荡时渴求平静。理解这种钟摆效应，就能在平淡日子里更惜福，在动荡日子里更坚定（因HBM中的浮躁心境有感）。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"INW-B-70","quadrant":"INW","subcat":"B","keyword":"终身学习姿态","title":"毕业不是学习的终点，停止学习就是在退步","core":"毕业不是学习的终点。在快速变化的时代（如AI浪潮），停止学习就是退步。","action":"","quotes":[],"cases":[{"date":"2024 (Merged)","text":"积极拥抱AI浪潮，从最早的ChatGPT到后来的Claude 3，不仅用于工作代码调试，更用于建立知识框架。深刻意识到：如果不学习Prompt Engineering，将被时代抛弃。","era":"recent"}],"recency":"recent","cluster":"c4"},{"id":"INW-B-80","quadrant":"INW","subcat":"B","keyword":"相信复利","title":"人总高估一年能做的事，低估十年能做的事","core":"学习不是为了应付当下的考试，而是为了建立长期的知识复利。无论是财富、知识还是健康，只要方向正确，时间会给你答案。人总是高估一年能做的事，低估十年能做的事。量变到质变之间存在一个需要耐心坚持的“蛰伏期”，且过程中一定存在“平台期”。","action":"","quotes":[{"date":"2025-02-14","text":"听到一个关于要有耐心的很好的名言：人总是会高估自己一年以内可以有的成就，而低估自己十年可以有的成就。同样在投资上也是一样，人总会高估自己一年可以有的收益，但低估十年的收益。"},{"date":"2025-06-09","text":"前几天在书上读到：好事总是慢慢才会见到效果，而坏事总是一瞬间就产生破坏性。这其实和我常和TM说的'good things will come, but need some patience'不谋而合了，'好事多磨'其实也是这个意思。"}],"cases":[{"date":"2016–2025","text":"十年成长的见证。","era":"mixed"},{"date":"2023-04-08","text":"质变源于量变：从每天坚持读《联合早报》的高质量文章，到减少刷短视频，这种微小的输入端改变，经过时间积累，会彻底改变一个人对世界格局的认知。这就是知识复利的具象化。","era":"recent"},{"date":"2025-02-14","text":"长期主义的耐心：投资中频繁查看账户导致的焦虑，往往是因为缺乏对“十年复利”的耐心。","era":"recent"},{"date":"2025-04-27","text":"大学时读的《当下的力量》当时未必全懂，但概念已植入大脑。随着阅历增长，这些概念在某一天突然完成“内化”，证明了早期接触哲理的延时价值。","era":"recent"},{"date":"2025-06-09","text":"好事多磨：坏事（破坏）往往发生在一瞬间，而好事（建设）总是慢慢显现效果。Good things will come, but need some patience.","era":"recent"},{"date":"2026-01-04","text":"学习认知的突破规律：体验到“山穷水复疑无路，柳暗花明又一村”。前两天测试AI新闻agent还一头雾水，继续摸索两天并阅读后，突然豁然开朗。坚持度过低谷期，大脑会自动完成拼图。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"INW-B-90","quadrant":"INW","subcat":"B","keyword":"保持好奇心","title":"多问几个为什么，是心态不老的秘诀","core":"对世界保持好奇，多问为什么。这是心态年轻的秘诀。","action":"","quotes":[],"cases":[{"date":"2024","text":"全年沉浸在AI技术的探索中。从一开始只是为了好玩，到后来用NotebookLM整理笔记、用Claude写代码。这种对新事物的好奇心，让我在30+的年纪依然感到兴奋。","era":"recent"}],"recency":"recent","cluster":"c4"},{"id":"DEO-A-10","quadrant":"DEO","subcat":"A","keyword":"人际投资策略","title":"别人的反应是市场噪音，你的原则才是交易纪律","core":"在投资中，成熟的投资者只关注“是否符合交易纪律”，而忽略市场噪音。人际交往中亦然：你的纪律（Strategy）是你预设的原则（如真诚、Clarity、坚持做正确的事、棱角）；市场噪音（Noise）是别人的反应、评价、脸色。如果做每件事前都想“别人想要什么”，做完后想“别人怎么看”，这本质上就是投资中的追涨杀跌和FOMO——你会被外界无法控制的信息牵着走，最终迷失自我且亏损（失去尊重）。","action":"专注于执行你的“策略”（原则），只要符合原则，就坚决执行。至于“市场”（他人）如何反应，那是市场的自由，与你的策略正确性无关。长期坚持“价值投资”（做正确的人），回报（尊重与深厚关系）自然会来。","quotes":[{"date":"2025-12-28","text":"我发现人际关系，与投资很相似。投资中，我们要遵守自己预设的纪律，即满足设定的规则就执行，而坚持下去，几年再回头，巨大的回报已经发生了。而人际关系中，同样的道理，我们要遵守的纪律，就是我们提前建立好的与人相处的准则。反面教材，就是做事情前先想别人想要的是什么，以此做决策——回头看，就迷失了自我，大概率也没有获得应有的尊重。"}],"cases":[{"date":"2025-12-28","text":"思考人际关系时有感而发。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-A-20","quadrant":"DEO","subcat":"A","keyword":"真实性","title":"人设完美但脆弱，真实有瑕疵但有生命力","core":"不要为了讨好世界而强行立“完美人设”。真实虽有瑕疵，但有生命力；人设虽然完美，但极其脆弱。在职场和生活中，与其伪装，不如放大自己的真实特质，做consistent的自己。","action":"","quotes":[{"date":"2025-12-14","text":"有时候比如说别人需要纸巾，你说'你要不要纸巾'和你直接去给他递一张纸巾是完全不一样的，这也是所谓真诚的表现。就好像今天早上，我说给柔柔把水瓶拿来给她喝点水，但不如直接自己去拿给她喝就好了。"}],"cases":[{"date":"2020-10-11","text":"看到大张伟翻红后的感悟：坚持做自己，哪怕短期不讨喜，长期却是最稳固的护城河。","era":"root"},{"date":"2025-12-14","text":"少说多做，拒绝Over-sell：真正的自信不需要语言上的强调。“递纸巾”的直接行动远比问“你要不要纸巾”更具诚意。知行合一是Leader的最高信誉，做自己坚信对的事，无论别人喜好，这才是真正的你。","era":"recent"},{"date":"2026-02-23","text":"坦诚面对世俗欲望（真实性与课题分离的结合）：发现自己对M3 promo其实有期待，反思以前总高尚地教导别人“不要在乎promotion”，这其实有些虚伪和凡尔赛。更精确的表达应该是：“我也希望promote，但那是超出自己Circle of Control的，所以看淡结果，去做能做的”。这样既真诚又务实。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"DEO-A-30","quadrant":"DEO","subcat":"A","keyword":"谦卑的力量","title":"自己的观点不是唯一真理，是启发别人还是强加于人","core":"自胜者强。意识到自己的观点并非唯一真理，保持好奇和开明，是解决复杂问题的关键。李嘉诚：“你是启发别人的天使，还是把主观强加于别人的牛魔王？”","action":"","quotes":[],"cases":[{"date":"2018","text":"在汕大演讲中反思管理者应有的“同理心与慷慨良心”。","era":"root"},{"date":"2026-01-22","text":"警惕吹嘘与低级虚荣：给Shermaine带点吹嘘地讲自己team engagement是满分，结果发现别人的team也都是100分。深刻教训：高调做事，低调做人。做的好，不说别人也看得到；做的不好，怎么吹嘘别人一样看不起。","era":"recent"},{"date":"2018-07-06","text":"一个人的善良，只要你真的在做，有心人自然就会看到，不需要你刻意做给谁看。做的人是因为习惯，因为心安，而有心人自然会appreciate，并在合适的时候给予帮助和奖励。","era":"root"}],"recency":"mixed","cluster":"c3"},{"id":"DEO-A-40","quadrant":"DEO","subcat":"A","keyword":"程序正义","title":"效率牺牲了公平，社会根基就会松动","core":"如果为了效率牺牲了公平，社会根基就会崩塌。功利论无可厚非，但必须在不违背道德的前提下。","action":"","quotes":[{"date":"2023-12-26","text":"这不就是'过程正义与结果正义'的区别吗？……最好的做法，应该追求程序正义……即便过程正义，按事情本身的对错而不是结果来产生情绪，'情绪稳定，与最亲的人好好说话'，永远都是更推荐的。"}],"cases":[{"date":"2023 (merged)","text":"读完《太白金星有点烦》感悟：孙悟空顶替六耳猕猴的名额就是舞弊。道德是社会稳定的基石，程序正义是公平的唯一手段。如果明天每个人都能冒名顶替，社会终将崩溃。","era":"recent","context":"乍看很容易同情六耳猕猴，觉得他被委屈了，如果没被顶替，就一定可以享有今日孙悟空的一切荣耀。但是，真的吗？成功永远是机遇+实力；也许开始是顶替，但是得到孙悟空的赏识、菩提老祖的真传，包括各种造化，不是他的天赋，性格，与无数努力使然吗？\n但是，以上是小小的辩证，若你问我是否就同意了孙悟空的名额顶替，因为他可以更大概率的成功，我会肯定的说不同意。两个思路：\n程序正义与结果正义：程序正义是公平的唯一手段，你可以说现在的结果很好，我们培养出了一个国家栋梁；但是同理度之，是不是明天你我他每个人都可以来做这种冒名顶替之事了呢？甚至于，一旦方便之门大开，甚至利益勾结就会出现，得势者就可以轻松顶替弱势者的名额了？久而久之，公平一丢，人心皆失，社会不是沉默中崩溃，便是沉默中暴乱。\n道德主义功利论：功利论固然无可厚非，每个人都应该追求自己的利益最大化，可是这种功利主义必须在不违背道德的前提下；道德是一个社会稳定的基石，而孙悟空顶替了六耳猕猴，就是在舞弊，而这种道德基石已经崩塌下的成功，是不可取的。"},{"date":"2023-12-26","text":"情绪的过程正义：过程正义不仅适用于社会公义，也适用于个人情绪管理。妻子因体温计坏了发脾气，曾认为“如果结果能解决，这脾气就白发了”（追求结果正义）。反思后发现：如果我在处理时考虑不周，那么由此产生的负面情绪就是“合理”的，不应以“结果好坏”来倒推情绪的合法性。当然，即便过程正义，保持情绪稳定依然是更优解。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-A-50","quadrant":"DEO","subcat":"A","keyword":"拒绝油滑","title":"棱角是内心的坚定，不是不会来事","core":"拒绝“油滑”和“好好先生”。棱角代表着坚定的立场和Inner Firmness（内心的坚定），不害怕冲突。在面临诱惑或压力时，听从内心道德罗盘的指引，坚持Do what you think is right，而不是做别人让你做的，或者做最容易的。面对无底线的恶意，忍让是不可取的，必须坚持底线，用法律和规则反击。","action":"不要为了讨好而模糊立场，也不要为了小利而因小失大。当面临选择时，问自己：“哪一个选项让我内心更坦荡？”在需要表达立场的场合，必须坚持“对就是对，错就是错”。","quotes":[{"date":"2022-02-13","text":"绝不忍让，底线不可碰……不要与恶人比恶，无论当时还是将来；你永远无法想象恶人有多恶……绝对不能做阿Q。"},{"date":"2016-08-29","text":"每个谎言，都需要十倍的谎言来弥补。"},{"date":"2020-04-25","text":"最精妙的谎话，就是真诚——绝不撒谎；绝不耍小聪明。"},{"date":"2024-10-21","text":"越往上越需要有自己独立的stand，做自己相信正确的，而不仅仅是为了happy end得过且过……没人让我attend yield review，但我就是觉得我可能要在里面回答highlight，所以就去了，结果证明我是对的。","context":"越往上越需要有自己独立的stand，做自己相信正确的, 而不仅仅是为了happy end 得过且过， 比如shuyi stress的conclusion要看的更仔细，且用data证明，所以我就坚持用我认为正确的方法看了data，比如没人让我attend yield review，但我就是觉得我可能要在里面回答highlight，所以就去了，结果证明我是对的；再比如pillar bending data cheeleong不想collect，可是我觉得这种drift root cause是老板会问的，所以依然要做。比如我和4c 和42MA的反复强调不只highlight我，也会换来他们帮我说话。"},{"date":"2025-01-22","text":"关于do what you think right to do, not what you are told to do。我从小到大有一个惯性，就是很容易被别人的说法左右……小美决定在回家的第一天上午只拿半天假，我本来有点心动，但思前想后，我拿半天是肯定不能工作的。如果这样，我得到的是省半天假，失去的是integrity，失去的是诚信。"}],"cases":[{"date":"2022-02-13","text":"处理邻居因抽烟问题引发的冲突。虽身体受损，但坚持报警、验伤、投诉，坚持程序正义，不委屈求全。","era":"recent"},{"date":"2024-10-21","text":"职场独立立场：越往上走，越需要有独立的Stand。虽然没人要求，坚持参加Yield Review并回答Highlight；虽然同事不想collect Pillar数据，坚持认为这是Root Cause并执行。这种“不随大流、坚持做我相信正确的事”的态度，最终赢得了尊重与支持。","era":"recent"},{"date":"2025-02-02","text":"诚信的原则：面对“回国第一天上午只拿半天假”的诱惑，虽然能省假，但实际上无法工作。果断拒绝这种小聪明，坚持拿全天假。Do what you think is right, not what you are told to do. 失去的是半天假，得到的是Integrity（诚信）和内心的坦荡，这是成熟的标志。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-A-60","quadrant":"DEO","subcat":"A","keyword":"课题分离","title":"只对自己能改变的事情负责，剩下的彻底接受","core":"区分“关注圈”和“影响圈”。把精力花在能改变的事情上（自己的能力、态度），彻底接受不能改变的（父母的性格、过去的事实）。","action":"对于他人的虚荣或固执，选择“课题分离”，那是他们的人生课题，不是我的。","quotes":[],"cases":[{"date":"2023","text":"筹备婚礼时，接受父母无法改变的性格缺陷，专注于自己能掌控的环节。面对小美妈妈关于彩礼的强硬态度和不礼貌言行，一度愤怒，后来意识到：她如何表现是她的素质课题，我按规则办事是我的课题。只要保护好小家的底线，她的情绪不应成为我的负担。","era":"recent"},{"date":"2024-03-19","text":"课题分离实战：面对办公室换座位的问题，运用阿德勒的“课题分离”：我去新座位有什么利弊是“我的课题”，而别人怎么看待我的行为则是“别人的课题”。","era":"recent"},{"date":"2026-01-10","text":"嫉妒的解药：承认对优秀同行（如PI Leader）的不适感本质是“嫉妒”。运用课题分离：她光彩夺目是她的能力（她的课题），我作为Supervisor如何用好她是我的课题。推己及人，登山者眼里只有前方的路，根本看不到身后的人。专注于自己的路，假以时日，那些曾让你嫉妒的人自然会被甩在身后。","era":"recent"},{"date":"2021-08-06","text":"一个快乐与自由的人，一定要有被讨厌的勇气，且一定会被某一部分人讨厌，因为这恰恰说明了你没有在迎合他们。唯一要自省的，就是'什么是我自己的课题'——如果答案是YES（已做好），剩下别人怎么看、怎么说，那都不是我能控制的了。","era":"root","context":"先记录过去几天出现的几个小冲突：在review里面val听到王东说hybrid NZO有yield loss于是问个不停，于是Adeline就来消息说'这是我们issue owner说要filter这个lot的'，简直鸡同鸭讲。她要给val写HXL update，于是就让我帮忙，我实在不耐烦同样的内容又给Adeline又给val写，于是只理了val没有理Adeline，又被complain'not reply in multiple trigger'。这时候我本来心中有个想法，'我会不会因为回复不及时……弄坏将来和Adeline的关系'；可是再反思，这不恰恰就是'避免认可欲求'和'课题分离'的用武之地吗？一个快乐与自由的人，一定要有被讨厌的勇气，且一定在被某一部分人讨厌，因为这恰恰说明了你没有在迎合他们了。你唯一要自省的，就是'什么是我自己的课题——保证我做好自己的project，meet business need'，而且'我有努力做好自己的课题吗'；如果答案是YES，剩下的别人要怎么看，怎么说，那其实都不是我能控制的了。要有'被讨厌的勇气'！"},{"date":"2026-04-21","text":"同事没能第一时间告知一条消息，本能地觉得“没把我放在眼里”；事后意识到这是不合理的自我中心视角——人家没有义务向自己汇报，运用课题分离与“共同体感觉”放下这份不爽，把精力放回自己能控制的事情上。","era":"recent","context":"他那种思维定式里面，比如说早上0.65ag消息没有告诉我，其实是无可厚非的。因为人家也是早上才知道这个消息，但我就觉得这是没把我放在眼里……其实，人完全没有动力来汇报东西，而且白天的主线本来就是工作，所以从理性上，我这些都是很不合理的想法。但是感性上我就会有这种以自我为中心的感觉，忘了所谓的共同体感觉，其实就是要在自己的control里面去做事情，比如说，接纳自己的局限，同时也知道自己的优点……那些我能够控制的东西，甚至于AI的应用，甚至于怎样提高自己思想的深度，或者去帮助一些我需要帮助的人，这些其实才是实实在在的。"}],"recency":"mixed","cluster":"c2"},{"id":"DEO-A-70","quadrant":"DEO","subcat":"A","keyword":"不苛责自己","title":"过去的自己已经尽力了，别用今天的标准苛责他","core":"不要因为过去的愚蠢而苛责现在的自己，那时的你已经尽力了。也不要高估自己与他人的耐心，未经他人苦，莫劝他人善。","action":"对瞬间失控的自己和他人保持宽容。","quotes":[{"date":"2025-01-05","text":"今天对于永远没有所谓的感同身受这个道理有了更深刻的见解……在FairPrice楼下买免费咖啡，能明显看到做咖啡的人不耐烦……同时也告诉了我千万不要高估自己控制情绪的能力，有时候不过是没有感同身受后的自以为是罢了。"},{"date":"2025-07-06","text":"记录一个昨天比较情绪化的瞬间：中午在图书馆玩，我要带柔柔回家，她越来越闹……如果我都无法做到任何时候都有耐心，那有没有可能，那些人当时也是在很紧急的情况下才会有这种状况？所以任何时候都不要高估自己情绪的控制。"},{"date":"2025-06-09","text":"有时我会觉得老婆鼻子或嗓子不舒服的时候，就更容易对身边人不耐烦。但今日换位思之，我因为牙疼难受，晚上柔柔11点还不睡的时候我也会很烦躁——永远不要高估自己的耐心和情绪控制力，有时候只是还未身受，所以无法感同而已。"},{"date":"2025-12-30","text":"莫经他人苦，莫劝他人善。"}],"cases":[{"date":"2025-01-05","text":"感同身受的伪命题：在FairPrice买咖啡遭遇店员敷衍时瞬间火大。反思：以前觉得小美与服务员争执是“斤斤计较”，其实是因为我没有置身于她的处境。","era":"recent"},{"date":"2025-06-09","text":"生理决定心理：永远不要高估生病时的情绪控制力。牙疼或感冒时，耐心条会缩短。意识到这一点，就要在身体不适时主动减少决策和社交，避免冲突。","era":"recent"},{"date":"2025-07-06","text":"在图书馆对孩子失去耐心后反思：不要苛责自己。路人的眼光不重要，他们没看到你当时的窘迫。任何人都无法时刻保持完美耐心，原谅那个瞬间失控的自己。","era":"recent"},{"date":"2025-12-30","text":"共情边界：再次提醒自己，莫经他人苦，莫劝他人善。对他人的痛苦保持敬畏，收起廉价的建议。","era":"recent"},{"date":"2023-11-19","text":"看到马丁·尼莫拉牧师的名言（'起初他们迫害共产党员，我没有说话……最后他们迫害到我头上，却再也没有人能为我说话'）后反思：在事情真正发生在自己身上前，不会有切肤之痛，这世上没有真正的感同身受，灾难来临时自保是人的第一本能，这是人性的本质，不应苛责。","era":"recent"},{"date":"2023-12-03","text":"面对家人的委屈/误解，与其纠结在'她固执己见'上钻牛角尖，不如换个思维模式：'我会看这件事情里有没有任何一点没有说错的地方'，只要有，那就是我以后可以做得更好的点，这个委屈就不算真的委屈了。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-A-80","quadrant":"DEO","subcat":"A","keyword":"不做烂好人","title":"不懂拒绝的善意，是廉价的善意","core":"不懂拒绝的善意是廉价的。有原则的拒绝，才能赢得真正的尊重。","action":"","quotes":[],"cases":[{"date":"2017","text":"拒绝同事不合理的插队请求，坚持First Thing First。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"DEO-A-90","quadrant":"DEO","subcat":"A","keyword":"建立原则","title":"选择困难的时候，原则就是你的导航仪","core":"遇到选择困难时，回到你的原则上来（如：诚实、家庭第一）。原则是决策的导航仪。","action":"","quotes":[],"cases":[{"date":"2023 (Merged)","text":"婚礼筹备期间，面对无数琐碎的冲突，死守“小家优先”和“有商有量”两条原则。凡是违背这两条的（如父母的无理要求），一律温和拒绝。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-A-100","quadrant":"DEO","subcat":"A","keyword":"真理优于和谐","title":"当场没问清楚，事后诸葛亮就没用了","core":"不要为了表面的一团和气而放弃当场反驳或追问的机会。事后诸葛亮（“哎呀当时我应该问这个”）是无效的。","action":"真正的尊重是严肃地对待对方的观点，哪怕这意味着当场争论。","quotes":[{"date":"2019-09-19","text":"怎样贯彻'做自己相信正确的事'，说白了，就是'为自己而活'，而不是总想着'别人会怎么看'。"},{"date":"2021-08-15","text":"把'和谐友好'放在'追求真理'的后面。","context":"意识到自己一个思维的问题：很多当场听，觉得OK OK，习惯在当场不做反驳（甚至背后有习惯在人前留好人印象，以'愉快的结束谈话为目的，而不是追求真理为目的'；于是后来回头再细思，会想'哎呀，如果这样我应该跟上这样一个follow up question'呀；或者是，'不对呀，如果真是这样，那为什么不是这样这样呢？'说白了，就是一些'需要反驳'的问题，或者是'继续深入探讨'的问题，总是思维太慢+为了和谐不习惯'当场打破砂锅问到底'，要事后才能想到这些当场本应该就即时问出的问题，没有达到最理想的谈话效果。那解决办法呢？1.意识并刻意打破自己'碍于面子'的老毛病，把'和谐友好'放在'追求真理'的后面；在将要结束谈话前问自己，'我真的达到end goal了；所有的逻辑点都已经理顺了吗？2.强迫自己建立'当场思考'的毛病，别想着'行，我先接受了，回家再慢慢想'，而是'我一定要来当场internalize,复述出你的要点了再结束谈话'；这和上课道理是一样的，课后努力绝对没有当场领悟的学习效率高，同时必然是要花费更多的精力了。"}],"cases":[{"date":"2021-08-15","text":"感悟：我之前习惯于在谈话中扮演“好人”，结果导致很多深层逻辑漏洞没能在会议中暴露。现在决定打破“碍于面子”的习惯，追求谈话的End Goal。","era":"root","context":"意识到自己一个思维的问题：很多当场听，觉得OK OK，习惯在当场不做反驳（甚至背后有习惯在人前留好人印象，以'愉快的结束谈话为目的，而不是追求 种Working smart 吧，比如关键的steer com update，top issue即时给他们heads up,关键meeting敢于给direction，对于m3+给的重要assignment比如QIT coverage依然要尽量卖力做好。"}],"cases":[{"date":"2024-09-08","text":"反思在Lead层面，核心价值不再是做牛马活，而是提供Direction（方向）和Visibility（可见性）。这才是高层社交中的硬通货。","era":"recent"},{"date":"2025-12-27","text":"在HBM project，开始感觉PDE的人对自己都爱理不理。可是当一路上慢慢证明了自己作为pilot line PIE的独特价值，突然这些人就都变成了自己的好朋友。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-B-20","quadrant":"DEO","subcat":"B","keyword":"结构化表达","title":"先抓住对方最核心的痛点，别急着钻细节","core":"在沟通时，不要急于跳入细枝末节（side notes），而应第一时间抓住对方最核心的痛点或诉求。","action":"沟通三步法：1. 先acknowledge（确认）自己了解对方的核心想法；2. 直接answer to the key point；3. 讲清楚关键矛盾后，再divert（下钻）到具体细节。这是让表达精炼、直击痛点的重要习惯。","quotes":[],"cases":[{"date":"2026-02-19","text":"沟通中的本末倒置：在探讨“整个system怎样reprioritize”时，直接跳入具体的conv discussion细节，导致对话错位。反思必须刻意练习“自下而上思考，自上而下表达”，最短时间戳到最重要点。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-B-30","quadrant":"DEO","subcat":"B","keyword":"有效道歉","title":"道歉不是说对不起，是说清楚哪里错了、以后怎么改","core":"道歉不是说“对不起”，而是“我意识到我的行为在什么地方伤害了你，我以后会……”。","action":"","quotes":[],"cases":[{"date":"2019","text":"职场中承担责任的正确姿势。","era":"root"}],"recency":"root","cluster":"c3"},{"id":"DEO-B-40","quadrant":"DEO","subcat":"B","keyword":"倾听是恭维","title":"大多数人都在等着说话，很少人真的在听","core":"大多数人都在等着说话，而不是在倾听。真正听进去，并给出反馈，能瞬间拉近关系。","action":"","quotes":[{"date":"2022-04-28","text":"we should listen much more and comment less, when talking with TM.","context":"we should listen much more and comment less, when talking with TM; also ask right question to let them talk; i need take note on this as well, i am talking too much today."}],"cases":[{"date":"2023","text":"观察到沈阳父母“拒绝倾听”的毛病，引以为戒。","era":"recent"},{"date":"2022-04-28","text":"和TM沟通时提醒自己要多听少说，多提出好问题让对方说，意识到自己那天说得太多了。","era":"recent","context":"we should listen much more and comment less, when talking with TM; also ask right question to let them talk; i need take note on this as well, i am talking too much today."}],"recency":"recent","cluster":"c2"}

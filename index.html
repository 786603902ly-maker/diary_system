">-</span><span style=\"color:#FA0000\">未能及时适应技术变革:</span> 例如，AT&amp;T 固守传统的语音通信业务，未能及时适应互联网时代数据传输需求的增长，最终走向衰落。[1]</p> <p>-过于保守的策略: 例如，IBM 的保守策略使其错失了个人电脑和互联网浪潮带来的机遇。[2] 摩托罗拉也因为过于保守，错失了数字手机时代。</p> <p style=\"color:#FA0000\"> </p> <p><span style=\"color:#FA0000\">-</span><span style=\"color:#FA0000\">来自新兴市场的竞争:</span> 例如，亚洲制造商以低成本和高效率优势，对惠普的传统业务造成了巨大冲击。</p> <p> </p> <p><span style=\"color:#FA0000\">-</span><span style=\"color:#FA0000\">决策失误:</span> 例如，惠普收购康柏的失败是其衰落的主要原因之一。</p> <p><span style=\"color:#FA0000\">-</span><span style=\"color:#FA0000\">商业策略失误:</span> 例如，太阳微系统未能有效推广 Java 平台和 Solaris 操作系统，最终被边缘化。</p> </ul>"},{"kind":"book","title":"李开复自传：世界因你不同","by":"user","titleHtml":"<p>李开复自传：世界因你不同</p>","html":"<ul> <ul type=\"disc\"> <li><span style=\"font-weight:700\">追随内心与梦想</span></li> <ul type=\"circle\"> <li>勇敢倾听内心，明确自己的追求，用梦想引领人生。</li> </ul> <ul type=\"circle\"> <li style=\"color:#FA0000\">成功是做最好的自己，并把最好的自己展现出来。（+达到内心的满足与快乐的状态）</li> </ul> <li><span style=\"font-weight:700\">教育与独立思考</span></li> <ul type=\"circle\"> <li>教育的本质是独立思考与批判性思维能力。</li> <li>西方教育重视客观分析，东方教育强调感性体验，两者互为补充。</li> </ul> <li><span style=\"font-weight:700\">创新与管理</span></li> <ul type=\"circle\"> <li>创新不局限于技术，可体现在商业模式或产品优化上。</li> <li>优秀管理需兼顾信任与自由，避免过度干涉，同时要注重员工与公司文化的匹配。</li> </ul> <li><span style=\"font-weight:700\">价值与用户导向</span></li> <ul type=\"circle\"> <li>项目应关注用户需求，追求实际应用价值，而非仅炫技。</li> </ul> <ul type=\"circle\"> <li style=\"color:#FA0000\">真正的成功公司恪守价值观，追求基业长青，而非单纯追求速度。</li> </ul> <li><span style=\"font-weight:700\">生活与品格</span></li> <ul type=\"circle\"> <li style=\"color:#FA0000\">快乐源自于内心的满足，最富有的人是需求最少的人。</li> </ul> <ul type=\"circle\"> <li>困境是磨练人格的最佳时机，家庭是应对人生风暴的坚实支柱。</li> </ul> <li><span style=\"font-weight:700\">人生哲理与智慧</span></li> <ul type=\"circle\"> <li style=\"color:#FA0000\">用勇气改变能改变的事，用胸怀接受不能改变的事，用智慧分辨两者的不同。</li> <li style=\"color:#FA0000\"><span style=\"font-weight:700\">宽恕是主动的态度，而非单纯的遗忘。</span></li> </ul> </ul> </ul>"},{"kind":"l2","title":"理财与金融","by":"user"},{"kind":"book","title":"小岛经济学","by":"user","titleHtml":"<p>小岛经济学</p>","html":"<p><span style=\"font-weight:700\">1.</span><span style=\"font-weight:700;color:#FA0000\">经济的发展由生产力提升衡量</span><span style=\"font-weight:700\">，即同等资源的更大收益；</span><span style=\"font-weight:700;color:#FA0000\">需要资本+创新</span></p> <p><span style=\"font-weight:700\">2.资本如果提高生产力同时提高雇员生活质量，便是双赢；雇主高风险于是获得了更高回报</span></p> <p><span style=\"font-weight:700\">3.储蓄产生资本，产生投资和生产力提升</span></p> <p><span style=\"font-weight:700\">4.</span><span style=\"font-weight:700;color:#FA0000\">作者推崇自由贸易，因为经济发展靠生产力提升而不是就业岗位数量</span><span style=\"font-weight:700\">，自由贸易可以让各地区各抒己长，降本增产，而保护主义反而不提高美国生产力，只是提高了物价</span></p> <p><span style=\"font-weight:700\">5.通货膨胀早期反映了生活水平的提高，需求增加，但持续恶化会因为成本增加而减少投资，公司裁员，同时个人不愿意消费，继续恶化经济</span></p> <p><span style=\"font-weight:700\">6.美国消费为主且低利率，靠的是中国足量的储蓄维持。中国人民储蓄在银行，中国政府储蓄在美联储</span></p> <p><span style=\"font-weight:700\">7.政府干预和基建投资需具备长期收益，否则可能带来经济负担；同时，货币供应的控制必须谨慎，以避免通货膨胀导致的购买力下降。</span></p> <p><span style=\"font-weight:700\">8. </span><span style=\"font-weight:700;color:#FA0000\">失业率才是经济发展的晴雨表</span><span style=\"font-weight:700\">（通货膨胀，GDP是另外两个；但通膨可以控制利息和货币发行控制）</span></p>"},{"kind":"book","title":"投资中最简单的事","by":"user","titleHtml":"<p>投资中最简单的事</p>","html":"<p><span style=\"font-weight:700\">一、投资理念的基石</span></p> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700\" value=\"1\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">实业的眼光</span></li> <ul type=\"circle\"> <li>将股票视为企业的一部分，关注长期价值，比如<span style=\"color:#FA0000\">行业门槛、现金流、竞争格局、定价权</span>，行业集中度高。</li> <li>“买企业的心态，淡化股价波动。”</li> </ul> </ol> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700;color:#FA0000\" value=\"2\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">逆向投资</span></li> <ul type=\"circle\"> <li><span style=\"color:#FA0000\">在市场恐慌时寻找低估值机会</span>。区分“假”风险与真实风险，耐心等待市场纠错。</li> <li><span style=\"font-weight:700\">核心思想</span>：“人弃我取是超额收益的重要来源。”</li> </ul> </ol> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700\" value=\"3\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">价值为本</span></li> <ul type=\"circle\"> <li><span style=\"color:#FA0000\">低估值买入优质公司</span>，获取高安全边际和长期回报。</li> <li><span style=\"font-weight:700\">核心思想</span>：“便宜是硬道理。”</li> </ul> </ol> <p><span style=\"font-weight:700\">二、投资策略的精髓</span></p> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700;color:#FA0000\" value=\"1\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">选择“月亮”行业：</span><span style=\"font-weight:400;font-style:normal;font-weight:400\">行业集中度高，竞争有序，利润稳定。</span></li> <li style=\"font-weight:700;color:#FA0000\"><span style=\"font-weight:700\">寻找定价权：</span><span style=\"font-weight:400\">投资定价权强的企业（例：茅台）。</span></li> <li style=\"font-weight:700;color:#FA0000\"><span style=\"font-weight:700\">重视先发优势：</span><span style=\"font-weight:400\">投资行业龙头，享受领先优势。（比如m</span><span style=\"font-weight:400\">ag7</span><span style=\"font-weight:400\">）</span></li> <li style=\"font-weight:700;color:#FA0000\"><span style=\"font-weight:700\">胜而后求战：</span><span style=\"font-weight:400\">投资于已有明确胜利的公司。</span></li> </ol> <p><span style=\"font-weight:700\">三、避开投资陷阱</span></p> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700;color:#FA0000\" value=\"1\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">价值陷阱：</span><span style=\"font-weight:400;font-style:normal;font-weight:400\">警惕基本面持续恶化的便宜公司。</span><span style=\"font-weight:400;font-style:normal;font-weight:400\">(比如Intel</span><span style=\"font-weight:400;font-style:normal;font-weight:400\">）</span></li> </ol> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700\" value=\"2\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">成长陷阱：</span><span style=\"font-weight:400;font-style:normal;font-weight:400\">警惕高估值、高增长的公司成长乏力。</span></li> </ol> <p><span style=\"font-weight:700\">四、投资方法的精要</span></p> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700;color:#FA0000\" value=\"1\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">三个问题：为什么便宜、好、现在买？</span><span style=\"font-weight:400;font-style:normal;font-weight:400\">估值最容易学习和把握，品质是关键，而时机最难判断</span></li> <li style=\"font-weight:700;color:#FA0000\"><span style=\"font-weight:700\">安全边际</span><span style=\"font-weight:400\">：低于内在价值买入以降低风险。</span></li> <li style=\"font-weight:700;color:#FA0000\"><span style=\"font-weight:700\">长期投资</span><span style=\"font-weight:400\">：淡化短期波动，注重基本面分析。</span></li> </ol> <p><span style=\"font-weight:700\">五、其他重要观点</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">价值投资局限性</span><span style=\"font-weight:400;font-style:normal\">：需适应不同市场阶段。</span></li> </ol> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li style=\"color:#FA0000\" value=\"2\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">知易行难：</span><span style=\"font-weight:400;font-style:normal\">投资成功更多依赖自控力与实践，避免追涨杀跌和受市场情绪影响</span></li> </ol> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"3\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">如何规避风险：</span><span style=\"font-weight:400;font-style:normal\">避免过度自信，审慎预测未来。</span></li> </ol>"},{"kind":"l2","title":"法制与科普","by":"user"},{"kind":"book","title":"法治的细节","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/35635639/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">法治的细节</span></a></p>","html":"<p>基本上是一本书来了解一个人，主题包括：</p> <p>1.正义客观存在，</p> <p>2.我们应该追求程序正义而非结果正义，</p> <p style=\"color:#FA0000\">3.我们应该追求道德功利主义而不是纯功利主义，而尊重生命，尊重人的尊严都是其体现，</p> <p>4.法律是对道德的最低要求，同时一个道德上鼓励的行为一定不是犯罪；</p> <p>5.<span style=\"color:#FA0000\">讨论再大的社会与法律问题，对抽象的人类命运表达再多怜悯，都比不上对身边人具体的爱</span> ；</p> <p style=\"color:#FA0000\">6.越是体现人尊严的欢乐，越能带给人更大的快乐，</p> <p>7.真正的智慧就是意识到自己的无知；</p> <p>8.人与人并不也不应该平等但我们依然应该追求法律下的平等</p>"},{"kind":"book","title":"生命是什么","by":"user","titleHtml":"<p>生命是什么</p>","html":"<p>-生命的三大基石</p> <p>能量：通过ATP合成和化学渗透获取负熵，维持高度有序的生命系统。</p> <p style=\"color:#FA0000\">自我复制：复制精确性与变异性确保生命延续与演化。</p> <p>细胞膜：脂质双分子层构建“分离之墙”，保护并稳定生命活动。</p> <p>-复杂生命的演化</p> <p style=\"color:#FA0000\">分工：细胞、器官与群体分工提高生存效率。</p> <p>感知：大脑将信息整合为感知世界。</p> <p style=\"color:#FA0000\">社交：语言与性别促进基因交流与协作行为。</p> <p>-智慧生命</p> <p>自我意识：通过镜像神经元与抽象记忆形成“自我”概念。</p> <p>自由意志：或是幻觉，但推动人类探索未知。</p> <p>-未知领域</p> <p>生命和意识的奥秘，如意识形成与癌细胞控制，仍等待科学解答</p>"},{"kind":"l2","title":"社会与政治","by":"user"},{"kind":"book","title":"李光耀观天下","by":"user","titleHtml":"<p>李光耀观天下</p>","html":"<ul> <ol style=\"font-weight:700;font-style:normal\" type=\"1\"> <li style=\"font-weight:700\" value=\"1\"><span style=\"font-weight:700;font-style:normal;font-weight:700\">中国的统治与政治体制</span></li> </ol> <ul type=\"disc\"> <li><span style=\"font-weight:700;color:#FA0000\">强大的中央集权</span><span style=\"font-weight:700\">：</span><span style=\"color:#FA0000\">根植于中国文化与历史；相信强人政治能带来和平与繁荣</span>；中共通过软硬手段全面掌控局势；网络与舆论严格监管</li> <li><span style=\"font-weight:700;color:#FA0000\">党内民主探索：</span><span style=\"color:#FA0000\">局限于经党批准的候选人</span>；主动权始终掌握在中共手中</li> </ul> <p><span style=\"font-weight:700\">2. 腐败与国家发展</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">现状：</span><span style=\"font-weight:700\"> </span>官员薪资与财富差距拉大；<span style=\"color:#FA0000\">制度无法完全杜绝腐败，但能维持稳定</span></li> <li><span style=\"font-weight:700\">解决策略：</span>反腐败作为党生死存亡的关键；提高制度效率，清除阻碍发展因素</li> </ul> <p><span style=\"font-weight:700\">3. 经济发展模式的转型</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">过去模式：</span>廉价劳动力和出口导向型经济</li> </ul> <ul type=\"disc\"> <li style=\"color:#FA0000\"><span style=\"font-weight:700\">未来模式：</span>内需拉动型经济；提升生产力；优化国有企业；鼓励消费，减少储蓄偏好</li> </ul> <p><span style=\"font-weight:700\">4. 中国的世界定位</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">和平崛起 ：</span>将自己视为复兴中的古老强国；在国际事务中寻求更大话语权；<span style=\"color:#FA0000\">强调不称霸</span></li> </ul> <ul type=\"disc\"> <li style=\"color:#FA0000\"><span style=\"font-weight:700\">区域经济关系：</span>加强与东盟合作</li> </ul> <ul type=\"disc\"> <li><span style=\"font-weight:700\">外交策略：</span>奉行“韬光养晦”（<span style=\"color:#FA0000\">习近平不是</span>）</li> </ul> <p><span style=\"font-weight:700\">5. 中美关系</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">双边动态：</span>既有竞争也需合作</li> </ul> <ul type=\"disc\"> <li style=\"color:#FA0000\"><span style=\"font-weight:700\">亚太平衡：</span>美国军事存在可以维持地区稳定</li> </ul> <ul type=\"disc\"> <li><span style=\"font-weight:700\">台湾问题 ：</span>敏感议题，<span style=\"color:#FA0000\">两岸经济融合降低独立可能性</span></li> </ul> <p><span style=\"font-weight:700\">6. 未来领导层的影响</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">挑战：</span><span style=\"font-weight:700\"> </span>经济转型；社会不平等；环境污染</li> <li><span style=\"font-weight:700\">特点：</span>教育良好、视野开阔；更加清晰的世界定位（<span style=\"color:#FA0000\">习近平不是</span>）</li> </ul> <p><span style=\"font-weight:700\">7. 新加坡对中国崛起的看法</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">机遇与挑战并存 ：</span>搭上中国经济发展快车；保持与其他国家密切联系</li> <li><span style=\"font-weight:700\">地区平衡 ：</span>强调<span style=\"color:#FA0000\">强大而稳定的中国符合区域利益</span></li> </ul> </ul>"},{"kind":"book","title":"置身事内","by":"user","titleHtml":"<p>置身事内</p>","html":"<p><span style=\"background:lime\">├── 中国政治经济体制概述</span></p> <p><span style=\"background:yellow\">│      ├── 基本特征</span></p> <p>│   │      ├── <span style=\"color:#FA0000\">条块分割，多重领导：中央主要架构在省、市、县三级复制，地方部门同时接受上级部门和地方党委政府的双重领导，导致权力向上集中</span></p> <p>│   │      └── <span style=\"color:#FA0000\">官员任命与轮换：官员需学习贯彻统一意识形态，由上级任命，地方主官需多地轮换任职</span></p> <p><span style=\"background:yellow\">│      ├── 行政区划与事权划分</span></p> <p>│   │      ├── 影响因素：外部性、公共服务规模经济、人口密度、地理条件、语言文化差异</p> <p>│   │      ├── <span style=\"color:#FA0000\">行政区域大小应与政策影响范围一致，避免过度依赖上级协调</span></p> <p>│   │      └── 公共服务规模经济和边界决定中央和地方政府在事权划分上的差异</p> <p><span style=\"background:yellow\">│      └── 决策机制</span></p> <p>│       └── <span style=\"color:#FA0000\">尽量在能达成共识的最低层级上解决问题，减轻上级负担，提高决策效率</span></p> <p> </p> <p><span style=\"background:lime\">├── 地方政府在经济发展中的角色</span></p> <p><span style=\"background:yellow\">│      ├── 分税制与“土地财政”</span></p> <p>│   │      ├── 分税制改革后，地方政府财政压力加大，依靠“土地财政”获取资金</p> <p>│   │      ├── <span style=\"font-weight:700;color:#FA0000\">地方政府通过低价供应工业用地招商引资，限制商住用地供给，从地价中获利</span></p> <p>│   │      └── <span style=\"color:#FA0000\">“土地财政”实质是“房地产财政”，推动工业化和城市化，但也引发地方政府债务、资源配置效率等问题</span></p> <p><span style=\"background:yellow\">│      ├── 地方政府投融资模式与债务风险</span></p> <p>│   │      ├── <span style=\"color:#FA0000\">成立融资平台公司，以土地为抵押借款投资，推动经济扩张，但也积累大量债务</span></p> <p>│   │      ├── 债务风险不能只看整体，要关注局部风险</p> <p>│   │      └── <span style=\"color:#FA0000\">债务置换、融资平台转型、金融监管和官员问责等是化解措施</span></p> <p><span style=\"background:yellow\">│      ├── 地方政府行为与激励机制</span></p> <p>│   │      ├── 经济发展是地方官主要政绩，影响其声望和升迁;促进经济发展，但也导致过度投资、盲目追求GDP增长等问题</p> <p><span style=\"background:yellow\">│      ├── 招商引资</span></p> <p>│   │      └── <span style=\"color:#FA0000\">改革后，企业税收在所在地上缴，刺激地方政府招商引资</span></p> <p><span style=\"background:yellow\">│      ├── 基础设施建设</span></p> <p><span>│   │      └── </span><span style=\"font-weight:700;color:#FA0000\">怎样做：设立融资平台公司，以土地抵押、发行债券和政府隐性担保等方式融资</span></p> <p><span>│   │      └── </span><span style=\"color:#FA0000\">利弊：好处是推动经济增长、改善民生和提升城市形象</span>；坏处则是<span style=\"color:#FA0000\">带来地方政府债务风险、资源错配和腐败风险</span></p> <p><span style=\"background:yellow\">│      └── 产业政策与政府干预</span></p> <p><span>│       ├── 政府通过投资、补贴、税收优惠等支持产业发展</span><span style=\"color:#FA0000\">（比如京东方）</span>。</p> <p>│       └── 政府干预需根据具体情况分析，<span style=\"color:#FA0000\">成功的干预需要足够的能力和资源，并避免形成寻租的利益集团和低效的垄断</span></p> <p> </p> <p><span style=\"background:lime\">├── 中国经济发展面临的挑战与未来方向</span></p> <p><span style=\"background:yellow\">│      ├── 城市化转型与收入差距</span></p> <p>│   │      ├── 城市化需转型，<span style=\"color:#FA0000\">以人为本，提供住房、教育、医疗等公共资源</span></p> <p>│   │      └── 解决城乡差距和地区差距的关键是<span style=\"color:#FA0000\">劳动力自由流动，建设用地指标跟着人口流动，改革户籍制度</span></p> <p><span style=\"background:yellow\">│      ├── 经济发展模式的反思与未来展望</span></p> <p>│   │      ├── 中国经济发展的成功在于找到一套适合国情的资源组织和动员方式</p> <p>│   │      └── <span style=\"font-weight:700;color:#FA0000\">需从“生产型政府”向“服务型政府”转型，更注重民生和社会服务，提高资源配置效率，缩小贫富差距，实现可持续发展</span></p> <p><span style=\"background:yellow\">│      ├── 如何平衡经济发展与社会公平</span></p> <p>│   │      ├── <span style=\"color:#FA0000\">以人为本的发展模式，加大民生投入</span></p> <p>│   │      ├── 深化要素市场改革，促进要素自由流动</p> <p>│   │      ├── 调整财政体制，加大民生投入</p> <p>│   │      ├── <span style=\"color:#FA0000\">完善官员激励机制，注重长期可持续发展</span></p> <p>│   │      └── <span style=\"color:#FA0000\">加强政府自身建设，提高治理能力</span></p> <p><span style=\"background:yellow\">│      └── 中国经济发展模式的优势与劣势及未来调整</span></p> <p>│       ├── 优势：高速度经济增长、强大的资源动员能力、规模经济效应、渐进式改革</p> <p>│       ├── 劣势：过度依赖投资、地方政府债务风险、公共服务供给不足、收入差距扩大、环境污染</p> <p>│       └── <span style=\"color:#FA0000\">未来调整：转变经济增长方式、化解地方政府债务风险、加强公共服务供给、缩小收入差距、加强环境保护</span></p>"},{"kind":"book","title":"寻路中国","by":"claude","bookId":"b-035","titleHtml":"<p><span style=\"font-weight:700\">寻路中国</span></p>","html":"<p>美国记者自驾穿越中国（长城沿线、农村、浙江工业城），用外部视角观察<span style=\"color:#FA0000;font-weight:700\">改革开放中普通人的生活逻辑</span>。</p><p><span style=\"background:lime\">├── 社会潜规则</span></p><p>1. <span style=\"font-weight:700\">先斩后奏</span>：很多事要靠打制度擦边球，<span style=\"color:#FA0000;font-weight:700\">事后原谅比事前许可要简单得多</span>——理解中国式变通的一把钥匙，也是更普适的策略思维。</p><p>2. <span style=\"font-weight:700\">香烟是社交货币</span>：烟的档次对应身份高低与关系亲疏；政府对烟草财政的依赖，也让公共健康宣传让位于财政与政治利益。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 反问：如果抗疫纯粹为了民众健康，为何不同样力度宣传吸烟的危害？</span></p><p>3. <span style=\"font-weight:700\">“老实”是最高褒奖</span>：孩子被表扬时父母一定不欣然接受（满招损）。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 背后是谦逊与中庸之道，也掺杂着不够自信和一定程度的示敌以弱</span></p><p><span style=\"background:lime\">├── 经济发展模式</span></p><p>4. <span style=\"font-weight:700\">先建设施，再招商</span>：经济特区先粗略修好基础设施、把地便宜卖给做生意的人，<span style=\"color:#FA0000\">商店、手机店、诊所随之自然出现</span>——先搭骨架后长血肉；温州模式则是低投入低质量低盈利的沿海制造业起家路径。</p><p>5. <span style=\"font-weight:700\">物质充裕，精神空虚</span>：<span style=\"color:#7030A0\">魏子淇的农家乐做大后</span>，压力和空虚感反而更大；有人靠宗教、子女、邻里填补精神支点。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 改革开放后的普遍状态：钱多了、挣钱动力强了，但更浮躁焦虑</span></p><p><span style=\"background:lime\">└── 体制与个人</span></p><p>6. <span style=\"font-weight:700\">回避认错的三种手法</span>：<span style=\"color:#FA0000\">模糊评价过去、用新概念覆盖旧问题、制造新焦点转移注意力</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 延续至今：对大跃进、文革的评价含糊；抗疫转向包装成“稳经济大盘”；国内矛盾被转移为民族情绪</span></p><p>7. <span style=\"font-weight:700\">维权困境</span>：抗议多针对与个人利益直接相关的争端（如房子面积少算），而非系统性问题，<span style=\"color:#FA0000\">给了当权者各个击破的机会</span>——法律意识缺乏与个人功利主义交织。</p><p>8. <span style=\"font-weight:700\">被动中的意义</span>：书中觉得农村老人照顾孙辈是“奉命”的负担。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 我不同意：对老人而言这也许恰恰是感知人生意义的事——外部视角的“被动”不等于当事人体验里的“牺牲”</span></p>"},{"kind":"l2","title":"历史","by":"user"},{"kind":"book","title":"万历十五年 : 经典版","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/25893465/\" target=\"_blank\" rel=\"noopener\">万历十五年 : 经典版</a></p>","html":"<p>1. 治国理念：</p> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">明朝靠的是礼仪与道德治国而非法制</span>，于是鼓励孝顺勤勉，用文采选拔官员，文官掌权军商被压，官员也用道德名义制衡皇权；</p> <p style=\"margin-left:2.45em\">法律制度也以四书中的道德标准做善恶，而非法律文件，因为司法从属于行政；(也无从谈西方所谓的科学）</p> <p style=\"margin-left:2.45em;color:#FA0000\">根源还是帝国宗旨是黎明不饥不寒下的长治久安 </p> <p>2. 万历皇帝的怠惰，</p> <p style=\"margin-left:2.45em\">一是张居正人设的崩塌让他无法再信任人，</p> <p style=\"margin-left:2.45em\">二便是看透文官体系的真相，有人借道德束缚皇权，有人借道德争名利 </p> <p>3. 海瑞本质上还是“志大才疏”，事无巨细，极致廉洁，<span style=\"color:#FA0000\">却不明白今日剥削背后是整个政治制度的低效和无科学的法律与财政系统 </span></p> <p>4. 张居正优点是极致的sharp,缺点却是过于铁面无私与苛求，+ <span style=\"color:#FA0000\">忽略了文官的阳面，即对圣贤“仁爱”的盲目崇拜，采取与之相悖的行政，</span><span style=\"color:#FA0000\">+ </span><span style=\"color:#FA0000\">忽略了现实的中央行政效率，设置了超出能力的目标</span></p>"},{"kind":"book","title":"芯片战争","by":"user","titleHtml":"<p>芯片战争</p>","html":"<p>最有感触的点：</p> <p>—危险也是机遇，英特尔的CPU就是不破不立的证明</p> <p>—<span style=\"color:#FA0000\"> 越是大的公司，越难转向</span>，如90年代的英特尔错过ARM和GPU的风口</p> <p>—台积电foundary模式成功不是偶然，它既可以避免三星英特尔既代工又自己卖产品造成的专利担忧，又可以因为大产量来用更低成本打磨工艺，做出规模效应</p> <p>—一个公司的成功， <span style=\"color:#FA0000\">政府的支持提供的充足资金+好的全球贸易环境+核心的技术+强硬的且有远见的管理团队，</span>缺一不可</p> <p> </p> <p>其他观点：</p> <p> 1. <span style=\"color:#FA0000\">今日很多高科技无法再用堆积资源的方法获得</span>，像过去造原子弹一般；因为今日技术需要高水平人才+ 没有参照的创意（原子弹已经有了别国清晰的成功经验）+全球超多行业参与的产业链+做成后还要有持续的盈利性，自给自足。</p> <p>2. 创新并不适合让政府主导。因为政府天性求稳，与创新思维冲突；美国日本芯片的成功，恰恰是政府不会刻意扶植某一个公司（虽然有政策鼓励）。</p> <p>3.<span style=\"color:#FA0000\">今日很难再追求百分百的独立自主</span>。全球化的今天很难所有技术自主，更优解是让自己变得值得依赖，你卡我我就卡你，比如中国庞大的消费市场，中国的供应链，廉价的中国制造。</p> <p>4.中美关系现在的破局点，本手是低端制程做起+<span style=\"color:#FA0000\">让民营企业有安全感敢创新+培养有创新精神的人才+进一步改革开放让世界以来中国</span>；妙手是之后全球芯片危机时获得重要技术，或是占领重要市场；同时避免低效的大基金使用</p>"},{"kind":"book","title":"人类简史","by":"user","titleHtml":"<p>人类简史</p>","html":"<p>1.10万年前认知革命智人崛起：基因突变，产生新的思考与语言；<span style=\"color:#FA0000\">可以构建想象的故事；从基因演化到文化演化</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 想象的故事，比如宗教，比如现代商业公司，比如民主体制</p> <p>2.1万年前农业革命：驯化动植物；人口大量繁殖，<span style=\"color:#FA0000\">孕育出社会阶级结构</span>（靠想象构建的秩序，规定不同人合作的规范）；因为秩序过于复杂，<span style=\"color:#FA0000\">文字被发明</span>。</p> <p>-人类文化统一的三大力量：经济上<span style=\"color:#FA0000\">金钱秩序</span>（背后是信任系统），政治上<span style=\"color:#FA0000\">帝国秩序</span>（可统治多民族且可无限扩张），全球性<span style=\"color:#FA0000\">宗教</span>（认为世界存在超人类秩序）</p> <p>3.1800年科学与工业革命：本质是能源转换的革命，让农业工业化；<span style=\"color:#FA0000\">家庭与社群被国家和市场代替</span>；出现在欧洲因其现代科学理念+资本主义体系+好奇心</p> <p>-现代科学特点是<span style=\"color:#FA0000\">人类承认自己无知</span><span style=\"color:#FA0000\">+</span><span style=\"color:#FA0000\">以观察与数学为核心</span><span style=\"color:#FA0000\">+</span><span style=\"color:#FA0000\">渴望把理论转化为具体的科技</span></p> <p>-资本主义核心是<span style=\"color:#FA0000\">假设生产利润会再投资</span>，于是资本的获利也会让社会所有人生活水平提高</p> <p>4.快乐不仅是家庭财富健康的<span style=\"color:#FA0000\">实际好过期望产生的主观快乐感</span>，也不仅是<span style=\"color:#FA0000\">做到了社会文化定义的有意义的生活</span>，如育儿，还有了解主观感受只是一瞬间这一事实，<span style=\"color:#FA0000\">积极解万物规律却不纠结得失，于是心灵平静而自在的状态。</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 主观感受是一瞬间，于是此刻得到了会恐惧失去，没得到时会焦虑渴望获得</p>"},{"kind":"book","title":"中国历代政治得失","by":"user","titleHtml":"<p>中国历代政治得失</p>","html":"<p><span style=\"font-weight:700\">-</span><span style=\"font-weight:700;color:#FA0000\">制度必须与人事相配合</span>: <span style=\"font-weight:700\">任何制度的设计和实施都必须考虑到当时的人文环境、社会结构以及人的能动性，否则制度就会变成空壳，无法发挥效用</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">府兵制</span>: 唐代的府兵制在初期取得了巨大成功，士兵平时务农，战时应召，减轻了政府负担，提高了军队战斗力。 <span style=\"font-weight:700;color:#FA0000\">但后期由于疏于管理，士兵沦为苦工，地位低下，导致府兵制逐渐败坏</span>。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">科举制</span>: 科举制在唐代走向成熟，打破了世袭制，为政府选拔了大量人才。 但是，宋代以后，<span style=\"font-weight:700;color:#FA0000\">科举制逐渐僵化，考试内容脱离实际，成为束缚人们思想的工具。 清代的科举制甚至沦为愚民政策</span></p> <p><span style=\"font-weight:700\">-</span><span style=\"font-weight:700;color:#FA0000\">制度得失的评判标准</span><span style=\"color:#FA0000\">:</span> 评价制度的优劣不能脱离具体的时代背景，而应<span style=\"font-weight:700\">根据其在当时产生的实际影响进行判断</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">言论开放与政治控制</span>: 明代鼓励言论公开，但这种开放性在国家危急时刻，容易导致决策混乱。 清代则实行严格的政治控制，限制言论、结社和出版自由。 <span style=\"color:#FA0000\">这两种制度各有优劣，明代的开放性有利于社会活力，但不利于危机应对；清代的控制有利于维护稳定，但也容易导致社会僵化。</span> 因此，评价制度的优劣不能脱离具体的时代背景。</p> <p><span style=\"font-weight:700\">-满清政权的特殊性</span>: 满清政权作为外来政权，<span style=\"font-weight:700\">其统治策略是\"存心压迫中国知识分子，而讨好下层民众，来分解中国社会之抵抗力\"。</span><span style=\"color:#FA0000\">这种统治策略只是法术，不能说它是制度，</span>导致了\"政治上的奴性、平庸、敷衍、腐败、没精神\"，最终走向了衰亡。</p> <p><span style=\"font-weight:700\">-中国政治体系：</span>中国传统政治并非简单的君主专制，而是一种<span style=\"color:#FA0000\">以皇权为中心的、士人参与的、注重文治的政治体系。</span></p> <p><span style=\"font-weight:700\">-革命与变法的选择</span>: 康有为没有看到满清政权的本质是部族政权，而章太炎则忽视了制度的重要性。孙中山先生则将两者结合起来，主张\"革命之后还得要变法\"。</p> <p>-<span style=\"font-weight:700\">从家天下到汉代官僚政府的转变，君权与相权的消长（汉唐与宋明），选官制度的演变</span></p> <p>（崇尚文治的政府），赋税制度演变（汉最轻），兵役制度演变（汉唐宋，征兵府兵募兵）</p>"},{"kind":"book","title":"智变时代","by":"user","titleHtml":"<p>智变时代</p>","html":"<p><span style=\"background:lime\">├── AI本质与核心驱动</span></p> <p><span style=\"color:#FA0000\">│ ├── AI是新工业革命的核心（发电机生成Token），</span><span style=\"text-decoration:underline;color:#FA0000\">Transformer是其动力引擎（类似内燃机）</span><span style=\"text-decoration:underline;color:#FA0000\">;</span><span style=\"text-decoration:underline;color:#FA0000\">机器智能将成为普惠各行业的通用“能源”</span>，通过互联网海量数据训练，压缩成对人类世界的理解</p> <p><span style=\"background:lime\">├── AI发展趋势与挑战</span></p> <p>│ ├── 模型竞争与演进：<span style=\"text-decoration:underline;color:#FA0000\">巨头（谷歌/Meta）用户基础是优势，Nvidia是GPU赢家</span><span style=\"text-decoration:underline\">，</span><span style=\"text-decoration:underline;color:#FA0000\">模型小型化（设备端运行）是重要需求</span>（如Apple希望iOS变aiOS），苏茨克维坚信算力加数据能“大力出奇迹”</p> <p>│ ├── 算力与能源瓶颈<span style=\"color:#FA0000\">：未来数据中心将以算力为主，</span><span style=\"text-decoration:underline;color:#FA0000\">电力供应是AI发展最大瓶颈，需投资核聚变等解决</span></p> <p>│ ├── 市场与监管：<span style=\"color:#FA0000\">AI处于指数增长初期</span><span style=\"text-decoration:underline;color:#FA0000\">（股市市值第一公司预示变革）</span></p> <p><span style=\"background:lime\">├── AI对世界的理解与交互</span></p> <p>│ ├── <span style=\"text-decoration:underline;color:#FA0000\">多模态理解：仅靠语言理解世界不够，智能需多模态（如亲眼看到“红色”比语言描述直观）</span><span style=\"color:#FA0000\">，模型通过端到端神经网络混合训练视觉、语音、文本数据</span><span style=\"color:#FA0000\">;</span><span style=\"text-decoration:underline;color:#FA0000\">苏茨克维信念“高效压缩信息即知识”</span></p> <p>│ └── 算力分布与思维模式：<span style=\"color:#FA0000\">结合人类系统1（快、直觉）/系统2（慢、控制、逻辑）思维模式，</span><span style=\"text-decoration:underline;color:#FA0000\">通过云端与边缘终端模型配合实现快慢思考</span></p> <p><span style=\"background:lime\">├── AI对经济与社会的深远影响</span></p> <p>│ ├── 商业模式重塑：<span style=\"text-decoration:underline;color:#FA0000\">基础模型是智能时代操作系统，</span>需构建原生应用，<span style=\"color:#FA0000\">市场核心竞争力转向用户，传统软件/服务公司（如Adobe）整合基础模型有优势</span>，科技公司将以“服务即软件”形式出现</p> <p>│ ├── 劳动力市场影响：<span style=\"color:#FA0000\">AI强制逆转SaaS（服务即软件），</span><span style=\"text-decoration:underline;color:#FA0000\">软件内置劳动力，减少部分人类工作机会，但创造新型软件和新工作，人类工作者将转变为自动化系统管理者</span>（提高效率创造更多就业）</p> <p>│ ├── 经济增长动力：<span style=\"color:#FA0000\">经济增长源于企业家创新（创造供给端需求）</span>，高级智能成本趋近于零将推动市场巨变</p> <p><span style=\"background:lime\">├── 人类与AI的协同进化</span></p> <p>│ ├── 应对挑战：不使用AI自动化重复任务者将被淘汰，<span style=\"text-decoration:underline;color:#FA0000\">需提升高层次学习和抽象能力</span></p> <p>│ ├── 学习加速<span style=\"color:#FA0000\">：</span><span style=\"text-decoration:underline;color:#FA0000\">AI能显著加快学习速度（契合查理芒格说的学科最重要知识是那百分之五），帮助人类高效回放知识，并以个性化方式呈现</span></p> <p>│ ├── 认知提升<span style=\"color:#FA0000\">：通过LLM加速认知，实现生物大脑与机器智能协同进化，</span><span style=\"text-decoration:underline;color:#FA0000\">将更多时间用于高阶思维锻炼（计划、评估、决策、抽象、创造）</span>，培养高理解水平直觉</p> <p>│ ├── 关键能力<span style=\"color:#FA0000\">：</span><span style=\"text-decoration:underline;color:#FA0000\">未来教育重点在于学会提问、批判性思维和好奇心，培养广泛深入思考和结构化思维</span></p> <p>│ ├── 人类价值：<span style=\"text-decoration:underline;color:#FA0000\">廉价AI普及后，人类连接和存在感更显重要，内在能力提升及情绪管理/沟通能强化社会连接效率</span>，人类服务将更昂贵</p> <p><span style=\"background:lime\">└── AI的未来展望与思考</span></p> <p>├── <span style=\"color:#FA0000\">AGI定义：</span><span style=\"text-decoration:underline;color:#FA0000\">关注能力而非过程，不需像人类思考理解或具备意识感知</span></p>"},{"kind":"l2","title":"哲学","by":"user"},{"kind":"l2","title":"生活与健康","by":"user"},{"kind":"book","title":"医生的精进 : 从仁心仁术到追求卓越","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/26578141/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">医生的精进</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 从仁心仁术到追求卓越</span></a></p>","html":"<ul> <ul type=\"disc\"> <li>通过在医生护士内部<span style=\"color:#FA0000\">找典型做分享，来激励更多人学习BKM，改变习惯；</span>就像我们做TM engagement/OOC review一般。 </li> <li>不厌其烦的录入每个病人的数据，然后总结，<span style=\"color:#FA0000\">data driven推出细致的改进方式来提高医疗有效性</span>。就像我们跑SWR，做engineer一般。 </li> <li>在面对医治的不可预料性时，确定不要被自尊所累，<span style=\"color:#FA0000\">勇敢尝试，但也勇敢放弃治疗</span>。就像我们在做决策时的思路一般。 </li> <li>救治水平，往往就体现在对99和99.5%的治愈率的区别。就像我们在做yield,p<span style=\"color:#FA0000\">assion for excellence</span>的概念一般。 </li> <li>医生也是需要tenacity, passion for excellence, innovation, attention to details; </li> </ul> <p> </p> <ul type=\"disc\"> <li>即兴发问，不要抱怨，<span style=\"color:#FA0000\">勤于统计，勇于求变，</span>从good到excellent的必经之路。</li> </ul> </ul>"},{"kind":"book","title":"医生的修炼 : 在不完美中探索行医的真相","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/26579966/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">医生的修炼</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 在不完美中探索行医的真相</span></a></p>","html":"<p>最难得的，还是<span style=\"color:#FA0000\">作者深刻的自省精神</span>，观察周遭，反省自身，对医生职业和个人，病症的思考，还有医疗体系的反思，都是很高的境界；</p> <p>也更觉得医生和我们工程师也并无质的区别，也需要踏实勤奋，熟能生巧，<span style=\"color:#FA0000\">也需要类似的excursion review</span>,在不能避免的错误中总结教训，尽心尽力而为</p>"},{"kind":"book","title":"最好的告别 : 关于衰老与死亡，你必须知道的常识","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/26576861/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">最好的告别</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 关于衰老与死亡，你必须知道的常识</span></a></p>","html":"<ul> <ul type=\"disc\"> <li>对一个老年人来说是不是在一个<span style=\"color:#FA0000\">更</span><span style=\"color:#FA0000\">注重</span><span style=\"color:#FA0000\">个人隐私，</span>而不是一个集中管理的养老院更能让他们感觉到尊严；</li> <li>让他们适当<span style=\"color:#FA0000\">尝试风险比如带动物，多运动，自己独立上厕所</span>，会比把他们照顾的事无巨细更好；</li> </ul> <ul type=\"disc\"> <li style=\"color:#FA0000\"><span style=\"color:#FA0000\">在病重时选择止痛药而让病人清醒的享受最后与家人共度的时光</span>，而不是强行用无情的医学与无尽的插管治疗，更能赋予病人意义？</li> </ul> <ul type=\"disc\"> <li>都是全新的思路，全让我重新考虑到底怎样才是一个体面的老年生活。</li> </ul> </ul>"},{"kind":"book","title":"众病之王 : 癌症传","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/20507206/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">众病之王</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 癌症传</span></a></p>","html":"<p>从公元前2500年的“没有治疗办法”，到公元前500年“原始肿瘤切除术”，到20世纪初的放疗，70年代的手术再辅以化疗，<span style=\"color:#FA0000\">80年代的激素与靶向治疗，90年代基因测序再辅以靶向疗法</span>，再到50年后可能的癌症全基因组序列+灵活靶向药，这之中有<span style=\"color:#FA0000\">科学演练的逻辑之美，有医学家誓与天斗的勇气坚持</span>，最感触的还是<span style=\"color:#FA0000\">普通人在未知苦难前的渺小与倔强，还是要心怀敬畏，知足喜乐</span>为贵🙏</p>"},{"kind":"book","title":"你是你吃出来的 : 吃对少生病，病了这样吃","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/27590675/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">你是你吃出来的</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 吃对少生病，病了这样吃</span></a></p>","html":"<p>精华浓缩： </p> <ul type=\"disc\"> <li style=\"color:#FA0000\">用粗粮薯类玉米土豆还有水果来代替精米精面补充碳水，</li> <li style=\"color:#FA0000\">多吃肉蛋奶来补充动物蛋白与脂肪，</li> </ul> <ul type=\"disc\"> <li>肝脏还有鸡蛋牛奶是补充维生素ABD的关键食物，</li> <li>吃红肉血制品补铁补血，</li> <li>吃内脏牛猪羊肉补锌；</li> <li>碳水蛋白质脂肪每天应是55 15 35的比例，碳水每天150g谷薯140g米面，蛋白质39g动物蛋白（1个鸡蛋，300ML牛奶，150g红肉），39g植物蛋白，35g动物油35g植物油，膳食纤维通过500g蔬菜350g水果。</li> </ul>"},{"kind":"l2","title":"育儿","by":"user"},{"kind":"book","title":"真希望我父母读过这本书 : 你的孩子也会庆幸你读过","by":"user","titleHtml":"<p>真希望我父母读过这本书 : 你的孩子也会庆幸你读过</p>","html":"<p>1.与宝宝沟通的方式：</p> <p style=\"margin-left:2.45em\">1）花时间<span style=\"color:#FA0000\">理解宝宝的感受或行为，无论是否同意都不急于否定</span>，及时回应并<span style=\"color:#FA0000\">尽量安抚，表达共情 </span></p> <p style=\"margin-left:2.45em\">2）在宝宝不能清晰表达时<span style=\"color:#FA0000\">帮助她表达</span>，得到她的答复 </p> <p>2.与孩子相处的方式：</p> <p style=\"margin-left:2.45em\">1）<span style=\"color:#FA0000\">把孩子作为平等的人相处而不是任务</span></p> <p style=\"margin-left:2.45em\">2）通过<span style=\"color:#FA0000\">界定自己而不是孩子的方式与孩子设定边界</span></p> <p style=\"margin-left:2.45em\">3）从舒适线开始按宝宝的步调训练分离</p> <p style=\"margin-left:2.45em\">4）不以激励或惩罚操纵，应该建立信任再以身作则</p> <p>3.其他成人共通的相处方式： </p> <p style=\"margin-left:2.45em\">1） 不打事实网球（本质就是<span style=\"font-weight:700;color:#FA0000\">用所谓事实去拒绝理解或解决问题</span>），应该<span style=\"color:#FA0000\">以“我”来分享自己的感受</span>，而不是用“事实”攻击对方；<span style=\"color:#FA0000\">以追求理解而不是获胜为目的 </span></p> <p style=\"margin-left:2.45em\">2）不要转移话题回避冲突，也<span style=\"color:#FA0000\">不要有“牺牲自己的受害者心态” </span></p> <p style=\"margin-left:2.45em\">3）<span style=\"color:#FA0000\">不要judge或定义对方意图 </span></p> <p style=\"margin-left:2.45em\">4）多花时间反思，不急着做反应  </p> <p>4.<span style=\"color:#FA0000\">父母思维转变：拥抱改变而不是试图找回过去</span></p>"},{"kind":"book","title":"第一次做奶爸","by":"user","titleHtml":"<p>第一次做奶爸</p>","html":"<p>1.孩子很多时候的犯错，<span style=\"color:#FA0000\">其实是在表达自己探索边界</span></p> <p>2.对小孩一定要诚实守信，<span style=\"color:#FA0000\">不可以言行不一</span></p> <p>3.管教孩子需要耐心，<span style=\"color:#FA0000\">需要你重复同样的话到你自己都心烦</span>。</p> <p>4.<span style=\"color:#FA0000\">与孩子需要平等与爱的沟通</span>，你需要给孩子解释为什么你不希望她做某事，或鼓励她表达。</p> <p>5.要让孩子严肃听话时，不是靠嗓门而是<span style=\"color:#FA0000\">要靠严肃的“语气”</span></p> <p>6.动之以情比晓之以理更有效，不是去解释这种做法有什么问题，而是与孩子交心告诉她“她的行为让你很难过”。</p> <p>7.<span style=\"color:#FA0000\">你和妻子的互动会对宝宝产生深远影响</span>，避免在她面前的争吵甚至暴力；宝宝会慢慢有父母性格的影子</p> <p>8.对于父亲，对孩子无尽的爱与恐惧都是正常的。</p> <p>9.家庭与工作的平衡很难，但是<span style=\"color:#FA0000\">“陪伴孩子而要错过一场会议”真的无所谓。</span></p> <p>10.如果你最爱的宝宝看似不在乎你不要不平衡，可能几天后她又会把妈妈甩在一边而粘着你</p>"},{"kind":"l1","title":"小说与文学","by":"claude"},{"kind":"l2","title":"小说","by":"claude"},{"kind":"book","title":"悉达多","by":"claude","bookId":"b-010","titleHtml":"<p><span style=\"font-weight:700\">悉达多</span></p>","html":"<p>一个“<span style=\"font-weight:700\">出世—入世—再出世</span>”的故事：苦修 → 质疑佛陀教义 → 拜自己为师走入尘世（情欲、贪欲、惰性）→ 绝望求死 → 在河边顿悟返璞归真。</p><p>1. <span style=\"font-weight:700\">智慧无法传授</span>：<span style=\"color:#FA0000;font-weight:700\">知识可以分享，智慧无法分享</span>；它只能被发现、被体验。意义就是事物本身，不藏在事物背后，<span style=\"color:#FA0000\">只能靠个人体验+反思自省获得</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 我做读书笔记，也不是在“学别人的智慧”，而是把悉达多的经历和自己的感悟结合，形成专属于自己的智慧</span></p><p>2. <span style=\"font-weight:700\">唯有当下</span>：向河水学习——河水<span style=\"color:#FA0000\">只有当下，没有过去也没有未来</span>；<span style=\"color:#FA0000;font-weight:700\">时间的每一瞬间皆为圆满</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 呼应《当下的力量》《遇见未知的自己》；人生不会有提前定义在终点的意义，把这一刻过出意义，意义就已出现</span></p><p>3. <span style=\"font-weight:700\">圆融的倾听</span>：晚年少了“傲慢与聪明”，多了真诚共情——在世人为简单甚至愚蠢的欲望受难时，<span style=\"color:#FA0000\">依然看到他们的可爱可敬，看到生命本身</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 表面倾听只需要“耐心”，真正的大爱需要感同身受、甚至从中发现美感；我的共情还远远没到那种境界</span></p><p>4. <span style=\"font-weight:700\">放手</span>：悉达多第一次真正去爱儿子，却用包容把他束缚——“<span style=\"color:#7030A0\">难道你没有用爱束缚他？</span>”儿子出走后才顿悟：<span style=\"color:#FA0000;font-weight:700\">人只能独自行过生命，父母最难也最必要的是放手</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 很多父母“以爱之名，其实想实现的是自己的心愿”；希望把“经历失败、经历错误从来不是坏事”带给柔柔</span></p>"},{"kind":"book","title":"使女的故事","by":"claude","bookId":"b-025","titleHtml":"<p><span style=\"font-weight:700\">使女的故事</span></p>","html":"<p>反乌托邦小说：基列共和国把女性物化为“生育工具”。核心是看清<span style=\"color:#FA0000;font-weight:700\">极权如何一步步建成，又如何让人从被迫服从走到真心认同</span>。</p><p>1. <span style=\"font-weight:700\">温水煮青蛙</span>：<span style=\"color:#7030A0\">先剥夺女性财产权 → 军管宵禁 → 控制生育与媒体 → 最后立法固化</span>，每一步都以社会能接受的方式蚕食自由，<span style=\"color:#FA0000\">整个社会在不知不觉中被重塑</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 这正是高效组织动员能力（如封城、反腐）的危险面：一旦缺乏制衡、上层昏庸或恶意，就没有机制及时纠偏</span></p><p>2. <span style=\"font-weight:700\">洗脑规训</span>：灌输“生育是为国牺牲”的宏大叙事 + 监视 + 软硬兼施，直到个体<span style=\"color:#FA0000\">真心相信不服从是可耻的</span>——强制演变成自我审查式的认同。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 和文革“上山下乡是一代人的牺牲”式动员如出一辙</span></p><p>3. <span style=\"font-weight:700\">言论管控</span>：只允许官方叙事存在，是所有此类体制维系统治的共同杠杆。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 对照朝鲜处决持有境外光碟者、“官方军队永远胜利”式宣传——虚构的极端情节在现实中都能找到对应，细思极恐</span></p><p>4. <span style=\"font-weight:700\">制度性恶</span>：上层把使女当生育玩物、医生借机满足私欲、正房太太暗害使女——<span style=\"color:#FA0000\">评价一个体系不能只看它宣称的宗旨，还要看它实际催生了什么行为</span>。</p><p>5. <span style=\"font-weight:700\">权利底线</span>：<span style=\"color:#FA0000;font-weight:700\">如果个人的基本权利都无法保证，无论何种体制，都是不能被接受的</span>。制度好不好，不能只看效率产出，还要看是否践踏了具体个体的尊严。</p>"},{"kind":"l1","title":"技能教学","by":"user"},{"kind":"l2","title":"设计教学","by":"user"},{"kind":"book","title":"写给大家看的设计书 : 实例与创意","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/4837333/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">写给大家看的设计书</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 实例与创意</span></a></p>","html":"<p>1.亲密--</p> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">相关项分组放在一起，</span>不相关项通过留白隔开； </p> <p>2.对齐--</p> <p style=\"margin-left:2.45em;color:#FA0000\">页面上任何元素都应当与某个内容存在视觉联系，对齐向某条线；</p> <p style=\"margin-left:2.45em\">避免居中对齐；</p> <p style=\"margin-left:2.45em\">避免一个页面混合多种对齐方式 </p> <p>3.重复--</p> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">某些设计的元素要在整个作品中反复出现</span>（线条，符号，形状，空间关系，颜色），以此统一设计并保持联系；</p> <p style=\"margin-left:2.45em\">可以把一个元素从现有设计中抽取出来，并据此做新的设计 </p> <p>4.对比--</p> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">如果两个元素不完全相同，就要用对比让它截然不同，</span>这样才能建立层次；</p> <p style=\"margin-left:2.45em\">可以用字体大小，颜色，线条粗细，old style vs sans serif字体等创造对比；</p> <p style=\"margin-left:2.45em;color:#FA0000\">用对比强调页面最重要元素； </p> <p style=\"margin-left:2.45em\">大量留白且有条理的留白可以让作品脱颖而出；</p> <p>5.先从模仿一些你喜欢的布局开始学习； </p>"},{"kind":"l2","title":"计算机教学","by":"user"}]}</script>

  var ALLOWED_TAGS = {MARK:1, SPAN:1, B:1, STRONG:1, I:1, EM:1, BR:1};
  function filterStyle(style){
    var out = [];
    style.split(';').forEach(function(rule){
      var parts = rule.split(':');
      if(parts.length !== 2) return;
      var prop = parts[0].trim().toLowerCase();
      var val = parts[1].trim();
      if((prop === 'color' || prop === 'background-color') && /^[a-zA-Z0-9#(),.% ]+$/.test(val)){
        out.push(prop + ':' + val);
      }
    });
    return out.join(';');
  }
  function sanitizeNode(node){
    var child = node.firstChild;
    while(child){
      var next = child.nextSibling;
      if(child.nodeType === 1){
        var tag = child.tagName;
        if(!ALLOWED_TAGS[tag]){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          child = next; continue;
        }
        var styleVal = child.getAttribute('style');
        Array.prototype.slice.call(child.attributes).forEach(function(a){ child.removeAttribute(a.name); });
        if((tag === 'SPAN' || tag === 'MARK') && styleVal){
          var cleaned = filterStyle(styleVal);
          if(cleaned) child.setAttribute('style', cleaned);
        }
        sanitizeNode(child);
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
      child = next;
    }
  }
  function sanitizeInline(html){
    var box = document.createElement('div');
    box.innerHTML = html;
    sanitizeNode(box);
    return box.innerHTML;
  }
  function commitEdit(el){

    var text = el.textContent || '';
    if(text.trim() === ''){

      el.innerHTML = esc(FALLBACK[key] || '');
    } else {
      overlay[key] = { html: sanitizeInline(el.innerHTML), text: text };
    }
    saveOverlay();
  }

  function principleMatchesSearch(p, q){
    if(matchText(effectiveText(p.id + '::title', p.title), q)) return true;
    if(matchText(effectiveText(p.id + '::keyword', p.keyword), q)) return true;
    if(matchText(effectiveText(p.id + '::core', p.core), q)) return true;
    if(matchText(effectiveText(p.id + '::action', p.action), q)) return true;
    var quotes = p.quotes || [];
    for(var i = 0; i < quotes.length; i++){ if(matchText(effectiveText(p.id + '::quote::' + i, quotes[i].text), q)) return true; }
    var cases = p.cases || [];
    for(var j = 0; j < cases.length; j++){ if(matchText(effectiveText(p.id + '::case::' + j, cases[j].text), q)) return true; }
    return false;
  }

  function truthMatchesSearch(t, q){
    if(matchText(effectiveText(t.id + '::title', t.title), q)) return true;
    if(matchText(effectiveText(t.id + '::keyword', t.keyword), q)) return true;
    if(matchText(effectiveText(t.id + '::core', t.core), q)) return true;
    var books = (t.books || []).map(bookById).filter(Boolean);
    for(var i=0;i<books.length;i++){ if(matchText(books[i].title.toLowerCase(), q)) return true; }
    var insights = t.insights || [];
    for(var j=0;j<insights.length;j++){ if(matchText((insights[j].title||'').toLowerCase(), q)) return true; }
    return false;
  }

  function libMatchesSearch(e, q){
    if(matchText(effectiveText(e.id + '::title', e.title), q)) return true;
    if(matchText(effectiveText(e.id + '::keyword', e.keyword), q)) return true;
    if(matchText(effectiveText(e.id + '::core', e.core), q)) return true;
    if(matchText(effectiveText(e.id + '::annotation', e.annotation), q)) return true;
    if(e.quote && matchText(e.quote.toLowerCase(), q)) return true;

    return false;
  }

  // ---------- shared: quadrant/subcat/cluster section renderer (used by both KB and Pyramid) ----------
  function sectionForSubcat(quad, sc, list, cardRenderer){
    var id = 'sc-' + quad.id + '-' + sc.id;
    var clusterDefs = (sc.clusters && sc.clusters.length) ? sc.clusters : [{id: null, name: null}];
    var byCluster = {};
    list.forEach(function(item){
      var cid = item.cluster || '_none';
      (byCluster[cid] = byCluster[cid] || []).push(item);
    });
    var groupsHTML = '';
    clusterDefs.forEach(function(cl){
      var items = byCluster[cl.id || '_none'] || [];
      if(!items.length) return;
      groupsHTML += (cl.name ? '<div class="cluster-h">' + esc(cl.name) + '</div>' : '') +
        '<div class="card-grid">' + items.map(cardRenderer).join('') + '</div>';
    });
    var assignedIds = {};
    clusterDefs.forEach(function(cl){ (byCluster[cl.id || '_none'] || []).forEach(function(item){ assignedIds[item.id] = true; }); });
    var orphans = list.filter(function(item){ return !assignedIds[item.id]; });
    if(orphans.length) groupsHTML += '<div class="card-grid">' + orphans.map(cardRenderer).join('') + '</div>';
    return '<section class="subcat-section" id="' + id + '">' +
      '<h3 class="subcat-h"><span class="sc-name">' + esc(sc.name) + '</span><span class="sc-count mono">' + list.length + ' 条</span></h3>' +
      groupsHTML +
      '</section>';
  }

  // ---------- render: life tab ----------
  // ---------- timeline: unified, color-coded merge of lifeRecords + every dated principle
  // quote/case (from TIMELINE_START onward) — "life" rows are plain diary flow, "insight" rows
  // are the same excerpts already curated into 思维库, tinted by which quadrant they belong to.
  function parseDateTuple(s){
    if(!s) return null;
    var m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(s);
    if(!m) return null;
    return [parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 1, m[3] ? parseInt(m[3], 10) : 1];
  }
  function dateTupleCompare(a, b){
    for(var i = 0; i < 3; i++){ if(a[i] !== b[i]) return a[i] - b[i]; }
    return 0;
  }
  var TL_CATEGORIES = [
    { id: 'life', label: '生活记录' },
    { id: 'health', label: '健康追踪' },
    { id: 'MAS', label: null }, { id: 'INW', label: null }, { id: 'DEO', label: null }, { id: 'LEG', label: null }
  ];
  function timelineItemCategory(it){
    return it.kind === 'insight' ? it.quadrant : it.kind;
  }
  function collectTimelineItems(){
    var items = [];
    (DATA.lifeRecords || []).forEach(function(rec, idx){
      items.push({ date: rec.date, kind: 'life', text: rec.text, context: rec.context,
        key: 'life::' + idx, ctxKey: 'life::' + idx + '::ctx' });
    });
    (DATA.healthLog || []).forEach(function(rec, idx){
      var key = 'health::' + idx;
      items.push({ date: rec.date, kind: 'health', text: rec.note, context: rec.context, member: rec.member,
        key: key, ctxKey: key + '::ctx' });
    });
    DATA.principles.forEach(function(p){
      // A quote and a case dated the same day are almost always the same diary moment seen
      // twice (verbatim excerpt + distilled reflection) — group same-principle/same-date
      // quotes+cases into one timeline card instead of two near-identical ones, so reading the
      // timeline doesn't mean re-reading the same day's insight back to back.
      var byDate = {};
      (p.quotes || []).forEach(function(qt, idx){
        var key = p.id + '::quote::' + idx;
        (byDate[qt.date] = byDate[qt.date] || []).push({ type: 'quote', text: qt.text, context: qt.context, key: key, ctxKey: key + '::ctx' });
      });
      (p.cases || []).forEach(function(c, idx){
        var key = p.id + '::case::' + idx;
        (byDate[c.date] = byDate[c.date] || []).push({ type: 'case', text: c.text, context: c.context, key: key, ctxKey: key + '::ctx' });
      });
      Object.keys(byDate).forEach(function(date){
        var parts = byDate[date].slice().sort(function(a, b){ return a.type === b.type ? 0 : (a.type === 'quote' ? -1 : 1); });
        items.push({ date: date, kind: 'insight', quadrant: p.quadrant, principleId: p.id, keyword: p.keyword, parts: parts });
      });
    });
    var cutoff = parseDateTuple(TIMELINE_START);
    return items.filter(function(it){
      var dt = parseDateTuple(it.date);
      return dt && cutoff && dateTupleCompare(dt, cutoff) >= 0;
    });
  }
  function timelineItemHTML(it){
    if(it.kind === 'insight'){
      var qColor = 'var(--quad-' + it.quadrant.toLowerCase() + ')';
      var partsHTML = it.parts.map(function(part){
        return '<div class="tl-part' + (part.type === 'quote' ? ' tl-part-quote' : '') + '">' +
          '<span class="editable" data-key="' + part.key + '">' + fieldHTML(part.key, part.text) + '</span>' +
          ctxToggleHTML(part.ctxKey, part.context) +
        '</div>';
      }).join('');
      return '<div class="life-item insight" style="border-left:3px solid ' + qColor + ';background:color-mix(in srgb, ' + qColor + ' 9%, var(--life-bg));">' +
        '<span class="ldate mono">' + esc(it.date || '') + '</span>' +
        '<div class="life-body">' +
          '<span class="chip-jump" data-jump-kb="' + it.principleId + '" style="margin-right:6px;">💡 ' + esc(it.keyword) + '</span>' +
          partsHTML +
        '</div></div>';
    }
    if(it.kind === 'health'){
      return '<div class="life-item insight" style="border-left:3px solid var(--health-accent);background:color-mix(in srgb, var(--health-accent) 9%, var(--life-bg));">' +
        '<span class="ldate mono">' + esc(it.date || '') + '</span>' +
        '<div class="life-body"><span class="life-member">🩺 ' + esc(it.member || '') + '</span>　<span class="editable" data-key="' + it.key + '">' + fieldHTML(it.key, it.text) + '</span>' +
        ctxToggleHTML(it.ctxKey, it.context) + '</div></div>';
    }
    return '<div class="life-item"><span class="ldate mono">' + esc(it.date || '') + '</span>' +
      '<div class="life-body"><span class="editable" data-key="' + it.key + '">' + fieldHTML(it.key, it.text) + '</span>' +
      ctxToggleHTML(it.ctxKey, it.context) + '</div></div>';
  }
  function renderTimelineLegend(){
    return '<div class="tl-legend">' + TL_CATEGORIES.map(function(c){
      var label = c.label || (DATA.quadrants.filter(function(q){ return q.id === c.id; })[0] || {}).name || c.id;
      return '<button class="tl-chip' + (state.timelineCategory === c.id ? ' active' : '') + '" data-tl-filter="' + c.id + '">' +

  function renderTimeline(){
    var q = state.search.toLowerCase();
    var items = collectTimelineItems();
    if(q) items = items.filter(function(it){
      if(it.parts) return it.parts.some(function(part){ return matchText(effectiveText(part.key, part.text), q); }) || (it.keyword && matchText(it.keyword.toLowerCase(), q));
      return matchText(effectiveText(it.key, it.text), q) || (it.member && matchText(it.member, q));
    });
    if(state.recentOnly){
      var eraStart = DATA.meta.primaryEraStart || 2022;
      items = items.filter(function(it){ var dt = parseDateTuple(it.date); return dt && dt[0] >= eraStart; });
    }
    if(state.timelineCategory) items = items.filter(function(it){ return timelineItemCategory(it) === state.timelineCategory; });
    items.sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });

    var legendHTML = renderTimelineLegend();
    if(!items.length){ main.innerHTML = legendHTML + '<div class="empty-hint">时间线还在陆续补充中，或没有匹配结果。</div>'; return; }
    var byYear = {};
    items.forEach(function(it){ var y = (it.date || '未知').slice(0, 4); (byYear[y] = byYear[y] || []).push(it); });
    var years = Object.keys(byYear).sort().reverse();
    var timelineHTML = '<div class="life-list">' + years.map(function(y){
      return '<div class="life-year">' + y + '</div>' + byYear[y].map(timelineItemHTML).join('');
    }).join('') + '</div>';
    main.innerHTML = legendHTML + timelineHTML;

  // ---------- render: graph tab (two modes: 思维库全景 comprehensive map, 金字塔主线 thread constellation) ----------
  function graphModeSwitchHTML(){
    return '<div class="controls" style="margin:0 0 12px;">' +
      '<button class="tab' + (state.graphMode==='library'?' active':'') + '" data-graph-mode="library" style="background:' + (state.graphMode==='library'?'var(--bg-elev)':'transparent') + '">思维库全景</button>' +
      '<button class="tab' + (state.graphMode==='thread'?' active':'') + '" data-graph-mode="thread" style="background:' + (state.graphMode==='thread'?'var(--bg-elev)':'transparent') + '">金字塔主线</button>' +
      '</div>';
  }
  function renderLibraryGraph(){
    var entries = BOOKS.library || [];
    if(!entries.length){ main.innerHTML = graphModeSwitchHTML() + '<div class="empty-hint">读书思维库还没有条目可视化。</div>'; return; }
    var quadOrder = ['MAS','INW','DEO','LEG'];
    var byQuad = {MAS:[],INW:[],DEO:[],LEG:[]};
    entries.forEach(function(e){ (byQuad[e.quadrant] = byQuad[e.quadrant] || []).push(e); });
    var W = 900, H = 900, cx = W/2, cy = H/2;
    var arcWidth = (Math.PI/2) * 0.82;
    var pos = {};
    quadOrder.forEach(function(qid, qi){
      var list = byQuad[qid] || [];
      var centerAngle = qi * (Math.PI/2) + Math.PI/4 - Math.PI/2; // start MAS at top, go clockwise
      var ringCount = Math.min(4, Math.max(1, Math.ceil(list.length / 14)));
      list.forEach(function(e, i){
        var ring = i % ringCount;
        var idxInRing = Math.floor(i / ringCount);
        var perRing = Math.ceil(list.length / ringCount);
        var a = (perRing > 1) ? (centerAngle - arcWidth/2 + (idxInRing/(perRing-1)) * arcWidth) : centerAngle;
        var r = 140 + ring * 85;
        pos[e.id] = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
      });
    });
    var edgesSvg = '';
    var drawnPairs = {};
    (BOOKS.crossLinks || []).forEach(function(xl){
      var m = xl.members;
      for(var i = 0; i < m.length; i++){
        for(var j = i + 1; j < m.length; j++){
          var a = m[i], b = m[j];
          if(!pos[a] || !pos[b]) continue;
          var key = a < b ? a + '|' + b : b + '|' + a;
          if(drawnPairs[key]) continue;
          drawnPairs[key] = true;
          var p1 = pos[a], p2 = pos[b];
          edgesSvg += '<line x1="' + p1.x.toFixed(1) + '" y1="' + p1.y.toFixed(1) + '" x2="' + p2.x.toFixed(1) + '" y2="' + p2.y.toFixed(1) + '" stroke="var(--ink-faint)" stroke-width="0.8" stroke-opacity="0.35"/>';
        }
      }
    });
    var nodesSvg = entries.map(function(e){
      var p = pos[e.id];
      if(!p) return '';
      var qColor = 'var(--quad-' + e.quadrant.toLowerCase() + ')';
      return '<g class="g-node" data-jump-library="' + e.id + '" transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')">' +
        '<title>' + esc(e.title) + '</title>' +
        '<circle r="4.5" fill="' + qColor + '"/>' +
        '</g>';
    }).join('');
    var quadLabelsSvg = quadOrder.map(function(qid, qi){
      var centerAngle = qi * (Math.PI/2) + Math.PI/4 - Math.PI/2;
      var lx = cx + (140 + 4*85 + 30) * Math.cos(centerAngle), ly = cy + (140 + 4*85 + 30) * Math.sin(centerAngle);
      var quad = BOOKS.quadrants.find(function(q){ return q.id === qid; });
      var qColor = 'var(--quad-' + qid.toLowerCase() + ')';
      return '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" fill="' + qColor + '" font-size="15" font-weight="700">' + esc(quad ? quad.name : qid) + '</text>';
    }).join('');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + edgesSvg + nodesSvg + quadLabelsSvg + '</svg>';
    main.innerHTML = graphModeSwitchHTML() + '<div class="graph-wrap">' + svg + '</div>' +
      '<div class="graph-hint">' + entries.length + ' 条读书思维库条目，按四象限分布；节点颜色=象限，连线=经过人工核实、写明"为什么"的跨书连接（悬停看标题，点击跳转到读书思维库对应卡片）。下面是这些连线对应的可读内容，每一组先给出共享的底层规律和成立的理由，再列出参与的条目，直接往下滑就能看，不用去点图上的点。</div>' +
      crossBookGroupsHTML();
  }

  // ---------- cross-book connection groups: editorial, not inferred ----------
  // BOOKS.crossLinks is the single source of truth for "which entries share a deeper
  // idea" — each entry is an explicit, hand-checked claim (law + why), never a bare
  // ID pair. A crossLink's `type` names what kind of connection it actually is, so a
  // real cross-domain structural analogy is never visually confused with "these two
  // just happen to sit in the same subcategory."
  var XL_TYPE_META = {
    isomorphism: { emoji: '🧬', label: '跨学科同构' },
    convergence: { emoji: '📚', label: '同源汇聚' },
    instance:    { emoji: '📎', label: '案例佐证' },
    chain:       { emoji: '⛓', label: '递进链条' },
    tension:     { emoji: '⚖️', label: '观点张力' },
    complement:  { emoji: '🧩', label: '互补策略' }
  };
  function libAdjacency(){
    if(BOOKS._xlAdj) return BOOKS._xlAdj;
    var adj = {};
    (BOOKS.crossLinks || []).forEach(function(xl){
      xl.members.forEach(function(id){ (adj[id] = adj[id] || []).push(xl); });
    });
    BOOKS._xlAdj = adj;
    return adj;
  }
  function groupMemberHTML(e){
    var b = bookById(e.book);
    return '<div class="group-member" data-id="' + e.id + '" data-jump-library="' + e.id + '">' +
      '<div class="group-member-head">' +
        '<span class="pc-kw">' + esc(e.keyword) + '</span>' +
        (b ? '<span class="pc-books">📖 ' + esc(b.title) + '</span>' : '') +
      '</div>' +
      '<div class="group-member-title">' + esc(e.title) + '</div>' +
      '<div class="group-member-core">' + esc(e.core) + '</div>' +
      (e.annotation ? '<div class="group-member-ann">🖊 ' + esc(e.annotation) + '</div>' : '') +
      '</div>';
  }
  function crossLinkCardHTML(xl){
    var members = xl.members.map(libById).filter(Boolean);
    var books = [];
    members.forEach(function(e){
      var b = bookById(e.book);
      if(b && books.indexOf(b.title) === -1) books.push(b.title);
    });
    var meta = XL_TYPE_META[xl.type] || { emoji: '🔗', label: xl.type };
    return '<div class="cross-group">' +
      '<div class="cross-group-head">' +
        '<span class="xl-type-badge xl-type-' + esc(xl.type) + '">' + meta.emoji + ' ' + esc(meta.label) + '</span>' +
        '<span class="cross-group-books">📚 ' + books.map(esc).join(' × ') + '</span>' +
      '</div>' +
      '<div class="xl-law">' + esc(xl.law) + '</div>' +
      '<div class="xl-why">' + esc(xl.why) + '</div>' +
      '<div class="xl-members-label">参与条目（' + members.length + '）</div>' +
      members.map(groupMemberHTML).join('') +
      '</div>';
  }
  function crossBookGroupsHTML(){
    var groups = BOOKS.crossLinks || [];
    if(!groups.length) return '<div class="empty-hint">还没有发现跨书连接。</div>';
    var touched = {};
    groups.forEach(function(xl){ xl.members.forEach(function(id){ touched[id] = true; }); });
    var html = '<div class="section-label" style="margin-top:20px;">🔗 跨学科连接组（' + groups.length + ' 组，' +
      Object.keys(touched).length + ' 条条目参与）</div>';
    html += groups.map(crossLinkCardHTML).join('');
    return html;
  }
  function renderThreadGraph(){
    var truths = BOOKS.universalTruths;
    if(!truths.length){ main.innerHTML = graphModeSwitchHTML() + '<div class="empty-hint">还没有可视化的条目。</div>'; return; }
    var buckets = {};
    truths.forEach(function(t){
      var tids = (t.threads && t.threads.length) ? t.threads : ['_unassigned'];
      tids.forEach(function(tid){ (buckets[tid] = buckets[tid] || []).push(t); });
    });
    var threadIds = Object.keys(buckets);
    var W = 760, H = 560, cx = W/2, cy = H/2, R1 = Math.min(W,H)/2 - 110;
    var colorVar = ['var(--thread-1)','var(--thread-2)','var(--thread-3)','var(--thread-4)','var(--thread-5)','var(--thread-6)'];
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    var nodesSvg = '', edgesSvg = '';
    threadIds.forEach(function(tid, i){
      var angle = (i / threadIds.length) * Math.PI * 2 - Math.PI/2;
      var hx = cx + R1 * Math.cos(angle), hy = cy + R1 * Math.sin(angle);
      var th = threadById(tid);
      var color = colorVar[i % colorVar.length];
      var members = buckets[tid];
      var R2 = 70;
      members.forEach(function(t, j){
        var a2 = (members.length === 1) ? angle : angle + (j/(members.length-1) - 0.5) * 1.1;
        var nx = hx + R2 * Math.cos(a2), ny = hy + R2 * Math.sin(a2);
        edgesSvg += '<line x1="' + hx.toFixed(1) + '" y1="' + hy.toFixed(1) + '" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) + '" stroke="' + color + '" stroke-width="1.3" stroke-opacity="0.55"/>';
        var qColor = 'var(--quad-' + t.quadrant.toLowerCase() + ')';
        var r = 7 + Math.min(3, (t.books||[]).length);
        nodesSvg += '<g class="g-node" data-jump-pyramid="' + t.id + '" transform="translate(' + nx.toFixed(1) + ',' + ny.toFixed(1) + ')">' +
          '<title>' + esc(t.title) + '</title>' +
          '<circle r="' + r + '" fill="' + qColor + '"/>' +
          '<text x="0" y="' + (r+12) + '" text-anchor="middle">' + esc((t.keyword||t.title||'').slice(0,8)) + '</text>' +
          '</g>';
      });
      nodesSvg += '<g class="g-hub" transform="translate(' + hx.toFixed(1) + ',' + hy.toFixed(1) + ')">' +
        '<circle r="5" fill="' + color + '"/>' +
        '<text x="0" y="-10" text-anchor="middle">' + esc(th ? th.name : '待归类') + '</text>' +
        '</g>';
    });
    svg += edgesSvg + nodesSvg + '</svg>';

    var legend = '<div class="g-legend">' + threadIds.map(function(tid, i){
      var th = threadById(tid);
      var color = colorVar[i % colorVar.length];
      return '<div class="g-legend-item"><span class="g-legend-dot" style="background:' + color + '"></span>' +
        esc(th ? th.name + '（' + th.desc + '）' : '待归类') + '</div>';
    }).join('') + '</div>';

    main.innerHTML = graphModeSwitchHTML() + '<div class="graph-wrap">' + svg + '</div>' + legend +
      '<div class="graph-hint">节点 = 一条普世智条目（颜色按四象限），线条颜色 = 所属跨学科主线；点击节点跳转到金字塔中的完整卡片。</div>';
  }
  function renderGraph(){
    if(state.graphMode === 'thread') renderThreadGraph();
    else renderLibraryGraph();
  }

  // ---------- render: summary tab (书籍总结) ----------
  // 数据：data/book-summaries.json。rows 按原 OneNote 表格顺序排列：l1 = 绿色大类行，l2 = 黄色★子类行，
  // book = 一本书一行（左书名、右总结）。html 字段是 src/import_onenote_summary.py 清洗过的原排版
  // （只留颜色/高亮/粗体/下划线/缩进/列表/链接），由构建脚本生成、不来自页面输入，所以直接插入。
  // by:"claude" 的行是 Claude 代写的，书名下方挂紫色标记，方便用户识别和审阅。
  function stripTags(h){ var d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent || ''; }
  var SUMMARY_TEXT = null;
  function summaryGroups(){
    // 把扁平 rows 切成 [{l1, l2, books:[]}] 方便搜索时隐藏空分组
    var groups = [], cur = null, l1 = null;
    SUMMARIES.rows.forEach(function(r, i){
      if(r.kind === 'l1'){ l1 = r; cur = null; return; }
      if(r.kind === 'l2' || !cur){ cur = {l1: l1, l2: r.kind === 'l2' ? r : null, books: [], idx: i}; groups.push(cur); l1 = null; if(r.kind === 'l2') return; }
      cur.books.push(r);
    });
    return groups;
  }
  function summaryRowHTML(r){
    var cls = 'bs-row bs-' + r.kind + (r.by === 'claude' ? ' by-claude' : '');
    if(r.kind !== 'book'){
      var icon = r.kind === 'l2' ? '<span class="bs-ico bs-ico-star">★</span>' : '';
      return '<div class="' + cls + '"><div class="bs-cell bs-t">' + icon + esc(r.title) +
        (r.by === 'claude' ? '<br><span class="bs-badge">🤖 Claude 新增分类</span>' : '') +
        '</div><div class="bs-cell bs-b"></div></div>';
    }
    var libRefs = r.bookId ? (BOOKS.library || []).filter(function(e){ return e.book === r.bookId; }) : [];
    var t = (r.titleHtml || esc(r.title));
    if(r.by === 'claude'){
      t += '<span class="bs-badge">🤖 Claude 代写 · 待你审阅</span>' +
        '<span class="bs-note">' + esc(r.note || ('素材：读书思维库 ' + libRefs.length + ' 条笔记 + 你当年的批注')) + '</span>';
    }
    if(libRefs.length) t += '<br><span class="bs-lib" data-jump-library="' + libRefs[0].id + '">📖 读书思维库 ' + libRefs.length + ' 条 →</span>';
    return '<div class="' + cls + '" id="bs-' + esc(r.bookId || r.title) + '"><div class="bs-cell bs-t">' + t + '</div>' +
      '<div class="bs-cell bs-b">' + (r.html || '') + '</div></div>';
  }
  function renderSummary(){
    var q = state.search.toLowerCase();
    if(q && !SUMMARY_TEXT){
      SUMMARY_TEXT = {};
      SUMMARIES.rows.forEach(function(r){ if(r.kind === 'book') SUMMARY_TEXT[r.title] = (r.title + ' ' + stripTags(r.html)).toLowerCase(); });
    }
    var all = SUMMARIES.rows.filter(function(r){ return r.kind === 'book'; });
    var nClaude = all.filter(function(r){ return r.by === 'claude'; }).length;
    var html = '<div class="bs-head"><span class="bs-head-title">' + esc(SUMMARIES.meta.title) + '</span>' +
      '<span class="bs-head-meta">' + esc(SUMMARIES.meta.source) + ' · ' + esc(SUMMARIES.meta.created) + ' · 共 ' + all.length + ' 本（其中 ' + nClaude + ' 本为 Claude 代写）</span></div>' +
      '<div class="bs-legend">' +
        '<span><span class="sw" style="color:#0070C0">蓝字</span> 自己的工作/生活举例</span>' +
        '<span><span class="sw" style="color:#7030A0">紫字</span> 书里的举例</span>' +
        '<span><span class="sw" style="color:#FA0000">红字</span> 重点（认知范围内）</span>' +
        '<span><span class="sw" style="color:#FA0000;text-decoration:underline">红下划线</span> 突破已有认知</span>' +
        '<span><span class="sw" style="background:lime">绿底</span> 高层级</span>' +
        '<span><span class="sw" style="background:yellow">黄底</span> 低层级</span>' +
        '<span><span class="bs-badge" style="margin:0">🤖 Claude 代写</span> 我补的，待你审阅</span>' +
      '</div>' +
      '<details class="bs-intro-wrap"><summary>📐 原文开头：分类框架 + 归类三问 + 标注图例</summary>' +
      '<div class="bs-sheet bs-intro">' + SUMMARIES.introHtml + '</div></details>';
    var body = '', hits = 0;
    summaryGroups().forEach(function(g, gi){
      var books = q ? g.books.filter(function(r){ return SUMMARY_TEXT[r.title].indexOf(q) !== -1; }) : g.books;
      hits += books.length;
      if(q && !books.length) return;
      body += '<section class="bs-group subcat-section" id="bs-sec-' + gi + '">' +
        (g.l1 ? summaryRowHTML(g.l1) : '') + (g.l2 ? summaryRowHTML(g.l2) : '') +
        books.map(summaryRowHTML).join('') + '</section>';
    });
    if(q && !hits){ main.innerHTML = html + '<div class="empty-hint">没有匹配的书籍总结。</div>'; return; }
    main.innerHTML = html + '<div class="bs-sheet">' + body + '</div>';
  }

  // ---------- render: books tab ----------
  function renderBooks(){
    var q = state.search.toLowerCase();
    var byDoc = {};
    var order = [];
    BOOKS.books.forEach(function(b){
      if(q && !matchText(b.title.toLowerCase(), q) && !matchText((b.author||'').toLowerCase(), q)) return;
      if(!byDoc[b.docSource]){ byDoc[b.docSource] = []; order.push(b.docSource); }
      byDoc[b.docSource].push(b);
    });
    if(!order.length){ main.innerHTML = '<div class="empty-hint">没有匹配的书。</div>'; return; }
    var distilled = BOOKS.books.filter(function(b){ return b.status !== 'queued'; }).length;
    var html = '<div class="stat-pill" style="margin-bottom:14px;display:inline-block;">已收录读书思维库 ' + distilled + ' / ' + BOOKS.books.length + ' 本</div>';
    order.forEach(function(doc){
      html += '<div class="book-doc-group"><div class="book-doc-h">' + esc(doc) + '</div>';
      byDoc[doc].forEach(function(b){
        var pyrRefs = BOOKS.universalTruths.filter(function(t){ return (t.books||[]).indexOf(b.id) !== -1; });
        var libRefs = (BOOKS.library || []).filter(function(e){ return e.book === b.id; });
        html += '<div class="book-row">' +
          '<span class="book-status ' + esc(b.status) + '"></span>' +
          '<span class="book-title">' + esc(b.title) + '</span>' +
          (b.author ? '<span class="book-author">' + esc(b.author) + '</span>' : '') +
          '<div class="book-links">' +
            pyrRefs.map(function(t){ return '<span class="book-link" data-jump-pyramid="' + t.id + '">🌍 ' + esc(t.keyword || t.id) + ' →</span>'; }).join('') +
            libRefs.map(function(e){ return '<span class="book-link" data-jump-library="' + e.id + '">📖 ' + esc(e.keyword || e.id) + ' →</span>'; }).join('') +
          '</div>' +
          '</div>';
      });
      html += '</div>';
    });
    main.innerHTML = html;
  }

  // ---------- quick-jump rail (kb + pyramid tabs, both share the same quadrant/subcat id scheme) ----------
  var io = null;
  function observeSections(){
    if(io) io.disconnect();
    var sections = main.querySelectorAll('.subcat-section');
    if(!sections.length || !window.IntersectionObserver) return;
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var id = en.target.id;
          Array.prototype.forEach.call(quickjumpEl.querySelectorAll('.qj-chip'), function(c){
            c.classList.toggle('active', c.getAttribute('data-target') === id);
          });
        }
      });
    }, {rootMargin: '-40% 0px -50% 0px', threshold: 0});
    Array.prototype.forEach.call(sections, function(s){ io.observe(s); });
  }
  function renderQuickJump(){
    if(state.tab === 'summary'){
      quickjumpEl.hidden = false;
      var sh = '';
      summaryGroups().forEach(function(g, gi){
        var target = 'bs-sec-' + gi;
        var label = (g.l2 ? g.l2.title : (g.l1 ? g.l1.title : '其它'));
        sh += '<button class="qj-chip' + (document.getElementById(target) ? '' : ' dim') + '" data-target="' + target + '">' +
          '<span class="qj-dot"></span>' + esc(label) + '</button>';
      });
      quickjumpEl.innerHTML = sh;
      observeSections();
      return;
    }
    if(state.tab !== 'kb' && state.tab !== 'pyramid' && state.tab !== 'library'){ quickjumpEl.hidden = true; quickjumpEl.innerHTML = ''; return; }
    quickjumpEl.hidden = false;
    var html = '';
    DATA.quadrants.forEach(function(quad){
      quad.subcats.forEach(function(sc){
        var target = 'sc-' + quad.id + '-' + sc.id;
        var exists = !!document.getElementById(target);
        html += '<button class="qj-chip' + (exists ? '' : ' dim') + '" data-q="' + quad.id + '" data-target="' + target + '">' +
          '<span class="qj-dot"></span>' + esc(sc.name) + '</button>';
      });
    });
    quickjumpEl.innerHTML = html;
    observeSections();
  }
  function scrollToSection(id){
    var el = document.getElementById(id);
    if(!el) return;
    // measured at click time (not a fixed CSS value) so it stays correct if the sticky
    // header's real height changes — quickjump row hidden/shown, edit toolbar, responsive wrap, etc.
    var header = document.querySelector('header.top');
    var offset = (header ? header.getBoundingClientRect().height : 0) + 10;
    var top = el.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
  }

  // ---------- cross-tab / cross-system jump ----------
  // Every jump* below hops to a different tab (and often a different card), which used to
  // strand the reader's scroll position with no way back. pushNav() snapshots "where I was"
  // right before the hop; the floating "返回上一页" button (goBack) pops the stack and restores
  // it. One shared stack works across both Mind OS and Book OS since they render into the same
  // #main / state — no per-system implementation needed.
  function pushNav(){
    state.navStack.push({ tab: state.tab, scrollY: window.scrollY, search: state.search, timelineCategory: state.timelineCategory, graphMode: state.graphMode });
    if(state.navStack.length > 30) state.navStack.shift();
    updateNavBackBtn();
  }
  function updateNavBackBtn(){
    var n = state.navStack.length;
    navBackBtn.hidden = n === 0;
    navBackLabel.textContent = n > 1 ? ('返回上一页（' + n + '）') : '返回上一页';
  }
  function goBack(){
    if(!state.navStack.length) return;
    var snap = state.navStack.pop();
    state.tab = snap.tab; setActiveTab(snap.tab);
    state.search = snap.search || ''; searchInput.value = state.search;
    state.timelineCategory = snap.timelineCategory;
    if(snap.graphMode) state.graphMode = snap.graphMode;
    render();
    updateNavBackBtn();
    // scroll restore needs to happen after the new tab's (possibly much taller/shorter) HTML
    // has actually been laid out, hence the double rAF rather than a single one.
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ window.scrollTo({top: snap.scrollY, behavior: 'auto'}); });
    });
  }
  navBackBtn.addEventListener('click', goBack);
  function jumpToQuotes(id){
    pushNav();
    state.tab = 'quotes'; setActiveTab('quotes'); state.search = ''; searchInput.value = ''; state.jumpTo = id; render();
  }
  function jumpToKB(id){
    pushNav();
    state.tab = 'kb'; setActiveTab('kb'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function jumpToPyramid(id){
    pushNav();
    state.tab = 'pyramid'; setActiveTab('pyramid'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function jumpToLibrary(id){
    pushNav();
    state.tab = 'library'; setActiveTab('library'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function jumpToBooksTab(){
    pushNav();
    state.tab = 'books'; setActiveTab('books'); state.search = ''; searchInput.value = ''; render();
  }
  function afterRenderJump(){
    if(!state.jumpTo) return;
    var id = state.jumpTo; state.jumpTo = null;
    requestAnimationFrame(function(){
      var el = main.querySelector('[data-id="' + id + '"]');
      if(!el) return;
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 1600);
    });
  }

  // ---------- targeted DOM updates for the two hottest interactions (expand/collapse, star) ----------
  // Large tabs (读书思维库 alone can hold 260+ cards) made a full render() per click needlessly
  // expensive — every keystroke-free click was re-building and re-parsing the entire visible
  // list's HTML just to flip one card's state. These two paths patch only the affected node.
  function detailHTMLFor(id){
    var p = principleById(id); if(p) return pcardDetailHTML(p);
    var t = truthById(id); if(t) return truthDetailHTML(t);
    var e = libById(id); if(e) return libDetailHTML(e);
    return '';
  }
  function toggleCardExpand(id){
    var wasExpanded = !!state.expanded[id];
    state.expanded[id] = !wasExpanded;
    var el = main.querySelector('.pcard[data-id="' + id + '"]');
    if(!el){ render(); return; }
    el.classList.toggle('expanded', !wasExpanded);
    var chev = el.querySelector('.pc-chev');
    if(chev) chev.textContent = wasExpanded ? '▾' : '▲';
    if(wasExpanded){
      var body = el.querySelector('.pcard-body');
      if(body) body.remove();
    } else {
      el.insertAdjacentHTML('beforeend', detailHTMLFor(id));
    }
    applyEditableAttrs();
  }
  function toggleStar(id){
    var key = id + '::star';
    var willStar = !overlay[key];
    if(willStar) overlay[key] = true; else delete overlay[key];
    saveOverlay();
    if(state.starOnly){ render(); return; } // visibility itself changes under this filter
    var el = main.querySelector('.pcard[data-id="' + id + '"]');
    if(!el){ render(); return; }
    el.classList.toggle('starred', willStar);
    var btn = el.querySelector('.star-btn[data-id="' + id + '"]');
    if(btn) btn.textContent = willStar ? '★' : '☆';
  }

  // ---------- delegated click handling (shared across both systems: same class names / data-attrs) ----------
  main.addEventListener('click', function(e){
    var t = e.target;
    var starBtn = t.closest && t.closest('.star-btn');
    if(starBtn){ toggleStar(starBtn.getAttribute('data-id')); return; }
    var quoteBadge = t.closest && t.closest('.b-quote');
    if(quoteBadge){ jumpToQuotes(quoteBadge.getAttribute('data-id')); return; }
    var jumpQ = t.closest && t.closest('[data-jump-quotes]');
    if(jumpQ){ jumpToQuotes(jumpQ.getAttribute('data-jump-quotes')); return; }
    var jumpKB = t.closest && t.closest('[data-jump-kb]');
    if(jumpKB){ jumpToKB(jumpKB.getAttribute('data-jump-kb')); return; }
    var jumpPyr = t.closest && t.closest('[data-jump-pyramid]');
    if(jumpPyr){ jumpToPyramid(jumpPyr.getAttribute('data-jump-pyramid')); return; }
    var jumpLib = t.closest && t.closest('[data-jump-library]');
    if(jumpLib){ jumpToLibrary(jumpLib.getAttribute('data-jump-library')); return; }
    var jumpBooksChip = t.closest && t.closest('[data-jump-books]');
    if(jumpBooksChip){ jumpToBooksTab(); return; }
    var graphModeBtn = t.closest && t.closest('[data-graph-mode]');
    if(graphModeBtn){ state.graphMode = graphModeBtn.getAttribute('data-graph-mode'); render(); return; }
    var tlFilterBtn = t.closest && t.closest('[data-tl-filter]');
    if(tlFilterBtn){
      var cat = tlFilterBtn.getAttribute('data-tl-filter');
      state.timelineCategory = (state.timelineCategory === cat) ? null : cat;
      render(); return;
    }
    var rootToggle = t.closest && t.closest('.root-toggle');
    if(rootToggle){
      var id2 = rootToggle.getAttribute('data-id');
      state.showRootFor[id2] = !state.showRootFor[id2];
      render(); return;
    }
    var ctxToggle = t.closest && t.closest('.ctx-toggle');
    if(ctxToggle){
      var ctxKey = ctxToggle.getAttribute('data-ctx');
      state.showCtxFor[ctxKey] = !state.showCtxFor[ctxKey];
      render(); return;
    }
    var head = t.closest && t.closest('.pcard-head');
    if(head){
      if(state.editMode && t.closest('.editable')) return;
      toggleCardExpand(head.getAttribute('data-id'));
      return;
    }
  });

  // quickjump chips live in <header>, outside #main's subtree, so they need their own delegated listener
  quickjumpEl.addEventListener('click', function(e){
    var qjChip = e.target.closest && e.target.closest('.qj-chip');
    if(qjChip) scrollToSection(qjChip.getAttribute('data-target'));
  });

  // ---------- controls visibility (recent-toggle is diary-only; stat-pill is book-only) ----------
  function renderControls(){
    var family = TAB_FAMILY[state.tab];
    recentToggle.hidden = family !== 'mindos';
    var statPill = $('#stat-pill');
    statPill.hidden = family !== 'bookos';
    if(family === 'bookos'){
      var distilled = BOOKS.books.filter(function(b){ return b.status !== 'queued'; }).length;
      statPill.textContent = distilled + ' / ' + BOOKS.books.length + ' 本已收录读书思维库 · ' +
        (BOOKS.library || []).length + ' 条思维库条目 · ' + BOOKS.universalTruths.length + ' 条普世智';
    }
  }

  function render(){
    if(state.tab === 'kb') renderKB();
    else if(state.tab === 'quotes') renderQuotes();
    else if(state.tab === 'timeline') renderTimeline();
    else if(state.tab === 'summary') renderSummary();
    else if(state.tab === 'pyramid') renderPyramid();
    else if(state.tab === 'library') renderLibrary();
    else if(state.tab === 'graph') renderGraph();
    else renderBooks();
    renderControls();
    renderQuickJump();
    applyEditableAttrs();
    afterRenderJump();
  }

  // deep-link support: #MAS-C-50 / #UT-MAS-C-10 / #LIB-MAS-A-10 opens directly into that card
  // on first load, routing to whichever tab (kb / pyramid / library) the id belongs to.
  if(location.hash && location.hash.length > 1){
    var hashId = decodeURIComponent(location.hash.slice(1));
    if(principleById(hashId)){ state.tab = 'kb'; setActiveTab('kb'); state.expanded[hashId] = true; state.jumpTo = hashId; }
    else if(truthById(hashId)){ state.tab = 'pyramid'; setActiveTab('pyramid'); state.expanded[hashId] = true; state.jumpTo = hashId; }
    else if(libById(hashId)){ state.tab = 'library'; setActiveTab('library'); state.expanded[hashId] = true; state.jumpTo = hashId; }
  }

  render();
})();
</script>

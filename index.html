size:1.27em\"><span style=\"font-weight:700\">2. </span><span style=\"font-weight:700\">解</span><span style=\"font-weight:700\">释</span><span style=\"font-weight:700\">世界</span><span style=\"font-weight:700\"> (Interpret World)</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">定位</span>：聚焦底层客观规律与认知工具。解决“我如何理解这个世界的运行机制”。</li> </ul> </ul> </td> <td> <ul> <ul type=\"circle\"> <li><span style=\"font-weight:700\">看待世界的</span><span style=\"font-weight:700\">视</span><span style=\"font-weight:700\">角</span><span style=\"font-weight:700\"> (Worldview)</span>：主观观察基准线（如拥抱变化、意义的当下性）。</li> <li><span style=\"font-weight:700\">底</span><span style=\"font-weight:700\">层</span><span style=\"font-weight:700\">心智模型</span><span style=\"font-weight:700\"> (Mental Models)</span>：跨学科的客观规律算法（如第一性原理、熵增、马太效应）。</li> <li><span style=\"font-weight:700\">认</span><span style=\"font-weight:700\">知升</span><span style=\"font-weight:700\">级</span><span style=\"font-weight:700\"> (Cognitive Upgrade)</span>：核心假设与战略视角的推翻重构（如长期主义、承认无知）。</li> <li><span style=\"font-weight:700\">学</span><span style=\"font-weight:700\">习</span><span style=\"font-weight:700\">方法</span><span style=\"font-weight:700\"> (Learning Methods)</span>：信息处理的战术与执行工具（如费曼技巧、间隔重复）。</li> </ul> </ul> </td> </tr> <tr> <td> <ul> <p style=\"font-size:1.27em\"><span style=\"font-weight:700\">3.应对</span><span style=\"font-weight:700\">他人</span><span style=\"font-weight:700\"> (Deal with Others)</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">定位</span>：聚焦人际边界与影响力。解决“我如何处理与他人的互动”。</li> </ul> </ul> </td> <td> <ul> <ul type=\"circle\"> <li><span style=\"font-weight:700\">原</span><span style=\"font-weight:700\">则</span><span style=\"font-weight:700\">与社交</span><span style=\"font-weight:700\">边</span><span style=\"font-weight:700\">界</span>：课题分离、拒绝烂好人、道德功利论。</li> <li><span style=\"font-weight:700\">沟通与人</span><span style=\"font-weight:700\">际</span><span style=\"font-weight:700\">技巧</span>：同理心倾听、非暴力沟通、价值交换。</li> <li><span style=\"font-weight:700\">家庭与</span><span style=\"font-weight:700\">亲</span><span style=\"font-weight:700\">密关系</span>：夫妻合伙人制度、代际情感独立。</li> <li><span style=\"font-weight:700\">育儿策略</span>：全人发展、避免牺牲感。</li> </ul> </ul> </td> </tr> <tr> <td> <ul> <p style=\"font-size:1.27em\"><span style=\"font-weight:700\">4. </span><span style=\"font-weight:700\">杠杆与博弈</span><span style=\"font-weight:700\"> (Leverage &amp; Game)</span></p> <ul type=\"disc\"> <li><span style=\"font-weight:700\">定位</span>：聚焦资源获取与价值交换。解决“我如何在外部社会机器中竞争与获利”。</li> </ul> </ul> </td> <td> <ul> <ul type=\"circle\"> <li><span style=\"font-weight:700\">职场进阶</span><span style=\"font-weight:700\">与</span><span style=\"font-weight:700\">执</span><span style=\"font-weight:700\">行力</span>：向上管理、结果导向、时间估算。</li> <li><span style=\"font-weight:700\">团队</span><span style=\"font-weight:700\">管理与</span><span style=\"font-weight:700\">领导</span><span style=\"font-weight:700\">力</span>：跨部门协同、管理强将、情绪稳定力。</li> <li><span style=\"font-weight:700\">财</span><span style=\"font-weight:700\">富</span><span style=\"font-weight:700\">积</span><span style=\"font-weight:700\">累与</span><span style=\"font-weight:700\">风</span><span style=\"font-weight:700\">控投</span><span style=\"font-weight:700\">资</span>：定投纪律、概率思维、拒绝错失恐惧症 (FOMO)。</li> </ul> </ul> </td> </tr> </table> </div> <p> </p> <p> </p> <p><span class=\"bs-ico bs-ico-star\" title=\"重要\">★</span> 归类的时候,我们需要思考以下几点:</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">这本书的</span><span style=\"font-weight:400;font-style:normal;background:yellow\">核心内容</span><span style=\"font-weight:400;font-style:normal\">和主旨是什么?</span></li> <li>作者写作的<span style=\"background:yellow\">目的</span>是什么?是传递知识,还是启发实践?</li> <li>读者阅读这本书<span style=\"background:yellow\">more likely获得</span>什么?</li> </ol> <p>--》所以从这个角度，《被讨厌的勇气》虽然分享了一些心理学理论，但本质是帮助你认识自我，启发成长</p> <p> </p> <p>----------------</p> <p><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 引文，举例</p> <p style=\"margin-left:2.45em;color:#0070C0\">自己的工作，生活，思考举例</p> <p style=\"margin-left:2.45em;color:#7030A0\">其他书本里给的举例</p> <p> </p> <p><span style=\"background:lime\">高层级</span></p> <p><span style=\"background:yellow\">低层级</span></p> <p> </p> <p style=\"color:#FA0000\">重点但是在我认知范围内的 (e )</p> <p style=\"color:#FA0000\"><span style=\"text-decoration:underline\">突破已有认知的点</span><span style=\"text-decoration:underline\">（a</span><span style=\"text-decoration:underline\"> </span><span style=\"text-decoration:underline\">)</span></p> <p style=\"color:#7030A0\"> </p> <p style=\"color:#7030A0\"> </p> <p>----------------</p> <p> </p> <p> </p> <div>","rows":[{"kind":"l1","title":"个人提升","by":"user"},{"kind":"l2","title":"自我认知与成长","by":"user"},{"kind":"book","title":"被讨厌的勇气","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/36150914/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">被讨厌的勇气</span></a></p>","html":"<p>三个核心观点：</p> <p>1. 避免被过去束缚：因为追随阿德勒目的论的观点，<span style=\"color:#FA0000\">人可以改变--不是过去的经历塑造你现在的行为，而是为了一个目的你产生了当下的想法或行为。</span></p> <p style=\"margin-left:2.45em\">方法便是应用目的论，对过去赋予积极意义，对将来构建事在人为的自信，以及看清自己的目的（比如我觉得现在工作压力大于是想换工作，但其实是为了达到“觉得自己不能胜任于是想逃避”的目的；若是如此，换工作并不解决问题）；</p> <p>2. 避免被人际关系束缚：因为人的大多烦恼都是人际关系（<span style=\"font-weight:700\">即在乎别人的看法）</span>；</p> <p style=\"margin-left:2.45em\">可以用两个方法解决人际关系的烦恼，</p> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">1：解决认可欲求--用课题分离法</span>（判断这件事是谁的课题即谁对后果负责；<span style=\"color:#FA0000\">该方法对“特别在乎别人感受”一类的情况最为使用</span>）和<span style=\"color:#FA0000\">建立横向关系</span>（虽不同，但平等）</p> <p style=\"margin-left:2.45em\">2：去追求共同体感觉，做到：<span style=\"font-weight:700;color:#FA0000\">自我接纳</span><span style=\"color:#FA0000\">（</span><span style=\"text-decoration:underline;color:#FA0000\">接受自己不能改变的</span><span style=\"color:#FA0000\">，改变能改变的</span>），<span style=\"font-weight:700\">他者信赖</span>（<span style=\"color:#FA0000\">把他人作伙伴，同时放弃时时自我为中心的思考方式，尤其“他她在怎么看我”</span>），<span style=\"font-weight:700;color:#FA0000\">他者贡献</span><span style=\"color:#FA0000\">（思考我能做什么，毋论他做了什么）</span></p> <p>3. 避免被未来束缚：因为<span style=\"font-weight:700;color:#FA0000\">人生的意义只能在过好当下后浮现</span>。</p> <p style=\"margin-left:2.45em\">方法便是关注当下的每次起舞的过程，而不是关注终点，好比旅行的风景而不是终点；</p>"},{"kind":"book","title":"认知觉醒 : 开启自我改变的原动力","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/35193035/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">认知觉醒</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 开启自我改变的原动力</span></a></p>","html":"<p>1.本能脑会“急于求成，趋易避难”，就是<span style=\"color:#FA0000\">追求“即时满足”</span>，难的但是<span style=\"color:#FA0000\">好的会拖延</span>，比如学习，<span style=\"color:#FA0000\">不好的即时享乐又无法自制</span><span style=\"color:#FA0000\">, 比如玩手机</span>。</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">怎么办：对于好的但拖延的要</span></li> <ol style=\"font-weight:400;font-style:normal\" type=\"a\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">与本能脑顺势而为，</span><span style=\"font-weight:400;font-style:normal;color:#FA0000\">保持拉伸区而避免困难区（如订合理目标） </span></li> <li><span style=\"color:#FA0000\">建立更多的清晰概念</span>让本能脑多耐心，比如明白“学习&lt;思考&lt;行动&lt;改变”，学习都是复利曲线，学习都有平台期</li> <li>在<span style=\"color:#FA0000\">“提示</span><span style=\"color:#FA0000\"> </span><span style=\"color:#FA0000\">渴求</span><span style=\"color:#FA0000\"> </span><span style=\"color:#FA0000\">行动</span><span style=\"color:#FA0000\"> </span><span style=\"color:#FA0000\">奖励”</span>上下功夫（<span style=\"background:yellow\">《掌控习惯》</span>，里面更多是怎样减少拖延，去养成好的习惯）；</li> </ol> <li>对于坏的但缺乏自制</li> <ol style=\"font-weight:400;font-style:normal\" type=\"a\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">可以用</span><span style=\"font-weight:400;font-style:normal;color:#FA0000\">“五分钟冷静期策略“，因为一旦满足不即时，就会失去吸引力；</span></li> <li>最后<span style=\"color:#FA0000\">把少拖延多自制变成习惯，壮大理智脑</span>；（甚至变成自我身份定位的一部分）</li> </ol> </ol> <p>2.元认知能力就是反思能力，也是对抗本能脑的最强大武器 </p> <p>3.几大力：</p> <p style=\"margin-left:2.45em\">目反难钻掌来提高专注力，</p> <p style=\"margin-left:2.45em;color:#FA0000\">一手资料，匹配（输入刚好能被触动的点）与缝接（个人知识体系）来提高学习力，</p> <p style=\"margin-left:2.45em\">增强回路来提高行动力，</p> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">心智带宽来提高情绪力</span>（关键是保持觉察）</p>"},{"kind":"book","title":"贪婪的多巴胺","by":"user","titleHtml":"<p>贪婪的多巴胺</p>","html":"<p>1.多巴胺欲望回路：对<span style=\"font-weight:700;color:#FA0000\">想象中的意外之喜产生渴求</span>而触发,如高热量食物与性高潮；正面作用是<span style=\"font-weight:700;color:#FA0000\">提供动力去追求未拥有之物</span>，最大化未来资源；类似本能脑；也因此可被有心人操纵，如电脑游戏；<span style=\"font-weight:700\">也是不快乐的源泉</span>，因为欲求不满;</p> <p>-特点：<span style=\"font-weight:700;color:#FA0000\">意外之喜变成已经拥有兴奋感便消失</span>；<span style=\"font-weight:700;color:#FA0000\">阈值会提高</span>，同等兴奋要更高刺激</p> <p>-例子：爱情由初始迷恋到厌倦，而后渴望激情（解法：<span style=\"font-weight:700;color:#FA0000\">由激情之爱转向体验当下的陪伴之爱</span>）；</p> <p>性爱由初始多巴胺主导的性兴奋到当下分子起作用的感官愉悦，到高潮时百分百当下分子（享受性的解法：<span style=\"font-weight:700;color:#FA0000\">停止脑补更兴奋事物，体验当下亲昵</span>）；</p> <p>多巴胺主导冲动消费，而后得到且体验低于预期产生懊悔（解法：用稀缺理论确定是真想要，进而延长当下喜爱的时间）；</p> <p>游戏与各类成瘾；<span style=\"font-weight:700\">损失厌恶，即损失十元的痛苦超过获得十元的快乐</span>，因为损失有多巴胺活性下降+当下分子痛苦感的共同作用，得到只有多巴胺活性上升的兴奋；<span style=\"font-weight:700\">创造力强的天才们</span>；</p> <p>自由主义者；当下享乐主义；第一批人类大迁徙的智人。</p> <p>2.多巴胺控制回路：1.为了管控欲望回路，<span style=\"font-weight:700;color:#FA0000\">让我们思考比其更遥远的未来，放弃即时满足</span>，超越本能决策，制定更长期计划，如长期储蓄，出门锻炼，先学而不是先玩，再比如婚外情。2.创造新的工具和抽象概念，如规划，语言，数学，哲学等。</p> <p>3.当下分子VS多巴胺：近体空间的事物，当下分子主导；远体空间，多巴胺主导，尤其控制多巴胺；如电车难题，在场工人不会换轨道，初始编程人员会设定牺牲更少的路线。</p> <p>-<span style=\"font-weight:700;color:#FA0000\">从多巴胺主导转向当下分子主导是成熟，也是持久幸福的必经之路</span>；因为<span style=\"font-weight:700\">多巴胺永不满足，依赖它带来的</span><span style=\"font-weight:700\">幸福感</span><span style=\"font-weight:700\">难以持久，只会越陷越深</span>；且<span style=\"font-weight:700\">多巴胺渴求的永远在将来，而当下才是我们唯一拥有的</span>，所以被多巴胺主导会让你疲于奔命却无法快乐</p> <p>-怎样做到这种和谐：1.<span style=\"font-weight:700\">去精通一件事情</span>，因为多巴胺的期待和当下分子的满足感都被满足；2.<span style=\"font-weight:700\">去做创造性工作</span>，如绘画，因为多巴胺参与构思而当下分子专注于实现；3.<span style=\"font-weight:700\">专注当下做的事，避免多任务</span></p> <p>4.对抗欲望多巴胺的方法：1.<span style=\"font-weight:700\">强行调用自控力</span>（用CCRR model，但依然要考虑意志力持续使用会疲劳，且与当前精神状态有关）2.控制对抗欲望多巴胺3.<span style=\"font-weight:700\">当下分子对抗欲望多巴胺，比如当下分子渴望社交</span>，渴望被认可，于是加入戒酒群让别人监督戒酒。</p>"},{"kind":"book","title":"定投改变命运","by":"user","titleHtml":"<p>定投改变命运</p>","html":"<p>-投资误区：房产本质是高息借钱去投资低流动性资产；学校教育不提投资；</p> <p>-<span style=\"color:#FA0000\">投资本质：就是在加入最优秀公司来共享利益，也是用现有的钱帮你</span><span style=\"color:#FA0000\">24h</span><span style=\"color:#FA0000\">赚钱</span></p> <p>-定投优势：低点就是在降低均价，提高收益；<span style=\"color:#FA0000\">更符合人性，不会在低点焦虑割肉</span>（因为一把梭会在低点失去耐心而割肉），<span style=\"color:#FA0000\">高点犹豫</span>，有了<span style=\"font-weight:700;color:#FA0000\">纪律和耐心</span>，因此<span style=\"font-weight:700;color:#FA0000\">打败短期股价的随机漫步</span>，不再赌概率；</p> <p>-定投方法：选好投资标（市场上最多人看好的标；投与国家与人类发展绑定且长期看涨的ETF），长期投。</p> <p>-定投与人生：1.所有人都要培养主动人格，<span style=\"font-weight:700\">proactive</span>; 2.要意识到主动的边界，即<span style=\"font-weight:700\">我应该影响的</span>（高道德自律，而不他决；不干涉小孩）和<span style=\"font-weight:700\">我能影响的</span>（运气，趋势，他人的看法），3.<span style=\"color:#FA0000\">决定命运的因素恰在主动边界之外，而“趋势”最</span><span style=\"color:#FA0000\">dominant</span>（“识时务者为俊杰”）4.过好人生的方式就是-被动的主动；<span style=\"font-weight:700;color:#FA0000\">主动做好当下，主动寻找趋势，再被动的顺应趋势，等待趋势起作用</span></p> <p>-<span style=\"color:#FA0000\">经济周期因为全球信息流通的更高效而在缩短</span>；如今七年就是两个周期，就可叫长期</p> <p>-教育是系统想让你成为的样子，自学是你自己想要成为的样子</p>"},{"kind":"book","title":"远见","by":"claude","bookId":"b-017","titleHtml":"<p><span style=\"font-weight:700\">远见</span></p>","html":"<p>职业生涯至少<span style=\"color:#FA0000;font-weight:700\">45年</span>，像一场长跑，靠<span style=\"font-weight:700\">“职场燃料”</span>驱动，分三大阶段：</p><p>1. <span style=\"font-weight:700\">三阶段</span>：①<span style=\"color:#FA0000\">加添燃料</span>（强势开局，耐心+持续行动储备早期燃料）；②<span style=\"color:#FA0000;font-weight:700\">锚定甜蜜区，聚焦长板</span>（在长板×热爱×世界需要的交集里深耕）；③<span style=\"color:#FA0000\">优化长尾</span>（从执行者/领导者转向顾问，开始确定接班人）。职业发展<span style=\"color:#FA0000;text-decoration:underline\">并不线性</span>——做好规划、耐心等运气、机会来了随机应变。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 比如我一直相信的“准备与机遇”，正是第三阶段的判断标准</span></p><p>2. <span style=\"font-weight:700\">三大职场燃料</span>：<span style=\"color:#FA0000\">可迁移技能</span>（学位、语言、耐心韧性/情商、培养出的人才账户）；<span style=\"color:#FA0000\">有意义的经验</span>（大型项目、海外、教学咨询、公开演讲写作）；<span style=\"color:#FA0000\">持久的关系</span>（5–10位关键同事、支持者、专业团）。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 比如CCA的D&amp;I人才秀、公司fire fighting project＝大型项目经验；吉他教学、develop TM＝教学咨询经验；懂法律/买房/政府机关的朋友＝专业团</span></p><p>3. <span style=\"font-weight:700\">四个黄金问题</span>评估当前阶段：<span style=\"color:#FA0000;font-weight:700\">我在学习成长吗？有影响力吗？有乐趣吗？物质回报适当吗？</span></p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ “在成长”和“有乐趣”，正是我和TM做绩效对话、团队engagement调研里一直强调的两点</span></p><p>4. <span style=\"font-weight:700\">职场路径向导</span>三问：理想是什么 → 手上有哪些燃料 → 还缺哪些燃料；比较路径时除了职位，<span style=\"color:#FA0000;text-decoration:underline\">更看工作内容和学习曲线</span>，并做好承担压力与风险的准备。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 比如“3年内成为M2”或“5年内攒够财富”，都可以反推出路径A、B</span></p><p>5. <span style=\"font-weight:700\">100小时测试</span>：把每周清醒的约100小时按工作/家庭/健康/学习/休闲拆开，看<span style=\"color:#FA0000\">真实时间分配是否和自己声称的优先级一致</span>；技巧：前摄时间迁移（预见冲突提前规划）、用好碎片时间。</p>","note":"原表格此行只有书名、内容为空，由 Claude 补写"},{"kind":"book","title":"高效能人士的七个习惯","by":"claude","bookId":"b-001","titleHtml":"<p><span style=\"font-weight:700\">高效能人士的七个习惯</span></p>","html":"<p>成长是<span style=\"color:#FA0000;font-weight:700\">由内而外</span>的：先赢得<span style=\"font-weight:700\">个人领域的成功</span>（习惯1–3，从依赖到独立），才有<span style=\"font-weight:700\">公众领域的成功</span>（习惯4–6，从独立到互赖），最后靠习惯7持续更新。</p><p><span style=\"background:lime\">├── 个人领域：从依赖到独立</span></p><p>1. <span style=\"font-weight:700\">积极主动</span>：刺激与回应之间有选择的空间，<span style=\"color:#FA0000\">为自己的回应负责</span>，把精力放在影响圈而不是关注圈。</p><p>2. <span style=\"font-weight:700\">以终为始</span>：任何事都经过<span style=\"color:#FA0000\">两次创造</span>——先在脑中构思（智力创造），再付诸实践（体力创造）；<span style=\"color:#FA0000;font-weight:700\">想象生命尽头希望得到的评价，倒推此刻的角色与价值观</span>，写成个人使命宣言当指南针。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 比如我的座右铭“做我相信正确的事”，就是一份最短的使命宣言</span></p><p>3. <span style=\"font-weight:700\">要事第一</span>：<span style=\"color:#FA0000;font-weight:700\">按重要性而不是紧急性排序</span>，把有限精力优先投到长期价值最大的事（重要不紧急象限）。</p><p><span style=\"background:lime\">├── 公众领域：从独立到互赖</span></p><p>4. <span style=\"font-weight:700\">双赢思维</span>：把每次合作当作<span style=\"color:#FA0000\">双方都能获益的机会</span>来经营，而不是预设对立的零和博弈。</p><p>5. <span style=\"font-weight:700\">知彼解己</span>：<span style=\"color:#FA0000;font-weight:700\">先理解对方，再寻求被理解</span>——专注倾听对方的立场和感受，再表达自己，而不是急于陈述己见。</p><p>6. <span style=\"font-weight:700\">统合综效</span>：基于互信与开放心态协作，最终方案<span style=\"color:#FA0000;text-decoration:underline\">优于任何一方的原始方案</span>，是团队合作的更高形态。</p><p><span style=\"background:lime\">└── 不断更新</span></p><p>7. <span style=\"font-weight:700\">不断更新</span>：在<span style=\"color:#FA0000\">身体、精神、智力、社会情感</span>四个维度持续投入维护，是支撑前六个习惯长期运转的基础设施。</p>"},{"kind":"book","title":"财富自由之路","by":"claude","bookId":"b-002","titleHtml":"<p><span style=\"font-weight:700\">财富自由之路</span></p>","html":"<p>核心：财富自由的本质是<span style=\"color:#FA0000;font-weight:700\">时间自由</span>，路径是先升级自己的“操作系统”，再升级“商业模式”。</p><p>1. <span style=\"font-weight:700\">注意力 &gt; 时间 &gt; 金钱</span>：注意力是唯一能主动调用来学习成长的资源；人生三大注意力黑洞：<span style=\"color:#FA0000\">凑热闹、随大流、为别人操碎心</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 用在家庭上——很多家庭不幸福，本质是花在彼此身上的时间不够；例外是亲人健康出问题，牺牲注意力和时间都值得</span></p><p>2. <span style=\"font-weight:700\">概念清晰</span>：<span style=\"color:#FA0000;font-weight:700\">一个人多聪明，看脑子里有多少清晰、准确、必要的概念，以及它们之间的关联</span>；概念模糊必然思考不清、判断出错。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 反复琢磨公司邮件措辞、坚持写日记整理思路，本质都是在训练把概念想清楚</span></p><p>3. <span style=\"font-weight:700\">元认知</span>：意识到自己正在思考、分析并纠正这个思考的能力，是<span style=\"color:#FA0000\">自主升级个人操作系统最关键的能力</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 比如会议上习惯性不敢举手时，元认知跳出来提醒：你想成为有棱角、有勇气的人，现在这样不对</span></p><p>4. <span style=\"font-weight:700\">复利曲线</span>：知识、经验、资产都按指数积累，<span style=\"color:#FA0000\">前期几乎看不出效果，跨过拐点后急速上扬</span>，所以长期主义者前期看起来“盲目自信”。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 和我“量变引起质变”的信念一致，是自信的心理基础</span></p><p>5. <span style=\"font-weight:700\">消极的自证预言</span>：先入为主的判断驱动行为，行为又让判断成真，再被确认偏误强化。<span style=\"color:#FA0000;text-decoration:underline\">要主动打断“我的看法→我的行为→他人看法→他人行为”这条链</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 比如曾怀疑老板讨厌自己，于是只看到对方不给好脸色的瞬间、表现越来越差，最后真的印证了猜测</span></p><p>6. <span style=\"font-weight:700\">放弃部分安全感</span>：追求百分之百安全感会困在当下，<span style=\"color:#FA0000\">敢放弃一部分，才有深度专注与长远眼光</span>。</p><p>7. <span style=\"font-weight:700\">正确但不被认同</span>：别人也认为对的事没有稀缺性；<span style=\"color:#FA0000;font-weight:700\">正确却暂时不被认同的判断才真正有价值</span>——前提是确保判断正确，而非为特立独行而特立独行。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 正中我的老毛病：太在意别人此刻怎么看</span></p><p>8. <span style=\"font-weight:700\">个人商业模式三层</span>：①一份时间卖一次（打工）→ ②一份时间卖多次（写书、编程等产品）→ ③<span style=\"color:#FA0000;font-weight:700\">买别人的时间再卖出</span>（创业、投资）；用花钱买来的时间反哺自身成长。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 认同用钱买服务、省下时间投资自己；但不同意“投资人只看创业者素质”——项目方向对，买到的时间价值也更高</span></p>"},{"kind":"l2","title":"心理学","by":"user"},{"kind":"book","title":"活出生命的意义","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/5330333/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">活出生命的意义</span></a></p>","html":"<ul> <ul type=\"disc\"> <li><span style=\"color:#FA0000\">去做事，与人接触，经历苦痛</span>，是找到人生意义的三大途径；</li> <li>人生没有广义的意义，但是每一刻的意义是可以定义的</li> </ul> </ul>"},{"kind":"l2","title":"思维方式","by":"user"},{"kind":"book","title":"金字塔原理 : 思考、表达和解决问题的逻辑","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/33391219/\" target=\"_blank\" rel=\"noopener\">金字塔原理 : 思考、表达和解决问题的逻辑</a></p>","html":"<p>--<span style=\"color:#FA0000\">横向归类分组</span></p> <p>（找到不同内容间的逻辑联系，然后归类分组简化内容；也是因为人的大脑无法一次记忆7个以上概念，所以需要归类）， </p> <p>--而后<span style=\"color:#FA0000\">自下而上思考（上层是对下层更多细节的更高度总结概括，类似take away)， </span></p> <p>--而后<span style=\"color:#FA0000\">自上而下表达</span>(总分的表达方式，最容易找到逻辑关系）</p>"},{"kind":"book","title":"系统之美","by":"user","titleHtml":"<p>系统之美</p>","html":"<ul> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">-</span><span style=\"font-weight:400;font-style:normal\">改变系统连接方式或功能目标远有效于改变要素</span></li> </ol> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如球队不再和谐，或是目标变成赌球，对成绩的影响远大于换几个球员<span style=\"color:#0070C0\">。</span><span style=\"font-weight:700;color:#0070C0\">或是公司员工的attrition影响不大，或是大学学生或教授离开不影响大学的根基。</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"2\"><span style=\"font-weight:400;font-style:normal\">-</span><span style=\"font-weight:400;font-style:normal\">适应力，自组织，层次性是</span><span style=\"font-weight:400;font-style:normal\">3</span><span style=\"font-weight:400;font-style:normal\">大系统特征；层次要求系统整体目标优先于子系统</span></li> </ol> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 适应力就比如库存系统的动态平衡；自组织就比如种子成长为大树；<span style=\"font-weight:700;color:#0070C0\">层次性比如一个不断壮大形成阶级的公司。系统整体目标就是</span><span style=\"font-weight:700;color:#0070C0\">business need,一个人开心与否不能比它更重要</span><span style=\"color:#0070C0\">;</span>再比如人体新陈代谢系统子系统不受控制就变成了癌症</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"3\"><span style=\"font-weight:400;font-style:normal\">-</span><span style=\"font-weight:400;font-style:normal\">时间延迟是常见系统障碍，包括感知，反应，交货延迟；缩短交货最有效</span></li> </ol> <p style=\"margin-left:2.45em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">感知延迟是销售察觉到客户需求变化</span><span style=\"font-weight:700\">，反应时工厂需要时间调整产量，交货延迟是工厂接单到销售收到货品发给客户需要时间</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"4\"><span style=\"font-weight:400;font-style:normal\">-</span><span style=\"font-weight:400;font-style:normal\">系统陷阱：（括号里的是解决办法）</span></li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">政策阻力（理解阻力源头重设政策，协调各方到更大目标），</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">- 比如中国的提高生育的政策</span></li> </ol> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如中国想提高生育，但是关闭补习中心不解决问题，核心是育儿成本，年轻人工作强度等。比如把提高生育的目标改成高质量儿童教育的目标which政府和年轻人都可以接受</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"2\"><span style=\"font-weight:400;font-style:normal\">公地悲剧（高层级管控资源，或建立用户强反馈），</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">- 比如对地下水的使用</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">，对于空气的污染</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如把波段资源分配给不同用途。比如对于不同开的车的排放量收取不同的拥车证</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"3\"><span style=\"font-weight:400;font-style:normal\">富者愈富（干预规则对富者压制而弱者补贴），</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">-比如首富的财产指数级的增长</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如给富人征收超额的富人税，或者中国今天的乡村振兴强制大公司投资捐款</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"4\"><span style=\"font-weight:400;font-style:normal\">竞争升级（引进新的平衡控制回路），</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">- 比如两国从小冲突变成战争</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如让美国出面让巴勒斯坦和以色列协商，或是大人出面让两个宝宝和解</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"5\"><span style=\"font-weight:400;font-style:normal\">目标侵蚀（无论表现保持绝对标准；始终参照回曾经最佳表现），</span><span style=\"font-weight:700;font-style:normal;font-weight:700;color:#0070C0\">-比如一个部门表现越来越差</span></li> </ol> <p style=\"margin-left:4.91em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">比如每个部门的performance要跟随KPI</span><span style=\"font-weight:700\">。比如ADTS要时刻参考回最benchmark的ttmcy，或是最capable的时候</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"6\"><span style=\"font-weight:400;font-style:normal\">转嫁负担给干预者（提前预防避开速效法，增强系统自愈力），</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">- 比如毒品上瘾</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">，或破公司依赖补贴</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如毒品坚决不可以碰。<span style=\"font-weight:700\">比如</span><span style=\"font-weight:700;color:#0070C0\">经营恶化的公司就直接更换整个管理层，像很多大公司的改组</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"7\"><span style=\"font-weight:400;font-style:normal\">规避规则</span><span style=\"font-weight:400;font-style:normal\">-并未真正执行设定的目标</span><span style=\"font-weight:400;font-style:normal\">（把规避看做反馈来改进规则），</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">-比如在排量上限的车</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">，或是减速再超速的车</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如catA和CATB边缘排量的车说明了对车的需求还是很大，于是推广电动车来保护环境的同时满足需求</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"8\"><span style=\"font-weight:400;font-style:normal\">目标错位</span><span style=\"font-weight:400;font-style:normal\">-有去认真执行设定的目标</span><span style=\"font-weight:400;font-style:normal\">（更改目标反应真正需求）</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">-比如达到GDP目标</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">，人民并不满意</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如唯GDP论后，社会真正需求是物质丰裕而生活公平，环境优美，于是就应该致力于发展法制建设，保护环境的发展经济等</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"5\"><span style=\"font-weight:400;font-style:normal\">-</span><span style=\"font-weight:400;font-style:normal\">系统干预强杠杆点：</span></li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">缩短时间延迟，</span></li> </ol> </ol> <p style=\"margin-left:4.91em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">比如提高供应链的反应速度</span><span style=\"font-weight:700\">，需求一来马上可以供货，像库克的苹果供应链</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"2\"><span style=\"font-weight:400;font-style:normal\">增强调节回路或弱化增强回路，</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如增强人的免疫力来增强调节回路，或是及时注射疫苗来弱化病毒传播的增强回路</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"3\"><span style=\"font-weight:400;font-style:normal\">新建信息流的反馈回路，</span></li> </ol> <p style=\"margin-left:4.91em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如地下水的公地悲剧，可以新建用水价信息的反馈回路</p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"4\"><span style=\"font-weight:400;font-style:normal\">系统目标设定，</span></li> </ol> <p style=\"margin-left:4.91em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">比如部门的目标设定成不加代价百分百完成任务</span><span style=\"font-weight:700\">，还是让大家更平衡更持久的输出</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"5\"><span style=\"font-weight:400;font-style:normal\">社会范式</span></li> </ol> <p style=\"margin-left:4.91em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">好比公司的value</span><span style=\"font-weight:700\">，就对应不同的KPI设定，像micron的</span><span style=\"font-weight:700\">safety,people,cost,technology etc</span><span style=\"font-weight:700\">，就决定了要设定哪些strategy和focus</span></p> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"6\"><span style=\"font-weight:400;font-style:normal\">-</span><span style=\"font-weight:400;font-style:normal\">与系统共舞诀窍：</span></li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">去了解系统事实而非道听途说，</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">--比如有人说全球降雨量减少</span><span style=\"font-weight:400;font-style:normal;color:#0070C0\">，其实是波动大了</span></li> <li>准确的语言描述并扩展语言来表达复杂系统，<span style=\"color:#0070C0\">--类似李笑来”清晰的概念“</span><span style=\"color:#0070C0\">，比如情绪描述的词</span></li> <li>关注重要而仅非能被衡量的 <span style=\"color:#0070C0\">-- </span><span style=\"color:#0070C0\">如爱，正义</span></li> <li>减少外部干预对系统自我调节影响，<span style=\"font-weight:700;color:#0070C0\">--比如我cover val的时候不重组部门</span><span style=\"font-weight:700;color:#0070C0\">，而是要激发本来的活力</span></li> <li>在决策和结果间建立起反馈，<span style=\"font-weight:700;color:#0070C0\">-- 比如让公司高官的薪资和公司股价挂钩</span></li> <li>保持谦逊持续学习 <span style=\"color:#0070C0\">-- 比如查理芒格讲的学习更多的跨学科知识</span><span style=\"color:#0070C0\">，持续的学习</span></li> </ol> </ol> </ul>"},{"kind":"l2","title":"效率与自控","by":"user"},{"kind":"book","title":"掌控习惯 : 如何养成好习惯并戒除坏习惯","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/34326931/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">掌控习惯</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 如何养成好习惯并戒除坏习惯</span></a></p>","html":"<ul> <ul type=\"disc\"> <li>cue提示 --让它显而易见—</li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">列出执行意图 - 即清晰的计划 </span></li> </ol> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li style=\"color:#FA0000\" value=\"2\"><span style=\"font-weight:400;font-style:normal;color:#FA0000\">让提示显而易见，</span><span style=\"font-weight:400;font-style:normal\">比如吉他放客厅直接 </span></li> <li style=\"color:#FA0000\"><span style=\"color:#FA0000\">把习惯与特定的环境绑定</span>，比如电脑打开轻音乐表示学习 </li> </ol> <li>crave渴求 --让它有吸引力—</li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li value=\"1\"><span style=\"font-weight:400;font-style:normal\">绑定喜好-- 做了我需要做的，就能去做我喜欢做的了，比如写半小时笔记就可以刷十分钟小红书 </span></li> </ol> <li><span> </span>respond 回应 --让它简单易行--</li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li style=\"color:#FA0000\" value=\"1\"><span style=\"font-weight:400;font-style:normal;color:#FA0000\">设计环境，降低执行的难度，</span><span style=\"font-weight:400;font-style:normal\">比如提前计划好要读的书或笔记的顺序 </span></li> <li style=\"color:#FA0000\">两分钟原则-- “我就做两分钟先” </li> <li style=\"color:#FA0000\">（把难度保持在拉伸区）</li> </ol> <li><span> </span>reward 奖励 --让它令人愉悦--</li> <ol style=\"font-weight:400;font-style:normal\" type=\"1\"> <li style=\"color:#FA0000\" value=\"1\"><span style=\"font-weight:400;font-style:normal;color:#FA0000\">增强法 - 给好习惯设计即时奖励，给坏习惯设计即时惩罚</span><span style=\"font-weight:400;font-style:normal\">，比如滴答清单记录每天起床没有玩手机，或是熬夜就罚款</span></li> </ol> <li>养成习惯三境界：设定结果，设定过程，定义身份。 </li> <li>习惯养成还要加上刻意练习，即不断反思自查，纠正变差的部分，同时及时提高标准</li> </ul> </ul>"},{"kind":"book","title":"心流 : 最优体验心理学","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/27186106/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">心流</span><span style=\"font-weight:700\"> </span><span style=\"font-weight:700\">: 最优体验心理学</span></a></p>","html":"<p>目反难专掌， 即为进入心流的五要素 </p> <p style=\"margin-left:2.45em;color:#FA0000\">清晰的可行的目标，</p> <p style=\"margin-left:2.45em\">及时的反馈，</p> <p style=\"margin-left:2.45em;color:#FA0000\">合适的难度（拉伸区）， </p> <p style=\"margin-left:2.45em\">专注的环境，</p> <p style=\"margin-left:2.45em\">自我的对当下的掌控感，</p>"},{"kind":"l2","title":"学习能力与方法","by":"user"},{"kind":"book","title":"学习之道","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/26895988/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">学习之道</span></a></p>","html":"<p>学习的基本原理：</p> <p style=\"margin-left:2.45em\">1）先<span style=\"color:#FA0000\">专注模式，再发散模式，交替发生</span>，好比砌墙的砖与水泥； 发散模式会如水泥般整合内容，甚至促成新灵感，同时也帮助你恢复精力；但<span style=\"color:#FA0000\">发散模式到下一个专注模式不可太久，</span>否则已经遗忘了。</p> <p style=\"margin-left:2.45em\">2）<span style=\"color:#FA0000\">进入发散模式可以用3B</span>（bed,bath,bus),也可以运动听音乐冥想进入；但<span style=\"color:#FA0000\">不可以是游戏上网看电视等</span>，因为你的注意力依然在消耗。 </p> <p style=\"margin-left:2.45em\">3）<span style=\"color:#FA0000\">学习需要间隔性重复的反复强化</span>，本质上就是不断去加强不同的联结点，好比弹球上的弹柱久了就软化； </p> <p style=\"margin-left:2.45em\">4）学习不要一来就太专注细节，<span style=\"color:#FA0000\">先通读，再进去学细节</span>；也可以换个环境学 </p> <p style=\"margin-left:2.45em\">5）人的记忆系统有工作记忆和长期记忆系统，如DRAM和NAND；<span style=\"color:#FA0000\">利用NAND的方法主要就是频繁复习，这样调用起来最快 </span></p> <p style=\"margin-left:2.45em\">6）<span style=\"color:#FA0000\">记忆碎片可以组成更大的组块；一旦形成就不用再纠结基础信息</span>；步骤就是集中注意力，联结到自己知识体系，设置何时可使用，好比指针</p>"},{"kind":"l1","title":"为人处世","by":"user"},{"kind":"l2","title":"人际沟通","by":"user"},{"kind":"book","title":"谈话的力量","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/1183730/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">谈话的力量</span></a></p>","html":"<ul> <ul type=\"disc\"> <li>输出他人：</li> </ul> <p style=\"margin-left:2.45em\"><span style=\"color:#FA0000\">提开放式问题</span>，真诚的称赞，分享关于自己; </p> <ul type=\"disc\"> <li>接收他人：</li> </ul> <p style=\"margin-left:2.45em\">积极的倾听，<span style=\"color:#FA0000\">寻找自由话题；</span></p> </ul>"},{"kind":"book","title":"影响力","by":"user","titleHtml":"<p>影响力</p>","html":"<p>人在某些情境的触发下会<span style=\"color:#FA0000\">本能的被影响</span>，因为人们追求最高效的捷径，且<span style=\"color:#FA0000\">情况越复杂越需要</span>；</p> <p>6大触发情境：</p> <p>1. 互惠：回报别人的好。因为人类社会认可懂回报的人。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如给执法人员送礼让其帮忙；政治同盟里的互利互惠；销售中给人发试用装</p> <p><span style=\"background:yellow\">特点</span>1）<span style=\"color:#FA0000\">即便讨厌你，互惠依然有效</span>2）小恩惠也会获得大回报3）<span style=\"color:#FA0000\">“拒绝</span><span style=\"color:#FA0000\">-</span><span style=\"color:#FA0000\">让步”</span>谈判法是互惠的应用。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 1）比如克里希纳会在机场塞你鲜花，虽然不愿意但是还是会捐款</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 3）比如销售先给你推销最贵的包，你拒绝后再推销更便宜的，你就更容易接受；<span style=\"font-weight:700;color:#0070C0\">或是公司排名的时候，我先说觉得我的几个人都应该最高排名，而后</span><span style=\"font-weight:700;color:#0070C0\">Adeline拒绝我再提出平均分配</span></p> <p><span style=\"background:yellow\">防卫</span>：以恩报公平互惠之恩，<span style=\"color:#FA0000\">以拒绝恩惠或拒绝回报报</span><span style=\"font-weight:700;color:#FA0000\">占便宜陷阱</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如一个人送我一套试用装，是因为之后要卖个我很不划算的产品，我大可以心安理得的接受用，但拒绝购买之后的产品。关键是能分辨出她的恩惠是不是为了占你便宜</p> <p>2.承诺与一致：与过去言行一致。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700;color:#0070C0\">比如我问liliang是不是真的相信t3spro</span>,或是暂时离开时让特定的陌生人帮忙保管物品</p> <p><span style=\"background:yellow\">特点</span>，关键是让人许诺，而1)<span style=\"color:#FA0000\">书面形式</span><span style=\"color:#FA0000\">/2</span><span style=\"color:#FA0000\">）自愿作出的</span><span style=\"color:#FA0000\">/3</span><span style=\"color:#FA0000\">）付出更高代价的承诺更有效</span>。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 1)书面形式--比如评价直线长度的实验里<span style=\"color:#7030A0\">写下并公布答案的人最晚更改结论</span>/</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 2)自愿作出--比如恐吓宝宝不去碰一个玩具，几个月后再来他们反而更想碰；在初始理解了玩具危险性且<span style=\"color:#7030A0\">自愿决定不碰的，几个月后还是不碰</span>/</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 3)更高代价--比如面试时更高的难度，或是<span style=\"color:#7030A0\">兄弟会更复杂的入会仪式</span></p> <p><span style=\"background:yellow\">防卫</span>：肠胃或心灵深处的声音会告诉你<span style=\"color:#FA0000\">这是愚蠢的一致性</span></p> <p style=\"color:#FA0000\"> </p> <p>3.社会认同：从众行为。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700;color:#7030A0\">比如喜剧节目里插入的笑声</span><span style=\"color:#7030A0\">；</span>广告商强调的销量最高；看别人都排队自己也去排</p> <p><span style=\"background:yellow\">特点</span>：1）<span style=\"color:#FA0000\">不确定形势</span>/2）<span style=\"color:#FA0000\">别人与自己身份相识</span>，更易参照别人。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 1） <span style=\"color:#7030A0\">比如多人目击的凶案</span><span style=\"color:#7030A0\">，因为没人出头反而大家都旁观</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 2）比如有自杀倾向的人看到电视报道的自杀事件，反而更容易行动；<span style=\"color:#7030A0\">比如一个小孩看另一个小孩很勇敢学游泳，自己就也会很勇敢去做</span></p> <p>防卫：发现可能的诱导，<span style=\"color:#FA0000\">自己去确认完整真实的信息</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如看到有人排队，去看下队头排的是什么商品，你是否真的需要</p> <p>4.喜好：</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如百货公司会让你的朋友给你推荐某一商品；<span style=\"font-weight:700;color:#7030A0\">比如车展都会安排美女模特</span></p> <p><span style=\"background:yellow\">特点</span>：1）漂亮<span style=\"color:#FA0000\">外表</span><span style=\"color:#FA0000\">/2</span><span style=\"color:#FA0000\">）与自己背景观点相似</span><span style=\"color:#FA0000\">/3</span><span style=\"color:#FA0000\">）奉承你的人</span>更让你喜欢 4<span style=\"color:#FA0000\">）爱屋及乌</span>。</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 1）比如长相英俊的政治家更容易获得选票 2）<span style=\"color:#7030A0\">比如销售人员会刻意说自己有和你一样的共同爱好，获取好感</span> 4）比如运动品牌会找知名运动员来代言，让你爱屋及乌</p> <p><span style=\"background:yellow\">防卫</span>：觉察到对该人<span style=\"color:#FA0000\">喜爱程度或速度超乎常态</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如一个汽车销售员让你几分钟内就想买这辆车，那就要问你喜欢的是车还是人</p> <p style=\"color:#FA0000\"> </p> <p>5.权威：</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 1 比如之前穿着军装的骗子去政府咋骗；<span style=\"font-weight:700\">比如</span><span style=\"font-weight:700;color:#7030A0\">穿着白大褂的明星给养生品打广告</span></p> <p><span style=\"background:yellow\">特点</span>：1）<span style=\"color:#FA0000\">权威表象如头衔衣着而非内涵即可让人顺从</span>。</p> <p><span style=\"background:yellow\">防卫</span>：问自己该人是否该领域真权威，与<span style=\"color:#FA0000\">他的话是否真的为我好</span></p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如<span style=\"color:#7030A0\">意识到白大褂的明星不是真的专家</span>，再比如<span style=\"color:#7030A0\">饭店服务员刻意透露后厨哪道菜新鲜是为了赚小费还是真心对顾客</span></p> <p style=\"color:#FA0000\"> </p> <p>6.稀缺：越短缺，越高价值；<span style=\"color:#FA0000\">得到的自由受限会让人愿付出更高代价重新拥有</span>。（因为人有保护既得利益的本能--心理抗拒）</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> 比如手机销售的饥饿营销；<span style=\"font-weight:700;color:#7030A0\">比如亲身体会里掉一副耳机的痛苦远超买新耳机的兴奋</span>；比如青少年越压制他们越叛逆</p> <p style=\"margin-left:2.45em\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"color:#7030A0\">比如革命者往往都是过了好日子的</span>；<span style=\"font-weight:700;color:#0070C0\">比如工作中员工初始福利高就会后期不接受无</span><span style=\"font-weight:700;color:#0070C0\">OT</span><span style=\"font-weight:700;color:#0070C0\">，所以加福利要谨慎；比如对宝宝或员工初始太自由，之后再严厉就很难</span></p> <p><span style=\"background:yellow\">特点</span>：1）<span style=\"color:#FA0000\">渐渐短缺</span>会比一直短缺更让人渴望。</p> <p>防卫：觉察自己进入了稀缺状态；<span style=\"color:#FA0000\">问自己若无稀缺是否对自己还有同等高价值，是则值得继续买</span></p> <p style=\"margin-left:2.45em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"font-weight:700\">比如自己买这套房子，如果抛开担心它的稀缺性（即之后再也遇不到了），我用这个价格买到这个view是不是划算，觉得是就表明可以买了</span></p>"},{"kind":"book","title":"与家人相处的秘密","by":"claude","bookId":"b-022","titleHtml":"<p><span style=\"font-weight:700\">与家人相处的秘密</span></p>","html":"<p>核心：<span style=\"color:#FA0000;font-weight:700\">边界越清晰，情感的流动反而越健康</span>。判断一份好意是爱还是控制，看它让对方<span style=\"color:#FA0000\">更独立还是更依附</span>。</p><p>1. <span style=\"font-weight:700\">真爱 vs 控制</span>：真爱是赋能，鼓励对方成为独立个体；控制以爱为名制造依赖。控制背后常是三种情感：<span style=\"color:#FA0000\">恐惧</span>（怕失控、怕脆弱暴露）、<span style=\"color:#FA0000\">愧疚</span>（“我为你牺牲了这么多”）、<span style=\"color:#FA0000\">责任</span>（“你应该怎样”）。</p><p>2. <span style=\"font-weight:700\">边界</span>：厘清“我是我，你是你”——<span style=\"color:#FA0000\">不为他人的情绪负责，也不让他人定义自己的价值</span>；缺乏边界的家庭会互相情感勒索、集体耗竭。</p><p>3. <span style=\"font-weight:700\">面对情绪化的父母</span>：承认有些事永远无法改变，放弃不切实际的期待；<span style=\"color:#FA0000;text-decoration:underline\">试图改变父母其实是一种隐秘的自恋和权力争夺</span>，注定徒劳。可以只听不说，告诉自己“这是她的情绪和人生课题”。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 学到了，我也可以对父母只听不反驳</span></p><p>4. <span style=\"font-weight:700\">与控制型母亲“分离”</span>：不一刀切、给彼此留回旋余地；<span style=\"color:#FA0000\">主动告诉她在我未来规划里被尊重的位置</span>，缓解被抛弃感；以平等成年人而非听话孩子的姿态沟通，必要时示弱，效果好过硬碰硬。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 凡事留一线；我也可以把类似的计划分享给父母——以爱为本、用情不用理，同时表达对自己人生做主的态度</span></p><p>5. <span style=\"font-weight:700\">关系复刻</span>：人会在亲密关系中无意识复刻原生家庭模式（甚至“与攻击者认同”），因为<span style=\"color:#FA0000\">熟悉的痛苦比陌生的健康更让人感到安全</span>。</p><p style=\"margin-left:1.6em\"><span style=\"color:#0070C0\">+ 深有同感：父母觉得要大方请客我就请客，说对伴侣要包容我就包容——很多处理方式都是在家里习得的</span></p><p>6. <span style=\"font-weight:700\">谁痛苦谁改变</span>：关系像跷跷板，一方改变另一方必随之调整；<span style=\"color:#FA0000;font-weight:700\">停止等待和要求对方改变</span>，问“我能做些什么让情况不同”。</p><p>7. <span style=\"font-weight:700\">恰到好处的挫折</span>：密不透风的爱会剥夺孩子自我安抚、独处、应对挫折的机会；<span style=\"color:#FA0000;font-weight:700\">安全感来自温柔而坚定的边界</span>，让孩子在安全范围内体验微小的失望。</p>"},{"kind":"l2","title":"管理类","by":"user"},{"kind":"book","title":"卓有成效的管理者","by":"user","titleHtml":"<p><a href=\"https://book.douban.com/subject/1322025/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-weight:700\">卓有成效的管理者</span></a></p>","html":"<p>1. 为什么要有效：</p> <p style=\"margin-left:2.45em\">员工能力的量化，员工内在动力源泉； </p> <p style=\"margin-left:2.45em;color:#FA0000\">让管理者跳出细节多思考策略与贡献 </p> <p>2.1掌握自己的时间-</p> <p style=\"margin-left:2.45em\">1）记录时间的分配，不做没有成果的，找别人做不影响效果的 </p> <p style=\"margin-left:2.45em\">2）<span style=\"color:#FA0000\">对反复出现的灭火建立机制从源头解决甚至预判危机 </span></p> <p style=\"margin-left:2.45em\">3）拼出块状时间做最重要的事比如人事决策 </p> <p>2.2：注重贡献而不是花的精力（帮助你放大格局思考我该做而不是能做什么）</p> <p style=\"margin-left:2.45em;color:#FA0000\">1）思考别人需要什么和自己的能力如何为人所用- like transformative team, how to add value </p> <p style=\"margin-left:2.45em;color:#FA0000\">2）追求成果而不是好的人际关系 </p> <p>2.3：发挥人的长处 -</p> <p style=\"margin-left:2.45em\">1）因事设人，让他扬其所长 </p> <p style=\"margin-left:2.45em;color:#FA0000\">2）了解自己的长处，建立发挥我长的工作方式 </p> <p>2.4：集中精力做重要的事-</p> <p style=\"margin-left:2.45em;color:#FA0000\">1）一次只做一件事</p> <p style=\"margin-left:2.45em\">2）提前规划时间避免赶工</p> <p style=\"margin-left:2.45em;color:#FA0000\">3）抛开压力后去做长期有利的事 </p> <p>2.5：做有效的决策-</p> <p style=\"margin-left:2.45em\">1）<span style=\"color:#FA0000\">思考清楚自己最终目的和绝不能妥协的部分</span> （boundary and end goal)</p> <p style=\"margin-left:2.45em\">2）确保可被执行</p>"},{"kind":"book","title":"Winning","by":"user","titleHtml":"<p>Winning</p>","html":"<p>1.<span style=\"font-weight:700\">Mission</span>: clear <span style=\"font-weight:700;color:#FA0000\">direction of how to win</span>, with inspiration to employee; Value:behaviours needed to win</p> <p>2.No <span style=\"font-weight:700\">candor</span> is human nature, to avoid conflict. </p> <p>Candor need reward it + leader demonstrate it eg direct performance feedback</p> <p>3.Difficult to do <span style=\"font-weight:700\">differentiation</span> because 1)looks bad to low performer? but they still need go in bad economy + no differentiation creates unfair culture <span style=\"font-weight:700;color:#FA0000\">2)demotivate mid 70? But it actually set high expectation to leader, if you can scrutinize and provide clear feedback</span> to mid 70, they can be even more motivated; </p> <p>Differentiation can get top 20 motivated, mid 70 knowns how to reach top, bot 10 knows change needed, like grades in school. </p> <p>Top20 need reward, recognition, training, mid 70 need clear goal setting and opportunity of testing leader skill; bot 10 have to go.</p> <p>4.<span style=\"font-weight:700\">Leader: every opportunity</span> to <span style=\"font-weight:700;color:#FA0000\">evaluate, coach and build self confidence</span>; promote <span style=\"font-weight:700;color:#FA0000\">positive</span> culture; build <span style=\"color:#FA0000\">trust</span> with candor; with courage of <span style=\"color:#FA0000\">making unpopular decision</span>(you here to lead, not to be popular);<span style=\"color:#FA0000\">ask right questions</span> with paranoid mindset;<span style=\"color:#FA0000\"> encourage risk and learn</span>; <span style=\"color:#FA0000\">celebrate</span></p> <p>5.<span style=\"font-weight:700\">Hiring</span>: basic(integrity+intelligence+maturity); <span style=\"font-weight:700;color:#FA0000\">4E1P(POSITIVE ENERY, energize, edge, execute, passion);</span>hiring leader(<span style=\"font-weight:700;color:#FA0000\">authenticity, foresight of anticipate unexpected, surround by talent, high resilience</span>); </p> <p>other hints(hire based on potential not readiness. exaggerate challenge of job during interview; positive energy and passion is must have for a job.)</p> <p>6.<span style=\"font-weight:700\">People management</span>: use a<span style=\"font-weight:700;color:#FA0000\"> non bureaucratic evaluation system(doing well and how improve</span>; who is successor); <span style=\"font-weight:700;color:#FA0000\">use MRT(MONEY, RECOGNITION, TRAINING) to retain talent</span>; take <span style=\"font-weight:700;color:#FA0000\">middle 70% as heart of org</span>(will shine with good care; those work hard quietly will be future star); design org as flat as possible</p> <p>7.<span style=\"font-weight:700\">Parting ways</span>: avoid surprise, <span style=\"font-weight:700;color:#FA0000\">point out performance gap early</span> with candor; <span style=\"font-weight:700\">protect his confidence</span> even let him go</p> <p>8.<span style=\"font-weight:700\">Change management</span>:<span style=\"font-weight:700;color:#FA0000\">attach change to a clear reason(use data</span> to explain rationale) + <span style=\"font-weight:700;color:#FA0000\">promote true believers</span> + get read of resisters even if good performance</p> <p>9.<span style=\"font-weight:700\">Crisis management</span>: <span style=\"font-weight:700;color:#FA0000\">build immunity to prevent(tight control system, good BP, transparency culture)</span>; <span style=\"font-weight:700;color:#FA0000\">Assume problem is worse than appeared</span> &amp; blood needed in crisis &amp; your org will survive and stronger</p> <p>10.<span style=\"font-weight:700\">Strategy</span>: <span style=\"font-weight:700\">What</span>-<span style=\"font-weight:700;color:#FA0000\">make choice on how to compete given you cannot have everything</span>. </p> <p><span style=\"font-weight:700\">How</span>-1.Find a best way to <span style=\"color:#FA0000\">gain sustainable competitive advantage</span> 2.put <span style=\"color:#FA0000\">right people</span> in right job to drive forward 3. <span style=\"color:#FA0000\">Continuous learning</span> and improve </p> <p>11.<span style=\"font-weight:700\">organic growth</span>(new startup): spent enough resource and <span style=\"font-weight:700\">assign 4E1P leader</span> + <span style=\"font-weight:700\">cheer the potential</span> and win of it + <span style=\"font-weight:700\">provide enough autonomy</span>; for leader running venture: <span style=\"font-weight:700\">earn the trust + stay humility</span> to have good relationship with other team </p> <p>12.<span style=\"font-weight:700\">Best job fit</span>: <span style=\"font-weight:700;color:#FA0000\">pay + people + opportunity(learn and grow) + options(widen future choice) + ownership(you choose to, not force to) + work content interest</span></p> <p>13.<span style=\"font-weight:700\">Getting promoted</span>: <span style=\"font-weight:700;color:#FA0000\">DELIVER BEYOND EXPECTATION RESULT &amp; GO BEYOND YOUR OFFICIAL BOUNDARY</span> + manage good relationship with subordinate +<span style=\"font-weight:700;color:#FA0000\">join company's new but risky initiative</span> +get input from all <span style=\"font-weight:700;color:#FA0000\">mentors</span> + spread <span style=\"font-weight:700;color:#FA0000\">positive</span> attitude + <span style=\"font-weight:700;color:#FA0000\">don’t break by setback</span></p> <p>14.<span style=\"font-weight:700\">Handle bad boss</span>: <span style=\"font-weight:700;color:#FA0000\">NEVER SEE YOUR SELF AS VICTIM, you NEED OWN YOUR CHOICE</span> +if my boss on the way out(-&gt;<span style=\"font-weight:700;color:#FA0000\">deliver strong result as usual</span>)+if company knows your situation though boss not out(-&gt;trust company, reward will come with your result) +still cannot endure(-&gt;if not worth it, plan exit, but minimize damage to yourself; if some long term benefit, focus on pros, accept those trade off)</p> <p>15.<span style=\"font-weight:700\">WLB</span>: <span style=\"font-weight:700;color:#FA0000\">YOU CANNOT HAVE ALL, it’s all about priority choice and do trade off</span>, then live with consequence. 1. <span style=\"color:#FA0000\">Your boss priority is company win first</span>, if possible let you happy meanwhile 2.<span style=\"color:#FA0000\">more flexibility in WLB need earn</span> through performance 3.people struggle with WLB will be assessed as “uncommitted, incompetent” 4.<span style=\"color:#FA0000\">WLB is your problem not leader’s</span>, you need assess the trade off, and say NO to those outside your plan </p>"},{"kind":"book","title":"只有偏执狂才能生存","by":"user","titleHtml":"<p>只有偏执狂才能生存</p>","html":"<p><span style=\"background:lime\">├── 核心概念</span></p> <p>│   ├── <span style=\"color:#FA0000\">战略转折点：外部环境剧变，原有规则失效，需根本性调整 (非时间点，是过程)</span><br> │   └── <span style=\"color:#FA0000\">10倍速变化：引发转折点的原因，</span>短期内因素势力增至10倍，颠覆旧秩序<br> │       └── 六大因素：<br> │           ├── 竞争对手 (现有/潜在) - 例：超市 vs 小店；数字媒体 vs 娱乐<br> │           ├── 供应商 (原材料等提供者)<br> │           ├── 客户 (最终用户及需求)<br> │           ├── 潜在对手 (未入市但可能加入)<br> │           ├── 替代方案 (颠覆性技术/方法) - 例：公路/航空 vs 铁路；微处理器 vs 运算；互联网 vs 传统通信<br> │           └── 互补企业 (提供互补产品/服务)</p> <p><span style=\"background:lime\">├── 如何识别 (战略)</span></p> <p>│   ├── 关注六大因素变化<br> │   ├── <span style=\"color:#FA0000\">“良方”测试变化 (子弹打谁？答案模糊/新目标 = 格局变化)</span><br> │   ├── <span style=\"color:#FA0000\">关注“卡桑德拉”预警 (中层/销售人员的早期发现)<br> </span>│   ├── 识别“战略矛盾” (言行不一致)<br> │   ├── <span style=\"color:#FA0000\">重视最初模型潜力 (区分优劣与长期潜力)<br> </span>│   └── 警惕数据陷阱 (数据说明过去，经验更重要)</p> <p><span style=\"background:lime\">├── 如何应对 (战略)</span></p> <p>│   ├── 接受现实，不否认/逃避<br> │   ├── <span style=\"color:#FA0000\">大胆实验，容忍混乱 (尝试新技术/产品/渠道/客户)<br> </span>│   ├── <span style=\"color:#FA0000\">尽早行动，不犹豫 (在实力削弱前)<br> </span>│   ├── <span style=\"color:#FA0000\">明确新战略，重分配资源 (人力/资金/时间从旧业务到新业务)<br> </span>│   ├── <span style=\"color:#FA0000\">加强沟通，保持凝聚力<br> </span>│   └── 领导者果断决策 (即使放弃辉煌业务)</p> <p><span style=\"background:lime\">├── 职业转折点 (个人)</span></p> <p>│   ├── 识别方法：<br> │   │   ├── <span style=\"color:#FA0000\">保持警觉，关注行业变化<br> </span>│   │   ├── <span style=\"color:#FA0000\">善用人际关系网<br> </span>│   │   ├── <span style=\"color:#FA0000\">关注公司商业/财务信息<br> </span>│   │   ├── 克服否认心理<br> │   │   └── “精神消防演练”<br> │   └── 应对要点：<br> │       ├── 坚定信念<br> │       ├── <span style=\"color:#FA0000\">积极行动<br> </span>│       └── <span style=\"color:#FA0000\">适应新环境</span></p> <p><span style=\"background:lime\">└── 生命转折点 (个人) </span></p> <p style=\"margin-left:2.45em\">- 例：格鲁夫抗癌经历，<span style=\"color:#FA0000\">保持积极主动，寻求最佳方案</span></p> <p style=\"color:#FA0000\"> </p>"},{"kind":"book","title":"The Ride of a Lifetime: Key Insights from Bob Iger's 15 Years as Disney CEO","by":"user","titleHtml":"<p>The Ride of a Lifetime: Key Insights from Bob Iger's 15 Years as Disney CEO</p>","html":"<p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   ├── Core Leadership Principles</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Optimism </span><span style=\"color:#2D2D2D;background:#F0F4F9\">(Maintain belief in ability, avoid pessimism)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Focus/Prioritization </span><span style=\"color:#2D2D2D;background:#F0F4F9\">(Allocate resources to critical strategies/problems/projects, communicate clearly)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Three core priorities as CEO (high-quality branded content, embracing technology, global expansion)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Fairness &amp; Empathy</span><span style=\"text-decoration:underline;color:#2D2D2D;background:#F0F4F9\"> (Treat people fairly/decently)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Contrast: </span><span style=\"text-decoration:underline;color:#7030A0;background:#F0F4F9\">Roone Arledge's style sometimes fostered fear, hindering risk-taking</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Thoughtfulness</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> &amp; Analysis (Gain knowledge for informed decisions, do the work)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   ├── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Thoroughly vetting acquisitions (e.g., Pixar)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── Caution: Avoid analysis paralysis, </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">recognize role of instinct/risk</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Authenticity &amp; Honesty</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Be genuine, operate with integrity</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   ├── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Upfront about lack of Hollywood experience</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Integrity (Uphold high ethical standards, demand honesty)</span></p> <p style=\"color:#2D2D2D\"><span style=\"background:#F0F4F9\">│   │   │   └── </span><span style=\"text-decoration:underline;background:#F0F4F9\">Quote: \"The way you do anything is the way you do everything.\"</span></p> <p style=\"margin-left:2.45em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"background:#F0F4F9\">Same concept can also use for my daily life, like whether \"take half day leave but not claim\"</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   └── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Relentless Pursuit of Perfection/Excellence</span><span style=\"text-decoration:underline;color:#2D2D2D;background:#F0F4F9\"> (Refuse mediocrity, strive for greatness, focus on quality)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │       ├──</span><span style=\"color:#7030A0;background:#F0F4F9\"> Mentor: Roone Arledge exemplified pushing for greatness</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │       └── </span><span style=\"text-decoration:underline;color:#FA0000;background:#F0F4F9\">Detail Focus: Greatness in getting small details right (learned from Michael Eisner)</span></p> <p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   ├── Managing Creativity and Talent</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Respect &amp; Empathy</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Mindful of creators' passion, balance management with care, give notes big picture first)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Empowerment </span><span style=\"color:#2D2D2D;background:#F0F4F9\">(Trust talented people, give autonomy/support, decentralize where appropriate)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Bet on Talent</span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\"> potential</span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\"> (Value ability often more than specific experience</span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">, put talented people in positions to grow)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"text-decoration:underline;color:#7030A0;background:#F0F4F9\">Example: Murphy/Burke promoting Iger into roles without prior experience</span></p> <p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   ├── Strategy and Vision</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── Clear Road Map (Define and communicate</span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\"> vision/strategy: \"Where we want to be, how to get there\"</span><span style=\"color:#2D2D2D;background:#F0F4F9\">)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">Prioritize Ruthlessly </span><span style=\"color:#2D2D2D;background:#F0F4F9\">(Focus capital/energy on few key priorities, avoid diluting efforts)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   └── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Long-Term Value (Make decisions based on long-term value, even with short-term pain)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │       └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Justifying Pixar price based on long-term creative/cultural value</span></p> <p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   ├── Acquisitions and Integration</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├──</span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\"> Strategic Fit (Ensure acquisitions align with core priorities</span><span style=\"color:#2D2D2D;background:#F0F4F9\">: IP, technology, global reach)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── People &amp; Culture (Acquisitions often about talent/culture, </span><span style=\"font-weight:700;color:#FA0000;background:#F0F4F9\">protect acquired company's unique culture</span><span style=\"color:#2D2D2D;background:#F0F4F9\">)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Promising Jobs/Lasseter/Catmull Pixar's culture would be protected</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"color:#FA0000;background:#F0F4F9\">Build Trust</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Establish personal trust with target company leaders/founders)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Examples: Relationships with Jobs (Pixar), Perlmutter (Marvel), Lucas (Lucasfilm), Murdoch (Fox)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   └──</span><span style=\"color:#FA0000;background:#F0F4F9\"> Sensitivity &amp; Respect</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Understand emotional stakes for sellers/founders, negotiate respectfully/honestly)</span></p> <p style=\"margin-left:2.45em;color:#0070C0\"><span class=\"bs-ico bs-ico-ref\" title=\"参考资料及链接\">✳</span> <span style=\"background:#F0F4F9\">Like today work with taiwan </span></p> <p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   ├── Handling Crises and Adversity</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000\">Compartmentalize (Focus on immediate responsibilities, trust team with others)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├──</span><span style=\"color:#FA0000\"> Stay Calm</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Approach bad news as problem to solve, maintain composure)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"text-decoration:underline;color:#FA0000;background:#F0F4F9\">Face Issues Directly</span><span style=\"text-decoration:underline;color:#2D2D2D;background:#F0F4F9\"> (Address problems head-on with empathy/honesty, don't hide behind spokespeople)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Directly addressing board/investors during Comcast takeover attempt/Roy Disney proxy fight</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"text-decoration:underline;color:#FA0000;background:#F0F4F9\">Take Responsibility</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Own up to mistakes honestly, builds trust)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └──</span><span style=\"color:#7030A0;background:#F0F4F9\"> Example: Taking responsibility for failures like Cop Rock</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   └── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Manage Stress (Recognize toll of high-pressure situations, find ways to maintain perspective)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │       └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Example: Experiencing anxiety attack during CEO succession, needing to recalibrate</span></p> <p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   ├── Personal Development and Influences</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Mentorship (Learn from bosses/mentors,</span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:yellow\"> adopt strengths</span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">, avoid weaknesses)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   │   └── </span><span style=\"color:#7030A0;background:#F0F4F9\">Examples: Perfectionism/innovation from Arledge; decency/focus/empowerment from Murphy/Burke; detail from Eisner</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   ├── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Humility (Maintain self-awareness, acknowledge luck/others' contributions, avoid arrogance)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│   │   └── </span><span style=\"font-weight:700;text-decoration:underline;color:#FA0000;background:#F0F4F9\">Lifelong Learning </span><span style=\"color:#2D2D2D;background:#F0F4F9\">(Continuously seek knowledge, especially in new territory, ask questions)</span></p> <p style=\"color:#2D2D2D\"><span style=\"background:lime\"><span style=\"background:#F0F4F9\">│   └── Communication and Presence</span></span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│       ├── </span><span style=\"text-decoration:underline;color:#FA0000;background:#F0F4F9\">Be Accessible</span><span style=\"text-decoration:underline;color:#2D2D2D;background:#F0F4F9\"> (Make time for people, listen, respect time, avoid signaling being too busy)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│       ├── </span><span style=\"text-decoration:underline;color:#FA0000;background:#F0F4F9\">Communicate Clearly</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Articulate vision/priorities/decisions directly/repeatedly)</span></p> <p><span style=\"color:#2D2D2D;background:#F0F4F9\">│       ├── </span><span style=\"color:#FA0000;background:#F0F4F9\">Honesty in Difficult Conversations</span><span style=\"color:#2D2D2D;background:#F0F4F9\"> (Be direct, honest, empathetic when delivering bad news/firing, </span><span style=\"color:#FA0000;background:#F0F4F9\">do it in person</span></p>"},{"kind":"l1","title":"知识面扩宽","by":"user"},{"kind":"l2","title":"传记","by":"user"},{"kind":"book","title":"穷查理宝典 (珍藏版)","by":"user","titleHtml":"<p>穷查理宝典 (珍藏版)</p>","html":"<p>-生活理念上：</p> <p style=\"margin-left:2.45em\"><span style=\"text-decoration:underline\">1</span><span style=\"text-decoration:underline;color:#FA0000\">.终身学习 </span></p> <p style=\"margin-left:2.45em\"><span style=\"text-decoration:underline\">2. 追求</span><span style=\"text-decoration:underline;color:#FA0000\">超越单一学科，结合不同学科重要理论，形成自己的终极思维框架</span><span style=\"text-decoration:underline\">，且生活中应用当中的各种模型 </span></p> <p style=\"margin-left:2.45em\"><span style=\"text-decoration:underline\">3.</span><span style=\"text-decoration:underline;color:#FA0000\"> 商才士魂，即自我提升开始，修身齐家，再去帮助他人，治国平天下 </span></p> <p style=\"margin-left:2.45em\">4. <span style=\"color:#FA0000\">投资要长远</span>，重要的是它的真实价值</p> <p style=\"margin-left:2.45em\">5.弄清自己的优势，尽量在能力圈里竞争 </p> <p>-书单：</p> <p style=\"margin-left:2.45em\">自然（自私的基因），人类（语言本能），经济（国富国穷），投资，人生（我生活的种种模式），处世（影响力） </p> <p>-普世智慧中的关键模型：</p> <p style=\"margin-left:2.45em\">数学复利原理，决策树；工程学临界质量概念；心理学；微观经济学冲浪模型 </p> <p>--人生的重要道理：</p> <p style=\"margin-left:2.45em\">1.终身学习是生活美好的唯一方式</p> <p style=\"margin-left:2.45em\">2.<span style=\"color:#FA0000\">消除嫉妒怨恨自怜自我服务偏好，但理解别人有自我服务偏好 </span></p> <p>--误判心理学：</p> <p style=\"margin-left:2.45em\">影响力的6要素</p> <p style=\"margin-left:2.45em\">+<span style=\"color:#FA0000\">对比错误反应倾向</span></p> <p style=\"margin-left:2.45em;color:#FA0000\">+简单联想倾向（《影响力》喜好一节，“关联）</p> <p style=\"margin-left:2.45em;color:#FA0000\">+自视过高倾向</p> <p style=\"margin-left:4.91em\"><img class=\"bs-img\" style=\"width:404px\" alt=\"1 人 只 有 对 对 比 烈 到 一 定 程 度 的 事 物 才 会 有 感 \n知 ， 2 也 会 在 强 刺 激 下 降 低 敏 感 度 忽 鉻 一 些 弱 刺 \n激 ， 3 誦 过 对 比 设 定 一 个 错 误 的 起 始 锚 点 \n对 比 错 误 反 应 傾 向 \n影 晌 \n1 温 水 煮 眚 蛙 ， 有 的 企 业 每 天 犯 小 错 ， 真 正 意 识 \n到 大 错 时 已 经 来 不 及 了 。 “ 量 变 到 质 变 &quot; \n2 消 费 时 ， 先 大 价 钱 买 的 车 ， 就 容 易 被 怂 恿 再 买 \n几 百 块 的 配 套 装 饰 \n5 销 售 员 会 先 给 你 一 个 很 差 的 产 品 或 很 高 价 格 ， \n而 后 看 的 产 品 或 价 格 都 会 计 你 格 外 满 意 ； 两 个 \n讯 员 ， 黑 脸 的 先 一 来 牿 别 凶 ， 而 后 白 脸 的 就 显 得 \n值 得 信 赖 \" src=\"data:image/png;base64,iVBORw0KGgo

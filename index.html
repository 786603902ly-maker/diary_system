"recent","cluster":"c2"},{"id":"DEO-B-50","quadrant":"DEO","subcat":"B","keyword":"愤怒背后是需求","title":"看见情绪背后没被满足的需求，而不是情绪本身","core":"当别人生气时，不要只看到他的情绪，要看到他未被满足的需求。","action":"","quotes":[],"cases":[{"date":"2020","text":"小美发脾气，不是因为脾气大，而是因为被委屈了，渴望被理解。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"DEO-B-60","quadrant":"DEO","subcat":"B","keyword":"具体的赞美","title":"空洞的夸奖没有力量，具体才有","core":"具体的赞美（“你这个PPT的逻辑架构很清晰”）比空洞的赞美（“你真棒”）更有力量。","action":"","quotes":[],"cases":[{"date":"2019","text":"学习如何给下属有效的正反馈。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"DEO-B-70","quadrant":"DEO","subcat":"B","keyword":"避免读心术","title":"别猜别人怎么想，直接问","core":"不要猜测别人怎么想，直接问。大多数人际烦恼都源于猜测。","action":"","quotes":[{"date":"2024-11-21","text":"有时候及时的当面的沟通很重要。比如Shirlyn的case，我就觉得Koksiak毫无caring，但是聊完发现他还是可以通情达理，接受很多变通。"}],"cases":[{"date":"2017","text":"以为同事不等我吃饭是嫌弃我，其实可能只是单纯饿了。","era":"root"},{"date":"2024-11-21","text":"面对面沟通的力量：原本以为对方冷漠无情，但在直接当面沟通后，发现他其实通情达理，愿意接受变通。猜测往往是恶意的放大镜，沟通因为面对面的温度而变得柔软。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"DEO-C-10","quadrant":"DEO","subcat":"C","keyword":"小家优于原生家庭","title":"愚孝或界限不清，是婚姻破裂的元凶","core":"以夫妻二人的小家为中心，有商有量。对原生家庭保持礼貌但坚定的界限。愚孝或界限不清是婚姻破裂的元凶。","action":"面对不合理要求，不迁就，在尽孝道的同时保护小家利益。","quotes":[{"date":"2023-10-03","text":"我想象过很多种幸福婚姻的样子，遇见你后，一切才有了具体的形状……我愿成为你的丈夫，无论贫穷与富有，快乐与悲伤，疾病与健康，都一路扶持，彼此珍惜。","context":"这一次的婚礼个人非常满意，不管是亲友们的参与度，还是与小美的个人表现，或是整体婚礼流程的完整度。心中一块大石也算是落地，更多也是替松滋父母松了口气。今后也可以以更舒服的姿态与沈阳父母相处。昨晚和小美的彻夜长谈也很棒。关键词就是'以小家为中心，有商有量'。\n\n婚礼誓词：亲爱的小美，我想象过很多种幸福婚姻的样子，遇见你后，一切才有了具体的形状。虽然我们性格一刚一柔，但是在日夜相处的2000天里，我们却有着最无言的默契，对我来说，你是我的同事，是朋友，是爱人，但更是知己。你问过我会不会嫌你太粘人，今天我想认真的回答你，'其实，一天没你黏在身边，我都浑身难受'，你知道我喜欢看海，但是，其实我看过最美的海，是你带笑的眼眸。今天，在各位亲朋好友的见证下，我向我的妻子馨雁起誓：我愿成为你的丈夫，无论贫穷与富有，快乐与悲伤，疾病与健康，都一路扶持，彼此珍惜；从此结发为夫妻，白首不分离。"}],"cases":[{"date":"2023-10-03","text":"婚礼后的界限确认：婚礼的圆满和彻夜长谈，再次确认了“以小家为中心”的绝对原则。面对双方父母（尤其是沈阳父母）的性格缺陷，确立了“不迁就、不争吵、客气疏离”的相处方针。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"DEO-C-20","quadrant":"DEO","subcat":"C","keyword":"亲戚社交能量管理","title":"不再需要亲戚的夸赞来获得认同感","core":"回国过年感到“无趣”且“压力大”的本质：记忆滤镜破碎（童年是“被照顾者”视角的狂欢，现在是“照顾者”视角的责任）；代际文化冲突（核心家庭的原子化生活与原生大家庭的“强行团聚”无法兼容）；需求层级跃迁（不再需要亲戚的夸赞来满足虚荣心和认同感）。","action":"抓大放小：幸福感核心来源是父母、老婆、孩子，其他义务性拜年能减则减。情面规则软着陆：利用孩子做挡箭牌，制造不得不走的理由，实现礼貌撤退。主动设计脚本：用“逛公园、拍全家福”替代“坐着尬聊、打牌”。","quotes":[{"date":"2025-01-31","text":"这次的回国过年经历带给我很多不一样的感悟：让我一次次反思，之前那么期待过年，我到底在期待什么……整套体验，让我发现最期待的部分，似乎也是自己美化过的记忆了——这样一天去一家都很累，且无趣。","context":"这次的回国过年经历带给我很多不一样的感悟：1.让我一次次反思，之前那么期待过年，我到底在期待什么。比如我觉得很大一部分是和舅舅或姨爹亲亲还有别的亲人的初二团聚，可是今年看来，婷姐小妹甚至初二都还在上班，姨爹亲亲也没什么机会聊天互动，同时舅舅还发酒疯，弄的婆婆和妈妈都极其不愉快，最后婆婆舅妈都拉着脸；整套体验，让我发现最期待的部分，似乎也是自己美化过的记忆了。2.切实感受到有宝宝和没有宝宝的确过年是两种心态；没宝宝的时候，过年就是吃喝玩乐，不停吃，打打牌，然后就是看电视看小说，可是带着宝宝的话，就会觉得过年的几天和平时没任何区别，只手机换地方带娃。3.当然第一次和小美的南方过年也有很多额外压力；小美还不能接受我们的吃饭了就打牌的文化，也不喜欢那些屋里的抽烟的味道，最后再加上所有屋子没有暖气，要忍受寒冷，于是整个假期都是一种在忍耐与克制情绪的状态。4.这甚至让我反思，以前是不是我在过年的几天里找到了很多虚荣心与认同感……当然，积极的部分，就是在某些四世同堂的瞬间，大家都能开怀大笑时，有片刻人生完美之感了。也许这恰恰是人生阶段的变化，以前我是那个需要去大家庭里汲取能量，寻找归属的人，而今天，我已经是那个要给自己的家庭，给自己的宝宝提供能量的人。"},{"date":"2025-02-08","text":"如果问这一次在国内过春节最愉快的体验是什么？扪心自问，最幸福的时候依然是跟爸爸妈妈小美柔柔一起在楼下看柔柔玩，或是一起闲聊的时光。而去亲戚那边拜年像是完成任务一样……当清楚感受什么对自己是最带来幸福感的，那些不重要的事情就不要做。","context":"如果问这一次在国内过春节最愉快的体验是什么? 捫心自问,最幸福的时候依然是跟爸爸妈妈小美柔柔一起在楼下看柔柔玩,或是去同乐湾或是去稻谷溪一起闲聊的时光。而去爸爸这边的亲戚这边拜年像是完成任务一样，这一些就明显没有任何快乐感。快乐感居中的就是可以带着柔柔去婆婆姥姥家，还依然有一些不错的家庭幸福感，再其次就是和妈妈这边的亲人互动。当清楚感受什么对自己是最带来幸福感的, 那我就知道下一次再回来,到底哪一些是真正可以带给自己幸福感, 哪一些其实只是美好的幻想或是以前不得不做的事情,在宝贵的时间精力里面， 那些不重要的事情就不要做。"}],"cases":[{"date":"2025","text":"回国过年感到“无趣”且“压力大”。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-C-30","quadrant":"DEO","subcat":"C","keyword":"翁婿本质","title":"互相尊重保持距离，不必强求亲如母女","core":"互相尊重，保持距离。不要强求亲如母女/父子。","action":"","quotes":[{"date":"2023-01-18","text":"具体解决方案：不亲热 + 不在乎 + 不忍让 + 回应需求 + 日常礼貌 + 节假问候。"}],"cases":[{"date":"2023-01-02","text":"严于律人，宽于待己：在处理岳父母因我未及时回复消息而产生的巨大冲突中，深刻看清了人性的双标——他们要求我作为女婿必须“感同身受”他们的恐惧，却从未在过去三年尝试了解或关心过我。这种“宽于待己，严于律人”是很多人际痛苦的根源。","era":"recent"},{"date":"2023-01-18","text":"应对恶意的策略：面对岳母持续的指责和“扣帽子”，总结出应对此类“无法沟通的长辈”的三个关键词：不亲热、不在乎、不忍让。在此基础上，做好晚辈的本分。这不是冷暴力，而是看透人性后的自我保护与界限确立。不指望亲如一家，只求面上过得去，客气是最好的保护色。","era":"recent"},{"date":"2023-01-19","text":"看到一句话'有意见就要发表，拒绝被PUA'，豁然开朗——这不就是在被PUA吗？PUA最大的陷阱就是'认真你就输了'；看透这一层，回应方式就很简单：不忍让，不亲热，不在乎。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-C-40","quadrant":"DEO","subcat":"C","keyword":"婚姻合伙人","title":"婚姻不只是爱情，更是经济与责任的共同体","core":"婚姻不仅是爱情，更是经济和责任的共同体。有商有量是最高准则。","action":"不要在家里讲道理，要讲感情。家务和责任需要明确分工，但多付出少计较。","quotes":[{"date":"2025-06-16","text":"我之前在择偶这件事情上一直纠结到底怎样才是最理想的伴侣……我突然发现，我之前一直追求的最理想状态不就是这个人能够讲道理、能够很理性、能够沟通，而恰恰不是需要一个多么一切跟着感觉走的吗？所以我不已经达到我想要的状态了吗？真是当局者迷呀。"}],"cases":[{"date":"2023","text":"不要在家里讲道理，要讲感情。","era":"recent"},{"date":"2025-06-16","text":"理性 > 感性：曾以为理想伴侣是感性体贴的，后来发现“讲道理、理性、能沟通”才是维持长期关系最核心的特质。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-C-50","quadrant":"DEO","subcat":"C","keyword":"夫妻关系优先","title":"最好的家教，是父母相爱","core":"在一个家庭中，夫妻关系优于亲子关系。最好的家教是父母相爱。","action":"","quotes":[],"cases":[{"date":"2023–2025","text":"维护小美在家庭中的地位，不让父母干涉。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-C-60","quadrant":"DEO","subcat":"C","keyword":"共同成长","title":"婚姻最怕一个人在跑，一个人在原地踏步","core":"婚姻最怕一个人在跑，一个人在原地踏步。保持精神上的同步。","action":"","quotes":[],"cases":[{"date":"2023","text":"与小美的彻夜长谈，价值观的对齐。","era":"recent"},{"date":"2024-11-24","text":"和小美晚上哄睡柔柔的同时闲聊很久，反思这也是两人可以互相吸引的最大原因——都爱思考、都靠直觉（intuitive）。萌生了想系统性学习描述性格异同的想法，是后续MBTI相关反思的前奏。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-C-70","quadrant":"DEO","subcat":"C","keyword":"情感代际转移","title":"有了自己的小家后，情感支持系统已经换了主场","core":"建立了自己的核心家庭（伴侣、孩子）后，情感支持系统已完成代际转移，不再像小时候那样依赖父母的情感反馈。","action":"","quotes":[{"date":"2016-06-19","text":"尝试解释都是徒劳……她要的就是个倾听的对象而已，宁肯让她觉得你话不多也比你跟她较真讲道理强。"},{"date":"2025-01-31","text":"也许这恰恰是人生阶段的变化，以前我是那个需要去大家庭里汲取能量、寻找归属的人，而今天，我已经是那个要给自己的家庭、给自己的宝宝提供能量的人；同时自己之前很看重的那些人和事，也都有了各自的生活，于是大家的距离就自然地远了。"}],"cases":[{"date":"2025-01-31","text":"情感重心的迁移：春节期间清晰地感知到，自己已从“向大家庭汲取能量”的孩童，变成了“向小家庭输送能量”的父亲。那些曾经看重的亲戚关系因各自生活的疏远而自然淡化。这种疏离感不是凉薄，而是个体化（Individuation）完成的标志。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"DEO-C-80","quadrant":"DEO","subcat":"C","keyword":"父母是普通人","title":"父母也有他们的局限，别想着改造他们","core":"父母也有他们的局限、虚荣和性格缺陷。不要试图改造他们，也不要被他们绑架。","action":"","quotes":[{"date":"2024-02-26","text":"咱妈时不时的'我早就说过'，或是本能地觉得自己带宝宝的过程没问题，原因大概是我们断奶断晚了、走路走晚了、腿没搭好受凉了……我们的和宝宝讲道理和科学育娃是读书人的迂腐。"},{"date":"2024-08-06","text":"爸妈从以前唠叨我的生活方方面面，改为了现在唠叨柔柔，就是无穷无尽的担忧……最好的态度也不过就是，耐心听完，而后回复一个'知道啦'，已是足矣。"}],"cases":[{"date":"2024-02-26","text":"应对“马后炮”：在柔柔断奶困难期，面对母亲“我早就说过……”的马后炮指责，虽然内心烦躁，但意识到这是老一辈表达关心（以及维护自己权威）的方式。与其争辩，不如理解她背后的焦虑。","era":"recent"},{"date":"2024-08-05","text":"唠叨是爱的噪音：父母将对我的唠叨转移到了柔柔身上（洗手、吃饭、穿衣无穷尽）。虽然听着Frustrating，但换个角度，这是“儿行千里母担忧”的具象化。最好的应对不是反驳，而是耐心听完，回一句“知道啦”。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"DEO-C-90","quadrant":"DEO","subcat":"C","keyword":"不出恶言","title":"语言的伤口很难愈合，生气先离开现场","core":"语言的伤口很难愈合。生气时先深呼吸，或者离开现场，先冷静后再行动。","action":"","quotes":[{"date":"2023-07-02","text":"这不是玩笑不玩笑，也不是不能开玩笑，而是听到反馈后的承认错误并改正；更何况谁都有说错话的时候，关键是要愿意接受自己做的不对。","context":"记录一次小小的家庭争吵。咱妈说了'雁妈妈'，贺馨雁不乐意，叫我去讲别说了。咱妈觉得在开玩笑，'而且也是爱面子作祟'，于是又说了两次，贺馨雁就出去顶嘴说了句'不好，怎么没叫李爸爸之类的'；之后咱妈就嘀咕'这玩笑都开不得了'，再之后的聊天中甚至委屈哭了，觉得'自己在这边全心付出，结果一个词就被凶了'；而贺馨雁觉得'并没有凶，是好好去说的'，而且'就算潜意识里咱妈不是不认可这个妈妈，感受上依然是很不舒服的'；再然后我出去和小美聊天，觉得'无论如何咱妈在这边能好的方式去表达她就情绪爆发，摔东西尖叫了'；我先回家后，咱妈看我一个人回来，又说什么'家庭和睦还是最重要的，只要你们两个人相处好就好了'，又说起'只是开玩笑，以后玩笑都开不得了'；于是我批评了她'这不是玩笑不玩笑，也不是不能开玩笑，而是听到反馈后的承认错误并改正；更何况谁都有说错话的时候，关键是要愿意接受自己做的不对'。"}],"cases":[{"date":"2016","text":"早期情绪失控的教训。","era":"root"},{"date":"2023-07-02","text":"面对妈妈关于“雁妈妈”称呼的误解，虽然内心委屈，但忍住了恶言，选择“笑着把话说清楚”，避免了矛盾激化。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"DEO-D-10","quadrant":"DEO","subcat":"D","keyword":"全人发展","title":"支持孩子学习是为了立足社会，不只是为了分数","core":"支持孩子学习是为了完善心智、提高认知，让她有能力在未来社会立足和自我实现，而不仅仅是为了分数。","action":"关注孩子的知识储备和思维能力，而非单纯的排名。","quotes":[],"cases":[{"date":"2025-04-06","text":"看到外面疯狂补课的现象，意识到：让柔柔拥有完整的知识储备是为了提高她的认知层次，让她未来有能力选择自己想要的生活。这和传统的“鸡娃”有本质区别。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-D-20","quadrant":"DEO","subcat":"D","keyword":"得失相伴","title":"得到孩子的信任，就必然要失去自由和娱乐时间","core":"人生是你得到一些什么，就必定会失去一些什么。得到了孩子的纯真快乐和无穷信任，就必须失去自由和娱乐时间。","action":"接受这个设定，将其视为一种公平的“交易”，就不会在育儿的疲惫中感到委屈。","quotes":[],"cases":[{"date":"2025-03-10","text":"育儿疲惫时的自我开导。与其抱怨没有时间打游戏、没时间睡觉，不如感恩得到的亲子联结。这种“舍”是主动的选择，而非被迫的牺牲。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-D-30","quadrant":"DEO","subcat":"D","keyword":"避免牺牲感","title":"别说我为你牺牲了什么，那是在索取愧疚感","core":"不要对孩子说“我为了你牺牲了什么”，这是在索取愧疚感。一切都是我的选择（谁痛苦，谁改变）。","action":"","quotes":[],"cases":[{"date":"2025-03-10","text":"这是一个“交易”，我得到了快乐，所以我付出了自由。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"DEO-D-40","quadrant":"DEO","subcat":"D","keyword":"孩子是独立个体","title":"孩子不是我未竟梦想的替身","core":"孩子不是我的附属品，不是我实现未竟梦想的工具。她有她的人生。","action":"","quotes":[{"date":"2024-07-06","text":"第二件事值得记录的就是柔柔上幼儿园了。一周下来，整体是感恩的，柔柔适应的不错，老师的整体态度也不错，发的评语也很正面。"}],"cases":[{"date":"2024-07-06","text":"柔柔入园适应期记录：看着她在校门口爆哭，我心如刀割，但必须坚定离去。这是她社会化的必经之路。感恩她最终遇到了好老师，适应力比我想象中强。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-D-45","quadrant":"DEO","subcat":"D","keyword":"马斯洛驱动","title":"用社交和尊重需求驱动，而不是单纯逼迫","core":"利用马斯洛需求层次理论来科学激励孩子。社交需求：用“交更多朋友”来激励去幼儿园的动力，培养分享与助人的习惯。尊重需求：用“懂更多东西会让大家觉得你很厉害”来激励学习，而不是单纯的逼迫，让孩子为了“赢得尊重”而自发努力。","action":"","quotes":[],"cases":[{"date":"2026-01-03","text":"提出这一育儿心智模型。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-D-50","quadrant":"DEO","subcat":"D","keyword":"温柔而坚定","title":"温柔是态度，坚定是边界，两个都不能少","core":"温柔而坚定。","action":"","quotes":[{"date":"2024-12-02","text":"这周一11/28，我送去学校，就开始严重的厌学，怎么都不肯去学校……一次次谈条件，满足她之后她就提新的条件……好的方向想，说明宝宝有自我意识了，会有自己的喜好，也会坚持自己。这种情况，最重要的就是父母要坚定且温柔，保持一致的行为，宝宝也终究可以明白可以做不可以做的边界了。"}],"cases":[{"date":"2024-12-02","text":"坚定与温柔的边界：面对柔柔严重的厌学和谈条件，和小美选择了“温柔而坚定”。底线不能破（必须上学、必须洗澡），但在底线之上给予陪伴。孩子的每一次反抗其实都是在测试边界，父母的一致性是帮她建立安全感和规则感的关键。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-10","quadrant":"LEG","subcat":"A","keyword":"向上管理","title":"带着两三个方案去汇报，别让老板做填空题","core":"给老板汇报时，不要只抛出问题。带着方案（最好是2-3个选项），并说明利弊和你倾向的建议。老板的时间是稀缺资源，你的价值在于帮他节省决策成本，而不是让他做填空题。","action":"","quotes":[],"cases":[{"date":"2019-10-16","text":"总结向上管理技巧，老板说一你能想到二。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-A-20","quadrant":"LEG","subcat":"A","keyword":"时间估算","title":"承诺时间要故意留余量，别信自己的乐观估计","core":"在承诺时间（ETA）时，刻意Over-estimate（多估算一点）。潜意识总希望自己能快点做完，导致总是给出一个不切实际的短时间，结果不仅没做完还失信。","action":"如果觉得1小时能做完，对外承诺1.5小时。","quotes":[{"date":"2019-10-11","text":"每次总是under estimate，几点睡觉，几点做完，总是不守时……接下来几个月就一个目标，把时间说准，或者至少先over estimate。"}],"cases":[{"date":"2018-10-11","text":"早上答应Manager 20分钟到却没做到，反思自己总是在时间上“自我欺骗”。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-A-30","quadrant":"LEG","subcat":"A","keyword":"优先级First Thing First","title":"按重要性排序，而不是按紧急程度排序","core":"永远把老板/核心KPI的要求放在第一位。依据重要性而非紧急性排序。","action":"","quotes":[],"cases":[{"date":"2017-02-27","text":"优先处理老板数据，延后同事请求，这就是优先级的实战。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-A-40","quadrant":"LEG","subcat":"A","keyword":"以终为始","title":"没想清楚终点，过程就都是无效的折腾","core":"做任何事之前，先在脑海中构想“做完的样子”。如果没有清晰的终点，过程就会充满了无效的折腾。","action":"","quotes":[],"cases":[{"date":"2017-02-27","text":"没想好结果就开始做表，导致浪费大量时间。","era":"root"},{"date":"2023-11-19","text":"Effectiveness注重结果不注重过程，Efficiency既注重结果又注重过程——例如汽车能到达目的地是effective，但烧油不是efficient的载人方式。据此反复用'做正确的事情，而不是去把事情做对'处理母亲唠叨、PI团队定位等完全不同的场景：'我们把PI越做越像supporting role，正确的事情是我们应该让自己做到center，多说无益，去想怎么做到就好'。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"LEG-A-50","quadrant":"LEG","subcat":"A","keyword":"追求unique value","title":"做别人干不了、想不到的事，才是真的Working Smart","core":"区分“牛马活”与“高光活”。别人不能干我能干的：关键的Steer Com Update，Top Issue的Heads up，给出的明确Direction。别人想不到我能想到的：Create transformative team，提前布局Critical Conv。这才是Working Smart的本质。","action":"","quotes":[{"date":"2024-09-08","text":"别人不能干我能干的：关键的steer com update，top issue即时给他们heads up，关键meeting敢于给direction……别人想不到我能想到的：create a new team，关键meeting敢于给direction。"}],"cases":[{"date":"2024-09-08","text":"深刻领悟到Lead层面的核心价值：不是做所有人都能做的Routine，而是捕捉那5%的关键机会（High Light）。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-60","quadrant":"LEG","subcat":"A","keyword":"结果导向","title":"只有功劳没有苦劳，别为自己的加班感动","core":"只有功劳，没有苦劳。这句话很残酷但很真实。不要感动于自己的加班，要看产出了什么价值。","action":"","quotes":[{"date":"2024-12-24","text":"我们经常讲说，要能够end goal in mind，impact driven，或者是能够想到老板在想的东西，那些没有做到的人，难道只是因为想不到要这样去做吗？有时候可能是因为这样做往往难度更高，精力花费更多……但恰恰是那些有execution的人，是那种知道了什么是right thing to do，且有决心和能力去做到这一步的人，往往能获得最终成功。","context":"我想到我们经常讲说,要能够end goal in mind,impact driven 或者是能够想到老板在想的东西,那那些没有做到的人，难道只是因为想不到要这样去做吗? 有时候可能也是因为这样做往往难度更高,精力花费更多，不确定性更多，就比如说我要去给大老板解释现在有的一个transformative的tool,我要证明他一步一步的把False alarm降低了多少,或者是有得到了多少的unique number of usage,但是这些信息往往是非常难得到的,所以如果是这样的话,就会让人望而却步，于是不得不退而求其次，给一些不那么直达老板想要的，但是比较容易做出来的内容。但是恰恰是那些有execution的人,是那种知道了什么是right thing to do,且有决心和能力去做到这一步的人，往往能获得最终成功。"}],"cases":[{"date":"2016","text":"即使很努力开发书单功能，如果结果没做好，依然没有价值。","era":"root"},{"date":"2024-12-24","text":"执行力是稀缺资源：许多人没有做到Impact Driven，不是因为想不到，而是因为“难”。那些知道什么是Right thing to do，并且有决心克服困难拿到数据的人，才是真正的Executer。执行力是将“想法”变为“结果”的唯一桥梁。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"LEG-A-70","quadrant":"LEG","subcat":"A","keyword":"名字即品牌","title":"别人提起你的名字，第一反应是什么","core":"你的名字就是你的品牌。让别人提到你时，联想到的是“靠谱”“专业”“解决问题”。","action":"","quotes":[],"cases":[{"date":"2019","text":"总结好员工品质，其实就是在打造个人品牌。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"LEG-A-75","quadrant":"LEG","subcat":"A","keyword":"个人产品化思维","title":"把当下的工作当成一次产品来经营","core":"将自己作为一件产品，把当前的工作视为一次个人产品的售卖。工作压力大、累是常态，但不应只沉浸在消耗感中。","action":"定期反思：“在这段过程中我有没有获得成长？我有什么不一样了的地方？”只要有总结经验，就不亏；如果回头一看什么都想不出来，才是真正的浪费。","quotes":[],"cases":[{"date":"2026-02-26","text":"面对巨大的工作压力，调整心态，不再只看眼前的累，而是逼迫自己把工作当做产品售卖的测试场，只关注自己有没有获得个人能力的升级。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-80","quadrant":"LEG","subcat":"A","keyword":"走出舒适区","title":"别把平台当本事，随时想清楚自己离开后还剩什么","core":"公司只是工具。不要把平台当本事。随时保持“如果明天失业，我能干什么”的危机感。走出舒适区是成长的唯一路径。","action":"","quotes":[{"date":"2016-04-10","text":"我又不是一生都必须在这里。公司只是让我成长的工具，我想走了，我利用完了，我随时都可以走。"},{"date":"2024-12-02","text":"我觉得持续在自己舒适区里做事，就是会减慢自己的思想成长的速度……那走出舒适区的概念，让我想到我是否要更积极地去追求陌生领域的工作……为什么去一个新地方就是'slow down'，继续在原地做苦工就是'stretch'呢？"},{"date":"2025-12-28","text":"在一个新的role，不是自己擅长的领域时，比如来到了HBM或YE，那些老人肯定会觉得要多花很多时间教你，而你又不能帮到很多value adding，所以这种时候就是'一份付出一份回报'，你就是要挤出更多时间参加那些engineering的meeting，让自己更快catch up……于是终于有一天可以和他们平起平坐。"}],"cases":[{"date":"2016","text":"“公司只是让我成长的工具，利用完了随时可以走。”","era":"root"},{"date":"2024-12-02","text":"舒适区会减缓成长：意识到持续待在舒适区会减慢思想成长的速度。申请陌生领域和管理陌生团队的工作，虽然意味着走出舒适区，但正是成长的实践。反思领导所谓的“换岗是Slow down”可能只是留人的话术，真正的成长需要自己去定义。","era":"recent"},{"date":"2025-12-28","text":"转型期需要的笨功夫：在转入新领域（如HBM, YE）初期，作为“外行”Leader，不能指望立刻提供Value Add。此时必须遵循“一份付出一份回报”的朴素法则：挤出时间参加基础的Engineering Meeting，做最枯燥的Catch up。这种看似低效的投入，是建立信任和话语权的必经之路。","era":"recent"},{"date":"2025-08-01","text":"不要急着分黑与白，事在人为，先把groundwork做了（比如先让别人partial去学新role），只要开了头，之后就好说了——欲速则不达，先开个头再逐步推进。","era":"recent"}],"recency":"mixed","cluster":"c3"},{"id":"LEG-A-90","quadrant":"LEG","subcat":"A","keyword":"自信的底气","title":"自信不是我能搞定一切，是搞不定我也扛得住","core":"自信不是盲目相信“我能搞定一切”，而是一种底气：“搞不定也没关系，我能接受最坏的结果，并且我有能力兜底”。","action":"在项目遇到困难时，不再掩饰太平，而是坦诚沟通风险。这种坦诚反而赢得了他人的信任。","quotes":[],"cases":[{"date":"2021 (merged)","text":"从早期报喜不报忧，转变为能够平静陈述坏消息。","era":"root"},{"date":"2025","text":"即便当下很多crisis的时候，能够给TM展示出自信的态度，大多也是因为以多年经验，相信自己一定能找到解法的绝对底气。","era":"recent"},{"date":"2026-01-10","text":"自信的螺旋上升：即使现在有自我怀疑，但回头看，今天的资深M2比起当年的M1，自信层次已完全不同。所有过去的痛苦经历与正反馈，都是内核稳定的原料。自信不是一蹴而就，而是螺旋上升的必经之路。","era":"recent"},{"date":"2022-03-17","text":"在争取项目资源支持的过程中初始很不顺利，'不患贫而患不均'的嫉妒心态一出来心情更糟；纠结一晚后突然出现转机。感触：无论怎样的绝境，都不要放弃希望，不沉沦、保持良好心态、继续尝试各种手段，就能带来好结果。","era":"recent"},{"date":"2022-11-19","text":"面对团队曝光度（visibility）不够的焦虑，选择'踏实做事，让团队都成长起来，机会永远都不会缺'来自我说服。","era":"recent"}],"recency":"mixed","cluster":"c3"},{"id":"LEG-A-100","quadrant":"LEG","subcat":"A","keyword":"接受批评","title":"先压住反驳的本能，那多半是自尊心在说话","core":"被指出不足时，先压制反驳的本能。有则改之，无则加勉。反驳往往是因为自尊心受伤，而非事实错误。","action":"","quotes":[],"cases":[{"date":"2019-10-16","text":"好员工品质之七：不本能反驳。","era":"root"}],"recency":"root","cluster":"c3"},{"id":"LEG-B-10","quadrant":"LEG","subcat":"B","keyword":"管理者同理心","title":"内容对不对不够，对方当下的状态和需求才是关键","core":"做启发别人的天使，而不是强加意志的牛魔王。沟通与分享的有效性，不仅取决于“内容是否正确”，更取决于“对方的状态与需求”。","action":"管理者意识到自己的观点并非唯一真理，在做决定前先真诚地询问下属：“你的建议是什么？为什么？”设身处地判断时机：在分享大道理前先问自己——对方是否已经深刻理解了这些？对方现在是不是太累了，时机对吗？这真的是对方在乎的东西吗？不要只讲自己想讲的，要用最短的时间，分享对他人最有价值的东西。","quotes":[{"date":"2022-03-18","text":"这全是我想说的，想分享的，可是他的问题是什么，而我又真正帮忙解决了吗……'you cannot let everyone like you, but you can let them respect you'。","context":"周五考虑到huangfei不够昂扬的状态，想到和他说几点，还精心准备了一下，包括'变成金子+过好每一天+主动control life & ROI +依然有别人很高的评价'。聊完觉得效果并不打动人心。于是静下心反思，意识到了一个问题：这全是我想说的，想分享的，可是他的问题是什么，而我又真正帮忙解决了吗（尤其对M1)：觉得如今的learning curve 很不comfortable（个人的成长）——真正需要的，还是'我多去分享我的经验+多去给及时的feedback'；缺少sense of progression——指去年拿到的rating不高，jessica/koksiak评价也不高；缺少sense of achievement——感觉做的东西，不如早年的SOT delam之类的，有impact；以上两点，我真正需要的，还是'去找更多challenging的project，而不是把垃圾塞给他，还让他变成金子，过好每一天吧。'缺少sense of controlling——很多被要求做的东西并不能让他感到价值+事情一多，就会有被推着走的感觉，于是无法control life。可能'you can control your life'是一个口号而已，真正需要的，还是'我去实实在在的manage assignment，不要给他无意义的CCA， 不要让他adhoc，不要让他over load'。也更加感同身受了第二点'you cannot let everyone like you, but you can let them respect you'；我因为多年的认可欲求，习惯性还是想更多的'like me'；可是何必强求呢？'做到那些TM真正需要的，不就是respect me'，不就已经是上层境界了吗？"}],"cases":[{"date":"2018","text":"引用李嘉诚在汕大的演讲，反思管理者应有的“同理心与慷慨良心”。","era":"root"},{"date":"2022-03-18","text":"Seek to understand：反思自己以前总是急于输出“我想说的”，而忽略了对方真正的痛点。真正的同理心是先倾听，解决他的问题，而不是灌输我的鸡汤。","era":"recent"},{"date":"2026-03-10","text":"分享欲的边界：晚上很累时听同事讲深刻道理，虽然概念都懂且平时爱听，但当下只觉得不耐烦。这让我反思：跟别人讲道理时，必须设身处地，考虑对方的疲劳度与真实需求，珍惜彼此的时间。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"LEG-B-20","quadrant":"LEG","subcat":"B","keyword":"不假装听懂","title":"会上装懂，事后返工的成本更高","core":"会议上不懂装懂，事后返工成本更高。当场问清楚，哪怕显得“笨”一点。","action":"打破“碍于面子”的习惯。在谈话结束前确认：“我真的懂了吗？逻辑通了吗？”课后努力永远抵不上当场领悟。","quotes":[],"cases":[{"date":"2021-08-15","text":"我有一个坏毛病，为了追求谈话场面的“和谐”而习惯性点头，结果事后才发现逻辑不通。正确做法是强迫自己当场内化、复述对方的要点。","era":"root","context":"意识到自己一个思维的问题：很多当场听，觉得OK OK，习惯在当场不做反驳（甚至背后有习惯在人前留好人印象，以'愉快的结束谈话为目的，而不是追求真理为目的'；于是后来回头再细思，会想'哎呀，如果这样我应该跟上这样一个follow up question'呀；或者是，'不对呀，如果真是这样，那为什么不是这样这样呢？'说白了，就是一些'需要反驳'的问题，或者是'继续深入探讨'的问题，总是思维太慢+为了和谐不习惯'当场打破砂锅问到底'，要事后才能想到这些当场本应该就即时问出的问题，没有达到最理想的谈话效果。那解决办法呢？1.意识并刻意打破自己'碍于面子'的老毛病，把'和谐友好'放在'追求真理'的后面；在将要结束谈话前问自己，'我真的达到end goal了；所有的逻辑点都已经理顺了吗？2.强迫自己建立'当场思考'的毛病，别想着'行，我先接受了，回家再慢慢想'，而是'我一定要来当场internalize,复述出你的要点了再结束谈话'；这和上课道理是一样的，课后努力绝对没有当场领悟的学习效率高，同时必然是要花费更多的精力了。"}],"recency":"root","cluster":"c1"},{"id":"LEG-B-30","quadrant":"LEG","subcat":"B","keyword":"情绪稳定竞争力","title":"压力下不把情绪带进工作，是专业的底线","core":"在压力下保持冷静，不把情绪带入工作，是专业人士的基本素养。","action":"","quotes":[{"date":"2022-04-14","text":"沉默是金；当你进入情绪的时候，always good to cool down a bit first, before commenting or arguing back……塞翁失马焉知非福。","context":"沉默是金；当你进入情绪的时候，always good to cool down a bit first, before commenting or arguing back——比如这次EC review，jiang sir说shuyi没有innovation，于是想马上怼回去，不是每个人都可以有那么多的innovative project的，几次都想直接插嘴，可是忍了下来，后来再想，发现不去argue是对的，因为几个原因：1.的确他说的点没有错。就比如看wangdong，明显就是做的要impressive很多，高下立判，那根本就没错，那任何的解释都是'情绪化而不理智，强词夺理，好面子的举动'罢了。2.塞翁失马焉知非福。有时候你觉得马上comment一件事情是对的，可是也许之后才意识到，其实自己的想法是错的，如果没有'谨言深思'，反而容易一下暴露自己的肤浅（记得有时在staff meeting就会有这种问题）。所以无论是因为'情绪化了急于找回场子'，还是'急于在大场合展示自己，想说话'，都要学会'三思而后行'，甚至'沉默是金'。当然，还是要把握和'逃避问题'的区别。比如如果EM吵起来了，你的人在被challenge，相当于触碰到原则之一了，那就必须勇敢站出来了。区分的办法很简单，你是为了面子或被情绪所控所以要站出来，还是因为你的一些原则冲突所以站出来（比如care for people），两者就是不同的。"},{"date":"2016-12-16","text":"Boss is always right。愤怒多是自己的无能。完全没有必要动气，用事实说话，改进自己，改掉不好的部分，用更好的结果让老板心服口服。"}],"cases":[{"date":"2016–2019","text":"从一被批评就崩溃，到能冷静分析问题。","era":"root"},{"date":"2021","text":"即使不知道项目Root Cause，也要在团队面前保持理性的镇定，这种“定海神针”的作用是管理者最高价值所在。","era":"root"},{"date":"2022-04-14","text":"沉默是金：在EC Review上被批评团队缺乏创新时，本能想反驳，但强行忍住（Cool down），事后反思发现对方说的是事实。在情绪上头时，闭嘴是最好的选择，避免了因情绪化而强词夺理。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"LEG-B-40","quadrant":"LEG","subcat":"B","keyword":"适当的露怯","title":"管理者适当露怯，反而更让团队觉得真实","core":"作为管理者，适当展示自己的不足，反而能增加团队的凝聚力，让人觉得真实。","action":"","quotes":[],"cases":[{"date":"2018","text":"只有谦恭的人才能长期处理复杂压力。","era":"root"},{"date":"2021 (Merged)","text":"在团队面前坦承“我现在也不知道Root Cause，我们需要一起挖掘”。这种坦诚没有削弱权威，反而让团队感到真实和被信任。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"LEG-B-50","quadrant":"LEG","subcat":"B","keyword":"跨部门win-win","title":"先搞懂对方的KPI，才找得到合作的切入点","core":"换位思考。理解对方的KPI是什么，才能找到合作的切入点。","action":"","quotes":[{"date":"2025-08-01","text":"在fab10习惯了讲我需要什么、为什么要，但network就得是想人家会不会要帮，比如PDE PI可以讲这些人将来也是你的，这是win win的精华。还有就是不要急着分黑与白，事在人为，你先去把ground level做了……欲速则不达。"}],"cases":[{"date":"2017","text":"理解同事的急迫性，但坚持自己的优先级。","era":"root"},{"date":"2025-07-16","text":"Win-Win Offer：求人办事（如PDE support）不能理所当然，要包装成双赢：告诉对方“来support这个项目也是帮你自己train人手”或“为将来做准备”。","era":"recent"},{"date":"2025-07-16","text":"在HBM工作中主动'过度沟通'（over communication）——多问一句、多确认一句，看似多管闲事，实则是必要的风险控制手段；同时不要想当然觉得别人就该帮你，要主动给出win-win的offer。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"LEG-B-60","quadrant":"LEG","subcat":"B","keyword":"问题即机会","title":"没有问题的话，公司就不需要你了","core":"公司请你来是解决问题的。如果没有问题，就不需要你了。遇到棘手问题（Bug、危机），不要抱怨，这是你展现能力、脱颖而出的时刻。","action":"","quotes":[],"cases":[{"date":"2019","text":"遇到Bug和危机，不再抱怨，而是视为表现机会。","era":"root"},{"date":"2025","text":"每次再出现大问题，都会作为考验团队与体现自身价值的机会。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"LEG-B-70","quadrant":"LEG","subcat":"B","keyword":"管理强将","title":"下属比你耀眼时，赋能她而不是和她比细节","core":"当下属比自己更耀眼、更专业时，不要嫉妒，要视作资源。Empower（授权）：给她舞台，给她Promotion，衷心赞美她的表演。Help（补位）：在她搞不定的资源和卡点上，用你的职级去帮她扫清障碍。Strength（赋能）：用你的长处（Big Picture、Executive Update、Strategy）去补她的短处，而不是在她擅长的领域和她比细节。","action":"","quotes":[],"cases":[{"date":"2026-01-10","text":"提出这一管理强将的框架。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-C-10","quadrant":"LEG","subcat":"C","keyword":"财务自由定义","title":"自由不是钱的多少，是能拒绝不喜欢的事的权利","core":"不是拥有多少钱，而是拥有“拒绝不喜欢的事情”的权利，与对时间的决定权。Time Freedom > Financial Freedom。","action":"","quotes":[],"cases":[{"date":"2025 (Merged)","text":"随着育儿压力的增加，对财务自由的渴望从“买跑车”转变为“拥有更多时间陪伴柔柔”。雇helper以此获得时间，也是财务自由的定义。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"LEG-C-20","quadrant":"LEG","subcat":"C","keyword":"投资心态策略","title":"定投加逢低买入，拒绝All-in断送自己的主动权","core":"策略：定投+Buy the Dip（混合模式），既避免踏空，又保留回调时降低成本的子弹。拒绝All-in：投资要留有子弹，少量多次投资，一旦All-in被套在山顶，就失去了后续操作的所有主动权。估值锚点：拒绝FOMO，必须有科学的估值判断，规则要简单到“无脑执行”。","action":"当股价长期上涨且估值合理时，按规则加仓；当估值离谱时，克制贪婪，等待回调或坚持定投。","quotes":[{"date":"2025-01-01","text":"回头看我在SMH/SOXX上还没有盈利，1是因为2024年在震荡期，需要我多一点耐心；2就是没有坚定遵守规则，因为看到它疯涨了一个月，FOMO，不管MA20也加了特别多，本质还是'追涨'了，高点套牢导致持仓成本偏高……如果再多个教训，就是一定要少量多次地投，千万千万千万不要ALL IN。","context":"一直有在纠结一个问题,就是如果此刻股价是在高点,那么如果我不马上入场的话,会不会将来等回调,但是回调下来的数值依然是高过今天的数值? 但后来想了一下,这是一个永远不可能有的答案，因为对于大多数股票，如果经济危机了的话，就是会有一个甚至于低过今天价格的大回调，但没有经济危机的话，往往的回调都只是部分性的很难真正降到今天的数字；所以我的结论是1.只要股价依然是在长期往上走的,2.在买的这一只股票不是那种清晰可见的非常高的点，比如far beyond fair value或者super high PE的某些股票，像是接近150时的美光，3.这是支我有比较科学的方法判断真实价值的股票或ETF，如通过PE或者fair value，那么在遵循自己设的规则下 buy the dip适当加仓依然是一个错不了的事情,只要到了一个满足自己规则的数字,就可以开始加码了，这样做的本质就是在我可控的范围内最大化了收益了；\n如果真是怕有那种半年一年一点回调都没有的极端情况，我此刻已经在采用的定投+buy the dip 的hybrid mode，就应该是最高可能性最大化收益的做法了，所以我也要摆正心态，坚决遵循规则，不要因为fomo情绪化操作；回头看我在smh soxx 上还没有盈利，1是因为它就是2024在震荡期，需要我多一点耐心，继续长持，2就是没有坚定遵守规则，在6/24号左右，因为看到它疯涨了一个月了，fomo,不低过MA20等也加了特别多，本质还是'追涨'了，高点套牢导致持仓的成本偏高，一时半会很难把价格压回来了；如果再多个教训，就是一定要少量多次的投，千万千万千万不要ALL IN;万一市场回调，你就套牢在了高位，同时没有子弹在低位加仓了"}],"cases":[{"date":"2025-01-01（回顾2023-2024教训）","text":"反面教材：在SMH/SOXX上因FOMO情绪高位追涨，导致持仓成本过高，长期处于解套焦虑中。","era":"recent"},{"date":"2026-01-03","text":"Micron Naked Call血泪史：绝对禁止Naked Call。在Micron高位卖出正股后，为贪图低成本卖出大量Naked Call等待回调买入，结果半年后暴涨，不仅错失正股暴涨红利，还因Naked Call欠了一屁股必须高价买回的债。教训：纪律——决定换仓就立刻执行，不要贪图“跌一点再买”的小便宜；风控——Naked Call意味着无限的风险，Roll over不是免费午餐，只是延迟了死刑；心态——十几万新币的学费如果不吸取教训就是沉没成本，吸取了教训就是未来管理更大财富的护身符。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"LEG-C-30","quadrant":"LEG","subcat":"C","keyword":"拒绝原创迷信","title":"你以为的绝妙点子，别人早就研究透了","core":"你以为的绝妙投资点子，别人早研究透了。保持谦卑，多看专业分析，站在巨人肩膀上。","action":"","quotes":[],"cases":[{"date":"2024-11-19","text":"承认自己认知的局限性。这也是现在有AI之后的一大好处。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"MAS-A-15","quadrant":"MAS","subcat":"A","keyword":"人是怎么废掉的","title":"五个自我麻痹的信号：低密度信息+错位成就感+封闭输出","core":"一套完整的自毁行为诊断框架：1. 沉溺于'轻易获得高成就感'的事情；2. 只接收'低信息密度'的信息源；3. 习惯用'错位成就感'麻痹自己；4. 过度依赖'既有可行路径'；5. 封闭'强化学习'的通道——只听不说、只看不写、只学不练，还麻痹自己说学到了很多东西。","action":"定期用这五条自检，尤其警惕第5条：接收信息不等于学到东西，没有输出和实践的“学习”是自我麻痹。","quotes":[{"date":"2018-02-21","text":"人是怎么废掉的——行为纲领：1. 沉溺于'轻易获得高成就感'的事情……2. 只接收'低信息密度'的信息源……3. 习惯用'错位成就感'麻痹自己……4. 过度依赖'既有可行路径'……5. 封闭'强化学习'的通道：只听不说、只看不写、只学不练，还麻痹自己说学到了很多东西。"}],"cases":[{"date":"2018-02-21","text":"系统总结了这套五点诊断框架。短视频/AI摘要时代下，这份清单比当年更致命：低信息密度的刷屏、错位成就感（收藏≠学会），都是这个时代的典型陷阱。","era":"root"}],"recency":"evergreen","cluster":"c1"},{"id":"MAS-C-15","quadrant":"MAS","subcat":"C","keyword":"问题在己不在境","title":"同一个坑跨阶段反复踩，大概率是自己的问题","core":"如果同一种困境（如被边缘化、无法融入圈子）在完全不同的人生阶段（转学、大学社团、职场）反复出现，那大概率不是环境的问题，而是自己身上某个尚未被识别的问题。跨阶段的模式重复，是比单次挫败更可靠的自我诊断信号。","action":"遇到似曾相识的困境时，先问自己：这个问题是不是在别的阶段、别的环境也发生过？如果是，答案在自己身上，不在环境里。","quotes":[{"date":"2016-04-06","text":"回忆以前，现在新的圈子又无法成功地成为焦点，又渐渐地被冷落，绝不是偶然的环境因素了，肯定是我自己的某些问题之前没有认识到……当这么多的问题在大学和今天重复出现，那就一定是人的问题而不是外界的问题了。"}],"cases":[{"date":"2016-04-09","text":"通过转学、大学社团、球队、职场等多个阶段反复出现的'被冷落'模式，倒推出问题在己不在境的元认知方法。","era":"root"}],"recency":"evergreen","cluster":"c2"},{"id":"MAS-B-25","quadrant":"MAS","subcat":"B","keyword":"李杨定律","title":"没有进步又被否定，负面情绪会双重叠加","core":"自创的两条个人心理定律：定律一——绝大多数好学生（包括我）都能在有进步、有意义的一天中，获得比纯娱乐/玩耍多得多的愉悦感（自我实现需求）；定律二——绝大多数好学生（我）都渴望得到别人的肯定、减少批评（即便可以虚心接受），这可能源于学生时代师生教育下养成的尊重与社会需求。这两条定律解释了一天情绪起伏的根源：一旦'没有进步'叠加'没被肯定/被批评'，负面情绪会双重叠加。","action":"情绪低落时，用这两条定律拆解原因——是今天没有进步感？还是被否定了？分开处理，比笼统地说“心情不好”更有操作性。","quotes":[{"date":"2023-11-19","text":"李杨定律1：绝大多数好学生（包括我），都能够在有进步，有意义的一天生活中，获得比纯娱乐或玩耍多得多的愉悦感。李杨定律2：绝大多数好学生（我），都渴望得到别人的肯定，减少别人的批评（即便可以虚心接受）。"}],"cases":[{"date":"2018-01-15","text":"首次系统提出李杨定律，以马斯洛需求模型（2017/7/22）为理论基础。","era":"root"},{"date":"2023-11-19","text":"用这两条定律解释自己一天情绪起伏的根源，是贯穿五年的自创理论框架，是'心流''意义感''成就感'相关多条知识的思想母体。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"INW-A-70","quadrant":"INW","subcat":"A","keyword":"能力温度分离","title":"让人尊重和让人愿意追随，是两件不同的事","core":"评价一个人（尤其是领导/前辈）时，把'能力/格局'和'温度/耐心'分开衡量。一个人可以思维很深、格局很高、让人尊重，同时又缺乏耐心和温润感，让人难以真心追随——'让人尊重，却难以让人跟随'是两个完全不同的评价维度，不能因为佩服能力就忽略共情的缺失，反之亦然。","action":"","quotes":[{"date":"2022-12-06","text":"对领导为人的评价：优点：对人情世故想得很多，深思，思维很深，喜好多想几步，适合做官；缺点：太过主观与自信，说是'爱人'但其实'人皆为棋子'，以自我为中心的思考，同时缺乏耐心，缺少温润感与仁慈心——让人尊重，却难以让人跟随。"}],"cases":[{"date":"2022-12-06","text":"对一位重要领导的完整人物评价，是能力与温度分离评估的典型案例。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"INW-B-45","quadrant":"INW","subcat":"B","keyword":"内力与术","title":"价值观是内力，技巧是术，内力不够术就是花招","core":"借金庸武侠'内力vs花招'的隐喻：若没有好的内功做基础，就会陷入花招甚至邪路。应用到现实：好的、正确的价值观就是'内力'，是'大道'；而'说话之道''生财之道''接人待物之道'之类的技巧书，都是'术'。心术不正的人学了这些术，不过是无根之水，经不起推敲，甚至误入歧途；一旦先有强大的内功，所有的术都是水到渠成。","action":"学习任何沟通/管理技巧之前，先确认自己的价值观底座是否稳固——技巧是放大器，会同等放大正的动机和歪的动机。","quotes":[{"date":"2023-11-19","text":"梁文道对天龙八部的感悟：金庸武侠里格外强调'内力'，若是没有好的内功做基础，就会陷入'花招'，甚至走上星宿老怪的邪路。我们的好的正确的价值观就是内力，是'大道'……你若是心术不正，学了这些术，不过是无萍之水，经不起推敲；可是一旦先有了强大的内功，所有的术都是水到渠成而已了。"}],"cases":[{"date":"2023-11-19","text":"借武侠隐喻提出'价值观是道（内力），技巧方法是术'的框架。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"DEO-D-35","quadrant":"DEO","subcat":"D","keyword":"渐进折中育儿","title":"非黑即白的训练法不如渐进折中，留有余地","core":"育儿场景下，'渐进折中式'方法优于'激进的哭声免疫法'或'完全不训练'两个极端。核心是循序渐进、留有余地——比如断夜奶不是一刀切，而是从'半夜抱着安抚不给奶'逐步过渡到'温母乳/奶粉/稀释奶粉'，历时约一个月，既达成目标又不激进。","action":"","quotes":[],"cases":[{"date":"2023-11-10","text":"断夜奶整体顺利，没有用激进的方式，历时约一个月的渐进过渡，最希望的还是一个天天爱笑的宝宝。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-15","quadrant":"LEG","subcat":"A","keyword":"换工作三问","title":"换工作前问三遍：喜欢吗、能迁移吗、旧问题真解决了吗","core":"换工作不应是情绪冲动的决定，而应过三问：1. 我喜欢这份工作、这个行业吗？我最想做的、最擅长的到底是什么？2. 新工作可以给同样的赏识、工作表现空间、发展潜力吗（可迁移性验证）？3. 换了之后，旧工作的问题都能解决吗（根本问题是否真的被解决，而不是换了个地方继续存在）？","action":"","quotes":[{"date":"2017-06-26","text":"我喜欢这份工作、这个行业吗？我最想做的、我最擅长的到底是什么？……我的新工作可以给同样的老板赏识、工作表现、发展潜力吗？……新工作之后，旧工作的问题都可以解决吗？"}],"cases":[{"date":"2017-06-26","text":"系统总结的三问式换工作决策框架，历经多年验证有效。","era":"root"}],"recency":"evergreen","cluster":"c4"},{"id":"LEG-A-33","quadrant":"LEG","subcat":"A","keyword":"雇佣双向交换","title":"雇佣关系是对等交换，不是单向的忠诚或索取","core":"把'员工-雇主'关系定义为双向的质量对等交换，而非单向的忠诚或索取。好员工（service provider）的品质要求：tenacity（坚韧）、commitment（投入）。好雇主（buyer）的品质要求：work-life balance、工作时间合理、薪水足够、sense of achievement足够（解决问题、带新人）、上升空间足够。","action":"评估一份工作是否该继续投入，用这套双向清单打分，而不是单方面问'我够不够努力'或'公司够不够好'。","quotes":[{"date":"2020-04-03","text":"一个好的员工（service provider），quality要求是：tenacity，commitment。一个好的雇主（buyer），quality要求是：要能给work-life balance……工作时间不能太长，回报的薪水要足够，回报的sense of achievement要足够，往上上升的空间要足够。"}],"cases":[{"date":"2020-04-03","text":"提出这套评估雇佣关系的双向对等交换模型。","era":"root"}],"recency":"evergreen","cluster":"c4"},{"id":"LEG-A-55","quadrant":"LEG","subcat":"A","keyword":"职场投入清醒边界","title":"工作是完善自己的工具，忘我付出往往最先被牺牲","core":"经历公司裁员后领悟：所谓caring for people，本质是把信任与热情转化为更高效的工作成果，风雨来时员工往往最早被牺牲。启示：1. 在工作中追求忘我与付出，你就输了——可以尽力而为，但要保持内心清醒，想清楚ROI，在'control your life'的前提下投入，把工作当作完善自己、追寻人生意义的工具；2. 如果一份工作钱和福利不是最好、精力付出偏多、前景想象力有限，那它凭什么值得你长期投入？","action":"","quotes":[{"date":"2023-03-30","text":"经历了第一次裁员……哪有以人为本，所谓caring for people，不过是尝试把信任与热情转化为更高效的工作成果而已，风雨来时，people往往也是最早被牺牲的……在工作中，追求忘我与付出，你就输了；你可以依然尽力而为，但一定要保持内心深处的清醒。"}],"cases":[{"date":"2023-03-30","text":"第一次经历公司裁员后，对职场投入边界的清醒认知，与'追求unique value'（LEG-A-50）和'财务自由的定义'（LEG-C-10）相关但角度独特。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"LEG-A-12","quadrant":"LEG","subcat":"A","keyword":"对事不对人","title":"对事不对人的反馈更可持续，这是要主动向上争取的","core":"明确总结出自己'对事不对人的客观反馈'比'贴标签式的人格批评'更能带来可持续、低耗能的成长动力，并主动向上级提出这一诉求。这不只是“如何给别人反馈”，更是“如何为自己争取有效反馈”——认清自己的驱动方式，主动塑造被管理的方式。","action":"","quotes":[{"date":"2020-06-13","text":"我更喜欢Self motivated，所以一个点如果真的说到了我心里，不需要那么'人格攻击'去激发我，一些例子加上一定的点拨，'对事而不要去对人'，我反而也能做到90分，但可能只让我消耗50%精力；而且，更多的对事不对人，我还可以有余力，让自己有动力，让自己某一天做到95分。"}],"cases":[{"date":"2020-06-13","text":"与领导的绩效反馈冲突后，写长邮件申诉反馈方式，明确提出自己需要的反馈方式。","era":"root"}],"recency":"evergreen","cluster":"c1"},{"id":"MAS-A-105","quadrant":"MAS","subcat":"A","keyword":"阅读情绪匹配","title":"书要配得上当下的心情和精力，不必死磕","core":"读书应该是愉悦的事情，follow your heart——如果一本书暂时提不起兴趣，就不要强行读。按当下情绪状态和精力水平匹配不同类型的书：睡前心情平静，读不复杂的短文；白天大段时间心情平静，读需要消化的书；心情浮躁，读更接近舒适区的书；周末容易焦虑；工作日晚上不焦虑但疲累难专注，适合读生活/文学/社会政治类。","action":"不用固定书单硬啃，而是根据当下的情绪与精力状态动态选书。","quotes":[{"date":"2022-09-18","text":"读书应该是愉悦的事情，所以follow your heart，如果一本书暂时就是提不起兴趣，就不要强行读……在不同的时间段，安排不同的书。","context":"读书应该是愉悦的事情，所以follow your heart,如果一本书暂时就是提不起兴趣，就不要强行读。提前安排读书计划；比如我正在做的priority 1 2 3的分类，以及他们对应的豆瓣评分和我生活的联系。在不同的时间段，安排不同的书：比如晚上睡前，心情平静，就读些没有复杂庞杂的短文，比如生活实践类，或是文学类；而白天的大段时间，如果心情平静，就读些需要时间消化的，接近困难区的，比如心理学，或文学类；如果心情比较浮躁，就读些更接近舒适区的，比如心智与自控，或组织管理，或思维方式。再比如说，周末容易焦虑，因为担心自己没有利用好大段时间，这就适合来读些很难但是又偏实践的，能带来比较显著且快速个人提升的内容，比如心理学，心智成长，思维方式，效率自控，组织管理。而工作日的晚上，更多不会焦虑，而是疲累，难以专注，这就可以读些生活时间或是文学，或是社会政治。在读完一本书后，给自己足够的时间写总结，确保没有open AI，这样心智带宽比较足，会有更好的状态学习新的书籍"}],"cases":[{"date":"2022-09-18","text":"总结出按情绪与场景匹配阅读内容的策略，而非固定书单。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"MAS-A-85","quadrant":"MAS","subcat":"A","keyword":"先分后总读书法","title":"先啃全书逻辑再摘触动点，反过来会流于表面","core":"反对'只挑触动点'的碎片化读书法——一本好书不同章节间一定有逻辑联系，只挑片段读会失去背后细节论证的过程，理解会很表面。正确顺序是先由分到总（掌握整本书的逻辑架构），再由总到分（在理解全局的基础上提炼触动点）。","action":"读书先花时间搞清楚整体框架/目录逻辑，再回头精读打动自己的章节，不要一上来就摘金句。","quotes":[{"date":"2024-01-27","text":"一本好书不同章节间一定有着逻辑联系……所以直接只挑片段的观点读必然会很表面，失去背后细节论证的过程，也会让你的理解不深……说白了就是必须先由分到总，再由总到分的来理解。","context":"对李笑来读书的关联的观点有了些不一样的想法，他觉得读书就挑里面能理解有触动的点去吸收就好，可是一本好书不同章节间一定有着逻辑联系，比如被讨厌的勇气和人类简史，章节里的论据细节和结论也一定相连，比如历代政治得失，所以直接只挑片段的观点读必然会很表面，失去背后细节论证的过程，也会让你的理解不深，甚至影响生活中的实践。\n所以最好的做法还是我思维导图在尝试的，虽然耗时间但还是要把整本书的架构完整记录，但可以尝试用自己的语言概括每章，然后到豆瓣总结时再挑几个最触动的点，作为以后时时的参考。\n说白了就是必须先由分到总，再由总到分的来理解。李笑来说的可能心灵鸡汤似的片段更适用，一个观点而不是一套理论甚至一个学科。\n11/21添加，在一个喜欢的博主那里看到了以下这段话，说的和我上面的其实是一个道理。因为思考必然是要联系上下文才可以有完整感悟的，所以一定程度上你的第一笔记录一定要包括那个让你产生触动的点的上下文——阅读的本质是思考，思维速度决定了阅读速度，而非反之。"}],"cases":[{"date":"2024-01-27","text":"对'只挑触动点'式读书法提出反思，主张先掌握整体逻辑架构再提炼要点。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-B-35","quadrant":"DEO","subcat":"B","keyword":"深入浅出","title":"能讲给父母听懂，才是真的想透了","core":"对自己思想深度与表达能力的最好总结，就是'深入浅出'：想得很透彻，但解释的时候又能用生活中的例子讲清楚——那种给父母讲，他们都能用有限的耐心和知识接受的程度，才是真正的理解和表达能力。","action":"检验自己是否真的想透了一件事：能不能用父母能听懂的大白话讲清楚。","quotes":[{"date":"2024-01-19","text":"想到对自己想达到的思想深度与表达能力的最好总结，就应该是深入浅出：想得很透彻，但是解释的时候又可以用生活中的例子，就是那种给我父母讲他们都能用有限的耐心和知识接受的。","context":"想到对自己想达到的思想深度与表达能力的最好总结，就应该是深入浅出：想得很透彻，但是解释的时候又可以用生活中的例子，就是那种给我父母讲他们都能用有限的耐心和知识接受的。\n比如：\n乱世出英雄（no pain no gain；那些成就大事的都是经历过最痛苦时刻的，而往往也是这些痛苦在筛选强者）\n无欲则刚（没有私心欲望，方能做到真正的有立场，刚正不阿）\n世上只有一种英雄主义，就是认清生活的真相之后依然热爱生活（类似悉达多中最后的经历一切依然入世的状态，也是看山还是山看水还是水的状态，也是人类简史里引用过的人生终极意义的状态）"}],"cases":[{"date":"2024-01-19","text":"提出'深入浅出'作为个人思想深度与表达能力的检验标准。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"LEG-C-25","quadrant":"LEG","subcat":"C","keyword":"小仓位保留期权","title":"错过风口不必空手旁观，小仓位保留上车的权利","core":"投资中，如果已经错过了最佳进场时机，又怕被套牢、又怕错过后续行情，最好的选择不是完全观望，而是先小仓位/低强度进场，保留'上车'的选择权——如果风口进一步扩大，已经进场；如果没有，损失也有限。这一心法同样适用于职业选择：错过风口型机会时，先建立联系、保持visibility，见机行事。","action":"","quotes":[{"date":"2024-11-20","text":"如果此刻你已经在高点了，你又怕被套牢，同时你又怕错过这一波继续涨的风口……最好的选择就是依然先保持进场，而后见机行事，如果这个风口再进一步扩大，那反正我上车了……也保持了visibility，将来再次上涨时我也可以第一时间上车。","context":"想到了做投资和做工的一个共同点。深刻意识到自己灵光乍现开始想的以为很原创，还没有人清晰分析过的想法,可能是人家多少年就想过的。做投资有一个概念是,如果此刻你已经在高点了,你又怕被套牢。同时你又怕错过这一波继续涨的风口。比如一直在想标普和债券收益率的问题,为什么标普收益高还要买债券? 那最好就是先少量的进场,以确保自己能够上台桌。结果发现人家ManyXYZ早就有详细的视频解释其中逻辑了，甚至解答了我到底是要买标普还是买债券的问题。而在工作上也有类似的概念, 就是理论上你要尽可能找再风口的机会,创业型的机会,这样往往回报最大。但如果现在错过了,最好的选择就是依然先保持进场,就好像我去找Federico一样,而后见机行事，如果这个风口再进一步扩大，那反正我上车了，如果风口的确涨不动了，那我也保持了visibility，将来再次上涨时我也可以第一时间上车。"}],"cases":[{"date":"2024-11-20","text":"把'小仓位保留期权'的投资心法迁移到职业机会评估上——调用了2.1概率思维与4.3投资策略。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"MAS-B-22","quadrant":"MAS","subcat":"B","keyword":"钝感力","title":"别人一句不经意的话，不必照单全收放在心上","core":"长期以来'太在意别人想法'的性格弱点，反过来提示了一个值得刻意修炼的品质——'钝感力'：别人不经意的一句话，不需要照单全收放在心上；不必对每一次'没被及时回应'都赋予情绪意义。钝感不是麻木，而是有选择地不较真。","action":"遇到自己又开始'较真'某句无心之言时，提醒自己：这可能是'太敏感'在作祟，试着刻意迟钝一点。","quotes":[{"date":"2025-03-17","text":"突然意识到了一个自己'太较真'的例子：咱妈在群里讲柔柔周末没和她开视频，于是我急着周天晚上开了，结果发现咱妈去打牌了；本质还是'我太在意别人的想法'，太敏感，别人不经意的话，我倒是听进去了——这可能也说明'钝感'是一件很重要的事情。"}],"cases":[{"date":"2025-03-17","text":"首次明确提出'钝感力'作为值得培养的品质，与长期'太在意别人想法'的性格弱点形成对照。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"INW-B-85","quadrant":"INW","subcat":"B","keyword":"通透五原则","title":"通透不是看破变消极，是认清规则后依然热情地玩下去","core":"事业家庭双双步入稳定期后，对'如何活得通透'的一次系统总结——通透不是看穿一切后变得消极，而是认清世界的'规则'之后，依然满怀热情地去玩这场人生的游戏。五条原则：1. 接纳不确定性与不完美；2. 觉察并管理人性（而非对抗人性）；3. 投资于核心连接（而非泛泛社交）；4. 主动构建意义（而非等待意义降临）；5. 追求过程，而非结果。","action":"","quotes":[],"cases":[{"date":"2025-12-21","text":"在32岁的年纪写下的年度哲学总结，融合熵增定律、进化论、社会学与意义构建理论，提炼出'通透'生活的五条实践原则。","era":"recent"}],"recency":"recent","cluster":"c4"},{"id":"DEO-D-42","quadrant":"DEO","subcat":"D","keyword":"陪伴质量补偿","title":"陪伴时间少的时候，用专注度补回来","core":"工作极度繁忙、亲子陪伴时间被大幅压缩时，追求的不应是陪伴时长，而是陪伴时的专注度——用'总量减少但质量专注'来补偿陪伴时间的不足：有机会就多陪玩游戏，尽量在陪伴的时间里专心致志，这是最重要的。","action":"","quotes":[{"date":"2025-12-07","text":"今年最大的变化，就是十月头把妈妈接到了新加坡。从那之后，似乎就突然在过去两个月断崖式地减少了与柔柔的互动，最大原因还是HBM实在是夸张的忙……我能做的，大概也就是有机会就多陪她玩游戏，尽量在陪她的时间里面专心致志地陪她，这应该是最重要的。"}],"cases":[{"date":"2025-12-07","text":"工作繁忙期用'专注度补偿时长不足'的育儿策略。","era":"recent"}],"recency":"recent","cluster":"c2"}],"lifeRecords":[{"date":"2016-02-06","text":"春节回荆州探亲，每天都过得很慢，因为每分钟都很珍惜，因为在家的时间太短，便愈发觉得时间过得好快了。"},{"date":"2016-04-08","text":"婆婆（奶奶）去世，本人在新加坡未能赶回奔丧：'婆婆去世了，我又不在身边。'"},{"date":"2016-06-27","text":"纪念换了新显示器，感觉特别棒，尤其是在加班需要好几块屏幕的时候。"},{"date":"2016-10-02","text":"与母亲视频通话，母亲首次明确松口支持婚事——催婚节点。"},{"date":"2016","text":"与彼时女友的日常相处，关于买房、生活价值观的分歧持续贯穿全年。"},{"date":"2017-04","text":"首次被派驻美国Boise出差一个月，记录当地全新的生活体验。"},{"date":"2017-04-16","text":"与同事自驾游犹他州盐湖城、拱门国家公园、公园城。"},{"date":"2017-08-12","text":"自行车被偷。"},{"date":"2017-09-02","text":"三天两夜邮轮之旅，记录海上日落、星空、音乐的沉浸体验。"},{"date":"2017-09-25","text":"和贺馨雁正式在一起的第一天——这段关系后续发展为婚姻。"},{"date":"2017-10-20","text":"与贺馨雁前往兰卡威旅行，浮潜、看巨鹰广场、海边看星空。"},{"date":"2018-02-07","text":"回国参加姐姐婚礼。"},{"date":"2018-06-03","text":"沉迷《王者荣耀》近4个月后重启日记自省，反思游戏成瘾的心理机制。"},{"date":"2018-08-05","text":"参加同事的婚礼。"},{"date":"2018-10-21","text":"正式开始新加坡国立大学（NUS）硕士课程学习，工作与学业双重压力开始。"},{"date":"2019-01-03","text":"重病发烧39度两天，同事主动提出帮忙代开周日会议，深受感动，反思'雪中送炭难'。"},{"date":"2019-04-12","text":"组织公司大型全员活动Talent Time，圆满结束，'和最终的音响师握手时，竟有种眼眶湿润的感觉'。"},{"date":"2019-05-17","text":"前往沈阳岳父母家探亲九天，探望祖辈、包饺子、逛街，记录东北民俗体验。"},{"date":"2020-01-26","text":"武汉/湖北新冠疫情初期，滞留荆州老家，记录复杂情绪：'这是一个可以载入史册的新年。'"},{"date":"2020-02-01","text":"因疫情隔离问题与新加坡房东发生激烈争执。"},{"date":"2020-04-17","text":"日记中出现贺小美（贺馨雁）留下的可爱留言：'贺小美超级美丽超级体贴超级乖，liyang哥哥超级超级喜欢贺小美。'"},{"date":"2021-04-14","text":"与贺小美（贺馨雁）正式领证结婚（ROM，Register of Marriage）：'今天是和贺小美正式领证的日子。在阳光下行走，拍照，在朋友的见证下，步入下一个人生的阶段。'（注：这是法定登记结婚的时间点，与2023年的婚宴仪式是两个不同的节点。）"},{"date":"2021-04-30","text":"换工作的念头最终作罢，与大老板谈话后决定留任：'人生是一段长跑，一两年真的不算什么。'"},{"date":"2021-08-16","text":"生日记：徒步登高、海边缆车、买新衣，'堪称完美的生日'。"},{"date":"2021-08-30","text":"晋升为M2管理层后进入新团队，处于持续焦虑适应期。"},{"date":"2022-01-01","text":"12/30-1/2跨年打了近20小时王者荣耀，读书计划基本落空，感悟'一味逃避解决不了问题'。","context":"计划 1/2------ 8点半点起床 9：30-11：30 做《认知觉醒》读书笔记 12 - 4：30 外出吃饭，剪头发，逛超市，回家 5 - 8 运动，娱乐，吃晚饭 7：30 - 8：30 和爸妈视频 8：30-10：45 看比赛，打游戏，洗澡 11：30-12：30 读《中国哲学简史》\n\n实际情况：12/30周四Working from home，周五拿了一天假，于是就有了12/31, 1/1, 1/2, 1/3的四天小长假。12/30:上午EM，下午NTUC吃完午饭，便开始划水，看youtube（看了一小时的郭德纲），而后打王者荣耀。3点开始，打到5点半。而后去和公司同事打了场篮球。回来9点20继续打农药，打到11:30。一天一共打了10局，约4.5h。1/1：早起8点40开始打农药，打到12点20。中间穿插着读了一点书，《心流》。中午下雨无法出门，于是自己煮的饺子。2点45开始打农药，打到3点半。而后wangjing shuyu他们3点半都来了，我就出去陪客，看电视，看了局XYG比赛，顺道读《中国哲学简史》，做了会《认知觉醒》的总结，小睡了一会到5点。5点多开始吃火锅，看看晚会。7点50又开始打游戏，到9点45。"},{"date":"2022-01-13","text":"打疫苗后WFH，当晚开始发烧，头痛卧床一天。"},{"date":"2022-01-27","text":"五天四夜游轮之旅，尾波冲浪、攀岩敲铃、看吉他与小提琴合奏、与老婆悠闲相处。"},{"date":"2022-05-24","text":"确认怀孕——B超看到胎心150，'开始有了生为人父的想法，即便必然会失去些当下的自由或闲适，整体还是期待与快乐更多'。"},{"date":"2022-05-30","text":"因验孕棒测出异常一度整夜担惊受怕，第二天紧急就医确认一切正常。","context":"过去两周，因为老婆偶尔的恶心，和例假迟迟不来，已经开始怀疑有了宝宝，验孕棒也有了苗头。今天去诊所产检，在真正B超下看到小生命，还有150的心跳，的确是非常神奇又让人兴奋。大致的几种情绪：1.开始有了生为人父的想法，总是很期待，因为将是全新的责任，也是全新的人生阶段了；即便必然会失去些当下的自由或闲适，整体还是期待与快乐更多。2.也还是会觉得很幸运。怀孕终究是很概率的事情，可是我和老婆可以两个月就怀上，没有碰到那么多所谓的'不孕不育'的挫折，也是值得感恩。3.同时也还是有些'不以物喜不以己悲'的自制，不想'开心的太早'。毕竟风险期还有两个月，之后还有七个月，各种的风险难以计数。即便很兴奋，但还是告诉自己要理智，走一步看一步更好。4.也觉得为平静的生活增添了另一种盼头。5.初始也不能完全理解老婆的心酸，尤其肉体的难受，如恶心与嗜睡。可是慢慢换位思考，她不仅和我一样承担着精神的压力，同时肉体还有着无法避免的长期的折磨，更遑论之后生产的痛苦，全部考虑下来，从此刻开始，我做出何种包容让步，还有更多的细心关照，都是绝对理所当然的事情了。"},{"date":"2022-07-19","text":"小美常规产检16周，一切正常，'开心，感恩，期待'。","context":"小美常规体检，16周了，一切正常。开心，感恩，期待。"},{"date":"2022-08-21","text":"得知姥姥心脏不好卧床，回忆儿时姥姥劈竹子做钓竿、烤红薯的往事，'从无所不能的超人，到人生终点，似乎就是眨眼之间'。","context":"拜五体检，游游一切正常。小美也是都好，除了胎盘偏低。初始大脑还是空白了几分钟，但等到科学的查询了一些资料，发现是常见状况，且后期往往都会好起来，且无甚大碍，慢慢就宽心了。感悟：这次体检，更让我感恩当下。我何德何能，可以有到今天都如此完美的生活。\n\n有许多伤感。在听到姥姥心脏不好，卧床不起，甚至快接近人生的尽头的时候了。往事历历在目。初中时钓鱼，姥姥还可以劈竹子做钓竿，每天早起走上十里路抓鳝鱼，看起来上山下海无所不能。高中时代的暑假长假，荫凉里读玄幻，看少年包青天。每次回乡下必有姥姥的烤红薯，中间包裹的是满满的爱。即便过去几年，也是田间活动终日不断，微瘸的腿，不瘸的倔强。最近一次新年回家，依然还记得姥姥算一天鳝鱼卖出上百元时候的得意。可是，突然之间，从无所不能的超人，到人生终点，似乎就是眨眼之间。恍惚间，才发现，两年多，真的可以沧海桑田。姥姥对我的爱，我如何回报的呢？几乎没有。只有一年年的疏远，从儿时的半月，变成近几年晚上都不过夜，再到过去两年甚至都没有办法见面。这份关爱没变，疏远和变的是我。"},{"date":"2022-10-22","text":"详细记录八段锦口诀（起势、双手托天理三焦、左右开弓似射雕等）。","context":"八段锦：起势——手心朝后摆开，再合于身前。双手托天理三焦——劲道在掌根、夹脊。左右开弓似射雕——食指用力，头望向食指，沉肩，水平，马步下蹲。调理脾胃需单举——上举手侧上方，下压手在髋部。五劳七伤往后瞧——转头不转体，两肩后张。摇头摆尾去心火——稍起后重心移向一边的脚。双手攀足固肾腰——最低点手往前顶。攒拳怒目增气力——脚趾用力。背后七颠百病消——脚趾抓地，尽量提踵。"},{"date":"2022-12-25","text":"观看演员选秀综艺节目，引发对'油滑vs棱角'的思考。","context":"对'油滑'一次有了更清晰的感悟。（在看一个关于演员诞生的综艺节目时，有些新生代的年轻演员有感）'油滑'的反面就是'棱角'。而'油滑'，就意味着自己缺乏主见，缺乏个性，缺乏立场，比如在谈话处事时习惯性的附和他人，说一些打太极的八面玲珑的好听话，或是说一些迎合他人而没有自己立场的话。而我之前的确就是有这种倾向性。所以要记住并时时引以为戒。此处关键就是'立场'。于是关键是坚定个人立场，而具体情境可以有不同做法：那比如我在出租车上，或是些萍水相逢的人，或是一些不需深交却也不想直接冲突的人，此处又不想陷入油滑的陷阱，那他们给comment时，你只需要安静并礼貌的倾听，不去附和也不去反对。而如果该场合下是一个正经的需要表达清楚立场的场合，那就千万不要想着八面玲珑，对就是对，错就是错。棱角 主见 勇气 真诚 共情 感恩 胸怀 格局 传承 谨言 笃行 深思"},{"date":"2022-12-28","text":"女儿柔柔出生，12小时催生、无痛副作用、助产士合力推出的全过程。"},{"date":"2023-01-25","text":"带娃两月，'如过三秋'，记录宝宝从吃完就睡到肠胀气、认人、抬头等阶段性变化；父母来访10天'比想象中与我们现有小家融洽和美的多得多'。","context":"带娃两月，如过三秋。每一天的宝宝看起来都是不一样的。突然，就不能吃完就睡了，有更多清醒时间了，于是，要学习哄睡，要学习吃完睡的规律。突然，就开始肠胀气大闹了，于是，需要排气操益生菌趴睡的技能。也是突然宝宝就可以发出更多的声音了，宝宝会对视觉听觉做出明显的反应了，宝宝可以灵活的摆头和抬头了，宝宝可以晚上不哄也自主入眠了，宝宝喝奶效率变高了，宝宝晚上喝奶的间隔越来越久了。一个美好的生命，从初始彩超下的小粒种子，变成如今茁壮的小人儿，不得不感慨生命的神奇。当下的每一天，都是美好的一天。\n\n再记录父母过来的这10天。比想象中与我们现有小家融洽和美的多得多。在我心中，家庭整体的和睦永远是最重要的。人活一世，若是真正爱的人都无法留住，又还有多少意义呢"},{"date":"2023-04-09","text":"柔柔满月后进步很快——会开心咧嘴笑、主动伸手要抱抱、能自主翻身、晚上能睡7-8小时整觉。","context":"柔柔最近一个月突然就长大了，有了智慧：会望着我们开心的咧嘴笑。会主动伸手去拿奶瓶，或者伸手要抱抱。突然就可以很好的翻身了，尤其今天全自助。偶尔发的声音，很像是在说话了。晚上也突然可以睡上7 8个小时的大觉了，昨天从九点直接睡到了第二天五点。家庭现在也很和睦了，相处也颇有默契。带柔柔依然是个体力活，周末好很多因为三个人，周一到周五就明显捉襟见肘，咱妈也是筋疲力尽了。"},{"date":"2023-10-03","text":"婚礼当天，完整婚礼誓词：'亲爱的小美，我想象过很多种幸福婚姻的样子，遇见你后，一切才有了具体的形状……我愿成为你的丈夫，无论贫穷与富有，快乐与悲伤，疾病与健康，都一路扶持，彼此珍惜。'","context":"这一次的婚礼个人非常满意，不管是亲友们的参与度，还是与小美的个人表现，或是整体婚礼流程的完整度。心中一块大石也算是落地，更多也是替松滋父母松了口气。今后也可以以更舒服的姿态与沈阳父母相处。昨晚和小美的彻夜长谈也很棒。关键词就是'以小家为中心，有商有量'。\n\n婚礼誓词：亲爱的小美，我想象过很多种幸福婚姻的样子，遇见你后，一切才有了具体的形状。虽然我们性格一刚一柔，但是在日夜相处的2000天里，我们却有着最无言的默契，对我来说，你是我的同事，是朋友，是爱人，但更是知己。你问过我会不会嫌你太粘人，今天我想认真的回答你，'其实，一天没你黏在身边，我都浑身难受'，你知道我喜欢看海，但是，其实我看过最美的海，是你带笑的眼眸。今天，在各位亲朋好友的见证下，我向我的妻子馨雁起誓：我愿成为你的丈夫，无论贫穷与富有，快乐与悲伤，疾病与健康，都一路扶持，彼此珍惜；从此结发为夫妻，白首不分离。"},{"date":"2023-11-10","text":"详细记录一个月的宝宝渐进式睡眠训练全过程，从半夜抱着安抚不给奶到逐步过渡。","context":"尤其想记录下11月头成功的睡眠训练。宝宝过去几个月的半夜睡觉一直是大问题，夸张的时候一个多小时一醒，然后就得抱着哄睡，甚至喝奶。夜夜如此。在十月中回来后，因为和小美还得上班，然后半夜还得醒，特别的折磨人。当然，有几个选择：1.最激进的，睡眠训练，半夜就让她哭，我们在隔壁房间，让她哭到累了睡，稍微温和点的就是过一段时间进去安抚几秒，再出去，但是坚决不给奶。主要风险就是宝宝哭的惨，可能会失去安全感，大人听着也难受。2.折中方案，半夜小美不出现，宝宝哭了我就安抚，虽然开始她肯定不接受，但是最后困了一定还是会睡，然后如果真有要奶的迹象我就用奶瓶。3.继续这个模式，直到宝宝慢慢白天摄入的多于是半夜不饿了，同时一岁多以后没有分离焦虑了，自然的好。最后，在大概20号左右，半夜柔柔又一小时一次奶，且喝了不肯睡让小美崩溃大哭后，我们开始了方案2。开始的两天，小美就在客厅睡。然后半夜宝宝肯定醒，我就坚持抱，每次都会抱半小时以上，宝宝就一直哭。而后拉扯到大概2点了，小美就进来给奶。再之后几天，就让小美在房间睡，但是躲在角落不要发声。到一周左右，咱爸妈来了，我们就开始换策略：小美在角落不发声，宝宝醒了我就抱，而后出来热母乳给她喝，喝完就能勉强睡下。再到10月底，就开始半夜换成奶粉，再然后就是稀释奶粉。这个过程中，宝宝还是会在2点到4点间醒来，但是可以基本半夜只醒一次了。所有因素相加，宝宝夜奶的需求越来越少，基本到11月头可以做到就一两次要四点左右去泡点稀释奶粉。终于，在过去一周，宝宝已经可以有稳定的规律：直接一夜睡到5点左右，然后我们就直接给亲喂，宝宝就再睡到六点半左右，我们再喂一点，宝宝就起床。回头来看，本没有太多值得升华的，一方面想感恩整个断夜奶整体很顺利，感恩小美和柔柔，另一方面，也很安心没有用激进的方式，毕竟我们最希望的还是一个天天爱笑的柔柔天使宝宝。"},{"date":"2023-12-01","text":"family day带娃冲突后感悟：'家和万事兴的确很重要'，'我的父母只是最普通与平凡的人，不要尝试改变50岁的老人的想法'。"},{"date":"2023-12-22","text":"突发严重感冒发烧，记录逐日症状，Christmas当天难以坚持，半夜出汗后退烧。","context":"记录昨天突然严重的感冒与发烧。虽然前段时间也有过轻微感冒和头痛，但是基本上睡一觉就好了，这一次从前天开始，就腿发软，打完球后更是严重。到了昨天Christmas，已经是难以坚持，头痛，嗓子痒，咳嗽，四肢无力。到了昨晚睡觉，已经是咳嗽个不停，以及轻微发烧了。于是昨晚的睡眠质量非常一般，所幸半夜流了好几场汗，今天起床已经不发烧了，就是身体依然极为疲惫，咳嗽和鼻涕也开始来了。"},{"date":"2023-12-25","text":"柔柔周岁礼，'整个周岁礼算是圆满成功了，感恩今天家里所有人都有的良性的他者贡献精神'。","context":"今天虽然和小美身体不适，所幸状态还不错，整个周岁礼算是圆满成功了。希望早日结束隔离，能给家里多做贡献，也多陪柔柔玩。感恩今天家里所有人都有的良性的他者贡献精神。"},{"date":"2024-01-03","text":"记录2024年个人目标——'讲话更简明而扼要，少啰嗦不清'。"},{"date":"2024-01-07","text":"因COE下降以及柔柔长大后的实际需求，全家开始考虑购车。","context":"这两天正在买车过程中，因为COE下降，以及家里柔柔长大后的确有这个需求。小美希望能买到更低COE的更低价，因为不急。今天也有了初步行动，就看接下来COE的变化了。也能明显感觉到小美对于情绪控制付出的努力。不管是在给咱妈解释些她不太理解或太担忧的事物时能心平气和的说，也能看到在生活中更有耐心，甚至于一些等我或是一起来回协商这种拿不定主意的事情，不容易到cliff；而且即便到了cliff也不会那么陡的slope，能很快的调整回来。而且也会尽量调整自己保持在一个爱，喜悦，和平的氛围里。所以感恩感恩。"},{"date":"2024-01-28","text":"柔柔严重恋奶和睡眠倒退，晚上需要多次亲喂，家里决定断夜奶；同期在英飞凌和SMAI之间考虑新工作机会。","context":"最近生活整体在一个不太平静和轻松的阶段。生活上，柔柔开始了严重的恋奶和睡眠倒退，晚上必须亲喂三到四顿，前半段醒了就要抱，后半段醒了就必须喝奶；白天还不坐车，只要抱；同时，和我关系比较疏远，不让抱，于是进一步加大了雁雁和奶奶的压力，尤其晚上当我们决定断夜奶以后，只能靠雁雁一个人抱，可是柔柔在妈妈抱时更不愿意睡，想喝那口奶，于是宝宝一闹就是一点到三四点，宝宝和大人都得不到休息。现在的计划，就是先奶奶作为过渡，再不行就只能靠我来强行抱三个小时了。等咱爸来了，就直接断奶。职业上，最近有两份可能的新工作，一个是英飞凌的，一个是SMAI的，都是TBD，但是感觉上SMAI和自己长期发展的计划更匹配，一切顺其自然。工作上，不出意外的，闲了一段时间后，收到了一个大活，这样challenging project固然还是能有一点兴奋性，但是这么多年类似的做多了，兴奋少而麻木多，成长也有限。Even worse还是我怀疑这种被push，不确定，且day and night 的意义何在，至少对我这决不是我想要的生活。回报，成长，工作时间与强度，总有一个要足够有吸引力，暂时ADTS让我三者都看不到。所幸，家庭依然很和谐，老婆也调整在很好的状态，和咱妈的相处也渐入佳境。只要家庭和谐，别的困难都不值一提了。"},{"date":"2024-02-26","text":"父亲大年三十凌晨成功抵达新加坡；柔柔断奶期间反复发烧出疹，一家人围绕育儿理念产生摩擦但最终和解。","context":"咱爸在大年三十凌晨成功到坡了，但是整个二月也的确有很多艰难之处。柔柔初五（周三）开始断奶，白天还好，就是有点闹，晚上就是疯狂找妈妈和找奶，得咱妈一直抱才可以，所幸慢慢似乎接受度在变高，可以睡前一顿，三点一顿，六点多喝一顿；唯一艰难的是小美特别想宝宝，心情比较低落，到了初九甚至因为在图书馆呆一天和我闹了矛盾；而后到了初十（周一），本来上午还收到爸妈发的柔柔开心玩学步车的视频，下午就发烧到39，吃药只是短暂退烧。而后周三小美恢复见宝宝，晚上也陪睡两天，可是宝宝半夜就是醒了就爆哭，周三更是抱了三个小时，大家都很极限，周三还带柔柔去了趟诊所；所幸到了周五早上，柔柔开始退烧，但是开始出急疹，全身都是，柔柔似乎很不舒服，也因此特别的闹了，以前只是吭吭唧唧，现在就是动不动就爆哭；而且只要看到妈妈，就完全不让走，寸步不离，晚上哄睡也变成了小美来做；到了周六，决定交回给咱爸妈睡，所幸柔柔的疹子在变好，到了周天和周一已经肉眼可见的情绪变好，愿意接受妈妈暂时离开，同时晚上的喝奶非常的规律，而且爆哭的时间也少了很多；（到了2月28周三，柔柔几乎完全变回了小天使）。要平衡各方，尽量大家和和气气，真的也很累……本来我唯一在乎的就是一家人和气，但是越想要什么就越得不到了，想时时呆在中间让大家都开心，可是偶尔还是会觉得有心无力。2/28补充：小美26号晚上心情就很低落，27号简单聊之后就好了，我们都很清楚问题所在；而且更感恩的，也能感到小美今天对咱爸妈很好，买蛋糕，主动夹菜，所以这也恰恰是我觉得我们可以是很幸福一家人的原因。"},{"date":"2024-04-01","text":"爷爷回国后一个月，柔柔的走路能力有了质的飞跃。"},{"date":"2024-04-17","text":"工作压力最大的一周，晚上九十点才到家，Triton conversion项目出现很多surprise。","context":"记录工作压力最大的一周。身体和精神的双重压力，一方面事情多，review也多，晚上肚子饿还只能九十点到家，早上还得很早八九点起床。更累的是自己的conversion triton出了很多的suprise，甚至影响到IPp，于是因为不确定性导致的没有安全感就变成了问题"},{"date":"2024-08-01","text":"连续感冒、柔柔病毒性肠炎爆吐、本人因吃麦当劳诱发严重腹泻整夜，'三英战吕布'式的身体多重不适期。"},{"date":"2024-09-08","text":"柔柔连续多轮流鼻涕、咳嗽、荨麻疹，期间接姥姥来新加坡；本人也严重荨麻疹反复发作近一个月。","context":"本来柔柔的身体就一直起起落落。在八月初的低谷慢慢恢复，到八月中自己身体好了，柔柔也愿意开心去学校了。八月21号接到了姥姥。可是八月22号开始，柔柔就一直流鼻涕，清鼻涕与黄鼻涕轮流流。多少她也有些烦躁。而后23号，妈妈去送了一次，爆哭，怎么都不愿意去上学。决定了早上坚决不能妈妈送了。到26号和27号，都是先抱着我哭，再抱着niangniang哭。而后28号到了顶峰，我送了进去，可是中午老师打电话，说柔柔流大鼻涕，不肯睡午觉，而后喝奶都把奶咳出来了。中午干脆接了回来，而后29 30周四周五干脆家里柔柔休息两天。而后30号给柔柔送了教师节礼物。到新的一周，9月2号开始，干脆回到我和姐姐送，姥姥不去。我在路上给柔柔做思想工作。所幸明显感觉到进去前虽然哭一下，但是马上就让老师抱她进去玩了，说明她已经明白去上学和爸妈上班的不可避免了。回到我自己。这一周的荨麻疹尤其严重，反反复复。从八月底就开始，初始只是挠挠下体，而后严重到全身，慢慢恢复，到九月2号却好像又再次反复，突然全身长满，直到今天周末才慢慢在恢复。这过程让我反省，是不是与自己亚健康状态，免疫力下降有关。"},{"date":"2024-09-24","text":"密集尝试多个AI工具（YouTube总结工具、ChatGPT全文总结等）带来的学习方式冲击与震撼体验。","context":"最近有几个AI tool，带给我很大的震撼。一个是把文章全文复制，然后一步丢进ChatGPT或者Claude，让它给你总结要点，于是很快一百字的bullet point就出来了。AI应该会有三大应用场景：1.自动化很多的重复性工作；2.作为高效的知识检索工具（个人agent）；3.作为高效的新知识的学习工具。我们都知道'三分钟读完红楼梦'是毫无意义的，事实上读书也只能靠自己一页页读完，那么'100字看完文章'，是不是也会有类似陷阱？我的想法，正确的AI用法：有时候的文章标题是'噱头'，你想读下又不确定是不是会最后'被骗，浪费表情'，就可以先让AI看一遍，确保大致内容的确是值得看得。有些文章你是真想认真读完，且拿到些takeaway，可是因为是英文，且内容hardcore，在之前就只能读完，似懂非懂，那现在你就可以先让chatgpt给你翻译个总纲，你有了个框架，而后进去读，然后总纲提到的那些takeaway可以很容易对上。"},{"date":"2024-11-06","text":"柔柔再次流鼻涕咳嗽；本人坚持每周四次午间篮球训练，比赛中取得好结果。","context":"昨天开始柔柔又流鼻涕了，昨晚咳嗽变严重，今天白天稍好可是到了晚上再次咳嗽不止，关键睡觉也更闹，醒的更加频繁。而我前两周四次中午篮球训练，依然在昨天比赛中带来了很好的结果，既说明了强身健体的重要性，也说明了体育依然是有付出才有回报的"},{"date":"2024-11-18","text":"柔柔持续一周多高烧（38-39度）反复，伴呕吐吐奶，父母轮流照顾睡眠严重不足，24日终于退烧。"},{"date":"2024-12-02","text":"柔柔'最严肃的一次厌学'，连续多日不愿去幼儿园、洗澡谈条件，父母坚持温柔而坚定的边界后，12/6终于顺利入园。"},{"date":"2025-01-31","text":"回国过年，经历舅舅发酒疯、亲戚寒暄疲惫，也有'四世同堂'的温情瞬间。","context":"这次的回国过年经历带给我很多不一样的感悟：1.让我一次次反思，之前那么期待过年，我到底在期待什么。比如我觉得很大一部分是和舅舅或姨爹亲亲还有别的亲人的初二团聚，可是今年看来，婷姐小妹甚至初二都还在上班，姨爹亲亲也没什么机会聊天互动，同时舅舅还发酒疯，弄的婆婆和妈妈都极其不愉快；整套体验，让我发现最期待的部分，似乎也是自己美化过的记忆了。2.切实感受到有宝宝和没有宝宝的确过年是两种心态；没宝宝的时候，过年就是吃喝玩乐，不停吃，打打牌；带着宝宝的话，就会觉得过年的几天和平时没任何区别，只手机换地方带娃。3.当然第一次和小美的南方过年也有很多额外压力；小美还不能接受我们的吃饭了就打牌的文化，也不喜欢那些屋里的抽烟的味道，最后再加上所有屋子没有暖气，要忍受寒冷，于是整个假期都是一种在忍耐与克制情绪的状态。4.这甚至让我反思，以前是不是我在过年的几天里找到了很多虚荣心与认同感……当然，积极的部分，就是在某些四世同堂的瞬间，大家都能开怀大笑时，有片刻人生完美之感了。也许这恰恰是人生阶段的变化，以前我是那个需要去大家庭里汲取能量、寻找归属的人，而今天，我已经是那个要给自己的家庭、给自己的宝宝提供能量的人。"},{"date":"2025-02-24","text":"承接drama video lead角色后压力增大，出现今年第一次感冒小发烧。","context":"今年基本平如水。柔柔偶有波澜，但基本还是去学校很顺利，也肉眼可见的有了智慧。生活依然在偶尔达观，偶尔戾气与计较之间来回震荡，但整体的基本盘没有问题，这几天是在比较好的状态。发现自己似乎Stress tolerance变弱了。上周接到了要做drama video lead的role，而后基本都是全身心投入，事无巨细的操心。周末因为不想工作，即便有些应该写下来的会议笔记，也没有去做；也许是一直在这种'紧绷状态'，周末就开始喉咙痛，鼻子堵，周天晚上身上发冷，今天周一似乎是感冒与低烧了；索性到了晚上似乎有些神奇的好转。"},{"date":"2025-03-28","text":"因配偶发烧、女儿半夜哭闹漏尿、换手机设置到深夜等多重因素导致睡眠不足，情绪失控对女儿发过几次脾气。","context":"记录自己几个很情绪化的时刻。这周一开始小美发烧，于是半夜呆在外面睡觉；先是周二晚上一点起来非得喝奶，我就睡的很不少。而后周三柔柔半夜十二点多突然哭，一点又漏尿打湿了床（因为穿的小尿布），过半小时又吵着喝奶，关键喝了一瓶还要再喝，再同时刚好那两天我和小美换手机，我花了很多时间setup，半夜几乎弄到两点，第二天又七点多起床参加八点半的leader training，只睡了四小时；于是耐心就更差，这样那两天半夜肉眼可见的没有耐心，甚至对着柔柔发了几次脾气。我最大最大的教训，就是在现在这个家庭事业两手抓的年纪，'保证充足的睡眠'是立身之本，否则工作做不好，家庭老婆孩子也没有耐心，甚至身体还迅速变差了。第二个就是再次告诫自己，'永远不要高估自己的耐心'。"},{"date":"2025-04-29","text":"开始帮女儿戒夜奶，每晚入睡前需强忍女儿哭闹十多分钟，认定这是'正确但痛苦'的坚持。"},{"date":"2025-05-29","text":"女儿第一次因胃炎剧烈呕吐，反复发烧到38.5度，持续三天后逐渐恢复。"},{"date":"2025-07-29","text":"周末带女儿逛动物园后开始喉咙不适，周二发展为发烧，周三奇迹般退烧。"},{"date":"2025-10","text":"将母亲从国内接到新加坡定居，家庭照护结构发生重大变化——奶奶承担更多带娃任务，本人因HBM项目繁忙常工作到凌晨。"},{"date":"2025-03-15","text":"岳母来新加坡帮忙带娃期间，因期待值设定不同引发与配偶的小摩擦——'降低期待依然是幸福感的前提'。","context":"近日有切身感受到'set right expectation'对幸福感的影响；姥姥刚来时，我的expectation是她能帮忙带一下娃，同时别招惹我，我就谢天谢地了，事实也是这个expectation是做到了的；可是昨天小美表达了不满，说姥姥'生活上帮不上什么忙，也不做早餐，也不主动帮忙'；按这个角度，我忽然发现那生活中姥姥的确有点过于'做客'了，至少做饭之类的时间是少之又少的。有了这个念头之后，就没有初始那么满意了。所以降低期待依然是幸福感的前提"},{"date":"2025-05-03","text":"与配偶因一句玩笑话引发的小冲突，事后反思沟通误解与付出回报不对等的感受。","context":"今天和小美有一个非常小的矛盾，就是我让她不要出去带柔柔的时候，一有时间就玩几秒钟手机。然后后来在电梯，我又开了个玩笑，说是不是还在生闷气。然后她觉得她就是有这样一个不能放空习惯，我是这样judge了他，然后让她不开心呢。她就甚至很偏激的说那你就去你表姐酒店过夜吧。我依然不能理解他为什么要说这样的话，但是依然有几点感悟：我并没有觉得对这个家亏欠什么。我觉得我带柔柔是尽心尽力的，所以现在我的很多姿态有一点过于低了，比如因为要出去，就要提前一天充电，再比如要去台湾所以就要先很久就不再打篮球等等，仔细想来，我花在柔柔身上的精力，照顾柔柔的耐心与精力，是远远超过小美的，那凭什么我要有这么多牺牲呢。尤其是我有了这些牺牲以后，反而还让他觉得牺牲的不够，就好像是做到99分以后，那一分没做到，他就觉得是多么大的错误。我觉得还有一个很重要的误区我一定要想到，就是我总会希望自己有情绪、有不开心的时候，别人能够放弃自己的视角来理解我，来迁就我。但是，你如果对人性理解多了，就会明白，每个人都会陷入在自己的思维逻辑里面。所以，你只能去想我到底想要什么，然后主动的去做你觉得该做的事情，而不是去奢望别人能够猜到你想什么，所谓的control your life就是这个意思。"}],"healthLog":[{"date":"2021-07","member":"本人","note":"疫苗接种后发烧，正常免疫反应，休息2天。"},{"date":"2021-12","member":"本人","note":"Christmas期间严重发烧，累计过度劳累，紧绷后的松弛导致感冒爆发。"},{"date":"2022-09","member":"全家","note":"首次感染COVID-19，本人最重，发烧头痛伴腹泻，全家互相扶持，1周后转阴。"},{"date":"2024-06","member":"本人","note":"腰椎痛复发，姿势不对（侧卧看书）+ 长期不运动，针灸治疗。"},{"date":"2024-08","member":"全家","note":"病毒性肠炎（严重），柔柔爆吐，本人头铁吃麦当劳油炸食品加重病情，教训：生病时必须忌口。"},{"date":"2024-09","member":"柔柔","note":"流鼻涕、咳嗽、荨麻疹，入园压力+季节过敏。"},{"date":"2024-11","member":"柔柔","note":"高烧咳嗽1周（支原体疑云），伴随呕吐，本人与小美体力接近极限。"},{"date":"2025-02","member":"本人","note":"感冒发热、免疫力低，项目压力大，紧绷状态下的防御崩塌。"},{"date":"2025-04","member":"全家","note":"严重感冒流涕，季节性流感。"},{"date":"2025-05","member":"柔柔","note":"感冒咳嗽、呕吐，5/1气管咳嗽，5/29胃炎导致剧烈呕吐发烧，反思饮食卫生与病毒防护需加强。"},{"date":"2025-06","member":"本人","note":"严重牙痛，6/11疼痛难忍，反思：失去才知珍惜，健康平时不可透支。"},{"date":"2025-07","member":"本人","note":"病毒性发烧，7/29浑身痛、冷热交替，反思：连续熬夜后的免疫力崩盘。"}]}</script>

tus":"distilled"},{"id":"b-037","title":"世界因你而不同","author":"李开复","docSource":"知识面扩宽 小说文学 技能教学 P3","status":"distilled"},{"id":"b-038","title":"芯片战争","author":"克里斯·米勒","docSource":"知识面扩宽 小说文学 技能教学 P3","status":"distilled"},{"id":"b-039","title":"万历十五年","author":"黄仁宇","docSource":"知识面扩宽 小说文学 技能教学 P3","status":"distilled"},{"id":"b-040","title":"投资中最简单的事","author":"邱国鹭","docSource":"知识面扩宽 小说文学 技能教学 P3","status":"distilled"}],"library":[{"book":"b-001","quadrant":"DEO","subcat":"A","cluster":"c3","keyword":"双赢思想","title":"人际互动应追求双赢而非零和","core":"公众领域成功的第一原则是双赢思想——把每一次合作都当作可以让双方同时获益的机会来经营，而不是预设对立的输赢博弈。","annotation":"","quote":"","id":"LIB-DEO-A-10","relatedIds":[]},{"book":"b-033","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"举证责任标准","title":"民法“优势证据”vs刑法“排除合理怀疑”：公权力与私权利间证据标准不同","core":"民事诉讼调整平等主体关系，采“优势证据标准”（51%即可胜诉）；刑法调整国家机器与被告人的关系，须采“排除合理怀疑”标准，被告只需承担“提出”合理怀疑的责任，无须自证清白——体现了刑法优先保护弱势一方（面对国家机器的个体）的立场。","annotation":"","quote":"","id":"LIB-DEO-A-100","relatedIds":[]},{"book":"b-033","quadrant":"DEO","subcat":"A","cluster":"c3","keyword":"具体的爱","title":"对具体的人投入具体的关爱，胜过对抽象人类命运的悲悯","core":"书中借“小王子”驯服玫瑰的比喻指出，真正的关系需要投入时间给具体的人，若只是抽象地爱着5000朵玫瑰（全人类）反而依然孤独；抽象的博爱观往往会让人忽略身边具体的人，甚至因为爱抽象的多数而对具体的少数施暴。","annotation":"用户将其总结为个人生活准则之一：“讨论再大的社会与法律问题，对抽象的人类命运表达再多怜悯，都比不上对身边人具体的爱。”","quote":"千万分的思考比不上一分的行动","id":"LIB-DEO-A-110","relatedIds":[]},{"book":"b-033","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"自由需要约束","title":"自由需要以道德、宗教与法律作为堤坝，否则容易滑向放纵与剥削","core":"相当比例的人存在“劣根性”，给予过多不受约束的自由反而会演变为放纵甚至对弱者的剥削（如淫秽物品对经济弱势女性的剥削）；自由需要如堤坝沟渠般的规则引导，否则就像水流一样“只会流失与蒸发”。","annotation":"","quote":"好比水流也需要堤坝沟渠与水管的引导一样，否则只会流失与蒸发","id":"LIB-DEO-A-120","relatedIds":["LIB-INW-A-380"]},{"book":"b-035","quadrant":"DEO","subcat":"A","cluster":"c3","keyword":"老实文化","title":"父母以\"老实\"为最高褒奖,背后是谦逊示弱的处世哲学","core":"书中观察到农村父母有个习惯——自家孩子被表扬时一定不能欣然接受,类似\"满招损\"的思想,而父母能给出的最高评价词就是孩子很\"老实\"。","annotation":"反思这背后是中国人习性中的谦逊、\"中庸之道\",也掺杂着骨子里的不够自信,以及一定程度的示敌以弱。","quote":"","id":"LIB-DEO-A-130","relatedIds":[]},{"book":"b-003","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"课题分离","title":"用谁承担后果来划清自己和他人的课题边界","core":"判断一件事是谁的课题，只需看最终谁承担这件事的后果；不越界干涉别人的课题，也不允许自己的课题被别人干涉，是摆脱认可欲求、减少人际烦恼的核心方法。","annotation":"用户把上司爱发脾气归为对方自己的课题，自己要做的只是坦然面对怎样做好本职工作、持续成长这个课题；也把这次换工作的决定视为自己的课题，别人如何评价这个决定不该是自己的课题。","quote":"可以把马带到河边，但不要强迫马喝水","id":"LIB-DEO-A-20","relatedIds":["LIB-MAS-C-100","LIB-DEO-A-60"]},{"book":"b-003","quadrant":"DEO","subcat":"A","cluster":"c3","keyword":"横向关系","title":"与任何人保持虽不同但平等的横向关系","core":"面对上司、长辈等看似有位阶差异的对象时，应保持横向而非纵向的关系认知——不因权力或年龄差异而在本能上盲从对方观点或屈从压力，同时依然保有基本的尊重。","annotation":"用户指出，人渴望被表扬的心理背后，其实正是把人际关系默认理解成了纵向关系。","quote":"","id":"LIB-DEO-A-30","relatedIds":[]},{"book":"b-004","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"六大触发器","title":"影响力攻防的总纲：识别触发信号,主动拆解诱导","core":"六大影响力武器本质是人在复杂情境下节省决策成本的思维捷径，越复杂的场景越容易被激活；防御的通用策略不是压抑本能反应，而是在察觉自己被异常快速或强烈地说服时，主动停下来把请求和情境拆开单独评估。","annotation":"","quote":"","id":"LIB-DEO-A-40","relatedIds":[]},{"book":"b-022","quadrant":"DEO","subcat":"A","cluster":"c3","keyword":"真爱赋能","title":"区分成全式的真爱与以爱为名的控制","core":"真爱旨在赋能，鼓励对方成为独立的个体；而控制则以爱为名制造依赖，让对方活在自己的规划和恐惧之中——判断家人间的一份好意究竟是爱还是控制，关键看它是让对方更独立还是更依附。","annotation":"","quote":"","id":"LIB-DEO-A-50","relatedIds":[]},{"book":"b-022","quadrant":"DEO","subcat":"A","cluster":"c2","keyword":"边界清晰","title":"边界的核心是厘清'我是我，你是你'的个体责任","core":"健康的边界意味着不为他人的情绪负责，也不让他人来定义自己的价值；缺乏边界的家庭成员关系会高度纠缠、情感上互相勒索，最终导致集体耗竭——边界越清晰，情感的流动反而越健康。","annotation":"特有感[啊][学到了]：人与人关系中，边界越清晰，情感的流动反而越健康。","quote":"人与人关系中，边界越清晰，情感的流动反而越健康。","id":"LIB-DEO-A-60","relatedIds":["LIB-DEO-A-20","LIB-DEO-B-40"]},{"book":"b-033","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"程序正义","title":"正义客观存在，但只能通过程序正义去逼近，而非直接追求结果正义","core":"作者认为正义如同“圆”的概念客观存在，但人的认知有限，无法直接画出完美的圆，只能借助“圆规”（程序）去逼近；跳过程序直接追求实体正义不可取，因为程序正义才是让所有人都感到公平、愿意接受同一正义标准的唯一选择。","annotation":"","quote":"法制的目的就是通过程序正义来追求实体正义，好比通过圆规画圆","id":"LIB-DEO-A-70","relatedIds":[]},{"book":"b-033","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"法律道德最低要求","title":"法律是对道德的最低要求，而非凌驾于道德之上","core":"严重违反道德的行为才需要法律介入约束；反过来，一件事若在道德上被普遍鼓励，就不可能构成犯罪。道德可以作为排除惩罚的消极理由，但不能作为惩罚的积极依据，否则就会滑向道德绑架。","annotation":"","quote":"法律是对道德的最低要求，严重违反道德的就需要法律的约束","id":"LIB-DEO-A-80","relatedIds":[]},{"book":"b-033","quadrant":"DEO","subcat":"A","cluster":"c1","keyword":"道德功利主义","title":"“道德功利主义”：在不违背道德底线的前提下追求最大化的好结果","core":"道德主义的权限高于纯功利主义——可以权衡利弊，但不能违背对生命尊重这类不可动摇的道德底线；但纯道义论又过于教条，容易忽视人对物质成功的正当渴望，“道德功利主义”是在坚守道德底线内追求自己想要结果的一种折中方案（如为保护他人生命而对施暴者说谎）。","annotation":"","quote":"","id":"LIB-DEO-A-90","relatedIds":[]},{"book":"b-001","quadrant":"DEO","subcat":"B","cluster":"c2","keyword":"知彼解己","title":"先理解对方,再寻求被理解","core":"移情沟通的原则是先专注地倾听并理解对方的立场和感受，再表达自己的观点，而不是急于陈述己见。","annotation":"","quote":"","id":"LIB-DEO-B-10","relatedIds":[]},{"book":"b-036","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"色彩关系","title":"互补色/三色组/类似色是好颜色搭配的几种固定公式","core":"色轮相对的互补色(如红绿)、彼此等距的三色组(如红黄蓝)、以及色轮相邻的类似色,是几种经过验证的颜色搭配关系;同一色调加黑得暗色、加白得亮色,也是快速扩展配色方案的办法。","annotation":"","quote":"","id":"LIB-DEO-B-100","relatedIds":[]},{"book":"b-036","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"字体气质","title":"字体的截线、粗细过渡方式,决定了它传递的气质与可读性","core":"old style字体截线倾斜、粗细过渡缓和,适合阅读;modern字体截线水平、粗细过渡剧烈,醒目但不适合大段文本;sans serif几乎没有截线和粗细变化,适合大量文本——选字体本质是在选气质和场景适配度,而非单纯审美偏好。","annotation":"","quote":"","id":"LIB-DEO-B-110","relatedIds":[]},{"book":"b-001","quadrant":"DEO","subcat":"B","cluster":"c3","keyword":"综合综效","title":"创造性合作能产生大于各自贡献之和的成果","core":"综合综效原则主张，当双方基于互信与开放心态协作时，最终方案会优于任何一方单独提出的原始方案，这是团队合作的更高形态。","annotation":"","quote":"","id":"LIB-DEO-B-20","relatedIds":[]},{"book":"b-010","quadrant":"DEO","subcat":"B","cluster":"c2","keyword":"圆融倾听","title":"共情的最高境界是圆融统一的倾听，而非单纯耐心","core":"悉达多晚年待人多了真诚共情，少了'傲慢与聪明'；他看到人们为本能、简单甚至愚蠢的欲望而活、不断受难，却依然在他们盲目的忠诚与坚韧中看到可爱可敬之处、看到生命本身。智慧不过是在生命中每个瞬间能圆融统一地思考、感受并融入这种统一的一种能力和秘密艺术。","annotation":"用户区分了两种共情：只做到表面倾听只需要'耐心'，但真正的大爱需要'感同身受'，理解对方感受甚至从中发现某种深层次的美感；并坦承自己的共情还远远达不到那种'大爱'境界。","quote":"他在他们的每种激情中看到生命，生机，看到坚不可摧之物和梵天。","id":"LIB-DEO-B-30","relatedIds":[]},{"book":"b-021","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"争论四不要","title":"不打事实网球、不转移话题、不牺牲自己，聚焦一个焦点用'我'陈述","core":"争论时堆砌理由却回避对方感受（打'事实网球'）、刻意回避冲突（转移话题）、憋屈自己等待爆发（牺牲自己）都无助于解决问题；正确做法是一次只讨论一个焦点、以'我'陈述分享感受而非用事实攻击对方、不急着定义对方意图，以理解为目的而非获胜为目的。","annotation":"","quote":"不要打'事实网球'——讲越来越多的理由，却就是不理解对方感受或寻找解决方法，最后没有赢的一方。","id":"LIB-DEO-B-40","relatedIds":["LIB-DEO-A-60"]},{"book":"b-035","quadrant":"DEO","subcat":"B","cluster":"c3","keyword":"社交货币","title":"香烟是中国社交场域里身份与关系的隐性货币","core":"书中观察到中国人社交中,香烟的档次直接对应着身份高低与关系亲疏,越好的烟代表越高的身份和越强的关系——同时政府对烟草收入的依赖,也让公共健康宣传让位于财政与政治利益。","annotation":"反问如果抗疫真的纯粹为了民众健康,为何不同样力度宣传吸烟的危害?说明政治需要始终优先于党的利益,其次才是民生与经济。","quote":"","id":"LIB-DEO-B-50","relatedIds":[]},{"book":"b-036","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"亲密性","title":"亲密性原则:相关项分组,不相关项留白隔开","core":"设计中把相关的元素组织在一起、不相关的元素用留白隔开,能让信息呈现出清楚的逻辑与视觉动线;常见误区是无意义填满角落空白,或同一组内留白不一致。","annotation":"","quote":"","id":"LIB-DEO-B-60","relatedIds":["LIB-LEG-A-100"]},{"book":"b-036","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"对齐","title":"对齐原则:找一条隐形基准线,页面上每个元素都与之呼应","core":"页面上任何元素都应与某个内容存在视觉联系;左右对齐通常比居中对齐更清晰有力,居中对齐容易让页面失去统一的视觉动线,是最容易被滥用的对齐方式。","annotation":"","quote":"","id":"LIB-DEO-B-70","relatedIds":[]},{"book":"b-036","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"重复","title":"重复原则:靠一致的视觉元素串联起整体设计的一致性与连续性","core":"字体、粗线、项目符号、颜色等元素在整份设计中重复出现,能建立一致性、并把单独的部分串联成一个可以流畅读下去的整体;技巧是选一个简单元素以多种方式变化使用,而不是机械复制。","annotation":"联想到公司汇报PPT里background/model/conclusion这类结构性重复,起的是同样的连续性作用。","quote":"","id":"LIB-DEO-B-80","relatedIds":[]},{"book":"b-036","quadrant":"DEO","subcat":"B","cluster":"c1","keyword":"对比","title":"对比要么不做,要做就必须强烈到毫不犹豫","core":"两个元素只要不完全相同,就该让它们截然不同——12号和14号字体的差异形同虚设,反而像是失误;对比的目的是建立层次、抓住读者的视线,不敢大胆对比往往比不做对比更糟。","annotation":"联想到工作中同事处理图表和文字的习惯:有人喜欢把重要数字放得极大,有人喜欢把重要的线画成纯黑,本质都是靠强烈对比抓重点。","quote":"","id":"LIB-DEO-B-90","relatedIds":[]},{"book":"b-021","quadrant":"DEO","subcat":"C","cluster":"c2","keyword":"教养轮回","title":"自己童年被如何对待，会无意识地复制到对下一代的教养上","core":"幼年接受的亲子教育方式会影响自己成年后对子女的教养方式，因此在理解孩子想法（同理心）时，最好时时反思自己童年经历以避免重蹈覆辙；但无论过去经历如何，现在开始改变依然来得及，关系破裂后重要的是采取行动修复。","annotation":"比如要是我父母总是习惯否定而不是赞美我，那我对自己的子女也会习惯性的否定（甚至是一种对自己过去不美好经历的报复）。","quote":"","id":"LIB-DEO-C-10","relatedIds":[]},{"book":"b-022","quadrant":"DEO","subcat":"C","cluster":"c2","keyword":"情绪化父母应对","title":"面对情绪化的父母：接受现实、摆脱纠缠、划清情绪边界","core":"首先要从内心承认有些事永远无法改变（如童年未得到的认同），放弃不切实际的期待；试图改变父母其实是一种隐秘的自恋和权力争夺，注定徒劳；面对父母倾诉时可以扮演'只听不说'的倾听者，并明确告诉自己'这是她的情绪和人生课题，我无法也无需为此负责'。","annotation":"特有感[大开眼界]：试图改变父母其实是一种隐秘的自恋和权力争夺，其动机是'让你变成我理想中的父母'的利己需求，这是一场注定徒劳的消耗战。学到了，我也可以对父母只听不反驳。","quote":"","id":"LIB-DEO-C-20","relatedIds":[]},{"book":"b-022","quadrant":"DEO","subcat":"C","cluster":"c2","keyword":"控制型母亲应对","title":"与控制型母亲'分离'的关键：不一刀切、提前沟通、角色对等","core":"关系处理上避免决绝分离，给彼此留回旋余地；主动清晰告知母亲自己未来生活规划中她所处的被尊重位置，以缓解其恐慌与被抛弃感；以平等的成年人姿态而非被动听话的女儿身份沟通；同时真诚关心以化解防御，必要时适时示弱以激发母爱本能，效果好于硬碰硬对抗。","annotation":"凡事留一线；茅塞顿开，我也可以分享类似计划给我父母；非常好，我也要找到这种平衡，既避免直接对抗，同时以爱为本，又恰当表达出成熟的对自己人生做主的态度，且不害怕随之而来的部分距离感；我也这样做，既是从我的角度表达，也是用情而不是用理，很适合对f型的人。","quote":"","id":"LIB-DEO-C-30","relatedIds":[]},{"book":"b-022","quadrant":"DEO","subcat":"C","cluster":"c1","keyword":"关系复刻","title":"熟悉的痛苦比陌生的健康更让人感到'安全'","core":"人们容易在亲密关系中无意识复刻原生家庭的相处模式，最典型的表现是'与攻击者认同'——成为自己当初最讨厌的人；根源是对父母的关系模式最熟悉，即便充满痛苦也早已掌握应对策略，这种熟悉感有时比不确定的健康模式更让人感到安全。","annotation":"深有同感；即便我很多对待生活事件的处理方式，也是在家里习得的。比如父母觉得得大方请客，我就会请客。父母说对伴侣要多包容我就会包容。若是他们说了脾气大不好，我就也会觉得这样不好。","quote":"","id":"LIB-DEO-C-40","relatedIds":[]},{"book":"b-022","quadrant":"DEO","subcat":"C","cluster":"c1","keyword":"谁痛苦谁改变","title":"关系是动态系统，停止等待对方改变，把焦点转回自身","core":"婚姻关系如同拔河或跷跷板，一方改变策略另一方必然随之调整；停止等待和要求对方改变（那只会带来无力与怨恨），转而思考'在这段关系中我能做些什么来让情况不同'，这才是为自己的人生和关系真正负责的体现。","annotation":"特有感[啊][就是从自身找问题]：改变的焦点：停止等待和要求对方改变。","quote":"","id":"LIB-DEO-C-50","relatedIds":[]},{"book":"b-030","quadrant":"DEO","subcat":"C","cluster":"c1","keyword":"夫妻互动塑造性格","title":"父母间的互动方式会持续终生地影响孩子的性格","core":"孩子会在成长过程中不自觉地继承父母互动中的影子，尤其24个月后是性格形成关键期——当着孩子面争吵甚至摔东西，其影响会延续到孩子成年，这要求父母对彼此的互动方式保持警觉。","annotation":"","quote":"","id":"LIB-DEO-C-60","relatedIds":[]},{"book":"b-010","quadrant":"DEO","subcat":"D","cluster":"c1","keyword":"放手","title":"对子女最难也最必要的，是放手而非用爱束缚","core":"悉达多与儿子相遇后第一次真正去爱，却也因爱而遭受苦难；儿子骄纵，悉达多不责骂只包容，却也害怕送他入俗世致其沉迷。书中借角色之口质问：'不强迫不责罚的主张，难道不是一种过失？难道你没有用爱束缚他？'儿子最终逃走，悉达多在寻子途中顿悟了'放手的意义'：人只能独自行过生命，蒙受玷污、承担罪过、寻觅出路，没有人能被父亲或老师一路庇护，父母最难也最需要做到的就是放手。","annotation":"用户联想到当下父母带孩子的普遍状况——'以爱之名，其实想实现的是自己的心愿'，反思父母是否真正想过孩子自己的感受、是否给了他们充足的自由；并表示希望把'经历失败经历错误从来不是坏事'的想法也带给自己的孩子。","quote":"是谁保护悉达多免于罪孽、贪婪和愚昧？是他父亲的虔诚，老师的规劝，还是他自己的求索？","id":"LIB-DEO-D-10","relatedIds":[]},{"book":"b-030","quadrant":"DEO","subcat":"D","cluster":"c1","keyword":"诚实守信底线","title":"对孩子要绝对诚实守信，孩子对“言行不一”的嗅觉极其敏锐","core":"一旦对孩子说一套做一套，她很快就不再相信你——书中强调即便是承诺“坐公交去图书馆”这样的小事，也必须兑现，诚信是亲子信任的基础，一旦破坏很难修复。","annotation":"","quote":"小孩子的嗅觉比狗还灵","id":"LIB-DEO-D-100","relatedIds":[]},{"book":"b-030","quadrant":"DEO","subcat":"D","cluster":"c1","keyword":"探索边界式犯错","title":"孩子的很多“犯错”本质是在表达自我、试探边界，而非恶意","core":"随着孩子逐渐意识到自己可以做决定、可以用各种方式表达不满，很多所谓的“不听话”其实是在尝试表达和表现自己——理解这一点能帮助父母不把孩子的探索行为简单地当作需要压制的问题。","annotation":"","quote":"","id":"LIB-DEO-D-110","relatedIds":[]},{"book":"b-021","quadrant":"DEO","subcat":"D","cluster":"c1","keyword":"行为塑造论","title":"父母的行为，而非对孩子反应的解读，才是塑造孩子人格的核心","core":"孩子是基因与环境的混合，父母是环境中最重要的组成部分；与其花精力去分析孩子每个行为背后的意图，不如把注意力放回自己的行为本身，因为父母的行为示范才是真正在塑造孩子人格的变量。","annotation":"","quote":"","id":"LIB-DEO-D-20","relatedIds":[]},{"book":"b-021","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"不贴标签","title":"评价孩子行为要描述具体行为并肯定优点，而非笼统贴标签","core":"父母不应给孩子的行为贴上'不听话''闹腾'这类笼统评判性标签，而应描述具体看到的行为并指出其中值得欣赏的优点，例如说'我佩服你画画时专注的样子'而不是空泛的'你太棒了'。","annotation":"","quote":"","id":"LIB-DEO-D-30","relatedIds":[]},{"book":"b-021","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"确认感受","title":"多花时间理解孩子感受，即便不认同也不急于否定","core":"即便是父母觉得不合理的感受，只要保持理解而不急于否定，孩子反而更容易建立安全感、也更愿意接受父母的意见；孩子发脾气时不必立刻满足要求，但一定要进行安抚、表达共情、替其用语言表达感受。","annotation":"","quote":"","id":"LIB-DEO-D-40","relatedIds":[]},{"book":"b-021","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"睡眠训练即控制","title":"睡眠训练是让孩子放弃求助，而非真正的独立","core":"让孩子哭喊到自己入睡的'睡眠训练'本质上是训练孩子放弃寻求安慰，会破坏其安全感，甚至让孩子放弃向父母表达感受或失去同情心；反而是及时回应孩子的需求，才能建立起长期的安全感并帮助其真正走向独立。","annotation":"","quote":"","id":"LIB-DEO-D-50","relatedIds":["LIB-MAS-B-150"]},{"book":"b-021","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"合作型管教","title":"管教效果排序：合作型 > 宽松型 > 严格型","core":"宽松管教最大的问题是孩子不知道父母的期待与标准，反而缺乏安全感；合作型管教的关键是从自己的需要出发对孩子提出请求、理解并肯定孩子行为背后的感受、再与孩子一同商量解决方案——这种方式最有利于培养孩子的抗挫折、应变、解决问题与共情四种适应社会的核心能力。","annotation":"","quote":"","id":"LIB-DEO-D-60","relatedIds":["LIB-DEO-D-70"]},{"book":"b-022","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"恰到好处的挫折","title":"安全感不是密不透风的爱，而是温柔而坚定的边界","core":"过度补偿式的密不透风的爱，反而会剥夺孩子发展自我安抚、独处、应对挫折等关键能力的机会；真正的安全感培养需要设定边界（让孩子自己承担情绪，父母陪伴而非替代）、鼓励独处，并温柔而坚定地拒绝不合理要求，让孩子在安全范围内体验微小的失望。","annotation":"温柔而坚定是关键。","quote":"","id":"LIB-DEO-D-70","relatedIds":["LIB-DEO-D-60"]},{"book":"b-030","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"语气而非嗓门","title":"管教孩子靠“语气”的严肃感，而不是提高音量或吼叫","core":"想让孩子听话又不用大吼大叫，关键在于运用严肃的语气传达问题的严重性，必要时配合表情——语气比嗓门更需要“智商”，也不会让双方在事后感到尴尬。","annotation":"","quote":"语气跟嗓门是一对孪生兄弟，只不过前者更需要智商","id":"LIB-DEO-D-80","relatedIds":[]},{"book":"b-030","quadrant":"DEO","subcat":"D","cluster":"c2","keyword":"动之以情","title":"管教孩子“动之以情”比“晓之以理”更有效","core":"与其向孩子解释某个行为有什么逻辑问题，不如坦诚告诉她“你的做法让我感觉很难过”——这利用了孩子的同理心，目的仍是矫正行为，但比讲道理更能触及孩子的内心。","annotation":"","quote":"","id":"LIB-DEO-D-90","relatedIds":[]},{"book":"b-002","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"概念清晰","title":"概念不清晰,思考就无法准确","core":"大脑里的核心概念如果模糊、错误或缺失，就必然导致思考不清、判断出错甚至行为失当；一个人有多聪明，本质上取决于脑中有多少清晰、准确、必要的概念，以及这些概念间的关联密度。","annotation":"用户提到自己反复琢磨公司邮件的措辞、坚持写日记整理思路，本质都是在刻意训练把每个概念想清楚，认为这个习惯也在持续塑造自己整个思维操作系统。","quote":"衡量一个人多么聪明（或者多么高级的物种），就看他脑子里有多少清晰，准确，必要的概念+这些概念之间有多少清晰，准确，必要的关联","id":"LIB-INW-A-10","relatedIds":[]},{"book":"b-005","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"逆向思考","title":"研究如何失败往往比研究如何成功更有效","core":"芒格擅长用逆向思考解决问题——比如要理解企业为何能成功，先研究企业为何会衰败失败，通过反向排除法逼近正确答案，这是许多领域普遍适用的分析工具。","annotation":"用户把这条方法论延伸到自己的职业规划思考上，认为职场发展路径同样应该先想清楚什么样的选择会让职业生涯衰败。","quote":"","id":"LIB-INW-A-100","relatedIds":[]},{"book":"b-005","quadrant":"INW","subcat":"A","cluster":"c2","keyword":"误判心理学","title":"25种心理倾向系统性解释了人类为何会做出错误判断","core":"从权威误判、喜爱/憎恨倾向、避免不一致性、社会认同、被剥夺的超级反应（稀缺）、奖惩超级反应、对比错误反应到简单联想影响等，人类大脑的决策捷径在特定情境下会系统性地导致误判；多种倾向同时叠加作用时，后果往往最极端。","annotation":"","quote":"","id":"LIB-INW-A-110","relatedIds":["LIB-LEG-A-110"]},{"book":"b-007","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"连接优先","title":"改变系统的连接方式比替换要素影响力大得多","core":"一个系统由要素、连接方式、功能/目标三部分构成；改变要素（如换球员、换叶子）对系统整体表现的影响，远小于改变连接方式（战术、默契）或目标本身——一旦目标从赢球变成赌钱，整个系统的行为会截然不同。","annotation":"用户把这条用在自己所在部门的人员流动上，认为个别人员变化对部门运作影响不大，核心还是连接方式和目标是否稳定。","quote":"","id":"LIB-INW-A-120","relatedIds":["LIB-INW-A-90"]},{"book":"b-007","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"增强调节回路","title":"调节回路维持稳定,增强回路制造指数级变化","core":"反馈回路是系统运作的核心机制——调节回路（如血糖稳定系统）让存量保持相对稳定；增强回路（如人口增长、银行复利）会不断放大原有趋势，导致存量呈指数级变化，多数增强回路后期都会被新的调节回路平衡。","annotation":"","quote":"","id":"LIB-INW-A-130","relatedIds":["LIB-MAS-A-50"]},{"book":"b-007","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"系统三特征","title":"适应力、自组织、层次性是判断系统健康度的三个维度","core":"适应力是系统受扰动后恢复自身稳定运作的能力；自组织是系统自我学习、进化、复杂化的能力；层次性是大系统与子系统之间既相对独立又服务于整体的结构——层次性失衡的常见误区是子系统目标凌驾于整体目标之上，或中央过度管控（micromanage）。","annotation":"","quote":"","id":"LIB-INW-A-140","relatedIds":[]},{"book":"b-007","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"最强杠杆点","title":"目标设定与社会范式是系统里效果最强的两个杠杆点","core":"在系统的12个干预杠杆点中，调整参数或流量这类具体数字是最低效的方式；真正的高杠杆点是重新设定系统目标，以及更根本地改变支撑整个系统运作的社会范式（大家共同相信的世界观），后者能从根本上重构整个系统的目标、结构和规则。","annotation":"","quote":"","id":"LIB-INW-A-150","relatedIds":[]},{"book":"b-009","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"战略转折点","title":"战略转折点：企业根基被10倍速变化颠覆的关键时刻","core":"当企业经营根基（技术、竞争、客户等）发生根本性、不可逆的改变，旧游戏规则彻底失效时，就出现了战略转折点。驱动力是六大竞争力（现有对手、供应商、客户、潜在对手、替代方案、互补企业）中某一项力量在短期内剧增十倍，足以压倒现有商业模式。识别信号包括：面对'良方测试'（只有一颗子弹打谁）时答案变得模糊、过去的战略伙伴退居二线、身边精明的同事开始迷惑争论。","annotation":"六大竞争力逐条对应了英特尔、tsmc、iPhone对诺基亚等案例，用户认可这套框架同样适用于判断今天的AI革命。","quote":"这不仅是变化，更是企业命运的曲线拐点，如同探险队在陌生领域中猛然意识到地图已无用，必须寻找新路。","id":"LIB-INW-A-160","relatedIds":["LIB-LEG-A-250","LIB-INW-A-660"]},{"book":"b-009","quadrant":"INW","subcat":"A","cluster":"c2","keyword":"成功惯性","title":"成功带来的惰性是最强的认知障碍","core":"过去的成功经验会固化为企业（或个人）的'基因'和'信条'，成为最强大的认知障碍，使人不愿或不能面对痛苦的现实；同时中层和一线员工因身处'战场前线'最早感知变化，却因组织层级和沟通障碍难以把信号传达给高层，导致'老板最后一个知道真相'。","annotation":"用户标注【特有感】[辟]，认为这解释了IBM因纵向一体化的巨大成功而难以适应PC时代横向分工、DEC作为小型机革命者却抵制微处理器革新的根本原因。","quote":"成功带来的惰性：过去的成功经验会固化为企业的'基因'和'信条'，成为最强大的认知障碍。","id":"LIB-INW-A-170","relatedIds":["LIB-LEG-B-170"]},{"book":"b-009","quadrant":"INW","subcat":"A","cluster":"c2","keyword":"最初模型陷阱","title":"警惕'最初模型陷阱'，用10倍思想实验判断新事物潜力","core":"不要因新事物的初代产品不完美、体验差就否定其长期潜力，很多革命性事物初期都显得笨拙可笑（如第一代PC、Windows 1.0、早期PDA）。核心思考方法是做思想实验：想象该事物在各方面改进10倍后（性能更强、成本更低、体验更好）是否会成为主流、成为新的威胁或机遇。当数据失效、只能说明过去而无法预测未来时，激烈开放的辩论（尤其纳入公司外部人士）是澄清模糊、打破内部回音室效应的唯一工具。","annotation":"用户标注【特有感】[p]并明确指出'今天的AI就是这样的例子'；也标注[d]认可辩论必须包含外部人士这一点，评价为'格局打开'。","quote":"","id":"LIB-INW-A-180","relatedIds":[]},{"book":"b-013","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"天才代价","title":"高创造力伴生孤僻与亲密关系不稳定的代价","core":"高水平多巴胺驱动想象力，让人能想象超越当下感受的事物，因此科学家往往也是艺术家，二者都需要抽象与想象的能力；但高创造力要求高水平多巴胺，会抑制当下分子，导致这类人（如福尔摩斯式人物）孤僻、社交能力差或过于自闭算计，亲密关系不稳定，爱抽象的人类却不爱具体的人。反过来这类'非普罗大众'也正因此成为提出革命性思想的革命家，甚至改变了世界的轨迹（如孟德斯鸠、贝多芬、牛顿、特斯拉）。","annotation":"用户联想到罗翔提出的'多爱身边具体的人，少一些普世的爱'的类似观点，并认为这解释了自己在书上、电视上看到的天才人物身上或多或少都带有的偏执个性。","quote":"","id":"LIB-INW-A-190","relatedIds":[]},{"book":"b-002","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"复利曲线","title":"一切可积累的成长都遵循复利曲线","core":"知识、经验、资产的积累都符合指数增长的复利效应——早期增长缓慢甚至看不出效果，但跨过某个拐点（成本线）后会急速上扬；这解释了为何长期主义者前期显得盲目自信，因为他们坚信曲线终会起飞。","annotation":"用户将此与自己量变引起质变的一贯信念对应，认为这是自己保持自信的心理基础。","quote":"","id":"LIB-INW-A-20","relatedIds":[]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"制度人事论","title":"制度是死的，人事是活的，二者必须适配","core":"无生命的制度无法脱离活的人事而独立发挥作用；若人事腐败或精神堕落，再好的制度也会变形走样。评判一套制度不能脱离执行它的人，强行照搬外国制度而摧残本地人事结构必然失败。","annotation":"特有感[典][System fix also need consider people]：制度是死的，人事是活的，二者必须适配，不能为了强行模仿外国制度而摧残人事，否则便是削足适履，必然失败。","quote":"无生命的制度无法脱离活的人事而独立存在与生长。","id":"LIB-INW-A-200","relatedIds":["LIB-INW-B-220"]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c2","keyword":"历史意见","title":"评价历史制度要用'历史意见'而非'时代意见'","core":"不能仅凭当代价值观评判历史制度，每项制度都有其深刻的时代背景与合理性；应重视制度实施时代亲历者的真实反馈（历史意见），而非后世单方面的理论推演（时代意见）。","annotation":"特有感[典]：壮年人不能因自己不睡摇篮，就认为睡摇篮是错的，需理解制度的时代性，避免犯下'历史的傲慢'。","quote":"壮年人不能因自己不睡摇篮，就认为睡摇篮是错的。","id":"LIB-INW-A-210","relatedIds":[]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"选才根本论","title":"选举与考试制度比政府组织法更根本","core":"政府组织法只决定权力如何分配，而选举/考试制度打通了社会与政府的渠道，决定了'什么样的人'能进入政权，从而从根子上塑造了政权的性质——这比研究权力架构本身更能解释一个政权的底色。","annotation":"特有感[典]：选举与考试制度：比政府组织法更根本，其本质是打通社会与政府的渠道，决定了'什么样的人'可以进入政府，从而塑造了政权的根本性质。","quote":"","id":"LIB-INW-A-220","relatedIds":[]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"士人政府","title":"汉代教育-实习-举荐-入仕四步曲奠定士人政府传统","core":"汉代将太学教育、地方行政实习、察举推荐（孝廉）、郎官考察四个环节融为一体，打破贵族对仕途的垄断，使政府成员逐渐由读书人构成，奠定了此后中国'崇尚文治'而非贵族/军人/商人主导的政治传统。","annotation":"特有感[辟]：政府成员逐渐由读书人构成，形成了此后中国'崇尚文治'的士人政府传统，而非贵族、军人或商人政府。","quote":"","id":"LIB-INW-A-230","relatedIds":[]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"分权制衡术","title":"唐代三省六部制：把决策权拆成起草-审核-执行三段","core":"中书省起草诏令（决策源头）、门下省审核并拥有封驳权（制衡）、尚书省负责执行，三省相互制衡，是一种把'相权'拆解为流程环节以防止权力集中的通用治理设计思路，六部取代汉代含混的'家务官'式九卿，标志政府职能从服务皇室转向服务国家。","annotation":"特有感[辟]：官名正式化，从汉代充满'家务官'色彩的名称变为纯粹的国家职能部门，是政治意识的巨大进步。","quote":"","id":"LIB-INW-A-240","relatedIds":[]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"法术非制度","title":"区分'法术'与'制度'：私利手段 vs 公共正当性","core":"'法术'只讲求手段和私利，服务于统治集团的特殊利益；'制度'则具有公共的、正当的政治意义，面向整个国家。清代作为满洲部族征服政权，其大量统治措施本质是维护部族私利的'法术'而非真正的公共制度——这是判断任何治理安排性质的一把通用尺子。","annotation":"特有感[私心是关键。越康是法术]：其措施多为'法术'而非'制度'。","quote":"'法术'只讲求手段和私利，服务于统治集团的特殊利益；而'制度'则具有公共的、正当的政治意义，面向整个国家。","id":"LIB-INW-A-250","relatedIds":["LIB-INW-B-210"]},{"book":"b-018","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"革命造反之别","title":"传统王朝更替是'造反'，晚清必须是'革命'","core":"汉唐宋明是向全社会开放的公共政权，其腐败属于'人事'问题，换人修制即可（造反/变法）；清政权是满洲部族的封闭'私政权'，不推翻这个权力主体，任何制度改革都无法成功，因此必须先'革命'再'变法'——康有为只看到制度问题而未看到部族主权障碍，见事不见人；孙中山抓住了问题根本。","annotation":"特有感[辟]：革命与造反的根本区别；特有感[典]：康有为的错误，可谓见事不见人；孙中山认识到必须先'革命'推翻部族主权，然后再'变法'建立新制度，抓住了问题的根本。","quote":"","id":"LIB-INW-A-260","relatedIds":[]},{"book":"b-019","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"政府生产者","title":"理解中国经济的钥匙：政府不仅分配蛋糕，更生产蛋糕","core":"脱离政府谈中国经济是不可行的，理解中国经济现象应聚焦'是什么'和'为什么'背后的运行机制，而非急于套用西方主流经济学的普适框架去裁剪中国现实——特定发展阶段的资源动员方式有其深刻的历史与现实根源。","annotation":"","quote":"在中国，政府不仅是'蛋糕'的分配者，更是生产者。","id":"LIB-INW-A-270","relatedIds":[]},{"book":"b-019","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"事权划分四因","title":"外部性、规模经济、信息复杂性、地理人文共同决定事权应下放到哪一级","core":"政策影响范围应与行政区域匹配（外部性）；公共物品覆盖越广人均成本越低（规模经济）；地方更了解本地信息、处理成本更低（信息复杂性）；人口密度与自然地理边界也影响行政区划大小——这是判断一件事该由哪一级组织来管的通用分析框架，不限于政府。","annotation":"","quote":"","id":"LIB-INW-A-280","relatedIds":[]},{"book":"b-019","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"晋标赛激励","title":"GDP晋升锦标赛+收入本地挂钩构成官员的胡萝卜与大棒","core":"对地方主官而言，GDP增长曾是决定仕途升迁的核心政绩，催生地区间'晋标赛'；对普通公务员而言，晋升空间有限但工资奖金与本地财政状况紧密挂钩，两者叠加纪律监督与地区招商引资的市场化约束，构成一套完整的激励-约束体系，是理解任何组织如何驱动基层行为的通用样本。","annotation":"","quote":"","id":"LIB-INW-A-290","relatedIds":[]},{"book":"b-004","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"互惠原理","title":"人有以相同方式回报他人恩惠的本能","core":"互惠是刻在人类演化中的社会契约——接受帮助后若不回报会产生负罪感，这种本能比喜好更有影响力（即便讨厌对方也会因受助而回报），也让拒绝-退让式谈判（先提大要求再让步到真实目标）容易得逞。","annotation":"","quote":"滴水之恩涌泉相报","id":"LIB-INW-A-30","relatedIds":[]},{"book":"b-019","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"土地财政本质","title":"'土地财政'的实质是'房地产财政'","core":"地方政府垄断土地一级市场获取转让收入与相关税费，其资本化的核心其实是把居民个人未来几十年的收入预期，通过住房贷款提前变现——这层关系比单看'卖地'表象更能解释高房价与居民高杠杆的成因。","annotation":"特有感[d]：本质是'土地财政'的实质是'房地产财政'，其资本化的核心是将居民个人未来的收入预期进行资本化（通过长达数十年的银行住房贷款）。","quote":"","id":"LIB-INW-A-300","relatedIds":[]},{"book":"b-019","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"以人为本转型","title":"城市化的核心不应是土地，而应是人","core":"过去'重土地轻人'的城市化模式导致土地与人口流向背离、公共服务与户籍而非常住人口挂钩；改革方向应是让建设用地指标随人口自由流动，缩小差距的关键在于促进人的自由流动，使个人价值与资产价值同步实现最大化。","annotation":"特有感[典]：城市化的核心不应该是土地，而应该是人。","quote":"","id":"LIB-INW-A-310","relatedIds":[]},{"book":"b-020","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"AI即能源","title":"AI是新工业革命的核心，模型是压缩人类知识的'发电机'","core":"Transformer相当于新工业革命的内燃机，通过海量互联网数据训练把对人类世界的理解压缩进模型，使机器智能可能成为像电力一样普惠各行业的通用'能源'。","annotation":"","quote":"","id":"LIB-INW-A-320","relatedIds":[]},{"book":"b-020","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"算力能源瓶颈","title":"未来AI发展的最大瓶颈将是电力而非芯片","core":"数据中心未来将以算力为主导资产，而电力供应会成为AI进一步发展最大的物理瓶颈，需要投资核聚变等新能源来解决，这一判断把AI竞争从纯软件/芯片问题延伸到了能源基础设施层面。","annotation":"","quote":"","id":"LIB-INW-A-330","relatedIds":[]},{"book":"b-020","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"快慢思考分工","title":"云端与边缘终端模型配合，对应人类系统1/系统2思维","core":"云端大模型负责慢而深的推理（系统2），边缘/设备端小模型负责快速直觉式响应（系统1），两者结合模拟人类的快慢双系统思维模式，是理解AI架构演进的一个借用认知科学的类比框架。","annotation":"","quote":"","id":"LIB-INW-A-340","relatedIds":[]},{"book":"b-020","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"AGI定义","title":"判断AGI应关注能力而非过程","core":"评判一个系统是否达到通用人工智能，应看它能否完成人类能完成的任务（能力标准），而不需要它像人类一样思考理解或具备意识感知（过程标准）——这是把AGI讨论从哲学思辨拉回工程可衡量指标的一个立场。","annotation":"","quote":"","id":"LIB-INW-A-350","relatedIds":[]},{"book":"b-023","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"机器人文分工","title":"机器负责精确的技术判断，人负责人文关怀","core":"机器不受外在情绪等因素干扰，因'精确、冷静'而在技术判断上具有天然优越性；由此得出的分工原则是：把可标准化的技术判断交给机器，把不可替代的共情与关怀留给人——这是判断人机协作边界的一个通用思路。","annotation":"","quote":"","id":"LIB-INW-A-360","relatedIds":[]},{"book":"b-023","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"疼痛闸门论","title":"疼痛感受强弱取决于神经信号与大脑感受神经间的'闸门'","core":"很多说不清病因的疼痛、头痛、恶心呕吐并非无中生有——疼痛信号传到大脑之间存在一道'闸门'，闸门开合程度因人而异（如战士与普通人、内向与外向者），这解释了为何同等强度的刺激在不同人身上会产生截然不同的主观疼痛体验。","annotation":"","quote":"","id":"LIB-INW-A-370","relatedIds":[]},{"book":"b-025","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"温水煮青蛙","title":"极权体制的渐进侵蚀模式：温水煮青蛙式的权利剥夺","core":"书中基列共和国的建立不是一夕突变，而是先剥夺财产权，再军管宵禁，再控制生育与媒体，最后完成立法固化——每一步都以社会认为可接受的方式蚕食自由，最终让整个社会在不知不觉中被重塑。","annotation":"用户认为这正是今日中国治理危险之处的隐喻——高效的组织动员能力（如疫情封城、反腐）背后，一旦缺乏制衡机制，一旦上层昏庸或恶意，就没有有效机制能及时纠偏。","quote":"如温水煮青蛙一般，先是女性失去了所有财产权，而后是军权政府，宵禁……再控制媒体，干扰语言自由……最后把一切立法，渐渐让制度潜移默化的改变整个社会","id":"LIB-INW-A-380","relatedIds":["LIB-DEO-A-120"]},{"book":"b-025","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"洗脑规训","title":"极权规训的心理机制：从外部胁迫到内化认同","core":"书中描述使女被灌输“生育是为国牺牲”的宏大叙事，配合监视和软硬兼施的手段，直到个体不仅无计可施，甚至真心相信不服从是可耻的——展示了强制如何演变为自我审查式的认同。","annotation":"用户将其与文革时期“上山下乡是一代人的牺牲”式动员相类比，认为这是同一套精神控制的历史重演。","quote":"","id":"LIB-INW-A-390","relatedIds":[]},{"book":"b-004","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"承诺一致","title":"人有维持言行与既往立场一致的本能","core":"一旦做出承诺（尤其是书面的、公开的、自愿的、代价较高的承诺），人会本能地用后续行为去验证这个承诺，即便事后理性分析会发现不划算，也会因为回避面对自己错了这个更痛苦的后果而选择继续保持一致。","annotation":"用户提到自己曾用是否真的信某只股票这类问题去试探同事的真实态度，意识到这本身就是在利用承诺一致原理。","quote":"","id":"LIB-INW-A-40","relatedIds":[]},{"book":"b-025","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"言论管控","title":"言论管控是极权维系的关键杠杆，且有历史与现实的多重印证","core":"书中基列共和国通过控制媒体、只允许官方叙事存在来维持统治合法性；用户将其与朝鲜处决持有境外光碟者、“官方军队永远胜利”式宣传相对照，指出压制言论自由是所有此类体制的共同特征。","annotation":"细思极恐——虚构小说里的极端情节，在现实的多个政权中都能找到对应案例。","quote":"","id":"LIB-INW-A-400","relatedIds":["LIB-INW-A-450"]},{"book":"b-026","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"生命去神秘化","title":"生命现象可还原为物理化学定律，无需诉诸“灵魂”或“活力”等特殊物质","core":"从亚里士多德的灵魂论、活力论，到米勒-尤里实验证明生命构成物质可在模拟原始地球环境中自发产生，科学逐步证明生命并无特殊物质基础，一切复杂生命现象最终可还原为基本物理化学规律。","annotation":"","quote":"至少在物质构成的角度上，包括人类在内的地球生命，并没有什么特殊之处。灵魂也好，活力也好，瞬间变成了多余的假说。","id":"LIB-INW-A-410","relatedIds":[]},{"book":"b-026","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"生命三大基石","title":"能量获取、自我复制、细胞膜是地球生命得以存在的三大基础机制","core":"生命需要持续从外界获取能量以对抗熵增（如化学渗透驱动ATP合成）；通过自我复制中的“错误”完成对环境的适应性演化；细胞膜作为分隔屏障保护内部秩序不受外界干扰——三者共同构成了生命的最小充分条件。","annotation":"","quote":"地球生命起源的三大要素就此功德圆满","id":"LIB-INW-A-420","relatedIds":[]},{"book":"b-026","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"分工感知社交","title":"多细胞分工、感知能力、社交行为是复杂生命演化的三条主线","core":"多细胞生物通过细胞分工提升整体效率（但也带来癌变风险）；感知系统（如视觉）让生命能对外部世界建模；社交行为从细菌群体感应到语言的出现，逐级放大了生命完成复杂任务的能力，语言尤其让人类社会的信息协作达到新高度。","annotation":"","quote":"","id":"LIB-INW-A-430","relatedIds":[]},{"book":"b-026","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"自我意识镜像","title":"自我意识源于将自身行为与外界感知信息匹配的“镜像”机制，但远比单纯镜像复杂","core":"人类通过类似“镜像神经元”的机制，将自己的行为与外部感知对齐从而产生“自我”概念；但人类的自我意识还叠加了丰富的记忆、情感与价值判断，远非简单的动作匹配。","annotation":"","quote":"","id":"LIB-INW-A-440","relatedIds":[]},{"book":"b-027","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"人治缺法治","title":"“人治”文化导致法治与治理制度缺失，制约国家发挥全部潜力","core":"李光耀指出，中国“人大于制度”的根深蒂固文化，即便有强大中央政权维持稳定，仍会因缺乏法治与制度化治理而无法充分释放国家潜力；腐败虽被视为关乎党的生死存亡，但尚不足以导致制度垮台。","annotation":"","quote":"","id":"LIB-INW-A-450","relatedIds":["LIB-INW-A-400"]},{"book":"b-027","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"国企激励缺失","title":"国企“平均主义”薪酬结构消解个体激励，印证“人都是逐利的”底层假设","core":"书中指出国企员工无论效率高低薪水相同，导致缺乏根本激励，而真正的企业家往往是自己打拼出来的——揭示了脱离个人利益回报的分配制度必然侵蚀效率。","annotation":"用户特别标注“人都是逐利的”，将其视为理解组织行为的一条底层假设。","quote":"","id":"LIB-INW-A-460","relatedIds":[]},{"book":"b-027","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"韬光养晦","title":"中国对美战略：韬光养晦 + 分阶段挤压势力范围","core":"李光耀分析中国的总体方针是低调发展30-40年不惹怒既有大国，同时逐步将美国势力挤出核心利益区（先12海里再200海里专属经济区）——是一种耐心积累实力、避免过早摊牌的渐进博弈范式。","annotation":"","quote":"","id":"LIB-INW-A-470","relatedIds":[]},{"book":"b-027","quadrant":"INW","subcat":"A","cluster":"c3","keyword":"台湾问题现实主义","title":"台湾问题的最终走向由两岸实力对比与经济整合决定，而非单纯民意","core":"李光耀认为台湾前途取决于两岸力量对比的现实以及美国是否干预，而非台湾人民单方面的意愿；他判断不可阻挡的经济整合最终会让“独立”变得不可行——是一种以实力和经济结构决定政治走向的现实主义判断。","annotation":"","quote":"","id":"LIB-INW-A-480","relatedIds":[]},{"book":"b-028","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"摩尔定律","title":"摩尔定律及其推论“反摩尔定律”：不进步等于指数级贬值","core":"每18个月芯片性能翻倍、价格不变，是整个IT产业指数增长的根本引擎；其推论“反摩尔定律”指出公司若原地踏步，18个月后产品价值就要减半——这套定律把硬件行业变成了一个不进则退的高压竞赛场。","annotation":"","quote":"","id":"LIB-INW-A-490","relatedIds":[]},{"book":"b-004","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"社会认同","title":"不确定情境下,人会本能参照他人行为判断正确","core":"越是情境不确定、或看到与自己相似的人在行动，社会认同的从众效应就越强；这也解释了旁观者效应——目击者越多，单个人出手相助的概率反而越低，因为每个人都在等别人先反应。","annotation":"","quote":"","id":"LIB-INW-A-50","relatedIds":[]},{"book":"b-028","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"安迪比尔定律","title":"安迪-比尔定律：硬件性能提升总会被软件臃肿完全吃掉","core":"硬件性能的每一次提升，很快会被软件功能膨胀和复杂度上升消耗殆尽——这是因为软件商在硬件资源充裕后倾向于优先堆功能而非优化效率，反过来又为下一代硬件创造市场需求，形成软硬件共生却互相“剥削”的循环。","annotation":"","quote":"","id":"LIB-INW-A-500","relatedIds":[]},{"book":"b-028","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"公司基因决定论","title":"企业的“创始基因”深刻决定其文化优势与能力边界，转型的本质是突破基因","core":"IBM的保守基因让它能赢得政府大客户信任却错失PC消费市场；苹果的创新与设计基因是其立身之本却也曾因封闭生态陷入十年低谷——一家公司能否穿越技术浪潮，取决于能否在关键时刻完成痛苦的自我转型，“跨越非连续性”。","annotation":"","quote":"","id":"LIB-INW-A-510","relatedIds":[]},{"book":"b-029","quadrant":"INW","subcat":"A","cluster":"c2","keyword":"简单恐惧症","title":"“简单恐惧症”：人本能不相信简单的方法能奏效","core":"很多人拒绝相信市场公认最优的简单策略（如定投标普500指数基金），本质是不相信“简单重复的刻意练习”就能带来复利效果，这种对简单方案的怀疑，本身就是一种认知偏误。","annotation":"","quote":"","id":"LIB-INW-A-520","relatedIds":["LIB-LEG-C-60"]},{"book":"b-029","quadrant":"INW","subcat":"A","cluster":"c2","keyword":"愚蠢与愚昧","title":"愚蠢是智商硬伤，愚昧是可以通过教育摆脱的认知局限","core":"作者区分“愚蠢”（智商问题，无可救药）与“愚昧”（缺乏正确认知框架，可通过教育改变）——比如阿基米德若活在今天会因缺乏现代金融知识而“愚昧”，但通过学习依然可以成为伟大投资家；这提醒人不要把可改变的认知局限误判为不可逆的能力缺陷。","annotation":"","quote":"","id":"LIB-INW-A-530","relatedIds":[]},{"book":"b-031","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"认知革命虚构故事","title":"智人靠“讨论虚构事物”的能力实现大规模陌生人协作","core":"约7万年前的基因突变让智人获得了讨论“虚构现实”的语言能力（传说、宗教、国家、公司等），使得超过150人规模的群体也能靠共同相信的故事进行合作——这是智人从“基因演化”跃迁到“文化演化”快车道的分水岭。","annotation":"","quote":"","id":"LIB-INW-A-540","relatedIds":[]},{"book":"b-031","quadrant":"INW","subcat":"A","cluster":"c1","keyword":"想象秩序双刃剑","title":"“想象构建的秩序”既能维持社会稳定，也会固化不平等","core":"农业革命后的阶级社会依赖一整套被集体默认遵守的虚构规则（如汉谟拉比法典、独立宣言）来分配资源、控制暴力，但这类秩序往往缺乏客观逻辑基础，一旦确立就会通过资源与权力分配不断自我强化，固化种姓、父权等不平等结构。","annotation":"","quote":"","id":"LIB-INW-A-550","r

:"提出这一育儿心智模型。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"DEO-D-50","quadrant":"DEO","subcat":"D","keyword":"温柔而坚定","title":"温柔是态度，坚定是边界，两个都不能少","core":"温柔而坚定。","action":"","quotes":[{"date":"2024-12-02","text":"这周一11/28，我送去学校，就开始严重的厌学，怎么都不肯去学校……一次次谈条件，满足她之后她就提新的条件……好的方向想，说明宝宝有自我意识了，会有自己的喜好，也会坚持自己。这种情况，最重要的就是父母要坚定且温柔，保持一致的行为，宝宝也终究可以明白可以做不可以做的边界了。"}],"cases":[{"date":"2024-12-02","text":"坚定与温柔的边界：面对柔柔严重的厌学和谈条件，和小美选择了“温柔而坚定”。底线不能破（必须上学、必须洗澡），但在底线之上给予陪伴。孩子的每一次反抗其实都是在测试边界，父母的一致性是帮她建立安全感和规则感的关键。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-10","quadrant":"LEG","subcat":"A","keyword":"向上管理","title":"带着两三个方案去汇报，别让老板做填空题","core":"给老板汇报时，不要只抛出问题。带着方案（最好是2-3个选项），并说明利弊和你倾向的建议。老板的时间是稀缺资源，你的价值在于帮他节省决策成本，而不是让他做填空题。","action":"","quotes":[],"cases":[{"date":"2019-10-16","text":"总结向上管理技巧，老板说一你能想到二。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-A-20","quadrant":"LEG","subcat":"A","keyword":"时间估算","title":"承诺时间要故意留余量，别信自己的乐观估计","core":"在承诺时间（ETA）时，刻意Over-estimate（多估算一点）。潜意识总希望自己能快点做完，导致总是给出一个不切实际的短时间，结果不仅没做完还失信。","action":"如果觉得1小时能做完，对外承诺1.5小时。","quotes":[{"date":"2019-10-11","text":"每次总是under estimate，几点睡觉，几点做完，总是不守时……接下来几个月就一个目标，把时间说准，或者至少先over estimate。"}],"cases":[{"date":"2018-10-11","text":"早上答应Manager 20分钟到却没做到，反思自己总是在时间上“自我欺骗”。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-A-30","quadrant":"LEG","subcat":"A","keyword":"优先级First Thing First","title":"按重要性排序，而不是按紧急程度排序","core":"永远把老板/核心KPI的要求放在第一位。依据重要性而非紧急性排序。","action":"","quotes":[],"cases":[{"date":"2017-02-27","text":"优先处理老板数据，延后同事请求，这就是优先级的实战。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-A-40","quadrant":"LEG","subcat":"A","keyword":"以终为始","title":"没想清楚终点，过程就都是无效的折腾","core":"做任何事之前，先在脑海中构想“做完的样子”。如果没有清晰的终点，过程就会充满了无效的折腾。","action":"","quotes":[],"cases":[{"date":"2017-02-27","text":"没想好结果就开始做表，导致浪费大量时间。","era":"root"},{"date":"2023-11-19","text":"Effectiveness注重结果不注重过程，Efficiency既注重结果又注重过程——例如汽车能到达目的地是effective，但烧油不是efficient的载人方式。据此反复用'做正确的事情，而不是去把事情做对'处理母亲唠叨、PI团队定位等完全不同的场景：'我们把PI越做越像supporting role，正确的事情是我们应该让自己做到center，多说无益，去想怎么做到就好'。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"LEG-A-50","quadrant":"LEG","subcat":"A","keyword":"追求unique value","title":"做别人干不了、想不到的事，才是真的Working Smart","core":"区分“牛马活”与“高光活”。别人不能干我能干的：关键的Steer Com Update，Top Issue的Heads up，给出的明确Direction。别人想不到我能想到的：Create transformative team，提前布局Critical Conv。这才是Working Smart的本质。","action":"","quotes":[{"date":"2024-09-08","text":"别人不能干我能干的：关键的steer com update，top issue即时给他们heads up，关键meeting敢于给direction……别人想不到我能想到的：create a new team，关键meeting敢于给direction。"}],"cases":[{"date":"2024-09-08","text":"深刻领悟到Lead层面的核心价值：不是做所有人都能做的Routine，而是捕捉那5%的关键机会（High Light）。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-60","quadrant":"LEG","subcat":"A","keyword":"结果导向","title":"只有功劳没有苦劳，别为自己的加班感动","core":"只有功劳，没有苦劳。这句话很残酷但很真实。不要感动于自己的加班，要看产出了什么价值。","action":"","quotes":[{"date":"2024-12-24","text":"我们经常讲说，要能够end goal in mind，impact driven，或者是能够想到老板在想的东西，那些没有做到的人，难道只是因为想不到要这样去做吗？有时候可能是因为这样做往往难度更高，精力花费更多……但恰恰是那些有execution的人，是那种知道了什么是right thing to do，且有决心和能力去做到这一步的人，往往能获得最终成功。"}],"cases":[{"date":"2016","text":"即使很努力开发书单功能，如果结果没做好，依然没有价值。","era":"root"},{"date":"2024-12-24","text":"执行力是稀缺资源：许多人没有做到Impact Driven，不是因为想不到，而是因为“难”。那些知道什么是Right thing to do，并且有决心克服困难拿到数据的人，才是真正的Executer。执行力是将“想法”变为“结果”的唯一桥梁。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"LEG-A-70","quadrant":"LEG","subcat":"A","keyword":"名字即品牌","title":"别人提起你的名字，第一反应是什么","core":"你的名字就是你的品牌。让别人提到你时，联想到的是“靠谱”“专业”“解决问题”。","action":"","quotes":[],"cases":[{"date":"2019","text":"总结好员工品质，其实就是在打造个人品牌。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"LEG-A-75","quadrant":"LEG","subcat":"A","keyword":"个人产品化思维","title":"把当下的工作当成一次产品来经营","core":"将自己作为一件产品，把当前的工作视为一次个人产品的售卖。工作压力大、累是常态，但不应只沉浸在消耗感中。","action":"定期反思：“在这段过程中我有没有获得成长？我有什么不一样了的地方？”只要有总结经验，就不亏；如果回头一看什么都想不出来，才是真正的浪费。","quotes":[],"cases":[{"date":"2026-02-26","text":"面对巨大的工作压力，调整心态，不再只看眼前的累，而是逼迫自己把工作当做产品售卖的测试场，只关注自己有没有获得个人能力的升级。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-80","quadrant":"LEG","subcat":"A","keyword":"走出舒适区","title":"别把平台当本事，随时想清楚自己离开后还剩什么","core":"公司只是工具。不要把平台当本事。随时保持“如果明天失业，我能干什么”的危机感。走出舒适区是成长的唯一路径。","action":"","quotes":[{"date":"2016-04-10","text":"我又不是一生都必须在这里。公司只是让我成长的工具，我想走了，我利用完了，我随时都可以走。"},{"date":"2024-12-02","text":"我觉得持续在自己舒适区里做事，就是会减慢自己的思想成长的速度……那走出舒适区的概念，让我想到我是否要更积极地去追求陌生领域的工作……为什么去一个新地方就是'slow down'，继续在原地做苦工就是'stretch'呢？"},{"date":"2025-12-28","text":"在一个新的role，不是自己擅长的领域时，比如来到了HBM或YE，那些老人肯定会觉得要多花很多时间教你，而你又不能帮到很多value adding，所以这种时候就是'一份付出一份回报'，你就是要挤出更多时间参加那些engineering的meeting，让自己更快catch up……于是终于有一天可以和他们平起平坐。"}],"cases":[{"date":"2016","text":"“公司只是让我成长的工具，利用完了随时可以走。”","era":"root"},{"date":"2024-12-02","text":"舒适区会减缓成长：意识到持续待在舒适区会减慢思想成长的速度。申请陌生领域和管理陌生团队的工作，虽然意味着走出舒适区，但正是成长的实践。反思领导所谓的“换岗是Slow down”可能只是留人的话术，真正的成长需要自己去定义。","era":"recent"},{"date":"2025-12-28","text":"转型期需要的笨功夫：在转入新领域（如HBM, YE）初期，作为“外行”Leader，不能指望立刻提供Value Add。此时必须遵循“一份付出一份回报”的朴素法则：挤出时间参加基础的Engineering Meeting，做最枯燥的Catch up。这种看似低效的投入，是建立信任和话语权的必经之路。","era":"recent"},{"date":"2025-08-01","text":"不要急着分黑与白，事在人为，先把groundwork做了（比如先让别人partial去学新role），只要开了头，之后就好说了——欲速则不达，先开个头再逐步推进。","era":"recent"}],"recency":"mixed","cluster":"c3"},{"id":"LEG-A-90","quadrant":"LEG","subcat":"A","keyword":"自信的底气","title":"自信不是我能搞定一切，是搞不定我也扛得住","core":"自信不是盲目相信“我能搞定一切”，而是一种底气：“搞不定也没关系，我能接受最坏的结果，并且我有能力兜底”。","action":"在项目遇到困难时，不再掩饰太平，而是坦诚沟通风险。这种坦诚反而赢得了他人的信任。","quotes":[],"cases":[{"date":"2021 (merged)","text":"从早期报喜不报忧，转变为能够平静陈述坏消息。","era":"root"},{"date":"2025","text":"即便当下很多crisis的时候，能够给TM展示出自信的态度，大多也是因为以多年经验，相信自己一定能找到解法的绝对底气。","era":"recent"},{"date":"2026-01-10","text":"自信的螺旋上升：即使现在有自我怀疑，但回头看，今天的资深M2比起当年的M1，自信层次已完全不同。所有过去的痛苦经历与正反馈，都是内核稳定的原料。自信不是一蹴而就，而是螺旋上升的必经之路。","era":"recent"},{"date":"2022-03-17","text":"在争取项目资源支持的过程中初始很不顺利，'不患贫而患不均'的嫉妒心态一出来心情更糟；纠结一晚后突然出现转机。感触：无论怎样的绝境，都不要放弃希望，不沉沦、保持良好心态、继续尝试各种手段，就能带来好结果。","era":"recent"},{"date":"2022-11-19","text":"面对团队曝光度（visibility）不够的焦虑，选择'踏实做事，让团队都成长起来，机会永远都不会缺'来自我说服。","era":"recent"}],"recency":"mixed","cluster":"c3"},{"id":"LEG-A-100","quadrant":"LEG","subcat":"A","keyword":"接受批评","title":"先压住反驳的本能，那多半是自尊心在说话","core":"被指出不足时，先压制反驳的本能。有则改之，无则加勉。反驳往往是因为自尊心受伤，而非事实错误。","action":"","quotes":[],"cases":[{"date":"2019-10-16","text":"好员工品质之七：不本能反驳。","era":"root"}],"recency":"root","cluster":"c3"},{"id":"LEG-B-10","quadrant":"LEG","subcat":"B","keyword":"管理者同理心","title":"内容对不对不够，对方当下的状态和需求才是关键","core":"做启发别人的天使，而不是强加意志的牛魔王。沟通与分享的有效性，不仅取决于“内容是否正确”，更取决于“对方的状态与需求”。","action":"管理者意识到自己的观点并非唯一真理，在做决定前先真诚地询问下属：“你的建议是什么？为什么？”设身处地判断时机：在分享大道理前先问自己——对方是否已经深刻理解了这些？对方现在是不是太累了，时机对吗？这真的是对方在乎的东西吗？不要只讲自己想讲的，要用最短的时间，分享对他人最有价值的东西。","quotes":[{"date":"2022-03-18","text":"这全是我想说的，想分享的，可是他的问题是什么，而我又真正帮忙解决了吗……'you cannot let everyone like you, but you can let them respect you'。"}],"cases":[{"date":"2018","text":"引用李嘉诚在汕大的演讲，反思管理者应有的“同理心与慷慨良心”。","era":"root"},{"date":"2022-03-18","text":"Seek to understand：反思自己以前总是急于输出“我想说的”，而忽略了对方真正的痛点。真正的同理心是先倾听，解决他的问题，而不是灌输我的鸡汤。","era":"recent"},{"date":"2026-03-10","text":"分享欲的边界：晚上很累时听同事讲深刻道理，虽然概念都懂且平时爱听，但当下只觉得不耐烦。这让我反思：跟别人讲道理时，必须设身处地，考虑对方的疲劳度与真实需求，珍惜彼此的时间。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"LEG-B-20","quadrant":"LEG","subcat":"B","keyword":"不假装听懂","title":"会上装懂，事后返工的成本更高","core":"会议上不懂装懂，事后返工成本更高。当场问清楚，哪怕显得“笨”一点。","action":"打破“碍于面子”的习惯。在谈话结束前确认：“我真的懂了吗？逻辑通了吗？”课后努力永远抵不上当场领悟。","quotes":[],"cases":[{"date":"2021-08-15","text":"我有一个坏毛病，为了追求谈话场面的“和谐”而习惯性点头，结果事后才发现逻辑不通。正确做法是强迫自己当场内化、复述对方的要点。","era":"root"}],"recency":"root","cluster":"c1"},{"id":"LEG-B-30","quadrant":"LEG","subcat":"B","keyword":"情绪稳定竞争力","title":"压力下不把情绪带进工作，是专业的底线","core":"在压力下保持冷静，不把情绪带入工作，是专业人士的基本素养。","action":"","quotes":[{"date":"2022-04-14","text":"沉默是金；当你进入情绪的时候，always good to cool down a bit first, before commenting or arguing back……塞翁失马焉知非福。"},{"date":"2016-12-16","text":"Boss is always right。愤怒多是自己的无能。完全没有必要动气，用事实说话，改进自己，改掉不好的部分，用更好的结果让老板心服口服。"}],"cases":[{"date":"2016–2019","text":"从一被批评就崩溃，到能冷静分析问题。","era":"root"},{"date":"2021","text":"即使不知道项目Root Cause，也要在团队面前保持理性的镇定，这种“定海神针”的作用是管理者最高价值所在。","era":"root"},{"date":"2022-04-14","text":"沉默是金：在EC Review上被批评团队缺乏创新时，本能想反驳，但强行忍住（Cool down），事后反思发现对方说的是事实。在情绪上头时，闭嘴是最好的选择，避免了因情绪化而强词夺理。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"LEG-B-40","quadrant":"LEG","subcat":"B","keyword":"适当的露怯","title":"管理者适当露怯，反而更让团队觉得真实","core":"作为管理者，适当展示自己的不足，反而能增加团队的凝聚力，让人觉得真实。","action":"","quotes":[],"cases":[{"date":"2018","text":"只有谦恭的人才能长期处理复杂压力。","era":"root"},{"date":"2021 (Merged)","text":"在团队面前坦承“我现在也不知道Root Cause，我们需要一起挖掘”。这种坦诚没有削弱权威，反而让团队感到真实和被信任。","era":"root"}],"recency":"root","cluster":"c2"},{"id":"LEG-B-50","quadrant":"LEG","subcat":"B","keyword":"跨部门win-win","title":"先搞懂对方的KPI，才找得到合作的切入点","core":"换位思考。理解对方的KPI是什么，才能找到合作的切入点。","action":"","quotes":[{"date":"2025-08-01","text":"在fab10习惯了讲我需要什么、为什么要，但network就得是想人家会不会要帮，比如PDE PI可以讲这些人将来也是你的，这是win win的精华。还有就是不要急着分黑与白，事在人为，你先去把ground level做了……欲速则不达。"}],"cases":[{"date":"2017","text":"理解同事的急迫性，但坚持自己的优先级。","era":"root"},{"date":"2025-07-16","text":"Win-Win Offer：求人办事（如PDE support）不能理所当然，要包装成双赢：告诉对方“来support这个项目也是帮你自己train人手”或“为将来做准备”。","era":"recent"},{"date":"2025-07-16","text":"在HBM工作中主动'过度沟通'（over communication）——多问一句、多确认一句，看似多管闲事，实则是必要的风险控制手段；同时不要想当然觉得别人就该帮你，要主动给出win-win的offer。","era":"recent"}],"recency":"mixed","cluster":"c1"},{"id":"LEG-B-60","quadrant":"LEG","subcat":"B","keyword":"问题即机会","title":"没有问题的话，公司就不需要你了","core":"公司请你来是解决问题的。如果没有问题，就不需要你了。遇到棘手问题（Bug、危机），不要抱怨，这是你展现能力、脱颖而出的时刻。","action":"","quotes":[],"cases":[{"date":"2019","text":"遇到Bug和危机，不再抱怨，而是视为表现机会。","era":"root"},{"date":"2025","text":"每次再出现大问题，都会作为考验团队与体现自身价值的机会。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"LEG-B-70","quadrant":"LEG","subcat":"B","keyword":"管理强将","title":"下属比你耀眼时，赋能她而不是和她比细节","core":"当下属比自己更耀眼、更专业时，不要嫉妒，要视作资源。Empower（授权）：给她舞台，给她Promotion，衷心赞美她的表演。Help（补位）：在她搞不定的资源和卡点上，用你的职级去帮她扫清障碍。Strength（赋能）：用你的长处（Big Picture、Executive Update、Strategy）去补她的短处，而不是在她擅长的领域和她比细节。","action":"","quotes":[],"cases":[{"date":"2026-01-10","text":"提出这一管理强将的框架。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-C-10","quadrant":"LEG","subcat":"C","keyword":"财务自由定义","title":"自由不是钱的多少，是能拒绝不喜欢的事的权利","core":"不是拥有多少钱，而是拥有“拒绝不喜欢的事情”的权利，与对时间的决定权。Time Freedom > Financial Freedom。","action":"","quotes":[],"cases":[{"date":"2025 (Merged)","text":"随着育儿压力的增加，对财务自由的渴望从“买跑车”转变为“拥有更多时间陪伴柔柔”。雇helper以此获得时间，也是财务自由的定义。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"LEG-C-20","quadrant":"LEG","subcat":"C","keyword":"投资心态策略","title":"定投加逢低买入，拒绝All-in断送自己的主动权","core":"策略：定投+Buy the Dip（混合模式），既避免踏空，又保留回调时降低成本的子弹。拒绝All-in：投资要留有子弹，少量多次投资，一旦All-in被套在山顶，就失去了后续操作的所有主动权。估值锚点：拒绝FOMO，必须有科学的估值判断，规则要简单到“无脑执行”。","action":"当股价长期上涨且估值合理时，按规则加仓；当估值离谱时，克制贪婪，等待回调或坚持定投。","quotes":[{"date":"2025-01-01","text":"回头看我在SMH/SOXX上还没有盈利，1是因为2024年在震荡期，需要我多一点耐心；2就是没有坚定遵守规则，因为看到它疯涨了一个月，FOMO，不管MA20也加了特别多，本质还是'追涨'了，高点套牢导致持仓成本偏高……如果再多个教训，就是一定要少量多次地投，千万千万千万不要ALL IN。"}],"cases":[{"date":"2025-01-01（回顾2023-2024教训）","text":"反面教材：在SMH/SOXX上因FOMO情绪高位追涨，导致持仓成本过高，长期处于解套焦虑中。","era":"recent"},{"date":"2026-01-03","text":"Micron Naked Call血泪史：绝对禁止Naked Call。在Micron高位卖出正股后，为贪图低成本卖出大量Naked Call等待回调买入，结果半年后暴涨，不仅错失正股暴涨红利，还因Naked Call欠了一屁股必须高价买回的债。教训：纪律——决定换仓就立刻执行，不要贪图“跌一点再买”的小便宜；风控——Naked Call意味着无限的风险，Roll over不是免费午餐，只是延迟了死刑；心态——十几万新币的学费如果不吸取教训就是沉没成本，吸取了教训就是未来管理更大财富的护身符。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"LEG-C-30","quadrant":"LEG","subcat":"C","keyword":"拒绝原创迷信","title":"你以为的绝妙点子，别人早就研究透了","core":"你以为的绝妙投资点子，别人早研究透了。保持谦卑，多看专业分析，站在巨人肩膀上。","action":"","quotes":[],"cases":[{"date":"2024-11-19","text":"承认自己认知的局限性。这也是现在有AI之后的一大好处。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"MAS-A-15","quadrant":"MAS","subcat":"A","keyword":"人是怎么废掉的","title":"五个自我麻痹的信号：低密度信息+错位成就感+封闭输出","core":"一套完整的自毁行为诊断框架：1. 沉溺于'轻易获得高成就感'的事情；2. 只接收'低信息密度'的信息源；3. 习惯用'错位成就感'麻痹自己；4. 过度依赖'既有可行路径'；5. 封闭'强化学习'的通道——只听不说、只看不写、只学不练，还麻痹自己说学到了很多东西。","action":"定期用这五条自检，尤其警惕第5条：接收信息不等于学到东西，没有输出和实践的“学习”是自我麻痹。","quotes":[{"date":"2018-02-21","text":"人是怎么废掉的——行为纲领：1. 沉溺于'轻易获得高成就感'的事情……2. 只接收'低信息密度'的信息源……3. 习惯用'错位成就感'麻痹自己……4. 过度依赖'既有可行路径'……5. 封闭'强化学习'的通道：只听不说、只看不写、只学不练，还麻痹自己说学到了很多东西。"}],"cases":[{"date":"2018-02-21","text":"系统总结了这套五点诊断框架。短视频/AI摘要时代下，这份清单比当年更致命：低信息密度的刷屏、错位成就感（收藏≠学会），都是这个时代的典型陷阱。","era":"root"}],"recency":"evergreen","cluster":"c1"},{"id":"MAS-C-15","quadrant":"MAS","subcat":"C","keyword":"问题在己不在境","title":"同一个坑跨阶段反复踩，大概率是自己的问题","core":"如果同一种困境（如被边缘化、无法融入圈子）在完全不同的人生阶段（转学、大学社团、职场）反复出现，那大概率不是环境的问题，而是自己身上某个尚未被识别的问题。跨阶段的模式重复，是比单次挫败更可靠的自我诊断信号。","action":"遇到似曾相识的困境时，先问自己：这个问题是不是在别的阶段、别的环境也发生过？如果是，答案在自己身上，不在环境里。","quotes":[{"date":"2016-04-06","text":"回忆以前，现在新的圈子又无法成功地成为焦点，又渐渐地被冷落，绝不是偶然的环境因素了，肯定是我自己的某些问题之前没有认识到……当这么多的问题在大学和今天重复出现，那就一定是人的问题而不是外界的问题了。"}],"cases":[{"date":"2016-04-09","text":"通过转学、大学社团、球队、职场等多个阶段反复出现的'被冷落'模式，倒推出问题在己不在境的元认知方法。","era":"root"}],"recency":"evergreen","cluster":"c2"},{"id":"MAS-B-25","quadrant":"MAS","subcat":"B","keyword":"李杨定律","title":"没有进步又被否定，负面情绪会双重叠加","core":"自创的两条个人心理定律：定律一——绝大多数好学生（包括我）都能在有进步、有意义的一天中，获得比纯娱乐/玩耍多得多的愉悦感（自我实现需求）；定律二——绝大多数好学生（我）都渴望得到别人的肯定、减少批评（即便可以虚心接受），这可能源于学生时代师生教育下养成的尊重与社会需求。这两条定律解释了一天情绪起伏的根源：一旦'没有进步'叠加'没被肯定/被批评'，负面情绪会双重叠加。","action":"情绪低落时，用这两条定律拆解原因——是今天没有进步感？还是被否定了？分开处理，比笼统地说“心情不好”更有操作性。","quotes":[{"date":"2023-11-19","text":"李杨定律1：绝大多数好学生（包括我），都能够在有进步，有意义的一天生活中，获得比纯娱乐或玩耍多得多的愉悦感。李杨定律2：绝大多数好学生（我），都渴望得到别人的肯定，减少别人的批评（即便可以虚心接受）。"}],"cases":[{"date":"2018-01-15","text":"首次系统提出李杨定律，以马斯洛需求模型（2017/7/22）为理论基础。","era":"root"},{"date":"2023-11-19","text":"用这两条定律解释自己一天情绪起伏的根源，是贯穿五年的自创理论框架，是'心流''意义感''成就感'相关多条知识的思想母体。","era":"recent"}],"recency":"mixed","cluster":"c2"},{"id":"INW-A-70","quadrant":"INW","subcat":"A","keyword":"能力温度分离","title":"让人尊重和让人愿意追随，是两件不同的事","core":"评价一个人（尤其是领导/前辈）时，把'能力/格局'和'温度/耐心'分开衡量。一个人可以思维很深、格局很高、让人尊重，同时又缺乏耐心和温润感，让人难以真心追随——'让人尊重，却难以让人跟随'是两个完全不同的评价维度，不能因为佩服能力就忽略共情的缺失，反之亦然。","action":"","quotes":[{"date":"2022-12-06","text":"对领导为人的评价：优点：对人情世故想得很多，深思，思维很深，喜好多想几步，适合做官；缺点：太过主观与自信，说是'爱人'但其实'人皆为棋子'，以自我为中心的思考，同时缺乏耐心，缺少温润感与仁慈心——让人尊重，却难以让人跟随。"}],"cases":[{"date":"2022-12-06","text":"对一位重要领导的完整人物评价，是能力与温度分离评估的典型案例。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"INW-B-45","quadrant":"INW","subcat":"B","keyword":"内力与术","title":"价值观是内力，技巧是术，内力不够术就是花招","core":"借金庸武侠'内力vs花招'的隐喻：若没有好的内功做基础，就会陷入花招甚至邪路。应用到现实：好的、正确的价值观就是'内力'，是'大道'；而'说话之道''生财之道''接人待物之道'之类的技巧书，都是'术'。心术不正的人学了这些术，不过是无根之水，经不起推敲，甚至误入歧途；一旦先有强大的内功，所有的术都是水到渠成。","action":"学习任何沟通/管理技巧之前，先确认自己的价值观底座是否稳固——技巧是放大器，会同等放大正的动机和歪的动机。","quotes":[{"date":"2023-11-19","text":"梁文道对天龙八部的感悟：金庸武侠里格外强调'内力'，若是没有好的内功做基础，就会陷入'花招'，甚至走上星宿老怪的邪路。我们的好的正确的价值观就是内力，是'大道'……你若是心术不正，学了这些术，不过是无萍之水，经不起推敲；可是一旦先有了强大的内功，所有的术都是水到渠成而已了。"}],"cases":[{"date":"2023-11-19","text":"借武侠隐喻提出'价值观是道（内力），技巧方法是术'的框架。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"DEO-D-35","quadrant":"DEO","subcat":"D","keyword":"渐进折中育儿","title":"非黑即白的训练法不如渐进折中，留有余地","core":"育儿场景下，'渐进折中式'方法优于'激进的哭声免疫法'或'完全不训练'两个极端。核心是循序渐进、留有余地——比如断夜奶不是一刀切，而是从'半夜抱着安抚不给奶'逐步过渡到'温母乳/奶粉/稀释奶粉'，历时约一个月，既达成目标又不激进。","action":"","quotes":[],"cases":[{"date":"2023-11-10","text":"断夜奶整体顺利，没有用激进的方式，历时约一个月的渐进过渡，最希望的还是一个天天爱笑的宝宝。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"LEG-A-15","quadrant":"LEG","subcat":"A","keyword":"换工作三问","title":"换工作前问三遍：喜欢吗、能迁移吗、旧问题真解决了吗","core":"换工作不应是情绪冲动的决定，而应过三问：1. 我喜欢这份工作、这个行业吗？我最想做的、最擅长的到底是什么？2. 新工作可以给同样的赏识、工作表现空间、发展潜力吗（可迁移性验证）？3. 换了之后，旧工作的问题都能解决吗（根本问题是否真的被解决，而不是换了个地方继续存在）？","action":"","quotes":[{"date":"2017-06-26","text":"我喜欢这份工作、这个行业吗？我最想做的、我最擅长的到底是什么？……我的新工作可以给同样的老板赏识、工作表现、发展潜力吗？……新工作之后，旧工作的问题都可以解决吗？"}],"cases":[{"date":"2017-06-26","text":"系统总结的三问式换工作决策框架，历经多年验证有效。","era":"root"}],"recency":"evergreen","cluster":"c4"},{"id":"LEG-A-33","quadrant":"LEG","subcat":"A","keyword":"雇佣双向交换","title":"雇佣关系是对等交换，不是单向的忠诚或索取","core":"把'员工-雇主'关系定义为双向的质量对等交换，而非单向的忠诚或索取。好员工（service provider）的品质要求：tenacity（坚韧）、commitment（投入）。好雇主（buyer）的品质要求：work-life balance、工作时间合理、薪水足够、sense of achievement足够（解决问题、带新人）、上升空间足够。","action":"评估一份工作是否该继续投入，用这套双向清单打分，而不是单方面问'我够不够努力'或'公司够不够好'。","quotes":[{"date":"2020-04-03","text":"一个好的员工（service provider），quality要求是：tenacity，commitment。一个好的雇主（buyer），quality要求是：要能给work-life balance……工作时间不能太长，回报的薪水要足够，回报的sense of achievement要足够，往上上升的空间要足够。"}],"cases":[{"date":"2020-04-03","text":"提出这套评估雇佣关系的双向对等交换模型。","era":"root"}],"recency":"evergreen","cluster":"c4"},{"id":"LEG-A-55","quadrant":"LEG","subcat":"A","keyword":"职场投入清醒边界","title":"工作是完善自己的工具，忘我付出往往最先被牺牲","core":"经历公司裁员后领悟：所谓caring for people，本质是把信任与热情转化为更高效的工作成果，风雨来时员工往往最早被牺牲。启示：1. 在工作中追求忘我与付出，你就输了——可以尽力而为，但要保持内心清醒，想清楚ROI，在'control your life'的前提下投入，把工作当作完善自己、追寻人生意义的工具；2. 如果一份工作钱和福利不是最好、精力付出偏多、前景想象力有限，那它凭什么值得你长期投入？","action":"","quotes":[{"date":"2023-03-30","text":"经历了第一次裁员……哪有以人为本，所谓caring for people，不过是尝试把信任与热情转化为更高效的工作成果而已，风雨来时，people往往也是最早被牺牲的……在工作中，追求忘我与付出，你就输了；你可以依然尽力而为，但一定要保持内心深处的清醒。"}],"cases":[{"date":"2023-03-30","text":"第一次经历公司裁员后，对职场投入边界的清醒认知，与'追求unique value'（LEG-A-50）和'财务自由的定义'（LEG-C-10）相关但角度独特。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"LEG-A-12","quadrant":"LEG","subcat":"A","keyword":"对事不对人","title":"对事不对人的反馈更可持续，这是要主动向上争取的","core":"明确总结出自己'对事不对人的客观反馈'比'贴标签式的人格批评'更能带来可持续、低耗能的成长动力，并主动向上级提出这一诉求。这不只是“如何给别人反馈”，更是“如何为自己争取有效反馈”——认清自己的驱动方式，主动塑造被管理的方式。","action":"","quotes":[{"date":"2020-06-13","text":"我更喜欢Self motivated，所以一个点如果真的说到了我心里，不需要那么'人格攻击'去激发我，一些例子加上一定的点拨，'对事而不要去对人'，我反而也能做到90分，但可能只让我消耗50%精力；而且，更多的对事不对人，我还可以有余力，让自己有动力，让自己某一天做到95分。"}],"cases":[{"date":"2020-06-13","text":"与领导的绩效反馈冲突后，写长邮件申诉反馈方式，明确提出自己需要的反馈方式。","era":"root"}],"recency":"evergreen","cluster":"c1"},{"id":"MAS-A-105","quadrant":"MAS","subcat":"A","keyword":"阅读情绪匹配","title":"书要配得上当下的心情和精力，不必死磕","core":"读书应该是愉悦的事情，follow your heart——如果一本书暂时提不起兴趣，就不要强行读。按当下情绪状态和精力水平匹配不同类型的书：睡前心情平静，读不复杂的短文；白天大段时间心情平静，读需要消化的书；心情浮躁，读更接近舒适区的书；周末容易焦虑；工作日晚上不焦虑但疲累难专注，适合读生活/文学/社会政治类。","action":"不用固定书单硬啃，而是根据当下的情绪与精力状态动态选书。","quotes":[{"date":"2022-09-18","text":"读书应该是愉悦的事情，所以follow your heart，如果一本书暂时就是提不起兴趣，就不要强行读……在不同的时间段，安排不同的书。"}],"cases":[{"date":"2022-09-18","text":"总结出按情绪与场景匹配阅读内容的策略，而非固定书单。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"MAS-A-85","quadrant":"MAS","subcat":"A","keyword":"先分后总读书法","title":"先啃全书逻辑再摘触动点，反过来会流于表面","core":"反对'只挑触动点'的碎片化读书法——一本好书不同章节间一定有逻辑联系，只挑片段读会失去背后细节论证的过程，理解会很表面。正确顺序是先由分到总（掌握整本书的逻辑架构），再由总到分（在理解全局的基础上提炼触动点）。","action":"读书先花时间搞清楚整体框架/目录逻辑，再回头精读打动自己的章节，不要一上来就摘金句。","quotes":[{"date":"2024-01-27","text":"一本好书不同章节间一定有着逻辑联系……所以直接只挑片段的观点读必然会很表面，失去背后细节论证的过程，也会让你的理解不深……说白了就是必须先由分到总，再由总到分的来理解。"}],"cases":[{"date":"2024-01-27","text":"对'只挑触动点'式读书法提出反思，主张先掌握整体逻辑架构再提炼要点。","era":"recent"}],"recency":"recent","cluster":"c3"},{"id":"DEO-B-35","quadrant":"DEO","subcat":"B","keyword":"深入浅出","title":"能讲给父母听懂，才是真的想透了","core":"对自己思想深度与表达能力的最好总结，就是'深入浅出'：想得很透彻，但解释的时候又能用生活中的例子讲清楚——那种给父母讲，他们都能用有限的耐心和知识接受的程度，才是真正的理解和表达能力。","action":"检验自己是否真的想透了一件事：能不能用父母能听懂的大白话讲清楚。","quotes":[{"date":"2024-01-19","text":"想到对自己想达到的思想深度与表达能力的最好总结，就应该是深入浅出：想得很透彻，但是解释的时候又可以用生活中的例子，就是那种给我父母讲他们都能用有限的耐心和知识接受的。"}],"cases":[{"date":"2024-01-19","text":"提出'深入浅出'作为个人思想深度与表达能力的检验标准。","era":"recent"}],"recency":"recent","cluster":"c1"},{"id":"LEG-C-25","quadrant":"LEG","subcat":"C","keyword":"小仓位保留期权","title":"错过风口不必空手旁观，小仓位保留上车的权利","core":"投资中，如果已经错过了最佳进场时机，又怕被套牢、又怕错过后续行情，最好的选择不是完全观望，而是先小仓位/低强度进场，保留'上车'的选择权——如果风口进一步扩大，已经进场；如果没有，损失也有限。这一心法同样适用于职业选择：错过风口型机会时，先建立联系、保持visibility，见机行事。","action":"","quotes":[{"date":"2024-11-20","text":"如果此刻你已经在高点了，你又怕被套牢，同时你又怕错过这一波继续涨的风口……最好的选择就是依然先保持进场，而后见机行事，如果这个风口再进一步扩大，那反正我上车了……也保持了visibility，将来再次上涨时我也可以第一时间上车。"}],"cases":[{"date":"2024-11-20","text":"把'小仓位保留期权'的投资心法迁移到职业机会评估上——调用了2.1概率思维与4.3投资策略。","era":"recent"}],"recency":"recent","cluster":"c2"},{"id":"MAS-B-22","quadrant":"MAS","subcat":"B","keyword":"钝感力","title":"别人一句不经意的话，不必照单全收放在心上","core":"长期以来'太在意别人想法'的性格弱点，反过来提示了一个值得刻意修炼的品质——'钝感力'：别人不经意的一句话，不需要照单全收放在心上；不必对每一次'没被及时回应'都赋予情绪意义。钝感不是麻木，而是有选择地不较真。","action":"遇到自己又开始'较真'某句无心之言时，提醒自己：这可能是'太敏感'在作祟，试着刻意迟钝一点。","quotes":[{"date":"2025-03-17","text":"突然意识到了一个自己'太较真'的例子：咱妈在群里讲柔柔周 -12-22","text":"突发严重感冒发烧，记录逐日症状，Christmas当天难以坚持，半夜出汗后退烧。"},{"date":"2023-12-25","text":"柔柔周岁礼，'整个周岁礼算是圆满成功了，感恩今天家里所有人都有的良性的他者贡献精神'。"},{"date":"2024-01-03","text":"记录2024年个人目标——'讲话更简明而扼要，少啰嗦不清'。"},{"date":"2024-01-07","text":"因COE下降以及柔柔长大后的实际需求，全家开始考虑购车。"},{"date":"2024-01-28","text":"柔柔严重恋奶和睡眠倒退，晚上需要多次亲喂，家里决定断夜奶；同期在英飞凌和SMAI之间考虑新工作机会。"},{"date":"2024-02-26","text":"父亲大年三十凌晨成功抵达新加坡；柔柔断奶期间反复发烧出疹，一家人围绕育儿理念产生摩擦但最终和解。"},{"date":"2024-04-01","text":"爷爷回国后一个月，柔柔的走路能力有了质的飞跃。"},{"date":"2024-04-17","text":"工作压力最大的一周，晚上九十点才到家，Triton conversion项目出现很多surprise。"},{"date":"2024-08-01","text":"连续感冒、柔柔病毒性肠炎爆吐、本人因吃麦当劳诱发严重腹泻整夜，'三英战吕布'式的身体多重不适期。"},{"date":"2024-09-08","text":"柔柔连续多轮流鼻涕、咳嗽、荨麻疹，期间接姥姥来新加坡；本人也严重荨麻疹反复发作近一个月。"},{"date":"2024-09-24","text":"密集尝试多个AI工具（YouTube总结工具、ChatGPT全文总结等）带来的学习方式冲击与震撼体验。"},{"date":"2024-11-06","text":"柔柔再次流鼻涕咳嗽；本人坚持每周四次午间篮球训练，比赛中取得好结果。"},{"date":"2024-11-18","text":"柔柔持续一周多高烧（38-39度）反复，伴呕吐吐奶，父母轮流照顾睡眠严重不足，24日终于退烧。"},{"date":"2024-12-02","text":"柔柔'最严肃的一次厌学'，连续多日不愿去幼儿园、洗澡谈条件，父母坚持温柔而坚定的边界后，12/6终于顺利入园。"},{"date":"2025-01-31","text":"回国过年，经历舅舅发酒疯、亲戚寒暄疲惫，也有'四世同堂'的温情瞬间。"},{"date":"2025-02-24","text":"承接drama video lead角色后压力增大，出现今年第一次感冒小发烧。"},{"date":"2025-03-28","text":"因配偶发烧、女儿半夜哭闹漏尿、换手机设置到深夜等多重因素导致睡眠不足，情绪失控对女儿发过几次脾气。"},{"date":"2025-04-29","text":"开始帮女儿戒夜奶，每晚入睡前需强忍女儿哭闹十多分钟，认定这是'正确但痛苦'的坚持。"},{"date":"2025-05-29","text":"女儿第一次因胃炎剧烈呕吐，反复发烧到38.5度，持续三天后逐渐恢复。"},{"date":"2025-07-29","text":"周末带女儿逛动物园后开始喉咙不适，周二发展为发烧，周三奇迹般退烧。"},{"date":"2025-10","text":"将母亲从国内接到新加坡定居，家庭照护结构发生重大变化——奶奶承担更多带娃任务，本人因HBM项目繁忙常工作到凌晨。"},{"date":"2025-03-15","text":"岳母来新加坡帮忙带娃期间，因期待值设定不同引发与配偶的小摩擦——'降低期待依然是幸福感的前提'。"},{"date":"2025-05-03","text":"与配偶因一句玩笑话引发的小冲突，事后反思沟通误解与付出回报不对等的感受。"}],"healthLog":[{"date":"2021-07","member":"本人","note":"疫苗接种后发烧，正常免疫反应，休息2天。"},{"date":"2021-12","member":"本人","note":"Christmas期间严重发烧，累计过度劳累，紧绷后的松弛导致感冒爆发。"},{"date":"2022-09","member":"全家","note":"首次感染COVID-19，本人最重，发烧头痛伴腹泻，全家互相扶持，1周后转阴。"},{"date":"2024-06","member":"本人","note":"腰椎痛复发，姿势不对（侧卧看书）+ 长期不运动，针灸治疗。"},{"date": <script>
(function(){
  var DATA = JSON.parse(document.getElementById('mind-os-data').textContent);
  var state = { tab:'kb', search:'', recentOnly:false, starOnly:false, editMode:false, expanded:{}, showRootFor:{}, showCtxFor:{}, jumpTo:null };

  var $ = function(sel, el){ return (el||document).querySelector(sel); };
  var main = $('#main');
  var quickjumpEl = $('#quickjump');
  var searchInput = $('#search');

  $('#site-title').textContent = DATA.meta.title || '个人思维操作系统';
  $('#site-sub').textContent = DATA.meta.subtitle || '';

  function esc(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function matchText(hay, needle){ return hay && hay.toLowerCase().indexOf(needle) !== -1; }

  // ---------- local edit overlay (no cloud storage capability granted to this session:
  // edits persist per-browser via localStorage; 导出/导入 bridges across devices) ----------
  var overlay = {};
  try{ overlay = JSON.parse(localStorage.getItem('mindos-edits-v1')||'{}'); }catch(e){ overlay = {}; }
  function saveOverlay(){
    try{ localStorage.setItem('mindos-edits-v1', JSON.stringify(overlay)); }catch(e){}
  }
  var FALLBACK = {};
  function fieldHTML(key, plain){
    FALLBACK[key] = plain || '';
    var ov = overlay[key];
    if(ov && ov.html != null) return ov.html;
    return esc(plain || '');
  }
  function effectiveText(key, plain){
    var ov = overlay[key];
    return (ov && ov.text != null) ? ov.text : (plain || '');
  }

  var ALLOWED_TAGS = {MARK:1, SPAN:1, B:1, STRONG:1, I:1, EM:1, BR:1};
  function filterStyle(style){
    var out = [];
    style.split(';').forEach(function(rule){
      var parts = rule.split(':');
      if(parts.length !== 2) return;
      var prop = parts[0].trim().toLowerCase();
      var val = parts[1].trim();
      if((prop === 'color' || prop === 'background-color') && /^[a-zA-Z0-9#(),.% ]+$/.test(val)){
        out.push(prop + ':' + val);
      }
    });
    return out.join(';');
  }
  function sanitizeNode(node){
    var child = node.firstChild;
    while(child){
      var next = child.nextSibling;
      if(child.nodeType === 1){
        var tag = child.tagName;
        if(!ALLOWED_TAGS[tag]){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          child = next; continue;
        }
        var styleVal = child.getAttribute('style');
        Array.prototype.slice.call(child.attributes).forEach(function(a){ child.removeAttribute(a.name); });
        if((tag === 'SPAN' || tag === 'MARK') && styleVal){
          var cleaned = filterStyle(styleVal);
          if(cleaned) child.setAttribute('style', cleaned);
        }
        sanitizeNode(child);
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
      child = next;
    }
  }
  function sanitizeInline(html){
    var box = document.createElement('div');
    box.innerHTML = html;
    sanitizeNode(box);
    return box.innerHTML;
  }
  function commitEdit(el){
    var key = el.getAttribute('data-key');
    if(!key) return;
    var text = el.textContent || '';
    if(text.trim() === ''){
      delete overlay[key];
      el.innerHTML = esc(FALLBACK[key] || '');
    } else {
      overlay[key] = { html: sanitizeInline(el.innerHTML), text: text };
    }
    saveOverlay();
  }

  // ---------- theme ----------
  var themeBtn = $('#theme-btn');
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); localStorage.setItem('mindos-theme', t); }
    else { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem('mindos-theme'); }
  }
  var savedTheme = localStorage.getItem('mindos-theme');
  if(savedTheme) applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next;
    if(!cur) next = prefersDark ? 'light' : 'dark';
    else if(cur === 'dark') next = 'light';
    else next = 'dark';
    applyTheme(next);
  });

  // ---------- edit mode ----------
  var editModeBtn = $('#edit-mode-btn');
  var editToolbar = $('#edit-toolbar');
  function applyEditableAttrs(){
    Array.prototype.forEach.call(main.querySelectorAll('.editable'), function(el){
      if(state.editMode) el.setAttribute('contenteditable', 'true');
      else el.removeAttribute('contenteditable');
    });
  }
  editModeBtn.addEventListener('click', function(){
    state.editMode = !state.editMode;
    document.body.classList.toggle('edit-mode', state.editMode);
    editModeBtn.classList.toggle('on', state.editMode);
    editToolbar.hidden = !state.editMode;
    applyEditableAttrs();
  });
  main.addEventListener('focusout', function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('editable')) return;
    commitEdit(el);
  });
  main.addEventListener('paste', function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('editable')) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  editToolbar.addEventListener('mousedown', function(e){ e.preventDefault(); });
  editToolbar.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.hasAttribute('data-hl')){ document.execCommand('hiliteColor', false, b.getAttribute('data-hl')); commitActive(); return; }
    if(b.hasAttribute('data-fc')){ document.execCommand('foreColor', false, b.getAttribute('data-fc')); commitActive(); return; }
    if(b.id === 'et-export'){ exportEdits(); return; }
    if(b.id === 'et-import'){ $('#et-import-file').click(); return; }
    if(b.id === 'et-reset'){ resetEdits(); return; }
  });
  function commitActive(){
    var a = document.activeElement;
    if(a && a.classList && a.classList.contains('editable')) commitEdit(a);
  }
  function todayStr(){
    var d = new Date();
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fallbackDownload(text){
    try{
      var blob = new Blob([text], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'mindos-edits-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    }catch(e){ alert('导出失败：' + (e && e.message || e)); }
  }
  function exportEdits(){
    var payload = JSON.stringify(overlay, null, 2);
    if(window.claude && window.claude.downloads){
      window.claude.downloads.save({filename:'mindos-edits-' + todayStr() + '.json', data: payload}).catch(function(){
        fallbackDownload(payload);
      });
    } else {
      fallbackDownload(payload);
    }
  }
  $('#et-import-file').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var incoming = JSON.parse(reader.result);
        var n = 0;
        Object.keys(incoming).forEach(function(k){ overlay[k] = incoming[k]; n++; });
        saveOverlay();
        render();
        alert('已导入编辑记录（' + n + ' 条）。');
      }catch(err){ alert('文件内容不是有效的编辑记录 JSON，导入失败。'); }
    };
    reader.readAsText(f);
    this.value = '';
  });
  function resetEdits(){
    if(!confirm('确定清空本机保存的全部编辑（文字修改/高亮/标星）吗？此操作不可撤销，建议先导出备份。')) return;
    overlay = {};
    saveOverlay();
    render();
  }

  // ---------- tabs ----------
  function setActiveTab(name){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-tab') === name); });
  }
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      state.tab = t.getAttribute('data-tab');
      setActiveTab(state.tab);
      state.search = ''; searchInput.value = '';
      render();
    });
  });

  // ---------- search / filters ----------
  var searchTimer;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ state.search = searchInput.value.trim(); render(); }, 120);
  });
  var recentToggle = $('#recent-toggle');
  recentToggle.addEventListener('click', function(){
    state.recentOnly = !state.recentOnly;
    recentToggle.classList.toggle('on', state.recentOnly);
    render();
  });
  var starToggle = $('#star-toggle');
  starToggle.addEventListener('click', function(){
    state.starOnly = !state.starOnly;
    starToggle.classList.toggle('on', state.starOnly);
    render();
  });

  // 键盘可达性：自定义 div 控件（tabindex=0）用 Enter/Space 触发点击；
  // 排除真实 button/input 与 contenteditable，避免打字时空格被拦截。
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var el = document.activeElement;
    if(!el || el.getAttribute('tabindex') !== '0') return;
    e.preventDefault();
    el.click();
  });

  function principleById(id){ return DATA.principles.find(function(p){ return p.id === id; }); }
  function quadrantById(id){ return DATA.quadrants.find(function(q){ return q.id === id; }); }
  function principlesOf(qid, scid){
    return DATA.principles.filter(function(p){ return p.quadrant === qid && (!scid || p.subcat === scid); });
  }
  function isRecentEnough(p){
    return p.recency === 'recent' || p.recency === 'mixed' || p.recency === 'evergreen';
  }
  function isStarred(id){ return !!overlay[id + '::star']; }

  function principleMatchesSearch(p, q){
    if(matchText(effectiveText(p.id + '::title', p.title), q)) return true;
    if(matchText(effectiveText(p.id + '::keyword', p.keyword), q)) return true;
    if(matchText(effectiveText(p.id + '::core', p.core), q)) return true;
    if(matchText(effectiveText(p.id + '::action', p.action), q)) return true;
    var quotes = p.quotes || [];
    for(var i = 0; i < quotes.length; i++){ if(matchText(effectiveText(p.id + '::quote::' + i, quotes[i].text), q)) return true; }
    var cases = p.cases || [];
    for(var j = 0; j < cases.length; j++){ if(matchText(effectiveText(p.id + '::case::' + j, cases[j].text), q)) return true; }
    return false;
  }

  function quadHeaderHTML(quad){
    return '<h2 class="quad-h" data-q="' + quad.id + '"><span class="quad-dot"></span>' + esc(quad.name) +
      '<span class="quad-en">' + esc(quad.en) + '</span></h2>' +
      '<div class="quad-tag">' + esc(quad.tagline) + '</div>';
  }

  function ctxToggleHTML(ctxKey, context){
    if(!context) return '';
    var open = !!state.showCtxFor[ctxKey];
    return '<button class="ctx-toggle" data-ctx="' + ctxKey + '">' + (open ? '收起原始日记片段 ▲' : '查看原始日记片段 ▼') + '</button>' +
      '<div class="ctx-panel' + (open ? ' open' : '') + '">' + esc(context) + '</div>';
  }

  function caseItemHTML(p, o, recentClass){
    var key = p.id + '::case::' + o.i;
    var ctxKey = key + '::ctx';
    return '<div class="case-item' + (recentClass ? ' recent' : '') + '"><div class="cdate mono">' + esc(o.c.date || '') + '</div>' +
      '<div class="ctext editable" data-key="' + key + '">' + fieldHTML(key, o.c.text) + '</div>' +
      ctxToggleHTML(ctxKey, o.c.context) + '</div>';
  }

  function quoteBlockHTML(p, qt, idx){
    var key = p.id + '::quote::' + idx;
    var ctxKey = key + '::ctx';
    return '<div class="quote-block"><div class="qtext editable" data-key="' + key + '">' + fieldHTML(key, qt.text) + '</div>' +
      '<div class="qdate mono">' + esc(qt.date || '') + '</div>' +
      ctxToggleHTML(ctxKey, qt.context) + '</div>';
  }

  function pcardDetailHTML(p){
    var quotes = p.quotes || [];
    var cases = p.cases || [];
    var casesWithIdx = cases.map(function(c, i){ return {c: c, i: i}; });
    var recentCases = casesWithIdx.filter(function(o){ return o.c.era === 'recent' || o.c.era === 'mixed'; });
    var rootCases = casesWithIdx.filter(function(o){ return o.c.era === 'root'; });
    var quotesHTML = quotes.map(function(qt, idx){ return quoteBlockHTML(p, qt, idx); }).join('');
    var recentHTML = recentCases.map(function(o){ return caseItemHTML(p, o, true); }).join('');
    var rootHTML = rootCases.map(function(o){ return caseItemHTML(p, o, false); }).join('');
    var rootOpen = !!state.showRootFor[p.id];
    var coreKey = p.id + '::core';
    var actionKey = p.id + '::action';
    return '<div class="pcard-body">' +
      '<div class="core editable" data-key="' + coreKey + '">' + fieldHTML(coreKey, p.core) + '</div>' +
      (p.action ? '<div class="action"><b>行动指南　</b><span class="editable" data-key="' + actionKey + '">' + fieldHTML(actionKey, p.action) + '</span></div>' : '') +
      (quotesHTML ? '<div class="section-label" data-id="q-' + p.id + '">📖 原话</div>' + quotesHTML : '') +
      (recentHTML ? '<div class="section-label">⏳ 历史回溯（近年）</div>' + recentHTML : '') +
      (rootHTML ? '<div class="section-label">🕰 历史根系（旧年，' + rootCases.length + ' 条）</div>' +
        '<button class="root-toggle" data-id="' + p.id + '">' + (rootOpen ? '收起旧年案例 ▲' : '展开旧年案例 ▼') + '</button>' +
        '<div class="root-cases' + (rootOpen ? ' open' : '') + '">' + rootHTML + '</div>' : '') +
      (quotes.length ? '<button class="jump-link" data-jump-quotes="' + p.id + '">在原话集中查看这条的全部原话 →</button>' : '') +
      '</div>';
  }

  function principleCardHTML(p){
    var quoteCount = (p.quotes || []).length;
    var starred = isStarred(p.id);
    var expanded = !!state.expanded[p.id];
    var badge = p.recency === 'evergreen'
      ? '<span class="b-evergreen" title="旧年但至今仍适用的主教训">⏳ 长效</span>'
      : (isRecentEnough(p) ? '<span class="b-recent" title="近3–4年"></span>' : '');
    return '<article class="pcard' + (expanded ? ' expanded' : '') + (starred ? ' starred' : '') + '" data-id="' + p.id + '">' +
      '<div class="pcard-head" data-id="' + p.id + '" tabindex="0">' +
        '<button class="star-btn" data-id="' + p.id + '" title="标记重点">' + (starred ? '★' : '☆') + '</button>' +
        '<div class="pcard-head-text">' +
          '<div class="pc-kw editable" data-key="' + p.id + '::keyword">' + fieldHTML(p.id + '::keyword', p.keyword) + '</div>' +
          '<div class="pc-title editable" data-key="' + p.id + '::title">' + fieldHTML(p.id + '::title', p.title) + '</div>' +
        '</div>' +
        '<div class="pc-meta">' + badge +
          (quoteCount ? '<button class="b-quote" data-id="' + p.id + '" title="查看原话">❝ ' + quoteCount + '</button>' : '') +
          '<span class="pc-id mono">' + p.id + '</span>' +
          '<span class="pc-chev">' + (expanded ? '▲' : '▾') + '</span>' +
        '</div>' +
      '</div>' +
      (expanded ? pcardDetailHTML(p) : '') +
      '</article>';
  }

  function sectionForSubcat(quad, sc, list){
    var id = 'sc-' + quad.id + '-' + sc.id;
    var clusterDefs = (sc.clusters && sc.clusters.length) ? sc.clusters : [{id: null, name: null}];
    var byCluster = {};
    list.forEach(function(p){
      var cid = p.cluster || '_none';
      (byCluster[cid] = byCluster[cid] || []).push(p);
    });
    var groupsHTML = '';
    clusterDefs.forEach(function(cl){
      var items = byCluster[cl.id || '_none'] || [];
      if(!items.length) return;
      groupsHTML += (cl.name ? '<div class="cluster-h">' + esc(cl.name) + '</div>' : '') +
        '<div class="card-grid">' + items.map(principleCardHTML).join('') + '</div>';
    });
    // 兜底：万一有条目没有 cluster 字段或不在已定义的簇里，也不能漏渲染
    var assignedIds = {};
    clusterDefs.forEach(function(cl){ (byCluster[cl.id || '_none'] || []).forEach(function(p){ assignedIds[p.id] = true; }); });
    var orphans = list.filter(function(p){ return !assignedIds[p.id]; });
    if(orphans.length) groupsHTML += '<div class="card-grid">' + orphans.map(principleCardHTML).join('') + '</div>';
    return '<section class="subcat-section" id="' + id + '">' +
      '<h3 class="subcat-h"><span class="sc-name">' + esc(sc.name) + '</span><span class="sc-count mono">' + list.length + ' 条</span></h3>' +
      groupsHTML +
      '</section>';
  }

  function filteredList(qid, scid, q){
    var list = principlesOf(qid, scid);
    if(state.recentOnly) list = list.filter(isRecentEnough);
    if(state.starOnly) list = list.filter(function(p){ return isStarred(p.id); });
    if(q) list = list.filter(function(p){ return principleMatchesSearch(p, q); });
    return list;
  }

  // ---------- render: KB tab ----------
  function renderKB(){
    var q = state.search.toLowerCase();
    var html = '';
    DATA.quadrants.forEach(function(quad){
      var quadHTML = '';
      quad.subcats.forEach(function(sc){
        var list = filteredList(quad.id, sc.id, q);
        if(!list.length) return;
        quadHTML += sectionForSubcat(quad, sc, list);
      });
      if(quadHTML) html += '<div class="quad-block">' + quadHeaderHTML(quad) + quadHTML + '</div>';
    });
    main.innerHTML = html || '<div class="empty-hint">没有匹配的内容，试试关闭筛选或换个搜索词。</div>';
  }

  // ---------- render: quotes tab ----------
  function quoteGroupHTML(p){
    var starred = isStarred(p.id);
    var quotesHTML = (p.quotes || []).map(function(qt, idx){ return quoteBlockHTML(p, qt, idx); }).join('');
    return '<div class="qgroup' + (starred ? ' starred' : '') + '" data-id="' + p.id + '">' +
      '<div class="qgroup-head">' +
        '<span class="pc-id mono">' + p.id + '</span>' +
        '<span class="qgroup-title editable" data-key="' + p.id + '::title">' + fieldHTML(p.id + '::title', p.title) + '</span>' +
        '<button class="jump-link-btn" data-jump-kb="' + p.id + '">← 思维库</button>' +
      '</div>' + quotesHTML + '</div>';
  }
  function renderQuotes(){
    var q = state.search.toLowerCase();
    var html = '';
    DATA.quadrants.forEach(function(quad){
      var quadHTML = '';
      quad.subcats.forEach(function(sc){
        var list = filteredList(quad.id, sc.id, q).filter(function(p){ return (p.quotes || []).length > 0; });
        if(!list.length) return;
        quadHTML += '<section class="subcat-section" id="qsc-' + quad.id + '-' + sc.id + '">' +
          '<h3 class="subcat-h"><span class="sc-name">' + esc(sc.name) + '</span><span class="sc-count mono">' + list.length + ' 条含原话</span></h3>' +
          '<div class="qgroup-list">' + list.map(quoteGroupHTML).join('') + '</div></section>';
      });
      if(quadHTML) html += '<div class="quad-block">' + quadHeaderHTML(quad) + quadHTML + '</div>';
    });
    main.innerHTML = html || '<div class="empty-hint">还没有收录原话，或没有匹配结果。随着新日记不断融入，这里会持续增多。</div>';
  }

  // ---------- render: life tab ----------
  function renderLife(){
    var list = (DATA.lifeRecords || []).map(function(x, i){ return {rec: x, idx: i}; });
    var health = (DATA.healthLog || []).map(function(x, i){ return {rec: x, idx: i}; });
    var q = state.search.toLowerCase();
    if(q){
      list = list.filter(function(o){ return matchText(effectiveText('life::' + o.idx, o.rec.text), q); });
      health = health.filter(function(o){ return matchText(effectiveText('health::' + o.idx, o.rec.note), q) || matchText(o.rec.member, q); });
    }
    list.sort(function(a, b){ return (b.rec.date || '').localeCompare(a.rec.date || ''); });
    health.sort(function(a, b){ return (b.rec.date || '').localeCompare(a.rec.date || ''); });

    var healthHTML = '';
    if(health.length){
      healthHTML = '<div class="life-year">🩺 全家健康追踪</div><div class="life-list" style="margin-top:0;">' +
        health.map(function(o){
          var key = 'health::' + o.idx;
          return '<div class="life-item"><span class="ldate mono">' + esc(o.rec.date || '') + '</span>' +
            '<span><span class="life-member">' + esc(o.rec.member || '') + '</span>　<span class="editable" data-key="' + key + '">' + fieldHTML(key, o.rec.note) + '</span></span></div>';
        }).join('') + '</div>';
    }
    if(!list.length && !health.length){ main.innerHTML = '<div class="empty-hint">生活记录还在陆续补充中，或没有匹配结果。</div>'; return; }
    var byYear = {};
    list.forEach(function(o){ var y = (o.rec.date || '未知').slice(0, 4); (byYear[y] = byYear[y] || []).push(o); });
    var years = Object.keys(byYear).sort().reverse();
    var lifeHTML = years.length ? ('<div class="life-list">' + years.map(function(y){
      return '<div class="life-year">' + y + '</div>' + byYear[y].map(function(o){
        var key = 'life::' + o.idx;
        return '<div class="life-item"><span class="ldate mono">' + esc(o.rec.date || '') + '</span>' +
          '<span class="editable" data-key="' + key + '">' + fieldHTML(key, o.rec.text) + '</span></div>';
      }).join('');
    }).join('') + '</div>') : '';
    main.innerHTML = healthHTML + lifeHTML;
  }

  // ---------- quick-jump rail ----------
  var io = null;
  function observeSections(){
    if(io) io.disconnect();
    var sections = main.querySelectorAll('.subcat-section');
    if(!sections.length || !window.IntersectionObserver) return;
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var id = en.target.id;
          Array.prototype.forEach.call(quickjumpEl.querySelectorAll('.qj-chip'), function(c){
            c.classList.toggle('active', c.getAttribute('data-target') === id);
          });
        }
      });
    }, {rootMargin: '-40% 0px -50% 0px', threshold: 0});
    Array.prototype.forEach.call(sections, function(s){ io.observe(s); });
  }
  function renderQuickJump(){
    if(state.tab !== 'kb'){ quickjumpEl.hidden = true; quickjumpEl.innerHTML = ''; return; }
    quickjumpEl.hidden = false;
    var html = '';
    DATA.quadrants.forEach(function(quad){
      quad.subcats.forEach(function(sc){
        var target = 'sc-' + quad.id + '-' + sc.id;
        var exists = !!document.getElementById(target);
        html += '<button class="qj-chip' + (exists ? '' : ' dim') + '" data-q="' + quad.id + '" data-target="' + target + '">' +
          '<span class="qj-dot"></span>' + esc(sc.name) + '</button>';
      });
    });
    quickjumpEl.innerHTML = html;
    observeSections();
  }
  function scrollToSection(id){
    var el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  }

  // ---------- cross-tab jump (KB ↔ 原话集) ----------
  function jumpToQuotes(id){
    state.tab = 'quotes'; setActiveTab('quotes'); state.search = ''; searchInput.value = ''; state.jumpTo = id; render();
  }
  function jumpToKB(id){
    state.tab = 'kb'; setActiveTab('kb'); state.search = ''; searchInput.value = ''; state.expanded[id] = true; state.jumpTo = id; render();
  }
  function afterRenderJump(){
    if(!state.jumpTo) return;
    var id = state.jumpTo; state.jumpTo = null;
    requestAnimationFrame(function(){
      var el = main.querySelector('[data-id="' + id + '"]');
      if(!el) return;
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 1600);
    });
  }

  // ---------- delegated click handling ----------
  main.addEventListener('click', function(e){
    var t = e.target;
    var starBtn = t.closest && t.closest('.star-btn');
    if(starBtn){
      var id1 = starBtn.getAttribute('data-id');
      var key1 = id1 + '::star';
      if(overlay[key1]) delete overlay[key1]; else overlay[key1] = true;
      saveOverlay(); render(); return;
    }
    var quoteBadge = t.closest && t.closest('.b-quote');
    if(quoteBadge){ jumpToQuotes(quoteBadge.getAttribute('data-id')); return; }
    var jumpQ = t.closest && t.closest('[data-jump-quotes]');
    if(jumpQ){ jumpToQuotes(jumpQ.getAttribute('data-jump-quotes')); return; }
    var jumpKB = t.closest && t.closest('[data-jump-kb]');
    if(jumpKB){ jumpToKB(jumpKB.getAttribute('data-jump-kb')); return; }
    var rootToggle = t.closest && t.closest('.root-toggle');
    if(rootToggle){
      var id2 = rootToggle.getAttribute('data-id');
      state.showRootFor[id2] = !state.showRootFor[id2];
      render(); return;
    }
    var ctxToggle = t.closest && t.closest('.ctx-toggle');
    if(ctxToggle){
      var ctxKey = ctxToggle.getAttribute('data-ctx');
      state.showCtxFor[ctxKey] = !state.showCtxFor[ctxKey];
      render(); return;
    }
    var head = t.closest && t.closest('.pcard-head');
    if(head){
      if(state.editMode && t.closest('.editable')) return;
      var id3 = head.getAttribute('data-id');
      state.expanded[id3] = !state.expanded[id3];
      render(); return;
    }
    var qjChip = t.closest && t.closest('.qj-chip');
    if(qjChip){ scrollToSection(qjChip.getAttribute('data-target')); return; }
  });

  function render(){
    if(state.tab === 'kb') renderKB();
    else if(state.tab === 'quotes') renderQuotes();
    else renderLife();
    renderQuickJump();
    applyEditableAttrs();
    afterRenderJump();
  }

  render();
})();
</script>
